[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meerkat-meta"
version = "0.9.5"
description = "Python SDK for Meta — companion orchestration platform for the Meerkat multi-agent runtime"
requires-python = ">=3.10"
license = {text = "MIT OR Apache-2.0"}
authors = [{name = "Luka Crnkovic-Friis"}]
keywords = ["agent", "llm", "ai", "meerkat", "orchestration", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.rkat.ai/meta/introduction"
Repository = "https://github.com/lukacf/meerkat-meta"
Documentation = "https://docs.rkat.ai/meta/introduction"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meerkat_meta*"]

[tool.setuptools.package-data]
meerkat_meta = ["py.typed"]

[tool.pytest.ini_options]
# Short tracebacks do not print frame arguments. Transport fakes receive the
# child's env (the whole process environment), and CI logs are public.
addopts = "--tb=short"
