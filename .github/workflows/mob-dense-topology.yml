name: Dense Mob topology

on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.97.0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # A failed sccache install never fails a job either: each Setup sccache
  # step continues on error (so does the action's post step, which reads
  # the stats), and the step after it then sets an empty RUSTC_WRAPPER,
  # which Cargo reads as no wrapper.

jobs:
  unit-archive:
    name: Build Mob unit-test archive
    runs-on: ubuntu-24.04
    # A release commit bumps every workspace crate version, which invalidates
    # all compiled workspace artifacts in sccache and the cargo cache; the
    # archive then builds cold and needs well over 15 minutes.
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-nextest-mob-archive
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Build Mob unit archive
        uses: ./.github/actions/build-nextest-archive
        with:
          family: unit-mob
          reuse_exact_ci: "true"

  dense-topology:
    name: 300 members x 150 peers
    needs: unit-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run isolated dense topology stress
        uses: ./.github/actions/run-nextest-archive
        with:
          family: unit-mob
          partition: hash:1/1
          profile: mob-dense-topology
          run_ignored: all
