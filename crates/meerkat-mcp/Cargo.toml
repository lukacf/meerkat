[package]
name = "meerkat-mcp"
description = "MCP client for Meerkat (connect to tool servers)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # needs the unpublished mcp-test-server crate
    "tests/external_tool_integration.rs",
    # needs the unpublished mcp-test-server and meerkat-runtime, which depends on this crate
    "tests/form_elicitation.rs",
    # support modules of tests/form_elicitation.rs
    "tests/form_elicitation",
    # needs the unpublished mcp-test-server crate
    "tests/lifecycle_contract.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/m6_composition.rs",
    # support modules of tests/m6_composition.rs
    "tests/m6_composition_support",
    # needs the unpublished mcp-test-server and meerkat-runtime, which depends on this crate
    "tests/m6_staged_boundary.rs",
]

[dependencies]
meerkat-capabilities = { workspace = true }
meerkat-auth-core = { workspace = true, features = ["oauth"] }
meerkat-core = { workspace = true }
meerkat-sandbox = { workspace = true }
meerkat-contracts = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest"
] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
meerkat-skills = { workspace = true }
inventory = { workspace = true }
reqwest = { workspace = true }
http = "1"
sse-stream = "0.3.0"  # SseStream::from_bytes_stream first ships in 0.2.4

[features]
test-support = []
# Internal, not for consumers: compiles the unit tests that need the
# workspace (a crate this one cannot depend on once published). Only the
# path-only self dev-dependency enables it, and `cargo package` strips that
# dev-dependency, so the published package compiles those tests out
# (ci/standalone-workspace-only.toml names them).
workspace-tests = []

[[test]]
name = "lifecycle_contract"
path = "tests/lifecycle_contract.rs"
required-features = ["test-support"]

[[test]]
name = "form_elicitation"
path = "tests/form_elicitation.rs"
required-features = ["test-support"]

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
# Enables `workspace-tests` for this crate's own tests; path-only, so the
# published package does not carry it. It adds nothing else: with default
# features on, every test build would turn them back on, and a
# `--no-default-features` test build would not check the feature set it
# names.
meerkat-mcp = { path = ".", default-features = false, features = ["workspace-tests"] }
tempfile = { workspace = true }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
tracing-subscriber = { workspace = true, features = ["fmt", "registry"] }
mcp-test-server = { path = "../../tests/fixtures/mcp-test-server" } # test-only shared rmcp handler; never a published runtime dependency
tokio = { workspace = true, features = ["test-util", "macros"] }
meerkat-runtime = { path = "../meerkat-runtime", default-features = false } # path-only (no version): breaks packaging dev-dep cycle; flags mirror the workspace dep
axum = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["serde"]  # proc macro (derive)

[lints]
workspace = true
