name: CI

# Pull-request CI: Cargo only, on GitHub-hosted runners. The lanes are
# selected from the changed paths by scripts/ci-cargo-lanes.mjs, which fails
# closed: any change that can alter what Cargo compiles yields at least one
# clippy lane and one unit lane (or a named deferral), and the aggregate gate
# asserts that those lanes ran. The classifier is told the event
# (--event): a pull request runs what fits the 20-minute cap from the start
# of the pre-push hook to a green CI gate, and leaves the lanes that compile
# the meerkat-mob chain or sweep the reverse-dependency closure to the push
# (main or release/**), whose CI must be green before a release tag.
#
# Jobs (PR: pull request; push: push to main or release/**, and dispatch):
#   changes         - changed-path classification (packages, shards, closure,
#                     conditional-lane flags, what a PR left to the push)
#   fmt-governance  - always: fmt, docs, semver self-test, version parity,
#                     lock consistency, classifier self-tests, and the
#                     ripgrep tombstone scans (legacy surface names,
#                     session-control routes, deprecated backend)
#   ratchets        - generated-contract freshness when contract paths
#                     changed; machine/protocol drift when machine authority
#                     changed
#   governance-gates - the typed governance gates (rmat-audit, seam-inventory,
#                     runtime authority, machine-authority docs) when machine
#                     authority or a dogma document changed
#   tlc-audits      - (x8) the hand-written TLC audit shards on a
#                     machine-authority change
#   clippy (xN)     - one lane per shard of directly changed packages:
#                     clippy --no-deps --all-features over every target; in a
#                     PR the meerkat-mob chain packages lint their lib and bin
#                     targets only (their tests run on the push)
#   unit (xN)       - one lane per shard of the directly changed packages
#                     OUTSIDE the meerkat-mob compile chain:
#                     nextest --lib --bins --profile ci-pr (ci-pr = fast),
#                     plus the feature-gated suites of the changed packages
#                     outside the chain (FEATURE_UNIT_SUITES in
#                     scripts/ci-cargo-lanes.mjs; PR: those not marked
#                     pullRequest: false). A push runs these rows in
#                     main-unit instead, verbatim (unit_rows_on_main). A
#                     package in PARTITIONED_UNIT_PACKAGES (meerkat-runtime)
#                     runs as rows that each build it and run one
#                     --partition hash:k/n of its tests
#   integration     - (xN) the tests/*.rs binaries of each integration
#                     suite whose trigger packages or paths changed
#                     (INTEGRATION_SUITES in scripts/ci-cargo-lanes.mjs):
#                     nextest -p <package> --test '*'; in a PR only the suites
#                     whose package does not compile meerkat-mob. Also the
#                     reader rows: the exact targets that read a changed
#                     non-Rust input (scripts/ci-non-rust-readers.json)
#                     where no other lane of the plan runs them
#   wasm-check      - wasm32 check of meerkat-web-runtime: every push with a
#                     Rust change, and PRs that change the web runtime or a
#                     crate it compiles (its dependency closure) or the CLI
#                     web template, or plan the whole workspace
#   example-web     - sdks/web wasm runtime build, the Web SDK type and unit
#                     tests, plus the example 031, 032 and 033 browser
#                     suites; every push, and PRs that touch the runtime, its
#                     contracts, or those examples
#   wasm-timers     - shared timer ownership in Chrome and Node, selected
#                     with the web runtime suites
#   gate            - "CI gate": fail-closed aggregate; on pull requests a
#                     1080-second lane execution budget (classification plus
#                     each lane's own run time, runner queue excluded) and a
#                     1200-second push-to-terminal runaway ceiling, also
#                     runner queue excluded; runner queue wait is reported as
#                     a warning (the critical path,
#                     slowest lane and queue are reported on every run that
#                     was not cancelled, failed runs included); schema-4
#                     exact-tree attestation on pushes to main and release/**
#
# Push only (no wall-clock budget; a PR names them in deferred_to_push):
#   closure-tests   - the deterministic workspace test lanes
#                     (scripts/pre-push-unit.sh) for the test scope
#   closure-check   - cargo check --all-features (lib and bin targets) over
#                     the reverse-dependency closure of the changed packages
#   rustdoc         - (x2) cargo doc --workspace --no-deps with rustdoc's
#                     lints denied (RUSTDOCFLAGS=-Dwarnings), one leg with
#                     default features and one with --all-features: every
#                     crate's documentation and its intra-doc links
#   feature-check   - (xN, two per clippy shard) compile-only checks of the
#                     shard's packages under their Bazel feature sets (tests
#                     included) and the `make test-minimal` /
#                     `test-feature-matrix-lib` check rows
#   governed-jsonl  - exactly the non-MCP native-authorized JSONL tests its
#                     step's expected list names, on Rust changes
#   mcp-confinement-positive - exactly the Linux positive confinement cases
#                     of `make test-mcp-confinement-positive` (its
#                     CONFINEMENT_* filters and counts), on Rust changes;
#                     both also run in a PR that touches their inputs or
#                     changes their definition
#
# Release projections: a push or pull request whose diff from its first
# parent is only the forward patch projection scripts/release-hook.sh writes
# (scripts/release-projection-only.mjs, the pre-push hook's fail-closed
# classifier), with a completed, successful, workspace-mode exact-main CI run
# of that parent (scripts/ci-release-evidence.mjs, run from the parent's own
# tree), is planned as mode release-projection: format + governance, the
# generation ratchets, the Bazel graph check and the readers of the changed
# files (their closure rows, integration suites and lib/bin unit rows, plus
# meerkat-contracts' unit row) run, and the other lanes reuse the parent's
# run, which the gate verifies again and records in the attestation. A test,
# snapshot, fixture, SDK or Rust code line that pins the old or new version
# (scripts/release-version-pins.mjs) refuses reuse. Without that evidence the
# commit gets the ordinary plan. A commit carrying the trailer
# `CI-Plan: workspace` (or merging a branch whose head carries it) is planned
# as the whole workspace, the explicit way to give a release's parent that
# evidence.
#
# Push to main only (no wall-clock budget):
#   main-unit (xN)  - nextest --lib --bins over the whole workspace in eight
#                     cost-packed shards (this is where the meerkat-mob chain's
#                     unit tests run: mob, mob-adaptive, mob-mcp, mob-pack,
#                     rpc, rest, mcp-server, rkat, web-runtime,
#                     integration-tests, machine-codegen; their lanes
#                     compile mob's 442k lines and cannot fit the budget;
#                     xtask and machine-dsl-tests do not build mob and run
#                     in the pull request),
#                     plus one lane per feature-gated suite: the default
#                     feature lanes cannot reach a test behind a non-default
#                     feature (FEATURE_UNIT_SUITES in ci-cargo-lanes.mjs)
#   main-unit-archive-build / main-unit-archive-run
#                   - ARCHIVED_UNIT_LANES (meerkat-mob and its feature suites):
#                     one job compiles the lib-test binary into a nextest
#                     archive, and partition jobs run it with
#                     --partition hash:k/n, since that crate's compile alone
#                     fills most of a 4-vCPU lane
#   sdk-host        - Python + TypeScript SDK suites
#
# Caches: no cache step saves on a workflow_dispatch run (rust-cache
# `save-if`, and the Bazel graph job's cache step does not run on one). A
# dispatch on main saves into the scope the next push to main restores
# from, and that run writes the exact-tree attestation a release tag
# trusts (scripts/check_release_workflow_contract.py, release-caches).
# The sccache bucket is not such a cache: a dispatch on a release branch
# writes it (.github/actions/setup-sccache-ci), and an object there serves
# only a compile with the same inputs. The registry cache keeps the rule
# on every dispatch; a save would spare a registry download at most.
#
# Everything else (integration-fast and e2e-fast over the whole workspace,
# the dense Mob topology stress, the bounded TLC machine-verify sweep, the
# feature-matrix test runs, audit, the browser contract suites, and the whole
# Bazel graph) runs in nightly.yml and in the release workflow; PR CI never
# starts the remote Bazel fleet. A nightly dispatch with graph_only=true runs
# only the full graph, for the pre-tag check on a release branch.

on:
  # Pushes run on main and on release integration branches, the
  # attestation boundaries. Pull requests into a release branch unit-test only
  # the crates they change, so a merge there must run the push-only lanes
  # (main-unit over the whole workspace, wasm-check, sdk-host) or
  # reverse-dependency suites first run at the final merge to main: #1541
  # broke two facade tests that no release-branch run executed. A merge
  # commit is never a PR head, so no head runs twice; every other branch
  # still gets CI only through its pull request. A successful push to main
  # or to a release/** branch writes the exact-tree attestation (its steps
  # check the ref): a maintenance release is tagged on release/<version>
  # without reaching main, and release.yml accepts only the attestation of
  # main or of the release branch of the tag's own version.
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch: {}

# Pull requests: one group per PR, a newer push cancels the older run.
#
# Pushes to main: a newer main commit supersedes the still-running run of an
# older one (group main-<ref>-superseded, cancelled). The account runs at most
# 40 hosted jobs at once, a main run starts 35-50 of them, and merges arrive
# about every 13-32 minutes against a 20-34 minute main run, so completing
# every main run starved pull-request CI of runners: in the 02:27-03:50 UTC
# merge burst of 2026-10-01, 806 of the 1760 main-run job-minutes (46%) ran
# after a newer main commit had already been pushed. The newest main commit
# is still fully tested, and its run covers every superseded commit's change:
# a main push diffs against the last main commit whose run completed green
# with an attestation (scripts/ci-push-base.mjs), not against the cancelled
# run's commit.
#
# Never superseded, one group per commit (main-<ref>-<sha>):
#   - a release commit ("chore: release v..." in the head commit message),
#     because the release workflow's require_ci_green needs a successful
#     exact-main run on exactly that commit;
#   - every re-run attempt (run_attempt > 1). A superseded commit that turns
#     out to be needed (a tag on it, or bisecting a red main) gets its
#     attestation with `gh run rerun <id>`, and that attempt runs to the end;
#   - workflow_dispatch runs;
#   - every push to a release/** integration branch. Each merge there needs
#     its own verdict: with superseding, a busy merge train cancelled every
#     run after 21d00220a (#1575) and about 15 merges went without full CI,
#     hiding the public_broker_* failure #1556 introduced.
# A cancelled run never reaches the CI gate (it runs under !cancelled()), so
# it leaves no exact-tree attestation; require_ci_green only accepts a run
# that completed with success. A per-ref group with cancellation for every
# main push once cancelled 35918370610 and 35920687943 before their gates;
# the exemptions above are what makes cancellation safe for releases.
concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      (github.event_name == 'push' && github.run_attempt == 1 && !contains(github.event.head_commit.message, 'chore: release v') && !startsWith(github.ref, 'refs/heads/release/')) && format('main-{0}-superseded', github.ref_name) ||
      format('main-{0}-{1}', github.ref_name, github.sha)
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.run_attempt == 1 && !contains(github.event.head_commit.message, 'chore: release v') && !startsWith(github.ref, 'refs/heads/release/'))
    }}

permissions:
  actions: read
  contents: read
  # Workload identity for the GCS object cache; forks do not get it and
  # run with a local disk cache only.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Stable per-VM Cargo home: hosted runners are fresh per job, and cache
  # reuse (rust-cache + sccache) requires registry source paths that do not
  # change between runs.
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.94.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The server's own log; every compile lane uploads it, because with the
  # IO-error fallback a dead server means silent cold compiles (the
  # mob unit lane of run 35864652602 compiled 15 minutes with 0 requests).
  # Literal runner temp path: the `runner` context is not available in
  # workflow-level env, and upload-artifact rejects paths containing `..`.
  SCCACHE_ERROR_LOG: /home/runner/work/_temp/sccache.log
  SCCACHE_LOG: info
  # Never exit on idle: the mob lib-test link runs for minutes with no rustc
  # request, the default 600 s idle exit took the server down mid-lane, and
  # the post-step then reported a fresh server's zero statistics.
  SCCACHE_IDLE_TIMEOUT: "0"
  # One stable repo-cargo lane key on every runner, so the generated
  # toolchain wrapper path is identical across runs and lanes.
  RUST_LANE_ID: ci
  # Compiled objects live in the GCS bucket named by the repository variable
  # MEERKAT_SCCACHE_GCS_BUCKET, selected per job by
  # .github/actions/setup-sccache-ci; with the variable unset or the GCP
  # identity unavailable (fork pull requests) a lane runs with a local disk
  # cache only. The GitHub Actions cache is 10 GB per repository and one
  # workspace-mode run exceeds it, so writes failed at the quota and every run
  # stayed cold; it now keeps only the cargo registry. Debuginfo is off
  # (above) so the objects stay small.
  SCCACHE_GCS_BUCKET_NAME: ${{ vars.MEERKAT_SCCACHE_GCS_BUCKET }}
  # Pull-request wall-clock budget, split by who controls the time. It exists
  # to catch runaway CI (a lane that grows, aggregate drift), not to police a
  # single lane; every lane's own timeout-minutes does that.
  #
  # CI_MAX_EXEC_SECONDS bounds the execution path: for each lane, the change
  # classification's run time plus the lane's own run time (started_at to
  # completed_at), and the slowest such path. That is the time the code
  # controls. Runner queue wait (created_at to started_at) is not in it: the
  # account runs at most 40 hosted jobs at once, shared by every pull
  # request, main push and nightly, and a busy hour fills that cap.
  # CI_MAX_TERMINAL_SECONDS is the runaway backstop on the latest lane
  # terminal minus the runner queue on that lane's path (its own queue plus
  # the classification's, in the same attempt): a CI whose jobs are stuck
  # still fails, but one that only waited for runners does not. Queue is
  # reported, never budgeted (#1526 run 37062437146 failed this ceiling at
  # 3167 s with every lane green and 2817 s of runner queue).
  # Queue wait on the critical path at or above CI_QUEUE_WARN_SECONDS is a
  # warning with a typed verdict (queue_delayed), never a failure.
  #
  # Both budgets hold every lane a pull request plans for ordinary reasons.
  # An exact-profile lane (governed-jsonl, mcp-confinement-positive) that
  # the plan ran only because the change touched its inputs or changed its
  # definition (the plan's guard_lane_reasons, from GUARD_LANE_INPUTS and
  # GUARD_LANE_DEFINITIONS in scripts/ci-cargo-lanes.mjs) is outside them:
  # the confinement lane's cold build alone takes 27.5-32.5 minutes, so such
  # a pull request could never pass otherwise. It still must succeed, its
  # own timeout-minutes (40 on a pull request) bounds it, and the gate names
  # it, with its seconds and the reason, in a "Guard lane outside the
  # budget" warning. A guard lane run on every Rust change (a push, a
  # dispatch, a release projection) or for an unknown diff is planned for an
  # ordinary reason and stays in the budget.
  #
  # Sizing. The owner's cap is 20 minutes from the start of the pre-push
  # hook to a green CI gate. The hook now takes about a minute (49-55 s of
  # hooks a push on 2026-10-14..16 once the lanes CI runs left it), so 1080 s
  # (18 minutes) of execution leaves about a minute of slack for the gate,
  # and 1200 s (20 minutes) of terminal is the runaway backstop at the cap
  # itself. On the workspace-mode pull-request runs 38859112297 and
  # 38931641220 the lanes a pull request still plans ran at most 854 s
  # (wasm32 check; example-web 842 s cold), after 28-31 s of
  # classification. Runner queue stays out of both budgets, as before: the
  # account's 40 hosted jobs are shared (a workspace-mode pull request plans
  # 38-47 jobs), and #1526 run 37062437146 waited 2817 s for runners with
  # every lane green. The earlier budgets, 1500 s and 2700 s, were sized on 66
  # attempts of 2026-09-30..10-01 (execution path max 1244 s) before the
  # chain and closure lanes moved to the push.
  CI_MAX_EXEC_SECONDS: "1080"
  CI_MAX_TERMINAL_SECONDS: "1200"
  CI_QUEUE_WARN_SECONDS: "300"
  # Target set for the closure-check lane: "lib" checks lib and bin targets
  # of the closure; "all" adds every test target (--all-targets), which
  # measured 16 min after a meerkat-mob change and does not fit the budget.
  CLOSURE_CHECK_TARGETS: lib

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-24.04
    # A main push of a release projection waits up to 40 minutes for its
    # parent's CI run to complete before it can reuse it.
    timeout-minutes: 50
    outputs:
      event: ${{ steps.plan.outputs.event }}
      rust_changed: ${{ steps.plan.outputs.rust_changed }}
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      generated_contract: ${{ steps.plan.outputs.generated_contract }}
      machine_authority: ${{ steps.plan.outputs.machine_authority }}
      machine_posters: ${{ steps.plan.outputs.machine_posters }}
      governance_gates: ${{ steps.plan.outputs.governance_gates }}
      wasm: ${{ steps.plan.outputs.wasm }}
      sdk_host: ${{ steps.plan.outputs.sdk_host }}
      bazel_graph: ${{ steps.plan.outputs.bazel_graph }}
      examples_browser: ${{ steps.plan.outputs.examples_browser }}
      example_web: ${{ steps.plan.outputs.example_web }}
      example_web_wasm: ${{ steps.plan.outputs.example_web_wasm }}
      release_projection: ${{ steps.plan.outputs.release_projection }}
      release_projection_versions: ${{ steps.plan.outputs.release_projection_versions }}
      release_evidence_commit: ${{ steps.plan.outputs.release_evidence_commit }}
      release_evidence_run_id: ${{ steps.plan.outputs.release_evidence_run_id }}
      release_evidence_run_attempt: ${{ steps.plan.outputs.release_evidence_run_attempt }}
      package_count: ${{ steps.plan.outputs.package_count }}
      closure_count: ${{ steps.plan.outputs.closure_count }}
      closure_flags: ${{ steps.plan.outputs.closure_flags }}
      closure_check: ${{ steps.plan.outputs.closure_check }}
      rustdoc: ${{ steps.plan.outputs.rustdoc }}
      governed_jsonl: ${{ steps.plan.outputs.governed_jsonl }}
      mcp_confinement_positive: ${{ steps.plan.outputs.mcp_confinement_positive }}
      guard_lane_reasons: ${{ steps.plan.outputs.guard_lane_reasons }}
      deferred_to_push: ${{ steps.plan.outputs.deferred_to_push }}
      reader_not_run: ${{ steps.plan.outputs.reader_not_run }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shard_first_count: ${{ steps.plan.outputs.shard_first_count }}
      shard_rest_count: ${{ steps.plan.outputs.shard_rest_count }}
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
      shard_rest_matrix: ${{ steps.plan.outputs.shard_rest_matrix }}
      unit_shard_count: ${{ steps.plan.outputs.unit_shard_count }}
      unit_shard_matrix: ${{ steps.plan.outputs.unit_shard_matrix }}
      unit_deferred: ${{ steps.plan.outputs.unit_deferred }}
      unit_deferred_count: ${{ steps.plan.outputs.unit_deferred_count }}
      unit_rows_on_main: ${{ steps.plan.outputs.unit_rows_on_main }}
      unit_rows_on_main_count: ${{ steps.plan.outputs.unit_rows_on_main_count }}
      main_unit_shard_count: ${{ steps.plan.outputs.main_unit_shard_count }}
      main_unit_first_count: ${{ steps.plan.outputs.main_unit_first_count }}
      main_unit_rest_count: ${{ steps.plan.outputs.main_unit_rest_count }}
      main_unit_shard_matrix: ${{ steps.plan.outputs.main_unit_shard_matrix }}
      main_unit_rest_shard_matrix: ${{ steps.plan.outputs.main_unit_rest_shard_matrix }}
      main_archive_build_count: ${{ steps.plan.outputs.main_archive_build_count }}
      main_archive_build_matrix: ${{ steps.plan.outputs.main_archive_build_matrix }}
      main_archive_run_count: ${{ steps.plan.outputs.main_archive_run_count }}
      main_archive_run_matrix: ${{ steps.plan.outputs.main_archive_run_matrix }}
      integration_count: ${{ steps.plan.outputs.integration_count }}
      integration_matrix: ${{ steps.plan.outputs.integration_matrix }}
      test_scope_count: ${{ steps.plan.outputs.test_scope_count }}
      hook_binary_count: ${{ steps.plan.outputs.hook_binary_count }}
      hook_retained_count: ${{ steps.plan.outputs.hook_retained_count }}
      closure_test_count: ${{ steps.plan.outputs.closure_test_count }}
      closure_test_first_count: ${{ steps.plan.outputs.closure_test_first_count }}
      closure_test_rest_count: ${{ steps.plan.outputs.closure_test_rest_count }}
      closure_test_matrix: ${{ steps.plan.outputs.closure_test_matrix }}
      closure_test_rest_matrix: ${{ steps.plan.outputs.closure_test_rest_matrix }}
      feature_check_count: ${{ steps.plan.outputs.feature_check_count }}
      feature_check_first_count: ${{ steps.plan.outputs.feature_check_first_count }}
      feature_check_rest_count: ${{ steps.plan.outputs.feature_check_rest_count }}
      feature_check_matrix: ${{ steps.plan.outputs.feature_check_matrix }}
      feature_check_rest_matrix: ${{ steps.plan.outputs.feature_check_rest_matrix }}
    steps:
      # Depth 2 is HEAD and its parents. The classifier diffs a pull
      # request's merge commit against its first parent, or a push against
      # its push base (on main the last green, attested main commit before
      # HEAD, found through the API), which ci-cargo-lanes.mjs fetches at
      # depth 1 when the checkout lacks it; nothing walks history. The full-history fetch
      # took 41-63 s, once 242 s, on the path of every lane.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      # The release-projection classifier runs the docs and changelog
      # stampers (Python) and the evidence scripts (Node) under the same
      # versions as the CI gate and the release workflow.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Classify changed paths
        id: plan
        shell: bash
        env:
          BASE_SHA: >-
            ${{
              github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
              github.event_name == 'push' && github.event.before ||
              ''
            }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          # Pull requests never wait (the classification is on every lane's
          # budgeted path); a push waits for a running parent run.
          EVIDENCE_WAIT_SECONDS: ${{ github.event_name == 'push' && '2400' || '0' }}
        run: |
          set -euo pipefail
          # A pull_request checkout is refs/pull/N/merge; classify against its
          # base-branch parent, not the payload base read when the run was
          # queued (main may have moved in between). Fails closed if the
          # checkout is not the expected merge commit.
          classification_base="$(scripts/ci-pr-classification-base "${EVENT_NAME}" "${BASE_SHA}")"
          # A release projection (the diff from HEAD's first parent is only
          # the forward patch projection scripts/release-hook.sh writes)
          # reuses that parent's exact-main CI test evidence. The finder runs
          # from the parent's own tree, so a commit cannot certify itself with
          # edited scripts, and prints the evidence only for a completed,
          # successful, workspace-mode push run of ci.yml on main at the
          # parent (waiting for a running one up to EVIDENCE_WAIT_SECONDS);
          # otherwise, or on any lookup failure, the plan stays the ordinary
          # one.
          # A commit carrying `CI-Plan: workspace` gets the whole workspace
          # anyway, so it neither looks for evidence nor waits for it.
          plan_args=()
          evidence_tools="${RUNNER_TEMP}/release-evidence-tools/scripts"
          mkdir -p "${evidence_tools}"
          if [[ -n "${classification_base}" ]] \
            && ! node scripts/ci-cargo-lanes.mjs --workspace-plan-requested --head HEAD \
            && git show "${classification_base}:scripts/ci-release-evidence.mjs" > "${evidence_tools}/ci-release-evidence.mjs" 2>/dev/null \
            && git show "${classification_base}:scripts/release-projection-only.mjs" > "${evidence_tools}/release-projection-only.mjs" 2>/dev/null \
            && git show "${classification_base}:scripts/release-version-pins.mjs" > "${evidence_tools}/release-version-pins.mjs" 2>/dev/null \
            && evidence="$(node "${evidence_tools}/ci-release-evidence.mjs" find --repository "${GITHUB_REPOSITORY}" \
                --base "${classification_base}" --head HEAD --wait-seconds "${EVIDENCE_WAIT_SECONDS}")"; then
            plan_args=(--reuse-release-evidence "${evidence}")
          fi
          # The ordinary plan's base. A push to main diffs against the newest
          # commit before HEAD whose main CI run completed green and left its
          # exact-tree attestation, not against the payload base: a newer
          # main push cancels the run of an older one, and a run can fail, so
          # the payload base's changes may never have run the lanes a pull
          # request leaves to the push. scripts/ci-push-plan-base.mjs, the
          # payload base's own copy (so a pushed commit cannot edit the
          # decider for its own push), runs the finder
          # (scripts/ci-push-base.mjs) from HEAD's first parent, and only
          # when that parent is the payload base, so no pushed commit
          # supplies it (a push of several commits plans the whole
          # workspace), and accepts only a full sha of an ancestor of HEAD
          # other than HEAD. Otherwise, without that copy, or on any lookup
          # failure, the plan is the whole workspace. A release projection
          # keeps its first parent, whose workspace-mode run the evidence
          # above verified; a pull request keeps its merge base and a
          # release-branch push its payload base.
          plan_base="${classification_base}"
          if [[ "${#plan_args[@]}" -eq 0 && "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            plan_base=""
            decider="${RUNNER_TEMP}/push-base-tools/ci-push-plan-base.mjs"
            mkdir -p "$(dirname "${decider}")"
            if git show "${BASE_SHA}:scripts/ci-push-plan-base.mjs" > "${decider}" 2>/dev/null \
              && found_base="$(node "${decider}" --repository "${GITHUB_REPOSITORY}" --payload-base "${BASE_SHA}")"; then
              plan_base="${found_base}"
              echo "push base: ${plan_base} (payload base ${BASE_SHA})"
            else
              echo "::warning title=CI push base::no qualifying green, attested main CI run before HEAD (reason above); planning the whole workspace."
            fi
          fi
          # The classifier exits non-zero rather than emit an empty plan for a
          # build-relevant change; a failure here fails the CI gate. The event
          # decides which lanes run here: a pull request leaves the
          # meerkat-mob chain's and the reverse-dependency sweep's lanes to the
          # push (they are named in deferred_to_push).
          node scripts/ci-cargo-lanes.mjs --format github --event "${EVENT_NAME}" \
            --base "${plan_base}" --head HEAD "${plan_args[@]}" \
            | tee "${RUNNER_TEMP}/ci-cargo-lanes.txt" >> "${GITHUB_OUTPUT}"
          grep -vE '^(closure_flags|shard_matrix|shard_rest_matrix|unit_shard_matrix|main_unit_shard_matrix|main_unit_rest_shard_matrix|closure_test_rest_matrix|feature_check_rest_matrix|main_archive_build_matrix|main_archive_run_matrix|integration_matrix|closure_test_matrix|feature_check_matrix)=' "${RUNNER_TEMP}/ci-cargo-lanes.txt"

  stagger:
    name: Stagger the short rows
    needs: changes
    # Long rows first (scripts/ci-cargo-lanes.mjs): the rest wave of each
    # two-wave lane and the short lanes need this job, so they queue after
    # the long rows; on a push it also waits 30 s while those take runners
    # from the account's pool. A pull request does not wait.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Let the long rows take runners first
        env:
          STAGGER_SECONDS: ${{ github.event_name == 'pull_request' && '0' || '30' }}
        run: sleep "${STAGGER_SECONDS}"

  fmt-governance:
    name: Format + governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
    steps:
      # Depth 2, not 1: a depth-1 clone grafts HEAD to have no parents, which
      # hides the merge topology the lock-consistency gate reports on.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Format check
        run: make fmt-check

      - name: Docs validation
        run: make docs-check

      # The release-time semver-breaks gate needs cargo-semver-checks; its
      # analyser does not. Run the analyser's unit tests on every PR so parser
      # drift is caught here rather than at the tag.
      - name: Semver-breaks analyser self-test
        run: make semver-breaks-selftest

      - name: Native authorization cost analyser self-test
        run: make native-cost-analysis-selftest

      - name: Verify version parity
        run: make verify-version-parity

      # The pull_request checkout is refs/pull/N/merge, and that merge preview
      # is the only place a merge-manufactured dangling lock reference exists.
      - name: Cargo.lock resolves under --locked
        run: make verify-lock-consistency

      - name: MODULE.bazel.lock recorded inputs
        run: make verify-bazel-module-lock-inputs

      # The BUILD files are generated from Cargo metadata and the Rust
      # sources' text. The bazel-graph job's query and --nobuild build accept
      # a stale graph that is still valid (a missing data label, no target
      # for a new test), and the commit hook that regenerates them is local
      # and never sees a merge commit. About 5 seconds.
      - name: Generated Bazel BUILD files are current
        run: node scripts/generate-bazel-rust-builds.mjs --check

      # Release binaries must compile no test-only code: the release builds
      # pass the release define, under which no target they link enables a
      # non-shipping feature; the packaged-binary marker scan is the backstop.
      - name: Release builds exclude test-only features
        run: make verify-bazel-release-features

      - name: Release test-code guards still fail on their defects
        run: make release-test-code-guards-selftest

      - name: Verify Rust release configuration
        run: make check-rust-release-config

      - name: Release crates package their license files
        run: make check-crate-license-files

      # Published crates' tests must pass standalone: no packaged test
      # reads outside its package or skips itself when a binary is missing,
      # and every [package] exclude matches ci/standalone-workspace-only.toml.
      # The census that runs the packages' tests is nightly's.
      - name: Published crate tests stay standalone (static guard)
        run: |
          make published-crates-standalone-selftest
          make check-published-crates-standalone-guard

      - name: CI lane classifier fails closed
        run: make ci-lanes-selftest

      # The shell path classifiers (scripts/machine-authority-changed, the
      # remote-graph edge classifier and scripts/cargo-agent-gate) silently
      # stopped matching after the crates/ layout move because nothing ran
      # their pinning tests.
      - name: Path classifiers route gate inputs
        run: make path-classifier-selftest

      - name: Release doctor workflow assertions still bind
        run: scripts/test-release-doctor-workflow-contract.sh

      - name: Release prebuild lookup selects only usable exact-commit prebuilds
        run: scripts/test-release-find-prebuild.sh

      - name: Standalone census check passes only on a green main run at the given commit
        run: scripts/test-release-require-standalone-green.sh

      - name: Release asset provenance accepts an earlier run only through its build gate
        run: scripts/test-verify-release-asset-provenance.sh

      # The SDKs download rkat-rpc only against the digests the release
      # stamps into them (#1739): the stamp refuses an incomplete manifest
      # or an archive that does not re-hash, and the publish smokes refuse
      # an unstamped or wrong-version package.
      - name: SDK binary digest stamp refuses incomplete releases and unstamped packages
        run: python3 scripts/test_release_stamp_sdk_binary_digests.py

      - name: Intel macOS release binary check refuses each defect
        run: scripts/test-check-macos-x86-release-binary.sh

      - name: Release SQLite lock profile check refuses each defect
        run: scripts/test-check-release-binary-sqlite-profile.sh

      # Stubbed cargo and a file:// index: levels in order, bounded overlap,
      # skip of a published version, and stop at the first failing crate.
      - name: Level-parallel crate publisher keeps its order and failure semantics
        run: scripts/test-release-publish-rust-crates.sh

      # The tombstone scans (retired public names, session-control routes,
      # the deprecated backend) are ripgrep text scans. The hosted image
      # does not ship ripgrep, and each scan refuses to run without it
      # rather than report a false green, so install it and prove it is on
      # PATH before the scans run. These used to run only in make ci and the
      # uncalled cargo.yml, which let a retired route reach a release branch.
      - name: Install ripgrep for the tombstone scans
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          rg --version

      - name: Legacy public surface names stay retired
        run: make legacy-surface-gate

      - name: Retired session-control routes stay retired
        run: make session-control-gate

      - name: Turbo S scenarios carry no soft checks
        run: make turbo-s-oracle-gate

      - name: Deprecated backend stays unreferenced
        run: make deprecated-backend-gate

  ratchets:
    name: Generation ratchets
    needs: [changes, stagger]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Report selected ratchets
        shell: bash
        env:
          GENERATED_CONTRACT: ${{ needs.changes.outputs.generated_contract }}
          MACHINE_AUTHORITY: ${{ needs.changes.outputs.machine_authority }}
          MACHINE_POSTERS: ${{ needs.changes.outputs.machine_posters }}
        run: |
          echo "generated contract paths changed: ${GENERATED_CONTRACT}"
          echo "machine authority paths changed: ${MACHINE_AUTHORITY}"
          echo "machine poster inputs changed: ${MACHINE_POSTERS}"

      - name: Verify schema freshness
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-schema-freshness
        env:
          MEERKAT_SCHEMA_DIAGNOSTIC_DIR: ${{ github.workspace }}/schema-freshness-output

      - name: Upload fresh schemas after freshness failure
        if: ${{ failure() && needs.changes.outputs.generated_contract == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fresh-contract-schemas
          path: schema-freshness-output
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify SDK codegen freshness
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-sdk-codegen-freshness

      - name: Verify SDK event inventory
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-sdk-event-inventory

      - name: Verify RPC surface alignment
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-rpc-surface-alignment

      - name: Verify REST surface alignment
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-rest-surface-alignment

      - name: Verify SDK wrapper freshness
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-sdk-wrapper-freshness

      - name: Verify generated machine kernels are not stale
        if: ${{ needs.changes.outputs.machine_authority == 'true' }}
        id: machine_drift
        shell: bash
        run: |
          if make machine-check-drift; then
            exit 0
          fi
          # Preserve the exact generated side of the failed comparison so the
          # drift can be repaired without a second local Rust build.
          make machine-codegen
          exit 1

      - name: Upload fresh machine artifacts after drift failure
        if: ${{ failure() && steps.machine_drift.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fresh-machine-artifacts
          path: |
            specs/machines
            specs/compositions
            crates/meerkat-machine-kernels/src/generated
          if-no-files-found: error
          retention-days: 1

      - name: Verify generated protocol artifacts are not stale
        if: ${{ needs.changes.outputs.machine_authority == 'true' }}
        id: protocol_drift
        shell: bash
        run: |
          if make protocol-check-drift; then
            exit 0
          fi
          make protocol-codegen
          exit 1

      - name: Upload fresh protocol artifacts after drift failure
        if: ${{ failure() && steps.protocol_drift.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fresh-protocol-artifacts
          path: |
            crates/meerkat-core/src/generated
            crates/meerkat-session/src/generated
            crates/meerkat-mob/src/generated
            crates/meerkat-mcp/src/generated
            crates/meerkat-runtime/src/generated
            crates/meerkat-workgraph/src/generated
          if-no-files-found: error
          retention-days: 1

      # The posters render the canonical machine catalog, TLA specs and
      # contracts. The gate used to run only in cargo.yml, which nothing calls,
      # so the script's paths and the rendered HTML drifted unnoticed. It
      # runs when machine authority changes (what the posters render) or when
      # a poster input changes (scripts/machine-posters-changed, kept apart
      # from the machine-authority classifier so a poster-only change never
      # starts the machine lanes). `make verify-machine-poster-coverage` is
      # the same command locally.
      - name: Verify machine poster coverage and freshness
        if: ${{ needs.changes.outputs.machine_authority == 'true' || needs.changes.outputs.machine_posters == 'true' }}
        run: make verify-machine-poster-coverage

  # The typed governance gates over the live workspace: the effect-authority,
  # ownership-ledger and strict RMAT audits, the strict seam inventory, the
  # runtime authority bypass audit and the machine-authority docs alignment
  # test. They run on the agent gate's governance paths (machine authority
  # or a dogma document; governance_gates in scripts/ci-cargo-lanes.mjs),
  # where the pre-push hook's changed-path ratchets ran them before every
  # push; the hook no longer runs them, and no other per-push lane does. A
  # job of its own, beside `ratchets`: they took 400 s locally, 114 s of it
  # building xtask, which after the drift checks would hold the ratchets job
  # past the pull-request lane target.
  governance-gates:
    name: Typed governance gates
    needs: changes
    if: ${{ needs.changes.outputs.governance_gates == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry only; compiled objects come from sccache (see ratchets).
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Typed governance gates
        run: make rmat-audit seam-inventory runtime-authority-bypass machine-authority-docs-gate

  # Bounded TLC on machine-authority changes. The hand-written audits model
  # check the generated machines against their invariants and goals (drift
  # in `ratchets` only proves the artifacts match the DSL). Each shard of
  # the canonical TLC lane needs only a JDK and the TLC jar
  # (setup-tlc-ci; the audit parts never run xtask), runs in parallel, and
  # fits the PR budget: seven shards of 376-586 s of audits on a hosted
  # runner (measured per audit in machine_verify_all_tlc_test.sh), where
  # three shards ran 13-18 minutes or past the job timeout on runs
  # 40721495692 and 40721504088, and an eighth for the controller hold
  # audit with its mutants (100 s on a 4-worker local run, not yet measured
  # on a hosted runner).
  # The `machine-verify --all` sweep stays on nightly, the release gate and
  # the release-tag graph.
  tlc-audits:
    name: Bounded TLC audits (${{ matrix.part }})
    needs: changes
    if: ${{ needs.changes.outputs.machine_authority == 'true' }}
    runs-on: ubuntu-24.04
    # On a pull request a shard past about 17.5 minutes fails the execution
    # budget anyway (CI_MAX_EXEC_SECONDS, 1080 s, less about 30 s of change
    # classification); 20 leaves headroom over the expected 6-10 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [audits-a, audits-b, audits-c, audits-d, audits-e, audits-f, audits-g, audits-h]
    env:
      # A 4-vCPU runner: four TLC workers, and a heap that leaves room for
      # the runner.
      TLC_WORKERS: "4"
      JAVA_TOOL_OPTIONS: -Xmx8g
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup TLC
        uses: ./.github/actions/setup-tlc-ci

      - name: Run the audit shard
        shell: bash
        run: |
          set -euo pipefail
          # The audit parts never execute xtask, so they take no xtask
          # argument; the lane rejects an unknown part.
          bash crates/xtask/tests/machine_verify_all_tlc_test.sh --part "${{ matrix.part }}"

  clippy:
    name: Clippy (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.rust_changed == 'true' && needs.changes.outputs.shard_first_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.shard_matrix) }}
    env:
      # sccache could not cache a workspace crate behind clippy-driver, so
      # every Clippy lane re-checked the whole workspace chain below its
      # packages. This wrapper hands the crates Clippy does not lint (with
      # --no-deps, every crate but the lane's own packages) to sccache as the
      # plain rustc invocation clippy-driver would run; the lane's packages
      # still go through clippy-driver.
      RUSTC_WRAPPER: ${{ github.workspace }}/scripts/ci-clippy-sccache-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Clippy (changed packages, the shard's targets, all features)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          # --all-targets, except a pull request's meerkat-mob chain shards:
          # their lib and bin targets (--lib --bins), since their tests run
          # on the push, which lints every target.
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in a clippy lane"; exit 1; }
          case "${TARGETS}" in
            "--all-targets"|"--lib"|"--bins"|"--lib --bins") ;;
            *) echo "::error::unexpected clippy targets '${TARGETS}'"; exit 1 ;;
          esac
          # shellcheck disable=SC2086
          ./scripts/repo-cargo clippy ${PACKAGES} --no-deps ${TARGETS} --all-features -- -D warnings

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-clippy-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  clippy-rest:
    name: Clippy (${{ matrix.name }})
    needs: [changes, stagger]
    # The rest wave of `clippy` (long rows first, scripts/ci-cargo-lanes.mjs):
    # a copy of that job, which scripts/ci-cargo-lanes-selftest.mjs checks.
    if: ${{ needs.changes.outputs.rust_changed == 'true' && needs.changes.outputs.shard_rest_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.shard_rest_matrix) }}
    env:
      RUSTC_WRAPPER: ${{ github.workspace }}/scripts/ci-clippy-sccache-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Clippy (changed packages, the shard's targets, all features)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in a clippy lane"; exit 1; }
          case "${TARGETS}" in
            "--all-targets"|"--lib"|"--bins"|"--lib --bins") ;;
            *) echo "::error::unexpected clippy targets '${TARGETS}'"; exit 1 ;;
          esac
          # shellcheck disable=SC2086
          ./scripts/repo-cargo clippy ${PACKAGES} --no-deps ${TARGETS} --all-features -- -D warnings

      - name: Upload sccache server log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-clippy-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  unit:
    name: Unit tests (${{ matrix.name }})
    needs: changes
    # A release projection runs its readers' and meerkat-contracts' rows.
    if: ${{ (needs.changes.outputs.rust_changed == 'true' || needs.changes.outputs.release_projection == 'true') && needs.changes.outputs.unit_shard_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_shard_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Unit tests (changed packages, lib and bin targets)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TARGETS: ${{ matrix.targets }}
          # Set only on feature-suite rows whose tests need a deeper test-thread
          # stack than the 8 MiB .cargo/config.toml default (see FEATURE_UNIT_SUITES).
          MIN_STACK: ${{ matrix.rust_min_stack }}
          # Set only on the rows of a partitioned lane (PARTITIONED_UNIT_PACKAGES):
          # the row builds the lane and runs one hash partition of its tests.
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in a unit lane"; exit 1; }
          case "${TARGETS}" in
            "--lib"|"--bins"|"--lib --bins") ;;
            *) echo "::error::unexpected unit targets '${TARGETS}'"; exit 1 ;;
          esac
          # An empty RUST_MIN_STACK would drop tests to Rust's 2 MiB default, so it
          # is exported only when the row sets one.
          if [[ -n "${MIN_STACK}" ]]; then export RUST_MIN_STACK="${MIN_STACK}"; fi
          partition_args=()
          if [[ -n "${PARTITION}" ]]; then
            partition_args=(--partition "${PARTITION}")
          fi
          # Tests of crates that dev-depend on mcp-test-server spawn this exact
          # fixture and fail without it (mcp_test_server::fixture_binary).
          # shellcheck disable=SC2086
          fixture="$(scripts/mcp-test-server-fixture --if-needed ${PACKAGES})"
          if [[ -n "${fixture}" ]]; then
            export MEERKAT_MCP_TEST_SERVER="${fixture}"
            echo "mcp-test-server fixture: ${MEERKAT_MCP_TEST_SERVER}"
          fi
          # shellcheck disable=SC2086
          ./scripts/repo-cargo nextest run ${PACKAGES} ${TARGETS} --profile ci-pr "${partition_args[@]}" \
            --no-tests=pass --no-fail-fast --status-level fail --final-status-level fail

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-unit-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  governed-jsonl:
    name: Governed JSONL
    needs: [changes, stagger]
    # Default RPC features enable MCP and compile the governed JSONL cases
    # away; this profile runs them with the schedule-composition cases of
    # the same test module (which the default-feature unit lane also runs).
    # The step's expected list is the one record of the selection; every
    # count it checks derives from that list.
    # Native dependency changes must retain this positive non-MCP profile.
    # The push runs it on every Rust change; a pull request leaves it there
    # (it compiles meerkat-rpc's lib test and the meerkat-mob chain: 866 s on
    # run 38859112297) unless it touches the lane's own inputs or changes its
    # definition (GUARD_LANE_INPUTS, GUARD_LANE_DEFINITIONS in
    # scripts/ci-cargo-lanes.mjs).
    if: ${{ needs.changes.outputs.governed_jsonl == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
      RUST_MIN_STACK: "8388608"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Governed JSONL exact selection and execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          evidence = Path(os.environ["RUNNER_TEMP"]) / "governed-jsonl"
          evidence.mkdir()
          expected = sorted([
              "governed_jsonl::tests::a_governed_input_runs_its_staged_session_on_the_runtime_that_admits_it",
              "governed_jsonl::tests::governed_jsonl_public_entry_preserves_refusal_sibling_feedback_and_completed_native_run",
              "governed_jsonl::tests::governed_jsonl_refusal_retains_actor_seed_and_context_then_same_run_read_finishes",
              "governed_jsonl::tests::governed_jsonl_rejects_ungoverned_bundle_and_unsupported_wire_before_setup",
              "governed_jsonl::tests::ordinary_rpc_host_materializes_a_scheduled_fire_past_the_mandate_gate",
              "governed_jsonl::tests::rpc_runtimes_compose_the_realms_own_schedule_service",
          ])
          command = [
              "./scripts/repo-cargo", "test", "--locked", "-p", "meerkat-rpc", "--lib",
              "--no-default-features", "--features", "local-authorization",
              "governed_jsonl::tests::", "--",
          ]

          def run(phase, arguments):
              log_path = evidence / f"{phase}.log"
              with log_path.open("w") as log:
                  process = subprocess.Popen(
                      command + arguments, stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT, text=True,
                  )
                  for line in process.stdout:
                      log.write(line)
                      log.flush()
                      print(line, end="", flush=True)
                  code = process.wait()
              (evidence / f"{phase}.exit").write_text(f"{code}\n")
              if code != 0:
                  sys.exit(f"{phase} Cargo process failed with exit {code}")
              return log_path.read_text()

          listing = run("list", ["--list", "--color", "never"])
          names = re.findall(r"^(\S+): test$", listing, re.MULTILINE)
          if sorted(names) != expected or re.findall(
              r"^\d+ tests?, \d+ benchmarks?$", listing, re.MULTILINE
          ) != [f"{len(expected)} test{'' if len(expected) == 1 else 's'}, 0 benchmarks"]:
              sys.exit(f"governed JSONL list must contain exactly the {len(expected)} expected tests: {names!r}")

          # No --nocapture: libtest captures each test's output, so every
          # outcome is its own `test NAME ... ok` line (a test that prints
          # splits that line under --nocapture); a failure still prints it.
          result = run("run", ["--test-threads=1", "--color", "never"])
          outcomes = re.findall(r"^test (\S+) \.\.\. (ok|FAILED|ignored)$", result, re.MULTILINE)
          if sorted(outcomes) != [(name, "ok") for name in expected]:
              sys.exit(f"governed JSONL must pass all exact names with zero ignored: {outcomes!r}")
          summaries = re.findall(
              r"^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; "
              r"(\d+) measured; \d+ filtered out; finished in .+$", result, re.MULTILINE,
          )
          if summaries != [("ok", str(len(expected)), "0", "0", "0")]:
              sys.exit(f"governed JSONL requires exactly {len(expected)} passed, 0 failed, 0 ignored: {summaries!r}")
          PYTHON

      - name: Upload governed JSONL logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: governed-jsonl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-jsonl/
          if-no-files-found: error
          retention-days: 7

      - name: Upload sccache server log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-governed-jsonl-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  mcp-confinement-positive:
    name: MCP confinement positive (Linux)
    needs: changes
    # The Linux positive confinement cases (the MCP supported-native,
    # command-hook, sandbox and shell suites of
    # `make test-mcp-confinement-positive`, whose CONFINEMENT_* counts it
    # enforces) are ignored on Linux in the unit lanes; this lane selects
    # exactly them. A backend refusal fails it,
    # and so does a selection of zero tests. On ubuntu-24.04 the native
    # backend's probe needs an unprivileged user+mount+IPC namespace that
    # AppArmor restricts by default. On a GitHub-hosted runner only, the
    # step before the tests prints the restriction and a matching shell
    # probe, records the setting, lifts it and must then pass the same
    # probe; an always() step after the tests restores the recorded value.
    # The push runs it on every Rust change; a pull request leaves it there
    # (the command-hook suite compiles the facade's lib test under every
    # feature: 863 s on run 38859112297) unless it touches the lane's own
    # inputs or changes its definition (GUARD_LANE_INPUTS,
    # GUARD_LANE_DEFINITIONS in scripts/ci-cargo-lanes.mjs).
    # The push's build is cold after a change below the facade: 32.5 minutes
    # on main push 39213218053 and 27.5 on dispatch 39211283488, against the
    # 40 a pull request keeps. A push or dispatch gets 50, about 54% above
    # the slower run. That cold build cannot fit the gate's pull-request
    # budget (1760 s on pull-request run 39919235188), so a pull request
    # that runs this lane for its inputs or definition leaves it out of the
    # budget and names it in a warning (the gate's "Enforce lane execution
    # budget" step); the 40 minutes here are then its runaway bound, and the
    # gate still requires it to succeed.
    if: ${{ needs.changes.outputs.mcp_confinement_positive == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 40 || 50 }}
    env:
      RUSTC_WRAPPER: sccache
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest

      - name: Confinement eligibility on this runner (evidence before and after)
        shell: bash
        run: |
          # Kernel settings change only on a GitHub-hosted Actions runner.
          if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "refusing to change kernel settings: not a GitHub-hosted Actions runner (GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset} RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset})"
            exit 1
          fi
          # Mirrors the backend probe up to its chroot: user+mount+IPC
          # namespaces, root uid/gid map with setgroups denied, private
          # propagation, a tmpfs, and read-only bind remounts of a
          # directory and of a device node.
          probe() {
            unshare --user --map-root-user --mount --ipc --propagation private sh -euc '
              mount -t tmpfs -o mode=0755,size=16m tmpfs /tmp
              mkdir /tmp/usr
              touch /tmp/null
              mount --bind /usr /tmp/usr
              mount -o remount,bind,ro,nosuid,nodev /tmp/usr
              mount --bind /dev/null /tmp/null
              mount -o remount,bind,ro,nosuid /tmp/null
            '
          }
          echo "kernel: $(uname -r); apparmor label: $(cat /proc/self/attr/current 2>/dev/null || echo unknown)"
          for path in / /dev /tmp; do findmnt -no TARGET,FSTYPE,OPTIONS --target "$path" || true; done
          echo "BEFORE: $(sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces 2>&1 | tr '\n' ' ')"
          if probe; then echo "BEFORE: namespace probe ok"; else echo "BEFORE: namespace probe refused (rc=$?)"; fi
          orig="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          case "$orig" in 0|1) ;; *) echo "unexpected kernel.apparmor_restrict_unprivileged_userns value: $orig"; exit 1;; esac
          # Recorded before the change so the restore step below always has it.
          echo "CONFINEMENT_USERNS_RESTRICT_ORIGINAL=$orig" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "AFTER: $(sysctl kernel.apparmor_restrict_unprivileged_userns)"
          probe
          echo "AFTER: namespace probe ok"

      - name: MCP confinement positive acceptance
        shell: bash
        run: make test-mcp-confinement-positive

      - name: Restore the AppArmor userns restriction
        if: ${{ always() && env.CONFINEMENT_USERNS_RESTRICT_ORIGINAL != '' }}
        shell: bash
        run: |
          if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "refusing to change kernel settings: not a GitHub-hosted Actions runner (GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset} RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset})"
            exit 1
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="${CONFINEMENT_USERNS_RESTRICT_ORIGINAL}"
          restored="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          echo "RESTORED: kernel.apparmor_restrict_unprivileged_userns=${restored} (original ${CONFINEMENT_USERNS_RESTRICT_ORIGINAL})"
          if [ "${restored}" != "${CONFINEMENT_USERNS_RESTRICT_ORIGINAL}" ]; then
            echo "::error::the AppArmor userns restriction was not restored"
            exit 1
          fi

  integration:
    name: Integration tests (${{ matrix.name }})
    needs: [changes, stagger]
    # A crate's tests/*.rs binaries run in no unit lane (those run --lib
    # --bins). Each row is an integration suite whose trigger packages
    # changed (INTEGRATION_SUITES in scripts/ci-cargo-lanes.mjs); measured on
    # 4 cores after a meerkat-runtime change: runtime 168 s, machine-codegen
    # 396 s, so about 6 and 13 minutes on a hosted runner, well inside the
    # lane execution budget; xtask (with machine-authority, 163 tests,
    # selected also by workflow edits) 169 s.
    # Also the reader rows (reader_rows in scripts/ci-cargo-lanes.mjs): the
    # lib, bin, test or example target that reads a changed non-Rust input
    # (docs/, .claude/skills/, CHANGELOG.md, specs/, fixtures), with the
    # inventory's features and a filter on the reading tests.
    # Selected by the row count alone: a suite or a reader row can be
    # selected by changed paths in a plan with no Rust change (xtask's
    # workflow pins, a docs edit).
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.integration_count != '0' }}
    runs-on: ubuntu-24.04
    # A suite whose package compiles meerkat-mob runs on the push only, and
    # the first build of a tree that changes meerkat-core compiles that chain
    # cold. On dispatch 39211283488, whose cache is read-only so every lane
    # compiled alone, the rpc-configured-turn-limit row was cancelled at 30
    # minutes with meerkat-rpc still compiling (it started 22m44s in), and
    # gpt-live-replay took 28m52s there and 29m29s on main push 39213218053.
    # A push or dispatch gets 50 minutes; a pull request runs only the suites
    # outside the chain and keeps 30.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 50 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.integration_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry only; compiled objects come from sccache (see the unit lanes).
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Integration tests (tests/*.rs binaries of the suite package, its named targets, or a reader row's targets)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          # A suite may name its test targets; otherwise every tests/*.rs one.
          TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in an integration lane"; exit 1; }
          if [[ -n "${TESTS}" ]]; then
            read -r -a test_flags <<<"${TESTS}"
          else
            test_flags=(--test '*')
          fi
          # --no-tests=fail: a suite whose package lost its tests/ binaries
          # must be removed from INTEGRATION_SUITES, not pass silently.
          # Tests of crates that dev-depend on mcp-test-server spawn this exact
          # fixture and fail without it (mcp_test_server::fixture_binary).
          # shellcheck disable=SC2086
          fixture="$(scripts/mcp-test-server-fixture --if-needed ${PACKAGES})"
          if [[ -n "${fixture}" ]]; then
            export MEERKAT_MCP_TEST_SERVER="${fixture}"
            echo "mcp-test-server fixture: ${MEERKAT_MCP_TEST_SERVER}"
          fi
          # shellcheck disable=SC2086
          # Status level slow: the suites hold known heavy tests with exact-case
          # timeout overrides in .config/nextest.toml; their durations stay visible.
          ./scripts/repo-cargo nextest run ${PACKAGES} "${test_flags[@]}" --profile ci-pr \
            --no-tests=fail --no-fail-fast --status-level slow --final-status-level slow

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-integration-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  closure-tests:
    name: Closure tests (${{ matrix.name }})
    needs: changes
    # The deterministic workspace test lanes (scripts/pre-push-unit.sh, which
    # the pre-push hook now runs only on demand), run here for the test
    # scope: the reverse-dependency closure of the changed packages, or every
    # member on a global change. Rows are closure_test_rows in
    # scripts/ci-cargo-lanes.mjs: every tests/*.rs target the lane script
    # builds (by name, fast selection) and e2e-fast, selecting the whole
    # workspace so they compile the lane script's own units, and HeadCanonical
    # with its own command. Its kind(lib) lane gets no row: a --workspace
    # --lib row is planned only with --lib-row-runner, for a runner that
    # builds it in time (a hosted 4-vCPU runner needs about 64 min); every
    # member's lib tests run in main-unit and, under the workspace feature
    # set, in nightly's workspace unit lane.
    # scripts/ci-hook-coverage.mjs fails the plan when a lane binary in scope
    # has no row and is not such a lib binary. Push only: a pull request
    # plans no rows (its plan counts them in deferred_to_push; on run
    # 38859112297 the 17 rows took 315-1779 s). Selected by the row count
    # alone.
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.closure_test_first_count != '0' }}
    runs-on: ubuntu-24.04
    # A cold row (no reusable units, as after a release version bump) builds
    # for about 22 min before its tests run. The nested-Cargo canaries'
    # binary has rows of its own, one count partition per canary, so the
    # canaries run side by side on separate runners instead of one at a time.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.closure_test_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry only; compiled objects come from sccache (see the unit lanes).
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Closure tests (the row's targets, workspace feature set)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TESTS: ${{ matrix.tests }}
          PROFILE: ${{ matrix.profile }}
          FILTER: ${{ matrix.filter }}
          BINARIES: ${{ matrix.binaries }}
          NO_TESTS: ${{ matrix.no_tests }}
          MIN_STACK: ${{ matrix.rust_min_stack }}
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          if [[ -z "${PACKAGES}" || -z "${TESTS}" || -z "${PROFILE}" || -z "${BINARIES}" || -z "${NO_TESTS}" ]]; then
            echo "::error::incomplete closure test row"
            exit 1
          fi
          read -r -a test_flags <<<"${TESTS}"
          filter_args=()
          if [[ -n "${FILTER}" ]]; then filter_args=(-E "${FILTER}"); fi
          # A partitioned row (the nested-Cargo canaries' binary) runs one
          # count partition; the plan holds every sibling partition.
          partition_args=()
          if [[ -n "${PARTITION}" ]]; then partition_args=(--partition "${PARTITION}"); fi
          # One selection for the list and the run: the binaries nextest
          # lists, and the check below accepts, are the ones that run.
          # scripts/ci-hook-coverage.mjs pins every line of this step that
          # names a row input (the env above), RUST_MIN_STACK, the selection,
          # nextest or the binary check, so no line can reassign an input or
          # the test-thread stack.
          # shellcheck disable=SC2206
          selection=(${PACKAGES} "${test_flags[@]}" --profile "${PROFILE}" "${filter_args[@]}" "${partition_args[@]}")
          # The hook runs every lane on an 8 MiB test-thread stack.
          if [[ -n "${MIN_STACK}" ]]; then export RUST_MIN_STACK="${MIN_STACK}"; fi
          # Tests of crates that dev-depend on mcp-test-server spawn this exact
          # fixture and fail without it (mcp_test_server::fixture_binary).
          # shellcheck disable=SC2086
          fixture="$(scripts/mcp-test-server-fixture --if-needed ${PACKAGES})"
          if [[ -n "${fixture}" ]]; then
            export MEERKAT_MCP_TEST_SERVER="${fixture}"
            echo "mcp-test-server fixture: ${MEERKAT_MCP_TEST_SERVER}"
          fi
          # Build and list first: nextest must list exactly the binaries the
          # plan names for this row, none of their tests filtered out by a
          # profile, before anything runs. The run reuses the same build.
          ./scripts/repo-cargo nextest list "${selection[@]}" --message-format json >"${RUNNER_TEMP}/closure-test-list.json"
          # shellcheck disable=SC2086
          node scripts/ci-verify-row-binaries.mjs "${RUNNER_TEMP}/closure-test-list.json" "${partition_args[@]}" ${BINARIES}
          ./scripts/repo-cargo nextest run "${selection[@]}" --no-tests="${NO_TESTS}" --no-fail-fast --status-level slow --final-status-level slow

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-closure-tests-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

