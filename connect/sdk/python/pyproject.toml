[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meerkat-toolkit"
version = "0.9.14"
description = "Shared Meerkat Toolkit host adapters"
requires-python = ">=3.11"
license = "(MIT OR Apache-2.0) AND Apache-2.0 AND BSD-2-Clause AND MIT"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "LICENSE-Agno", "LICENSE-EXTRACTED", "THIRD_PARTY_NOTICES.md", "TELEGRAM.md", "FRONTEND.md", "PAIRED-HOST-LIVE.md", "EXTENSIONS.md", "GMAIL.md"]

[project.optional-dependencies]
extensions = ["packaging>=25.0"]
agno = ["agno==3.0.11", "jsonschema==4.26.0"]
agno-mcp = [
    "agno==3.2.0",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "anyio==4.15.1",
    "referencing==0.37.0",
    "requests==2.34.2",
    "tavily-python==0.8.5",
    "python-gitlab==8.6.0",
    "pytz==2026.6",
    "linkup-sdk==0.24.1",
    "todoist-api-python==4.0.1",
    "dataclass-wizard==0.39.1",
    "exa-py==2.28.0",
    "firecrawl-py==4.57.0",
    "py-trello==0.20.1",
    "simple-salesforce==1.12.10",
    "twilio==9.13.0",
    "webexpythonsdk==2.0.6",
    "plivo==4.63.0",
    "arxiv==4.1.0",
    "pypdf==6.19.0",
    "praw==8.0.3",
    "prawcore==4.0.0",
    "tweepy==4.17.0",
    "oauthlib==3.3.1",
    "oxylabs==3.0.0",
    "boto3==1.44.3",
    "botocore==1.44.3",
    "beautifulsoup4==4.15.0",
    "soupsieve==2.10",
    "psycopg==3.3.8",
    "psycopg-binary==3.3.8",
]
telegram = ["python-telegram-bot==22.8"]
home-assistant = ["httpx>=0.28.1,<0.29", "anyio>=4.13,<5"]
gmail = ["httpx>=0.28.1,<0.29", "anyio>=4.13,<5"]
google-calendar = ["httpx>=0.28.1,<0.29", "anyio>=4.13,<5"]
google-drive = ["httpx>=0.28.1,<0.29", "anyio>=4.13,<5"]
google-oauth = ["google-auth==2.62.2", "httpx>=0.28.1,<0.29", "anyio>=4.13,<5"]
slack = ["httpx>=0.28.1,<0.29", "anyio>=4.13,<5"]
paired-host-live = ["httpx>=0.28.1,<0.29", "anyio>=4.13,<5"]
# Requires the matching generic local transport API from this development
# composition; an older SDK is rejected before a child process is started.
native-host = ["meerkat-meta==0.9.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meerkat_toolkit = ["data/frontend_catalog.json", "data/frontend_catalog.sha256"]
"meerkat_toolkit.adapters" = ["CONFIGURATION-GUIDES.json", "PROFILE-GUIDE.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
