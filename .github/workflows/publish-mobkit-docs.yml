name: Publish MobKit docs

on:
  repository_dispatch:
    types: [mobkit-release-published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Public MobKit release tag to republish"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-mobkit-docs
  cancel-in-progress: false

jobs:
  publish:
    name: Publish latest MobKit release
    runs-on: ubuntu-latest
    env:
      MOBKIT_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.event.inputs.release_tag }}
      EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
      EXPECTED_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || '' }}
    steps:
      - name: Checkout docs.rkat.ai source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout immutable MobKit release
        uses: actions/checkout@v4
        with:
          repository: lukacf/meerkat-mobkit
          ref: ${{ env.MOBKIT_TAG }}
          path: _mobkit-release
          fetch-depth: 0

      - name: Verify public release identity and latestness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$MOBKIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid MobKit release tag: $MOBKIT_TAG" >&2
            exit 1
          fi

          actual_sha=$(git -C _mobkit-release rev-parse HEAD)
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("_mobkit-release/Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "v$version" != "$MOBKIT_TAG" ]]; then
            echo "::error::Tag $MOBKIT_TAG does not match MobKit version $version" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" && "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Release checkout $actual_sha does not match dispatched SHA $EXPECTED_SHA" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_VERSION" && "$version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Release version $version does not match dispatched version $EXPECTED_VERSION" >&2
            exit 1
          fi

          latest_tag=$(gh api repos/lukacf/meerkat-mobkit/releases/latest --jq .tag_name)
          if [[ "$latest_tag" != "$MOBKIT_TAG" ]]; then
            echo "::error::Refusing to replace latest docs with $MOBKIT_TAG; latest public release is $latest_tag" >&2
            exit 1
          fi

          python3 _mobkit-release/scripts/verify-published-registries.py --version "$version"

      - name: Generate released MobKit documentation
        run: |
          set -euo pipefail
          python3 scripts/sync-mobkit-docs.py _mobkit-release \
            --source-ref "$MOBKIT_TAG" \
            --require-clean

      - name: Validate complete Mintlify site
        run: make docs-check

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Mintlify parsing and links
        working-directory: docs
        run: npx --yes mint@4.2.728 broken-links

      - name: Stage the generated snapshot on a publication branch
        id: stage
        run: |
          set -euo pipefail
          git add docs/mobkit docs/docs.json
          if git diff --cached --quiet; then
            echo "docs.rkat.ai already contains $MOBKIT_TAG"
            exit 0
          fi

          unexpected=$(git diff --cached --name-only | grep -Ev '^docs/(mobkit/|docs\.json$)' || true)
          if [[ -n "$unexpected" ]]; then
            echo "::error::MobKit docs publication staged unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: publish MobKit ${MOBKIT_TAG}"

          pr_branch="codex/publish-mobkit-docs-${MOBKIT_TAG#v}-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${pr_branch}"
          echo "pushed_branch=${pr_branch}" >> "${GITHUB_OUTPUT}"

      - name: Publish generated snapshot through a protected pull request
        id: pull_request
        if: steps.stage.outputs.pushed_branch != ''
        env:
          # github.token cannot open pull requests while the repository setting
          # "Allow GitHub Actions to create and approve pull requests" is off;
          # every publication between 2026-08-24 and 2026-09-03 that reached
          # this step died here after the branch was already pushed (two
          # 2026-08-29 runs failed earlier, at `make docs-check`). A dedicated
          # fine-grained token is preferred when the secret exists, so the
          # workflow token itself is not widened. It only opens the pull
          # request and needs exactly: Pull requests: read and write on this
          # repository (Metadata: read is implied). CI dispatch and auto-merge
          # below run under github.token, which already holds actions: write
          # and contents: write; enabling auto-merge needs contents: write, so
          # a pull-request-only token must not be asked to do it.
          GH_TOKEN: ${{ secrets.MOBKIT_DOCS_PR_TOKEN || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.stage.outputs.pushed_branch }}
        run: |
          set -euo pipefail
          pr_branch="${PR_BRANCH}"
          pr_url=$(gh pr create \
            --base main \
            --head "${pr_branch}" \
            --title "docs: publish MobKit ${MOBKIT_TAG}" \
            --body "Publish the immutable ${MOBKIT_TAG} documentation snapshot after registry, generated-site, and link validation. This pull request is created because main requires the CI gate; the publication workflow must not bypass branch protection.")
          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
          # A branch pushed with github.token triggers no workflow run on its
          # own, so CI is dispatched with the workflow's own token, which holds
          # the actions: write permission the dedicated token need not have.
          GH_TOKEN="${ACTIONS_TOKEN}" gh workflow run ci.yml --ref "${pr_branch}"
          GH_TOKEN="${ACTIONS_TOKEN}" gh pr merge "${pr_url}" --auto --squash
          echo "Queued protected MobKit docs publication: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report a publication that needs a human
        # The branch is pushed but the pull request did not get opened or
        # queued for merge. Leave the job red (nothing was published) but say
        # so where someone will read it: the job summary and one tracking issue
        # with a stable title, so repeated failures update it instead of
        # piling up. Issue writes use github.token; Actions may open issues
        # even where it may not open pull requests.
        if: failure() && steps.stage.outputs.pushed_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.stage.outputs.pushed_branch }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
        run: |
          set -euo pipefail
          python3 scripts/report-mobkit-docs-publication-failure.py \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${MOBKIT_TAG}" \
            --branch "${PR_BRANCH}" \
            --pull-request-url "${PR_URL}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --summary "${GITHUB_STEP_SUMMARY}"
