name: Cargo CI

# The only CI lane. Runs entirely on free GitHub-hosted standard runners with
# a ~10-minute wall-clock target: many small parallel jobs, sccache
# (content-addressed compile cache) + mold (fast linker), and path gating so
# work scales with what actually changed.
#
# Per-push jobs:
#   changes         — path classification (docs-only skips build/test jobs;
#                     SDK-relevant paths enable the full Web SDK suite)
#   fmt-governance  — always-run fmt + surface + typed governance gates
#   locks           - always-run, never path-gated: Cargo.lock --locked
#                     resolution (merge danglers) + MODULE.bazel.lock
#                     recorded-input freshness
#   clippy          — workspace clippy, all features, lib/bin targets
#                     (--all-targets multiplies build volume several-fold for
#                     test-only lint yield; it runs nightly)
#   unit-archive    - build lib unit tests once into a portable archive
#   unit (x8)       - run hash partitions from the shared unit archive
#   dense-topology  - run the isolated ignored 300-member/150-peer Mob stress
#                     from that same archive on GitHub-hosted Linux
#   int-archives    - build the three fast-profile integration families on one
#                     runner so their shared dependency graph is compiled once;
#                     run the sub-second integration-crate family in place
#   int-mob, int-else (x3 each)
#                   - run hash partitions from the shared family archives
#   int-rest (x2)   - direct singleton crate-group integration lanes
#   e2e-fast        — deterministic end-to-end lane (real binaries)
#   ratchets        — version/schema/SDK/surface generation ratchets
#   machine-verify  — canonical bounded TLC lane; machine-authority changes
#   wasm-check      — wasm32 cargo check (every code change)
#   wasm-contract   — wasm-pack browser contract test in headless Chrome;
#                     only when wasm contract surfaces changed
#   sdk-host        — Python + TypeScript SDK suites; only when SDK-relevant
#                     paths changed
#   sdk-web         — full Web SDK suite (wasm-pack + wasm-opt + node tests);
#                     only when SDK-relevant paths changed
#   audit           — cargo-deny security/license audit
#   gate            — aggregate (branch protection targets ci.yml's "CI gate")
#
# Deferred to nightly.yml: feature matrices, minimal-feature build,
# surface-modularity, e2e-system, clippy --all-targets, release packaging,
# unconditional Web SDK suite.

on:
  workflow_call:
    inputs:
      base_sha:
        description: Base revision for changed-path gating.
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base revision for changed-path gating.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Stable per-VM Cargo home: hosted runners are fresh per job, and cache
  # reuse (rust-cache + sccache) requires registry source paths that do not
  # change between runs.
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.94.1
  # Keep repo-cargo's per-worktree redirection out of CI: pin the target dir
  # where Swatinem/rust-cache caches it (scripts/repo-cargo respects a
  # pre-set CARGO_TARGET_DIR).
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # CI never reuses incremental state across compiles within a job, and
  # debuginfo in test binaries only bloats the cache; both off for speed.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # sccache is content-addressed, so it survives fresh-checkout mtimes (which
  # defeat cargo's own fingerprints for workspace crates) and is shared
  # across the divergent CARGO_TARGET_DIRs the xtask gate scripts use.
  SCCACHE_GHA_ENABLED: "true"
  # Cache-service hiccups must degrade to plain compiles, never fail a job.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      sdk_changed: ${{ steps.classify.outputs.sdk_changed }}
      wasm_changed: ${{ steps.classify.outputs.wasm_changed }}
      machine_authority_changed: ${{ steps.classify.outputs.machine_authority_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ inputs.base_sha || '' }}
        run: |
          set -euo pipefail
          code_changed=true
          sdk_changed=true
          wasm_changed=true
          machine_authority_changed=true
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${BASE_SHA}...HEAD")
            # Docs-only changes skip the build/test jobs. Governance still
            # runs on every invocation below. Anything else — or an unknown
            # base — runs the full lane (fail open into MORE CI, never less).
            if ! grep -qvE '^(docs/|docs-internal/|\.claude/|CHANGELOG\.md|README\.md|.*\.md$)' <<<"${changed}"; then
              code_changed=false
            fi
            # The full Web SDK suite (wasm-pack + wasm-opt + node tests) is
            # inherently slow; run it per push only when SDK-relevant
            # surfaces changed. wasm-check still runs on every code change,
            # and nightly runs the full suite unconditionally.
            if ! grep -qE '^(sdks/|meerkat-web-runtime/|meerkat-contracts/|meerkat-core/|artifacts/schemas/|Cargo\.(toml|lock)|Makefile|\.github/)' <<<"${changed}"; then
              sdk_changed=false
            fi
            # The browser contract test (wasm-pack + headless Chrome) is the
            # executable semantic mirror of the browser surface; per push it
            # runs only when the wasm contract surfaces changed. wasm-check
            # still type-checks it on every code change, and nightly executes
            # it unconditionally.
            if ! grep -qE '^(meerkat-web-runtime/|meerkat-contracts/|sdks/web/|\.github/workflows/cargo\.yml)' <<<"${changed}"; then
              wasm_changed=false
            fi
            mapfile -t changed_paths <<<"${changed}"
            if scripts/machine-authority-changed -- "${changed_paths[@]}"; then
              machine_authority_changed=true
            else
              classifier_status=$?
              if [[ "${classifier_status}" -eq 1 ]]; then
                machine_authority_changed=false
              else
                echo "::warning::machine-authority classifier failed; running bounded TLC fail-closed"
                machine_authority_changed=true
              fi
            fi
          fi
          echo "code_changed=${code_changed}" >> "$GITHUB_OUTPUT"
          echo "sdk_changed=${sdk_changed}" >> "$GITHUB_OUTPUT"
          echo "wasm_changed=${wasm_changed}" >> "$GITHUB_OUTPUT"
          echo "machine_authority_changed=${machine_authority_changed}" >> "$GITHUB_OUTPUT"
          echo "code_changed=${code_changed} sdk_changed=${sdk_changed} wasm_changed=${wasm_changed} machine_authority_changed=${machine_authority_changed}"

  fmt-governance:
    name: Format + governance gates
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Install governance scan dependencies
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # One cache key PER JOB: with a single shared key only the first
          # job to save wins and every other job stays cold forever.
          shared-key: ci-governance

      - name: Format check
        run: make fmt-check

      - name: Nextest archive contract self-test
        run: scripts/test-ci-nextest-archive.sh

      - name: Surface/backend gates
        run: make legacy-surface-gate session-control-gate deprecated-backend-gate bridge-no-responsestatus-gate

      - name: Dogma skill docs mirror
        run: make sync-meerkat-dogma-skill-docs

      - name: Typed governance gates (rmat-audit set)
        run: make rmat-audit

      - name: Seam inventory (strict)
        run: make seam-inventory

      - name: Runtime authority bypass audit
        run: make runtime-authority-bypass

      - name: Storage ambient-resolution gate
        run: make storage-ambient-gate

      - name: Machine authority docs gate
        run: make machine-authority-docs-gate

      - name: Docs-only load-bearing contracts
        if: ${{ needs.changes.outputs.code_changed == 'false' }}
        run: make docs-only-contract-gate

      - name: Machine poster coverage
        run: make verify-machine-poster-coverage

      - name: Generated headers audit
        run: make audit-generated-headers

  locks:
    name: Lock consistency
    # No `needs` and no path gate: on a pull_request run the checked out tree is
    # refs/pull/N/merge, and that merge preview is the only place the
    # dangling-lock class exists. A release branch is always self-consistent
    # because cargo wrote it; the MERGE is where git resolves a shared
    # [[package]] block textually and leaves a branch-only crate pointing at a
    # version the merged lock no longer contains. No conflict marker, no test
    # failure, and then `cargo publish` (which is --locked) dies seconds in.
    runs-on: ubuntu-latest
    steps:
      # Depth 2, not the default 1: a depth-1 clone grafts HEAD to have no
      # parents, which hides the very merge topology this job reports on.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-locks

      - name: Cargo.lock resolves under --locked
        run: make verify-lock-consistency

      # MODULE.bazel.lock records Cargo.lock and every member manifest as
      # crate_universe extension inputs. Healing the Cargo.lock without
      # refreshing it fails every BuildBuddy release-binary lane, which is far
      # too late; the recorded hashes make that decidable here, offline. The
      # generated-BUILD half of `make verify-bazel-locks` stays on pre-push and
      # local `make ci`, where it is proven.
      - name: MODULE.bazel.lock recorded inputs
        run: make verify-bazel-module-lock-inputs

  clippy:
    name: Clippy (workspace, all features)
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy

      - name: Clippy (lib/bin targets; --all-targets runs nightly)
        run: ./scripts/repo-cargo clippy --workspace --all-features -- -D warnings

  unit-archive:
    name: Build unit-test archive
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-nextest-unit-archive

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Build workspace unit archive
        uses: ./.github/actions/build-nextest-archive
        with:
          family: unit

  unit:
    name: Unit tests (shard ${{ matrix.partition }}/8)
    needs:
      - changes
      - unit-archive
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unit tests (shard)
        uses: ./.github/actions/run-nextest-archive
        with:
          family: unit
          partition: hash:${{ matrix.partition }}/8

  dense-topology:
    name: Dense Mob topology (300 members x 150 peers)
    needs:
      - changes
      - unit-archive
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run isolated dense topology stress
        uses: ./.github/actions/run-nextest-archive
        with:
          family: unit
          partition: hash:1/1
          profile: mob-dense-topology
          run_ignored: all

  # Integration tests split by build scope, not just run partition. One runner
  # builds the three fast-profile families so matching dependencies are
  # compiled once; two singleton feature shapes stay direct. The tiny
  # integration-crate family runs beside its freshly built archive instead of
  # uploading 367 MB to three runners for less than one second of total tests.
  # The complement archive keeps coverage complete when new workspace crates
  # are added.
  int-archives:
    name: Build integration archives + run integration-crate tests
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-nextest-integration-archives

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Build integration-crate archive
        id: int-heavy-archive
        uses: ./.github/actions/build-nextest-archive
        with:
          family: int-heavy
          publish: "false"

      - name: Run integration-crate tests from the local archive
        run: >-
          scripts/ci-nextest-archive.sh run
          int-heavy
          "${{ steps.int-heavy-archive.outputs.path }}"
          hash:1/1

      - name: Build Mob integration archive
        uses: ./.github/actions/build-nextest-archive
        with:
          family: int-mob

      - name: Build complement integration archive
        uses: ./.github/actions/build-nextest-archive
        with:
          family: int-everything-else

  int-mob:
    name: Integration tests, mob-${{ matrix.partition }}of3 crates
    needs:
      - changes
      - int-archives
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Integration-fast tests (Mob shard)
        uses: ./.github/actions/run-nextest-archive
        with:
          family: int-mob
          partition: hash:${{ matrix.partition }}/3

  int-else:
    name: Integration tests, everything-else-${{ matrix.partition }}of3 crates
    needs:
      - changes
      - int-archives
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Integration-fast tests (complement shard)
        uses: ./.github/actions/run-nextest-archive
        with:
          family: int-everything-else
          partition: hash:${{ matrix.partition }}/3

  # Singleton crate groups still build and execute directly. Archiving them
  # would add transfer overhead without eliminating duplicate compilation.
  int-rest:
    name: Integration tests, ${{ matrix.group }} crates
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-machine
            scope: >-
              -p meerkat-core -p meerkat-models -p meerkat-machine-codegen
              -p meerkat-machine-derive -p meerkat-machine-dsl
              -p meerkat-machine-dsl-core -p meerkat-machine-kernels
              -p meerkat-machine-schema -p machine-dsl-tests
              -p meerkat-capabilities -p meerkat-agent-build-authority
              -p meerkat-contracts
          # meerkat-store/sqlite is explicit here: nothing in this crate
          # group enables it, and otherwise the SQLite storage-conformance
          # tests are cfg'd out of the only blocking lane that builds them.
          - group: client-session
            scope: >-
              -p meerkat-anthropic -p meerkat-auth-core -p meerkat-client
              -p meerkat-comms -p meerkat-gemini -p meerkat-hooks
              -p meerkat-llm-core -p meerkat-mcp -p meerkat-memory
              -p meerkat-openai -p meerkat-providers -p meerkat-session
              -p meerkat-skills -p meerkat-store -p meerkat-tools
              --features meerkat-store/sqlite
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-int-${{ matrix.group }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Integration-fast tests (singleton crate group)
        run: >-
          ./scripts/repo-cargo nextest run ${{ matrix.scope }} --tests
          --profile fast --show-progress none --status-level none
          --final-status-level fail --partition hash:1/1

  e2e-fast:
    name: Deterministic e2e lane
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-e2e

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Deterministic e2e lane
        run: make e2e-fast

  ratchets:
    name: Generation ratchets
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ratchets

      - name: Docs validation
        run: make docs-check

      # The release-time semver-breaks gate needs cargo-semver-checks; its
      # analyser does not. Run the analyser's unit tests on every PR so parser
      # drift is caught here rather than at the tag, where "no breaks found"
      # and "parser stopped matching the report" look identical.
      - name: Semver-breaks analyser self-test
        run: make semver-breaks-selftest

      - name: Verify version parity
        run: make verify-version-parity

      - name: Verify schema freshness
        run: make verify-schema-freshness
        env:
          MEERKAT_SCHEMA_DIAGNOSTIC_DIR: ${{ github.workspace }}/schema-freshness-output

      - name: Upload fresh schemas after freshness failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-contract-schemas
          path: schema-freshness-output
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify SDK codegen freshness
        run: make verify-sdk-codegen-freshness

      - name: Verify SDK event inventory
        run: make verify-sdk-event-inventory

      - name: Verify RPC surface alignment
        run: make verify-rpc-surface-alignment

      - name: Verify REST surface alignment
        run: make verify-rest-surface-alignment

      - name: Verify SDK wrapper freshness
        run: make verify-sdk-wrapper-freshness

      - name: Verify pre-ledger corpus generator exclusions
        run: make verify-fixture-mint-generator

      - name: Verify Rust release configuration
        run: make check-rust-release-config

      # The gate above is only worth its runtime if it still fails on the
      # defects it was written for. This contract test asserts that on a
      # scratch workspace and costs no build; pre-push alone is bypassable.
      - name: Verify release crate enumeration gate still fails closed
        run: scripts/test-crate-enumeration-gate.sh

      - name: Verify generated machine kernels are not stale
        id: machine_drift
        shell: bash
        run: |
          if make machine-check-drift; then
            exit 0
          fi
          # Preserve the exact generated side of the failed comparison. This
          # turns drift diagnostics into actionable evidence for static-only
          # repair instead of requiring a second local Rust build.
          make machine-codegen
          exit 1

      - name: Upload fresh machine artifacts after drift failure
        if: ${{ failure() && steps.machine_drift.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: fresh-machine-artifacts
          path: |
            specs/machines
            specs/compositions
            meerkat-machine-kernels/src/generated
          if-no-files-found: error
          retention-days: 1

      # protocol-codegen emits a different artifact set than machine-codegen
      # (handoff protocol helpers, terminal surface mapping, generated
      # authority contracts) through a different renderer. Before this step
      # nothing in a blocking lane re-rendered that set as a whole, so a stale
      # committed artifact could ship. Both this check and the writer read the
      # same emission set, so a newly added artifact is gated on arrival.
      - name: Verify generated protocol artifacts are not stale
        id: protocol_drift
        shell: bash
        run: |
          if make protocol-check-drift; then
            exit 0
          fi
          # Preserve the exact generated side of the failed comparison, same
          # rationale as the machine-kernel drift step above.
          make protocol-codegen
          exit 1

      - name: Upload fresh protocol artifacts after drift failure
        if: ${{ failure() && steps.protocol_drift.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: fresh-protocol-artifacts
          # The six crates protocol-codegen emits into. Kept in sync with the
          # emission set in xtask/src/protocol_codegen.rs; a missing directory
          # fails the upload rather than silently shipping partial evidence.
          path: |
            meerkat-core/src/generated
            meerkat-session/src/generated
            meerkat-mob/src/generated
            meerkat-mcp/src/generated
            meerkat-runtime/src/generated
            meerkat-workgraph/src/generated
          if-no-files-found: error
          retention-days: 1
      # check-rust-release-packaging dry-run-packages every release crate
      # (each `cargo package` compiles the crate in isolation) — ~1h on a
      # 4-core runner. It is release hygiene, re-verified by release_validate
      # at release time, and runs nightly instead of per push.

  machine-verify:
    name: Bounded TLC machine verification
    needs: changes
    if: ${{ needs.changes.outputs.machine_authority_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      # A dedicated runner has no Cargo lock contention, so keep xtask under
      # the standard cached target root instead of the local /tmp isolation.
      XTASK_TARGET_DIR: ${{ github.workspace }}/target
      # The generated adaptive composition is large enough that Java's
      # container-selected ~3.5 GiB heap OOMs during semantic processing.
      JAVA_TOOL_OPTIONS: -Xmx8g
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-machine-verify

      - name: Install pinned TLC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/lib" "$HOME/.local/bin"
          curl --fail --location --retry 5 --retry-delay 2 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output "$HOME/.local/lib/tla2tools.jar"
          printf '#!/bin/sh\nexec java -jar "%s/tla2tools.jar" "$@"\n' \
            "$HOME/.local/lib" > "$HOME/.local/bin/tlc"
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Canonical bounded machine verification
        run: make machine-verify

  wasm-check:
    name: wasm32 check
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-wasm-check

      - name: WASM runtime check
        run: make wasm-check

  wasm-contract:
    name: WASM browser contract
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.wasm_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-wasm-contract

      - name: Build browser contract test (wasm32)
        run: ./scripts/repo-cargo test -p meerkat-web-runtime --target wasm32-unknown-unknown --test browser_contract --no-run

      - name: Browser contract test (headless Chrome)
        run: wasm-pack test --headless --chrome meerkat-web-runtime --test browser_contract

  sdk-web:
    name: Web SDK build + tests
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.sdk_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      # Dev profile: skips wasm-opt (which dominates the release build — it
      # chews through the opt-level=0 binary for many minutes) and compiles
      # fast. This job runs the node unit tests, which never execute the
      # wasm binary; nightly builds the release profile unconditionally.
      MEERKAT_WEB_WASM_PROFILE: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-sdk-web

      - name: Web SDK build and tests
        run: make test-sdk-web

  sdk-host:
    name: Python + TypeScript SDK suites
    needs: changes
    if: ${{ needs.changes.outputs.sdk_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-sdk-host

      - name: Build RPC binary for SDK smoke tests
        run: ./scripts/repo-cargo build -p meerkat-rpc

      - name: Python + TypeScript SDK tests
        run: make -j2 test-sdk-python test-sdk-typescript

  audit:
    name: Security audit
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Cargo deny
        run: make audit

  gate:
    name: Cargo lane gate
    if: ${{ always() }}
    needs:
      - changes
      - fmt-governance
      - locks
      - clippy
      - unit-archive
      - unit
      - dense-topology
      - int-archives
      - int-mob
      - int-else
      - int-rest
      - e2e-fast
      - ratchets
      - machine-verify
      - wasm-check
      - wasm-contract
      - sdk-host
      - sdk-web
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Check lane results
        shell: bash
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.fmt-governance.result }}
            ${{ needs.locks.result }}
            ${{ needs.clippy.result }}
            ${{ needs.unit-archive.result }}
            ${{ needs.unit.result }}
            ${{ needs.dense-topology.result }}
            ${{ needs.int-archives.result }}
            ${{ needs.int-mob.result }}
            ${{ needs.int-else.result }}
            ${{ needs.int-rest.result }}
            ${{ needs.e2e-fast.result }}
            ${{ needs.ratchets.result }}
            ${{ needs.machine-verify.result }}
            ${{ needs.wasm-check.result }}
            ${{ needs.wasm-contract.result }}
            ${{ needs.sdk-host.result }}
            ${{ needs.sdk-web.result }}
            ${{ needs.audit.result }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              failure|cancelled)
                echo "::error::A cargo lane job failed or was cancelled."
                exit 1
                ;;
            esac
          done
