    "jsonschema",
    "__meerkat-facade-agent-factory-build",
    "test-support",
] }
tokio = { workspace = true, features = ["test-util", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
which = { workspace = true }
indexmap = { workspace = true }
# Path-only self-dependency (no version, stripped at publish), same hazard and
# same remedy as meerkat-runtime's.
#
# Without it, `cargo test -p meerkat` compiles away every feature-gated test in
# this crate and REPORTS SUCCESS OVER ZERO TESTS - the failure mode is silence,
# not a red lane. Measured: 28 tests in src/persistence.rs disappear (including
# the pre-0.8.10 bridge tests that guard a field-reported P0) because
# `session-store` is not a default feature here; `jsonl-store` hides another 28
# and `comms` another 5.
#
# CI was never affected - `cargo unit` is --workspace, and rpc/rest/mcp-server/
# mob all enable `session-store` on the facade, so feature unification builds
# these files on. That is exactly why this survived: the evidence was intact in
# the lane nobody doubted and absent from the one a developer actually runs.
# Test coverage must not depend on which sibling crates happen to share the
# build graph.
#
# The full non-live set is deliberate. `session-store` alone would leave the
# identical defect alive for the other gates, which is not progress under
# Rule 9. `integration-real-tests` and the live/realtime features stay out:
# those need real resources and belong to the e2e lanes.
meerkat = { path = ".", features = [
    "session-store",
    # Enabling `session-store` alone makes the cold-restart compaction batteries
    # RUN without the feature they need, so all four fail in setup with
    # "compaction did not run before the restart" - visible but not honest.
    # Whatever a test needs to be meaningful belongs in this list.
    "session-compaction",
    "jsonl-store",
    "memory-store",
    "memory-store-session",
    "comms",
    "mcp",
    "skills",
    "schedule",
    "workgraph",
    "atif",
] }
# meerkat-mob and meerkat-mcp-server depend on us, not the other way around.
# Binaries (rkat, meerkat-rest) depend on them directly.

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true }

[features]
default = ["anthropic", "openai", "gemini", "copilot"]
integration-real-tests = []

# LLM providers
anthropic = ["meerkat-client/anthropic", "dep:meerkat-anthropic", "meerkat-providers/anthropic"]
openai = [
    "meerkat-client/openai",
    "dep:meerkat-openai",
    "meerkat-openai/oauth",
    "meerkat-providers/openai",
]
openai-realtime = ["openai", "meerkat-client/openai-realtime", "meerkat-openai/realtime"]
# Pre-release live execution path. This is deliberately separate from public
# OpenAI Realtime and off by default. Runtime admission additionally requires
# explicit operator, realm, and Gate0 qualification evidence.
experimental-gpt-live = [
    "openai",
    "live-webrtc",
    "session-store",
    "meerkat-llm-core/experimental-gpt-live",
    "meerkat-openai/experimental-gpt-live",
]
# Non-shipping direct Gate0 target materialization. This does not configure the
# production experimental admission owner or advertise a live capability.
experimental-gpt-live-gate0-harness = [
    "experimental-gpt-live",
    "meerkat-openai/experimental-gpt-live-gate0-harness",
]
gemini = ["meerkat-client/gemini", "dep:meerkat-gemini", "meerkat-providers/gemini"]
copilot = [
    "anthropic",
    "openai",
    "gemini",
    "dep:meerkat-copilot",
    "meerkat-copilot/oauth",
    "meerkat-anthropic/copilot",
    "meerkat-openai/copilot",
    "meerkat-gemini/copilot",
]
all-providers = ["anthropic", "openai", "gemini", "copilot"]
native-keyring = ["meerkat-providers/native-keyring"]

# Storage backends
jsonl-store = ["meerkat-store/jsonl"]
memory-store = ["meerkat-store/memory"]
sqlite-store = ["meerkat-store/sqlite", "meerkat-runtime/sqlite-store"]

# Session capabilities
session-store = [
    "meerkat-session/session-store",
    "meerkat-runtime/sqlite-store",
    # Session persistence owns the built-in Memory and SQLite realm variants.
    # Keeping Memory aligned with this facade feature prevents target/dev
    # feature unification from exposing an enum variant that the persistence
    # bundle cannot realize. Jsonl remains separately opt-in.
    "meerkat-store/memory",
    "meerkat-store/sqlite",
    "meerkat-tools/sqlite",
]
session-compaction = ["meerkat-session/session-compaction"]
memory-store-session = ["dep:meerkat-memory"]

# ATIF trajectory export vocabulary (`meerkat::atif`). Off by default: the
# facade only re-exports it, so hosts that do not export trajectories do not
# compile it. `rkat` and `rkat-rpc` depend on `meerkat-atif` directly.
atif = ["dep:meerkat-atif"]

# Optional subsystems
comms = [
    "dep:meerkat-comms",
    "meerkat-comms/capability",
    "dep:parking_lot",
    "meerkat-tools/comms",
]
mcp = ["dep:meerkat-mcp", "meerkat-tools/mcp"]
schedule = []
workgraph = []
skills = [
    "dep:meerkat-skills",
    # Durable builtin SkillKeys must resolve after cross-surface resume even
    # when the facade's comms tool surface is disabled. This links only the
    # feature-owned declarations; `comms` still owns tool/runtime enablement.
    "dep:meerkat-comms",
    "meerkat-skills/capability",
    "meerkat-skills/skills-http",
    "meerkat-tools/skills",
    "meerkat-schedule/skills",
    "meerkat-workgraph/skills",
]
# Live-channel orchestration (LiveAdapterHost wiring + realtime open/refresh
# helpers shared by RPC, Rust SDK, REST, etc.). Pulls in `meerkat-live`.
live = ["dep:meerkat-live", "meerkat-runtime/live", "meerkat-session/live"]
# WebRTC live transport (phase 6b, DEC-P6B-L8): the webrtc bootstrap branch
# of the extracted open pipeline compiles only under this feature; the
# member host never enables it (a `transport=webrtc` request degrades typed
# as the non-compiled arm).
live-webrtc = ["live", "meerkat-live/webrtc"]
# Deterministic realtime test fixtures (ADJ-P6B-4): exposes
# `meerkat::test_fixtures::realtime::ScriptedRealtimeSessionFactory` for the
# cross-host live batteries (facade tests, meerkat-mob/tests, integration
# rows). Test-support only — never enable in production compositions.
test-realtime-fixtures = [
    "meerkat-openai/test-realtime-fixtures",
    "meerkat-live/test-support",
]

[package.metadata.cargo-machete]
ignored = ["which"]  # dev-dependency used in e2e tests

