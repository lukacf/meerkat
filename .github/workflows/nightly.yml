name: Nightly

# Everything pull-request CI (ci.yml) deliberately does not run. ci.yml is
# Cargo-only, selected by changed paths, and sized to a 20-minute
# push-to-terminal budget; the broad, slow, or low-churn coverage runs here
# once a day on free hosted runners (plus on demand), and the release
# workflow re-runs the BuildBuddy graph on the tag.
#
# Coverage rationale:
#   workspace-unit    - `make test-unit`: every workspace unit test (PR CI
#                       runs only the directly changed packages)
#   workspace-int     - `make test-int`: every integration-fast test
#   e2e-fast          - deterministic real-binary end-to-end lane
#   dense-topology    - the exact 300-member/150-peer Mob stress on hosted
#                       Linux (17-22 minutes; does not fit PR CI)
#   machine-verify    - the canonical TLC lane's machine-verify part: the
#                       bounded adaptive witness and the `machine-verify
#                       --all` sweep (ci.yml runs the lane's audit shards on
#                       every machine-authority change)
#   machine-verify-deep - Deep-profile TLC (deep.cfg, witnesses, coverage
#                       audit) over the compositions that fit the 900 s
#                       per-run cap; a capped run fails as TLC INCOMPLETE
#   sdk-host          - Python + TypeScript SDK suites, unconditional
#   gcp-buildbuddy    - the whole BuildBuddy/Bazel graph in `full-fresh`
#                       mode: prebuild, fmt/static, native nextest lanes,
#                       governance (seam-inventory, rmat-audit, machine
#                       authority), SDK suites, wasm-check, minimal-feature,
#                       feature matrix, audit
#   clippy-full       - clippy --all-targets --all-features over the whole
#                       workspace (PR CI lints changed packages only)
#   feature-matrix    - feature-unification bugs the all-features lane hides
#   minimal/modular   - minimal-feature builds + surface modularity contracts
#   e2e-system        - real-binary/local-resource lane
#   sdk-web           - full Web SDK suite
#   wasm-contract     - wasm-pack browser contract test in headless Chrome
#   release-packaging - per-crate `cargo package` dry-run (release hygiene)
#   audit             - daily cargo-deny advisory sweep
#   meta-docs-lag     - docs/meta mirror vs main: fails while a main commit
#                       that changed meta/docs after the mirrored one is not
#                       mirrored (publication has stalled silently)

# Hosted-runner slots. The account runs at most 40 hosted jobs at once,
# shared with every pull request and main push, and nightly once held 22 of
# them for most of 02:17-04:40 UTC (run 36807541395) while a merge burst
# queued pull-request jobs for up to 11 minutes. Nightly now holds about ten:
#   1. gcp-buildbuddy runs alone first (its own jobs peak at 9-10 hosted
#      submitters for about 35 minutes, and its 3000 s deadline needs them
#      in parallel);
#   2. then five sequential chains: each job `needs` the previous one and
#      runs under !cancelled(), so a red job never skips the rest:
#        release-packaging (143-304 min) > meta-docs-lag (2)
#        e2e-system (47-360) > sdk-web (4-29) > audit (1) >
#          machine-verify-deep (3-8)
#        feature-matrix (170-267) > workspace-int (134-240)
#        release-stack-budget (86-148) > minimal-and-modularity (13-72) >
#          e2e-fast (3-34) > sdk-host (3-52)
#        machine-verify (30-43) > workspace-unit (117-173) > clippy-full
#          (30-63) > dense-topology (24-70) > wasm-contract (4-26)
# Minutes are the range over the 2026-11-01 to 11-07 runs, a job that ran
# out of time counted at its limit and a run that lost its runner left
# out; most jobs swing several-fold from night to night. machine-verify's
# and workspace-unit's are estimates for their current settings, and
# workspace-int's and dense-topology's upper ends are their limits. The
# longest chain, feature-matrix > workspace-int, takes up to about eight
# and a half hours, and nightly took 4 h 46 min to 7 h 23 min. A new job
# joins the shortest chain; a new chain is a new slot.
#
# A red run on main opens or updates the "Nightly failures" issue through
# nightly-failure-issue.yml, which starts once this workflow's run has
# completed, so no job here waits for the others.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      graph_only:
        # Run only gcp-buildbuddy (the whole Bazel graph): the release
        # final gate dispatches it on the release branch tip before the tag,
        # where the full graph otherwise first runs (#1687), and the same
        # dispatch warms the remote cache for the tag run. While
        # MEERKAT_GCP_BUILDBUDDY_ENABLED is not 'true' such a dispatch starts
        # nothing in GCP and fails (buildbuddy.yml's gate), and the tag
        # validates on its exact-tree CI attestation instead (release.yml).
        description: Run only the full BuildBuddy graph (pre-tag check / cache warm-up).
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  # The reusable BuildBuddy workflow authenticates to GCP with OIDC.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Stable per-VM Cargo home: hosted runners are fresh per job, and cache
  # reuse (rust-cache + sccache) requires registry source paths that do not
  # change between runs.
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.97.0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # Never exit on idle (ci.yml's lanes do the same). sccache's idle clock
  # restarts only on a new compile request, and at the default 600 s the
  # server exits under a compile still running (it waits 10 s for it): a
  # crate whose rustc ran that long with nothing else compiling was cut off
  # and compiled again from the start without the cache ("The server looks
  # like it shut down unexpectedly, compiling locally instead"). The system
  # e2e lane printed that 90 times on 2026-11-07 and compiled for 343 of its
  # 346.6 minutes, and 36 times on 11-04, when it ran out of its 360; it
  # took 184 and 201 minutes in all on 10-28 and 11-03, which printed none.
  SCCACHE_IDLE_TIMEOUT: "0"
  # A failed sccache install never fails a job either: each Setup sccache
  # step continues on error (so does the action's post step, which reads
  # the stats), and the step after it then sets an empty RUSTC_WRAPPER,
  # which Cargo reads as no wrapper.

jobs:
  workspace-unit:
    name: Workspace unit tests
    needs: machine-verify
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    # At four Cargo jobs `make test-unit` took 60-79 minutes to compile and
    # 27-31 to run its tests (2026-11-02 to 11-05). Two jobs compile for an
    # estimated 1.5-1.8 times as long: 117-173 minutes in all.
    timeout-minutes: 180
    env:
      RUSTC_WRAPPER: sccache
      # At four Cargo jobs the 16 GB runner lost this job mid-compile (exit
      # 143 after the log went silent, 2026-11-06 and 11-07), as it lost
      # workspace-int below. Two jobs keep at most two rustc alive.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-workspace-unit
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      # meerkat-rpc's WebRTC router tests, which `live-webrtc` gates and this
      # lane compiles out, run on every Rust-changing main push instead:
      # ci.yml's "Main unit tests (rpc[openai-live])" row turns on every
      # meerkat-rpc feature (experimental-gpt-live implies openai-live, which
      # implies live-webrtc and mob).
      - name: Workspace unit tests
        run: make test-unit

  workspace-int:
    name: Workspace integration-fast tests
    needs: feature-matrix
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    # Two Cargo jobs build for up to about twice as long as four. On
    # 2026-11-07 `make test-int` compiled for 79 minutes and ran its 23968
    # tests in 81, all passing, then ran out of the former 180 minutes 19
    # minutes into the HeadCanonical kill window's own build (a feature
    # graph of its own, meerkat-mob with test-support), which still had
    # meerkat-runtime and meerkat-mob to compile.
    timeout-minutes: 240
    env:
      RUSTC_WRAPPER: sccache
      # At four Cargo jobs the 16 GB runner lost this job mid-build (exit 143
      # after the log went silent, 2026-10-14 and 10-16). A cold `make
      # test-int` reached 15.0 GiB of rustc memory within two minutes (the
      # schema catalog's library and test harness beside the kernels and
      # contracts), and single meerkat-core and meerkat-runtime rustc
      # processes reach 6-7 GiB. Two jobs keep at most two rustc alive.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-workspace-int
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Workspace integration-fast tests
        run: make test-int

  e2e-fast:
    name: Deterministic e2e lane
    needs: minimal-and-modularity
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-e2e-fast
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Deterministic e2e lane
        run: make e2e-fast

  dense-topology:
    name: GitHub-hosted dense Mob topology
    needs: clippy-full
    if: ${{ !cancelled() && !inputs.graph_only }}
    uses: ./.github/workflows/mob-dense-topology.yml

  machine-verify:
    name: Bounded TLC machine verification
    needs: gcp-buildbuddy
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      # A dedicated runner has no Cargo lock contention, so keep xtask under
      # the standard cached target root instead of the local /tmp isolation.
      XTASK_TARGET_DIR: ${{ github.workspace }}/target
      # The generated adaptive composition is large enough that Java's
      # container-selected ~3.5 GiB heap OOMs during semantic processing.
      JAVA_TOOL_OPTIONS: -Xmx8g
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-machine-verify
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Setup TLC
        uses: ./.github/actions/setup-tlc-ci
        with:
          setup-java: "false"

      # Only the lane's machine-verify part, which no per-change lane runs:
      # the bounded adaptive witness, then `machine-verify --all`, an
      # estimated 30-43 minutes with setup and the xtask build. The lane's
      # twenty-four audit shards run in ci.yml's tlc-audits job on every
      # change scripts/machine-authority-changed matches. The whole lane in
      # one 4-vCPU job needs an estimated 218-260 minutes, and it hit this
      # job's 90-minute limit every night from 2026-11-04.
      - name: Adaptive witness and machine-verify --all sweep
        run: make machine-verify MACHINE_VERIFY_PART=machine-verify

  machine-verify-deep:
    name: Deep TLC composition verification
    needs: audit
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      # A dedicated runner has no Cargo lock contention, so keep xtask under
      # the standard cached target root instead of the local /tmp isolation.
      XTASK_TARGET_DIR: ${{ github.workspace }}/target
      # The generated adaptive composition is large enough that Java's
      # container-selected ~3.5 GiB heap OOMs during semantic processing.
      JAVA_TOOL_OPTIONS: -Xmx8g
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-machine-verify
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Setup TLC
        uses: ./.github/actions/setup-tlc-ci
        with:
          setup-java: "false"

      - name: Deep composition verification (900 s per-run cap)
        run: make machine-verify-deep-compositions

  sdk-host:
    name: Python + TypeScript SDK suites
    needs: e2e-fast
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-sdk-host
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Build RPC binary for SDK smoke tests
        run: ./scripts/repo-cargo build -p meerkat-rpc

      - name: Python + TypeScript SDK tests
        run: make -j2 test-sdk-python test-sdk-typescript

  # Default OFF: the self-hosted GCP graph runs only while the repository
  # variable MEERKAT_GCP_BUILDBUDDY_ENABLED is 'true'. Otherwise a scheduled
  # or ordinary run skips this job (nothing starts, syncs or scales) and the
  # chains below still run, while a graph_only dispatch still calls
  # buildbuddy.yml, whose GCP jobs are gated off and whose gate job fails: a
  # graph-only check of a disabled graph is red, never an empty green.
  gcp-buildbuddy:
    name: GCP BuildBuddy (full-fresh)
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' || inputs.graph_only }}
    uses: ./.github/workflows/buildbuddy.yml
    with:
      mode: full-fresh
    # Exactly the secrets buildbuddy.yml declares, never `secrets: inherit`:
    # no registry or publish token reaches the called workflow.
    secrets:
      MEERKAT_GCP_BUILDBUDDY_API_KEY: ${{ secrets.MEERKAT_GCP_BUILDBUDDY_API_KEY }}
      BUILDBUDDY_ENDPOINT: ${{ secrets.BUILDBUDDY_ENDPOINT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RKAT_ANTHROPIC_API_KEY: ${{ secrets.RKAT_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RKAT_OPENAI_API_KEY: ${{ secrets.RKAT_OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RKAT_GEMINI_API_KEY: ${{ secrets.RKAT_GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      MEERKAT_E2E_AUTH_OPENAI_OAUTH_TOKENS_JSON: ${{ secrets.MEERKAT_E2E_AUTH_OPENAI_OAUTH_TOKENS_JSON }}
      MEERKAT_E2E_AUTH_ANTHROPIC_MODEL: ${{ secrets.MEERKAT_E2E_AUTH_ANTHROPIC_MODEL }}
      MEERKAT_E2E_AUTH_GEMINI_MODEL: ${{ secrets.MEERKAT_E2E_AUTH_GEMINI_MODEL }}
      MEERKAT_E2E_AUTH_VERTEX_CANARY: ${{ secrets.MEERKAT_E2E_AUTH_VERTEX_CANARY }}

  clippy-full:
    name: Clippy (all targets, all features)
    needs: workspace-unit
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-clippy-full
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"

      - name: Clippy (workspace, all features, all targets)
        run: make lint

  feature-matrix:
    name: Feature matrix (lint + test)
    needs: gcp-buildbuddy
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-matrix
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Feature matrix clippy
        run: make lint-feature-matrix

      - name: Feature matrix tests
        run: make test-feature-matrix

  minimal-and-modularity:
