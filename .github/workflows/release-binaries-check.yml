name: Release binaries check

# Builds the four release binaries on the dispatched ref exactly as the
# release workflow does: the Linux and macOS targets through its BuildBuddy
# lane (scripts/buildbuddy-bazel-poc release-build-*, which set
# --define=meerkat_release_build=1; Intel macOS is then run and inspected on
# Apple silicon, as the release's BuildBuddy backend does), Intel macOS also
# through the cross-build on Apple silicon its GitHub-hosted backend uses,
# and runs the release packaging guards on every one of them:
# the Linux portability check, scripts/check-release-binary-markers and, for
# Intel macOS, scripts/check-macos-x86-release-binary. It publishes nothing: a
# read-only token, no release archive, no attestation, no release, no
# registry; the only upload is a one-day workflow artifact that hands the
# BuildBuddy Intel macOS binaries to the Apple silicon runner.
# Dispatch it on a release candidate commit before tagging, so that the tag
# cannot fail at packaging:
#   gh workflow run release-binaries-check.yml --ref <branch>

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check release binaries (${{ matrix.target }})
    # The BuildBuddy release lane is the owner's, as in release.yml.
    if: github.actor == 'lukacf'
    runs-on: ${{ fromJSON(vars.MEERKAT_CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 240
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bb_command: release-build-linux-x86
            target: x86_64-unknown-linux-gnu
          - bb_command: release-build-linux-arm64
            target: aarch64-unknown-linux-gnu
          - bb_command: release-build-macos-arm64
            target: aarch64-apple-darwin
          - bb_command: release-build-macos-x86
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-buildbuddy-ci
        with:
          profile: native
          # A dispatch restores and never saves: a save lands in the default
          # branch's cache scope, which every tag run would restore.
          repository-cache: restore

      - name: Build release binaries via BuildBuddy
        shell: bash
        env:
          BUILDBUDDY_BAZEL_COMMAND: ${{ matrix.bb_command }}
          BUILDBUDDY_OUTPUT_LANE: release-check-${{ matrix.target }}
          BUILDBUDDY_OUTPUT_BASE: ${{ runner.temp }}/bb-release-${{ matrix.target }}
          MEERKAT_BUILDBUDDY_OUTPUT_ROOT: ${{ runner.temp }}/bb-release
          BUILDBUDDY_RELEASE_JOBS: ${{ vars.MEERKAT_RELEASE_BUILDBUDDY_JOBS || '64' }}
        run: |
          set +e
          scripts/buildbuddy-bazel-poc --jobs="${BUILDBUDDY_RELEASE_JOBS}"
          status="$?"
          set -e
          # 38: the build completed but its event-stream upload failed; the
          # next step still finds and checks every output.
          if [[ "${status}" -ne 0 && "${status}" -ne 38 ]]; then
            exit "${status}"
          fi

      - name: Check release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BB_OUTPUT_BASE: ${{ runner.temp }}/bb-release-${{ matrix.target }}
        run: |
          set -euo pipefail
          BAZEL_BIN="${BB_OUTPUT_BASE}/execroot/_main/bazel-out"
          declare -A BIN_PATHS=(
            [rkat]="crates/meerkat-cli/rkat"
            [rkat-rpc]="crates/meerkat-rpc/rkat_rpc_bin"
            [rkat-rest]="crates/meerkat-rest/rkat_rest_bin"
            [rkat-mcp]="crates/meerkat-mcp-server/rkat_mcp_bin"
          )
          for bin in rkat rkat-rpc rkat-rest rkat-mcp; do
            src="$(find "${BAZEL_BIN}" -path "*/${BIN_PATHS[$bin]}" -type f 2>/dev/null | head -1)"
            if [[ -z "${src}" ]]; then
              echo "Missing ${bin} output for ${TARGET} under ${BAZEL_BIN}" >&2
              exit 1
            fi
            if [[ "${TARGET}" == *-unknown-linux-gnu ]]; then
              ./scripts/check-linux-release-binary-portability.sh "${src}"
            fi
            scripts/check-release-binary-markers "${src}"
            # The binary's link-time registrations run. This runner runs
            # Linux x86_64: of the Linux aarch64 binaries the file is read
            # for a second init-array table, and nothing is read from a
            # Mach-O file (Intel macOS is run by macos-x86-buildbuddy below;
            # the release runs both arm64 targets on runners of their own,
            # verify_critical_native_binaries).
            python3 scripts/check-release-binary-registrations \
              --if-runnable-target "${TARGET}" --surface "${bin}" "${src}"
            # Intel macOS runs only on a Mac: macos-x86-buildbuddy below.
            if [[ "${TARGET}" == x86_64-apple-darwin ]]; then
              mkdir -p "${RUNNER_TEMP}/macos-x86"
              cp "${src}" "${RUNNER_TEMP}/macos-x86/${bin}"
            fi
            # The arm64 targets run only on their own runners:
            # native-arm64-buildbuddy below.
            if [[ "${TARGET}" == aarch64-* ]]; then
              mkdir -p "${RUNNER_TEMP}/native-arm64"
              cp "${src}" "${RUNNER_TEMP}/native-arm64/${bin}"
            fi
          done
          echo "All four ${TARGET} release binaries pass the release packaging guards"

      - name: Hand the arm64 binaries to a runner of their target
        if: startsWith(matrix.target, 'aarch64-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-check-${{ matrix.target }}
          path: ${{ runner.temp }}/native-arm64/*
          retention-days: 1
          if-no-files-found: error

      - name: Hand the Intel macOS binaries to the Apple silicon runner
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-check-x86_64-apple-darwin
          path: ${{ runner.temp }}/macos-x86/*
          retention-days: 1
          if-no-files-found: error

  # The release's BuildBuddy backend runs and inspects its Intel macOS
  # binaries on Apple silicon, under Rosetta (verify_macos_x86_binaries):
  # the same checks here, on the binaries the build job above made.
  macos-x86-buildbuddy:
    name: Run and inspect the BuildBuddy Intel macOS release binaries on Apple silicon
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the Intel macOS binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-check-x86_64-apple-darwin
          path: ${{ runner.temp }}/macos-x86

      - name: Run and inspect each binary
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '
            /^\[workspace.package\]/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          for bin in rkat rkat-rpc rkat-rest rkat-mcp; do
            src="${RUNNER_TEMP}/macos-x86/${bin}"
            chmod +x "${src}"
            scripts/check-macos-x86-release-binary "${src}" "${version}"
            scripts/check-release-binary-markers "${src}"
            if [[ "${bin}" == rkat ]]; then
              scripts/check-release-binary-sqlite-profile "${src}"
            fi
            python3 scripts/check-release-binary-registrations "${src}"
          done
          echo "Ran and inspected the four BuildBuddy Intel macOS release binaries"

  # The release runs its BuildBuddy Linux aarch64 and macOS arm64 binaries on
  # runners of their own target before it publishes them
  # (verify_critical_native_binaries): the same check here, on the binaries
  # the build job above made. Only a hosted run proves these two targets: no
  # other lane runs an arm64 release binary.
  native-arm64-buildbuddy:
    name: Run the BuildBuddy release binaries on a runner of their target (${{ matrix.target }})
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the binaries of this target
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-check-${{ matrix.target }}
          path: ${{ runner.temp }}/native-arm64

      - name: Require the registrations of each binary
        shell: bash
        run: |
          set -euo pipefail
          for bin in rkat rkat-rpc rkat-rest rkat-mcp; do
            src="${RUNNER_TEMP}/native-arm64/${bin}"
            chmod +x "${src}"
            python3 scripts/check-release-binary-registrations "${src}"
          done
          echo "Ran the four ${{ matrix.target }} release binaries and found their registrations"

  # The release's GitHub-hosted backend cross-compiles Intel macOS on Apple
  # silicon (build_binaries_macos_x86_cross): check it the same way, one job
  # per surface package.
  macos-x86-cross:
    name: Cross-compile and check Intel macOS release binaries (${{ matrix.surface.bin }})
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        surface:
          - package: rkat
            bin: rkat
          - package: meerkat-rpc
            bin: rkat-rpc
          - package: meerkat-rest
            bin: rkat-rest
          - package: meerkat-mcp-server
            bin: rkat-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust-ci

      - name: Add the Intel macOS target
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-x86_64-apple-darwin-cross
          # As in release.yml: a dispatch saves no release cache, and
          # ~/.cargo/bin is never cached.
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          cache-bin: "false"

      - name: Cross-compile the surface binary
        shell: bash
        env:
          CARGO_TARGET_DIR: target
        run: ./scripts/repo-cargo build --locked -p "${{ matrix.surface.package }}" --release --target x86_64-apple-darwin

      - name: Check the release binary
        shell: bash
        run: |
          set -euo pipefail
          src="target/x86_64-apple-darwin/release/${{ matrix.surface.bin }}"
          /usr/bin/codesign --force --sign - "${src}"
          version="$(awk '
            /^\[workspace.package\]/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          scripts/check-release-binary-markers "${src}"
          scripts/check-macos-x86-release-binary "${src}" "${version}"
          python3 scripts/check-release-binary-registrations "${src}"
