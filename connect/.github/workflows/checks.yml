name: Connect checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Packaging, Console panel and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check inert package construction and validation
        run: >-
          python3 -m unittest -v
          scripts.test_package_connect_resources
          scripts.test_assemble_connect_product
      - name: Check documentation
        run: python3 scripts/check-docs.py
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked panel test dependencies
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the embedded Console panel
        run: node --test sdk/typescript/tests/console-setup-panel.test.mjs
