# Vendored copy of oai-rt-rs 0.4.0 (crates.io), applied via [patch.crates-io]
# in the workspace root Cargo.toml.
#
# Single functional delta from the published 0.4.0 manifest: the reqwest
# dependency sets default-features = false. Upstream leaves reqwest defaults
# on, which enables default-tls (native-tls -> openssl-sys) through cargo
# feature unification for every binary in this workspace. On the Linux release
# build containers that dynamically links libssl.so.3/libcrypto.so.3, so the
# published binaries fail to load on any distro shipping OpenSSL 1.1 (for
# example Debian Bullseye). The non-TLS reqwest default features (charset,
# http2, macos-system-configuration) are re-enabled explicitly so the only
# behavior change is dropping the OpenSSL linkage.
#
# The example/test targets and dev-dependencies of the published crate are
# omitted because only src/ is vendored. Remove this directory and the patch
# entry once an oai-rt-rs release with default-features = false is published.

[package]
edition = "2024"
rust-version = "1.85.0"
name = "oai-rt-rs"
version = "0.4.0"
authors = ["Luka Crnkovic-Friis"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust SDK for the OpenAI Realtime API"
homepage = "https://github.com/lukacf/oai-rt-rs"
documentation = "https://docs.rs/oai-rt-rs"
readme = "README.md"
keywords = [
    "openai",
    "realtime",
    "api",
    "client",
    "audio",
]
categories = [
    "api-bindings",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/lukacf/oai-rt-rs"

[lib]
name = "oai_rt_rs"
path = "src/lib.rs"

[dependencies.async-trait]
version = "0.1"

[dependencies.base64]
version = "0.22"

[dependencies.futures]
version = "0.3"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "json",
    "rustls-tls",
    "multipart",
    "charset",
    "http2",
    "macos-system-configuration",
]

[dependencies.schemars]
version = "0.8"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.thiserror]
version = "2.0"

[dependencies.tokio]
version = "1.0"
features = [
    "rt",
    "net",
    "macros",
    "sync",
    "time",
]

[dependencies.tokio-tungstenite]
version = "0.26"
features = ["rustls-tls-native-roots"]

[dependencies.tracing]
version = "0.1"

[dependencies.url]
version = "2.5"

[lints.clippy]
all = "warn"
cargo = "warn"
nursery = "warn"
pedantic = "warn"

[lints.rust]
unsafe_code = "forbid"
