name: Dense Mob topology

on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.97.0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # Never exit on idle (nightly.yml says why): at the default 600 s the
  # server exits under a long compile, which then starts again without the
  # cache. On 2026-11-06 the archive build lost its server ten minutes into
  # a compile and ran out of its time with that compile still running.
  SCCACHE_IDLE_TIMEOUT: "0"
  # A failed sccache install never fails a job either: each Setup sccache
  # step continues on error (so does the action's post step, which reads
  # the stats), and the step after it then sets an empty RUSTC_WRAPPER,
  # which Cargo reads as no wrapper.

jobs:
  unit-archive:
    name: Build Mob unit-test archive
    runs-on: ubuntu-24.04
    # Without an exact-commit CI archive to reuse (main's push CI has not
    # passed at the nightly commit) the archive builds from source. At 30
    # minutes that build ran out of time in 11 of the 13 nightly runs from
    # 2026-10-26 to 11-07 that reached it, and the stress never ran; it
    # finished in 1182 and 1398 s in the other two. ci.yml's build of the
    # same archive (main-unit-archive-build) has 60.
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-nextest-mob-archive
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Build Mob unit archive
        uses: ./.github/actions/build-nextest-archive
        with:
          family: unit-mob
          reuse_exact_ci: "true"

  dense-topology:
    name: 300 members x 150 peers
    needs: unit-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run isolated dense topology stress
        uses: ./.github/actions/run-nextest-archive
        with:
          family: unit-mob
          partition: hash:1/1
          profile: mob-dense-topology
          run_ignored: all
