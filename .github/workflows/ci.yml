        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Check each feature combination
        shell: bash
        env:
          COMMANDS: ${{ matrix.commands }}
        run: |
          set -euo pipefail
          [[ -n "${COMMANDS}" ]] || { echo "::error::empty feature-combination row"; exit 1; }
          failed=0
          while IFS= read -r args; do
            [[ -n "${args}" ]] || continue
            echo "::group::cargo check ${args}"
            # shellcheck disable=SC2086
            if ! ./scripts/repo-cargo check ${args}; then
              echo "::error::cargo check ${args} failed"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "${COMMANDS}"
          exit "${failed}"

      - name: Upload sccache server log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-feature-check-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  wasm-check:
    name: wasm32 check
    needs: changes
    # Every push with a Rust change, and pull requests that change the web
    # runtime, a workspace crate it compiles (its dependency closure, the
    # provider crates included) or the CLI web template, or that plan the
    # whole workspace (the classifier's `wasm` flag): the wasm32 clippy of
    # the web runtime and the provider crates it links caught breaks only
    # after merge before (#1108).
    if: ${{ (github.event_name == 'push' && needs.changes.outputs.rust_changed == 'true') || needs.changes.outputs.wasm == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: WASM runtime check
        run: make wasm-check

  sdk-host:
    name: Python + TypeScript SDK suites
    needs: [changes, stagger]
    # The Python + TypeScript SDK suites are post-merge only (13 min
    # measured); pull requests defer them. The Node example suites
    # (examples/037-live-webrtc-web in Playwright Chromium and the examples
    # SDK suite) also run on pull requests that touch their inputs, without
    # the Rust build.
    if: ${{ (github.event_name == 'push' && (needs.changes.outputs.rust_changed == 'true' || needs.changes.outputs.sdk_host == 'true' || needs.changes.outputs.examples_browser == 'true')) || (github.event_name != 'push' && needs.changes.outputs.examples_browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Setup sccache
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        if: ${{ github.event_name == 'push' }}
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        if: ${{ github.event_name == 'push' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Build RPC binary for SDK smoke tests
        if: ${{ github.event_name == 'push' }}
        run: ./scripts/repo-cargo build -p meerkat-rpc

      - name: Python + TypeScript SDK tests
        if: ${{ github.event_name == 'push' }}
        run: make -j2 test-sdk-python test-sdk-typescript

      - name: Build TypeScript SDK for the examples
        working-directory: sdks/typescript
        # The SDK has no lockfile; the examples link it through file:.
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Install example dependencies
        run: |
          npm ci --no-fund --no-audit --prefix examples
          npm ci --no-fund --no-audit --prefix examples/037-live-webrtc-web

      - name: Install Playwright Chromium
        working-directory: examples/037-live-webrtc-web
        run: npx playwright install --with-deps chromium

      - name: Live WebRTC example browser tests
        working-directory: examples/037-live-webrtc-web
        run: npm test

      - name: Examples SDK suite
        working-directory: examples
        run: npm run test:sdk

  example-web:
    name: Example web suites
    needs: [changes, stagger]
    # Examples 031, 032 and 033 execute the sdks/web wasm runtime in
    # Playwright Chromium. Every main push runs them (a release projection
    # reuses its parent's run); pull requests run them when the runtime, its
    # contracts, or those examples change (the push also for every change
    # that reaches the runtime's crates).
    # Independent of the Rust lanes, so it stays off the critical path.
    # A pull request that changes a crate the web runtime builds on, or plans
    # the whole workspace, runs only the Web SDK's type and unit tests here
    # (example_web_wasm is false): building the wasm then compiles the
    # runtime's whole dependency closure cold, 1181 s of pull request
    # 39209102985's 1329 s lane, over the 1080 s lane budget. The push runs
    # the wasm build and the browser suites (deferred_to_push names them).
    if: ${{ (github.event_name == 'push' && needs.changes.outputs.release_projection != 'true') || needs.changes.outputs.example_web == 'true' }}
    runs-on: ubuntu-24.04
    # Sized from measurement (2026-09-29). Warm (sccache 100% hits, e.g. job
    # 109577859270): 4.5 min, 2 min of it the wasm build. Cold, a pull request
    # that changes meerkat-core, so all 27 workspace crates of the wasm graph
    # miss sccache and rebuild at opt-level "s" while dependencies still hit
    # (86.8% hits): jobs 109538182678 1097 s, 109573573790 1125 s,
    # 109561685236 1146 s, 109576652284 1199 s (its build step 1038 s; every
    # step passed but the old 20-minute timeout cancelled it). This is the
    # cost of compiling the crates, not a cache that misses. 25 minutes is
    # about 25% above the slowest cold run, so a legitimate cold run is never
    # cancelled here. On a pull request the gate's CI_MAX_EXEC_SECONDS
    # (1080 s of execution, about 30 s of it the change classification)
    # caps it first: run 38931641220's cold lane took 842 s. A push or a
    # dispatch builds the wasm cold after a change below the runtime: 22m15s
    # on dispatch 39211283488 and 22m23s on main push 39213218053 (wasm build
    # 19m21s), so they get 35 minutes, about 55% above those.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 35 }}
    env:
      RUSTC_WRAPPER: sccache
      # The suites need a working runtime, not a size-optimized one: skip
      # wasm-opt, which spends many minutes on the release build.
      MEERKAT_WEB_WASM_OPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install the Web SDK
        working-directory: sdks/web
        # The SDK has no lockfile.
        run: npm install --no-fund --no-audit --ignore-scripts

      - name: Web SDK type and unit tests
        working-directory: sdks/web
        # tsc over tests/ (the exhaustive event switches over the generated
        # events) and the node unit suites; #1469 failed only in nightly.
        # They need no wasm, so a pull request that leaves the wasm to the
        # push still runs them.
        run: npm test

      - name: Setup Rust
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only; compiled objects come from
          # sccache (see the wasm32 check lane).
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Build the Web SDK wasm
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        working-directory: sdks/web
        # Built once; all three suites read sdks/web/wasm (033 through its
        # sync:runtime copy).
        run: npm run build:wasm

      - name: Install example dependencies
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        run: |
          npm ci --no-fund --no-audit --prefix examples/031-wasm-mini-diplomacy-sh/web
          npm ci --no-fund --no-audit --prefix examples/032-wasm-webcm-agent/web
          npm ci --no-fund --no-audit --prefix examples/033-the-office-demo-sh/web

      - name: Install Playwright Chromium
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        # The three examples lock the same Playwright release.
        working-directory: examples/033-the-office-demo-sh/web
        run: npx playwright install --with-deps chromium

      - name: Direct WASM runtime browser contracts
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        working-directory: sdks/web
        run: npm run test:browser

      - name: WASM package lifecycle and natural process shutdown
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        working-directory: sdks/web
        timeout-minutes: 2
        run: |
          node --test tests/e2e_wasm_runtime.test.mjs tests/wasm_mob_comms.test.mjs
          npm run test:packed

      - name: 031 wasm mini diplomacy suite
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        working-directory: examples/031-wasm-mini-diplomacy-sh/web
        run: npm test

      - name: 032 wasm WebCM agent suite
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        working-directory: examples/032-wasm-webcm-agent/web
        run: npm test

      - name: 033 office demo suites
        if: ${{ needs.changes.outputs.example_web_wasm == 'true' }}
        working-directory: examples/033-the-office-demo-sh/web
        # test runs the fixture groups; test:offline loads the built page
        # with the synced runtime.
        run: |
          npm run build
          npm test
          npm run test:offline

  wasm-timers:
    name: WASM timer ownership
    needs: [changes, stagger]
    # Compile the Rust regression binaries independently of the example build
    # so both lanes retain the pull-request wall-clock budget. Selected with
    # the example web suites' wasm build (example_web_wasm): a pull request
    # that changes a crate the web runtime builds on, or plans the whole
    # workspace, leaves both to the push,
    # since this lane compiles the same closure for wasm32 (893 s cold at
    # opt-level 0 on pull request 39209102985).
    if: ${{ (github.event_name == 'push' && needs.changes.outputs.release_projection != 'true') || needs.changes.outputs.example_web_wasm == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="wasm_js" -C link-arg=-zstack-size=8388608'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Browser status deadline and timer ownership regressions
        shell: bash
        run: |
          export CARGO="$PWD/scripts/repo-cargo"
          wasm-pack test --headless --chrome --release crates/meerkat-web-runtime --test browser_contract --test wasm_timers
          wasm-pack test --node --release crates/meerkat-web-runtime --test wasm_timers_node

  bazel-graph:
    name: Bazel graph check
    needs: [changes, stagger]
    # Proves the Bazel graph loads and analyses (plain local Bazel, no
    # remote execution, nothing is compiled). Pull requests run it when the
    # classifier sees a Bazel-relevant path: BUILD/Starlark/module inputs,
    # the BUILD generator, the tools/ Bazel and remote-execution configs,
    # any Cargo manifest, or a moved or deleted Rust file. Every main push
    # runs it.
    if: ${{ github.event_name == 'push' || needs.changes.outputs.bazel_graph == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bazelisk
        # Bazelisk downloads the Bazel release pinned in .bazelversion (9.1.1).
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      - name: Cache Bazel repository and disk caches
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-graph-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-graph-${{ runner.os }}-

      - name: Bazel query
        run: bazel query //... --repository_cache="${HOME}/.cache/bazel-repo" >/dev/null

      - name: Bazel analysis
        run: bazel build --nobuild //... --repository_cache="${HOME}/.cache/bazel-repo" --disk_cache="${HOME}/.cache/bazel-disk"

  gate:
    name: CI gate
    # Not `always()`: a superseded run (cancel-in-progress) must surface as
    # cancelled, not leave a FAILURE "CI gate" check on the head.
    if: ${{ !cancelled() }}
    needs:
      - changes
      - fmt-governance
      - ratchets
      - governance-gates
      - tlc-audits
      - stagger
      - clippy
      - clippy-rest
      - unit
      - integration
      - closure-tests
      - closure-tests-rest
      - governed-jsonl
      - mcp-confinement-positive
      - main-unit
      - main-unit-rest
      - main-unit-archive-build
      - main-unit-archive-run
      - closure-check
      - rustdoc
      - feature-check
      - feature-check-rest
      - wasm-check
      - sdk-host
      - example-web
      - wasm-timers
      - bazel-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check lane results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FMT_GOVERNANCE_RESULT: ${{ needs.fmt-governance.result }}
          RATCHETS_RESULT: ${{ needs.ratchets.result }}
          TLC_AUDITS_RESULT: ${{ needs.tlc-audits.result }}
          MACHINE_AUTHORITY: ${{ needs.changes.outputs.machine_authority }}
          GOVERNANCE_GATES_RESULT: ${{ needs.governance-gates.result }}
          GOVERNANCE_GATES: ${{ needs.changes.outputs.governance_gates }}
          STAGGER_RESULT: ${{ needs.stagger.result }}
          CLIPPY_FIRST_RESULT: ${{ needs.clippy.result }}
          CLIPPY_REST_RESULT: ${{ needs.clippy-rest.result }}
          SHARD_FIRST_COUNT: ${{ needs.changes.outputs.shard_first_count }}
          SHARD_REST_COUNT: ${{ needs.changes.outputs.shard_rest_count }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          GOVERNED_JSONL_RESULT: ${{ needs.governed-jsonl.result }}
          MCP_CONFINEMENT_POSITIVE_RESULT: ${{ needs.mcp-confinement-positive.result }}
          INTEGRATION_COUNT: ${{ needs.changes.outputs.integration_count }}
          CLOSURE_TESTS_FIRST_RESULT: ${{ needs.closure-tests.result }}
          CLOSURE_TESTS_REST_RESULT: ${{ needs.closure-tests-rest.result }}
          CLOSURE_TEST_FIRST_COUNT: ${{ needs.changes.outputs.closure_test_first_count }}
          CLOSURE_TEST_REST_COUNT: ${{ needs.changes.outputs.closure_test_rest_count }}
          CLOSURE_TEST_COUNT: ${{ needs.changes.outputs.closure_test_count }}
          TEST_SCOPE_COUNT: ${{ needs.changes.outputs.test_scope_count }}
          HOOK_BINARY_COUNT: ${{ needs.changes.outputs.hook_binary_count }}
          HOOK_RETAINED_COUNT: ${{ needs.changes.outputs.hook_retained_count }}
          MAIN_UNIT_FIRST_RESULT: ${{ needs.main-unit.result }}
          MAIN_UNIT_REST_RESULT: ${{ needs.main-unit-rest.result }}
          MAIN_UNIT_FIRST_COUNT: ${{ needs.changes.outputs.main_unit_first_count }}
          MAIN_UNIT_REST_COUNT: ${{ needs.changes.outputs.main_unit_rest_count }}
          MAIN_UNIT_ARCHIVE_BUILD_RESULT: ${{ needs.main-unit-archive-build.result }}
          MAIN_UNIT_ARCHIVE_RUN_RESULT: ${{ needs.main-unit-archive-run.result }}
          MAIN_ARCHIVE_BUILD_COUNT: ${{ needs.changes.outputs.main_archive_build_count }}
          MAIN_ARCHIVE_RUN_COUNT: ${{ needs.changes.outputs.main_archive_run_count }}
          CLOSURE_CHECK_RESULT: ${{ needs.closure-check.result }}
          RUSTDOC_RESULT: ${{ needs.rustdoc.result }}
          FEATURE_CHECK_FIRST_RESULT: ${{ needs.feature-check.result }}
          FEATURE_CHECK_REST_RESULT: ${{ needs.feature-check-rest.result }}
          FEATURE_CHECK_FIRST_COUNT: ${{ needs.changes.outputs.feature_check_first_count }}
          FEATURE_CHECK_REST_COUNT: ${{ needs.changes.outputs.feature_check_rest_count }}
          FEATURE_CHECK_COUNT: ${{ needs.changes.outputs.feature_check_count }}
          WASM: ${{ needs.changes.outputs.wasm }}
          WASM_CHECK_RESULT: ${{ needs.wasm-check.result }}
          SDK_HOST_RESULT: ${{ needs.sdk-host.result }}
          EXAMPLE_WEB_RESULT: ${{ needs.example-web.result }}
          WASM_TIMERS_RESULT: ${{ needs.wasm-timers.result }}
          BAZEL_GRAPH_RESULT: ${{ needs.bazel-graph.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          PLAN_EVENT: ${{ needs.changes.outputs.event }}
          CLOSURE_CHECK: ${{ needs.changes.outputs.closure_check }}
          RUSTDOC: ${{ needs.changes.outputs.rustdoc }}
          GOVERNED_JSONL: ${{ needs.changes.outputs.governed_jsonl }}
          MCP_CONFINEMENT_POSITIVE: ${{ needs.changes.outputs.mcp_confinement_positive }}
          DEFERRED_TO_PUSH: ${{ needs.changes.outputs.deferred_to_push }}
          READER_NOT_RUN: ${{ needs.changes.outputs.reader_not_run }}
          SDK_HOST: ${{ needs.changes.outputs.sdk_host }}
          BAZEL_GRAPH: ${{ needs.changes.outputs.bazel_graph }}
          EXAMPLES_BROWSER: ${{ needs.changes.outputs.examples_browser }}
          EXAMPLE_WEB: ${{ needs.changes.outputs.example_web }}
          EXAMPLE_WEB_WASM: ${{ needs.changes.outputs.example_web_wasm }}
          MODE: ${{ needs.changes.outputs.mode }}
          REASON: ${{ needs.changes.outputs.reason }}
          SHARD_COUNT: ${{ needs.changes.outputs.shard_count }}
          UNIT_SHARD_COUNT: ${{ needs.changes.outputs.unit_shard_count }}
          UNIT_DEFERRED: ${{ needs.changes.outputs.unit_deferred }}
          UNIT_DEFERRED_COUNT: ${{ needs.changes.outputs.unit_deferred_count }}
          UNIT_ROWS_ON_MAIN: ${{ needs.changes.outputs.unit_rows_on_main }}
          UNIT_ROWS_ON_MAIN_COUNT: ${{ needs.changes.outputs.unit_rows_on_main_count }}
          PACKAGE_COUNT: ${{ needs.changes.outputs.package_count }}
          CLOSURE_COUNT: ${{ needs.changes.outputs.closure_count }}
          GENERATED_CONTRACT: ${{ needs.changes.outputs.generated_contract }}
          RELEASE_PROJECTION: ${{ needs.changes.outputs.release_projection }}
          RELEASE_EVIDENCE_COMMIT: ${{ needs.changes.outputs.release_evidence_commit }}
          RELEASE_EVIDENCE_RUN_ID: ${{ needs.changes.outputs.release_evidence_run_id }}
          RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ needs.changes.outputs.release_evidence_run_attempt }}
        run: |
          set -euo pipefail
          # A two-wave lane (long rows first, the rest after the stagger job)
          # ran when every wave that holds rows succeeded: a failure or
          # cancellation of either fails it, a wave with rows that did not
          # run leaves it unrun, and it counts as skipped only when neither
          # wave holds a row. The attestation step reads the same results.
          combine_waves() {
            local first="$1" first_count="$2" rest="$3" rest_count="$4" any_rows=0 result count wave
            for result in "${first}" "${rest}"; do
              case "${result}" in failure|cancelled) echo "${result}"; return ;; esac
            done
            for wave in "${first}:${first_count}" "${rest}:${rest_count}"; do
              result="${wave%%:*}"
              count="${wave##*:}"
              if ! [[ "${count}" =~ ^[0-9]+$ ]]; then echo "unplanned"; return; fi
              if (( count > 0 )); then
                any_rows=1
                if [[ "${result}" != "success" ]]; then echo "${result}"; return; fi
              fi
            done
            if (( any_rows )); then echo success; else echo skipped; fi
          }
          CLIPPY_RESULT="$(combine_waves "${CLIPPY_FIRST_RESULT}" "${SHARD_FIRST_COUNT}" "${CLIPPY_REST_RESULT}" "${SHARD_REST_COUNT}")"
          CLOSURE_TESTS_RESULT="$(combine_waves "${CLOSURE_TESTS_FIRST_RESULT}" "${CLOSURE_TEST_FIRST_COUNT}" "${CLOSURE_TESTS_REST_RESULT}" "${CLOSURE_TEST_REST_COUNT}")"
          MAIN_UNIT_PACKED_RESULT="$(combine_waves "${MAIN_UNIT_FIRST_RESULT}" "${MAIN_UNIT_FIRST_COUNT}" "${MAIN_UNIT_REST_RESULT}" "${MAIN_UNIT_REST_COUNT}")"
          FEATURE_CHECK_RESULT="$(combine_waves "${FEATURE_CHECK_FIRST_RESULT}" "${FEATURE_CHECK_FIRST_COUNT}" "${FEATURE_CHECK_REST_RESULT}" "${FEATURE_CHECK_REST_COUNT}")"
          {
            echo "CLIPPY_RESULT=${CLIPPY_RESULT}"
            echo "CLOSURE_TESTS_RESULT=${CLOSURE_TESTS_RESULT}"
            echo "MAIN_UNIT_PACKED_RESULT=${MAIN_UNIT_PACKED_RESULT}"
            echo "FEATURE_CHECK_RESULT=${FEATURE_CHECK_RESULT}"
          } >> "${GITHUB_ENV:-/dev/null}"
          # Main unit coverage is the packed waves plus the archived lanes
          # (build once, partitioned runs), each given as result:row count:
          # one failure or cancellation fails it, a lane that has rows and did
          # not succeed leaves it unrun (the others' success never stands in
          # for its rows), and it counts as skipped only when no lane has rows.
          combine_main_unit() {
            local lane result count any_rows=0
            for lane in "$@"; do
              case "${lane%%:*}" in failure|cancelled) echo "${lane%%:*}"; return ;; esac
            done
            for lane in "$@"; do
              result="${lane%%:*}"
              count="${lane##*:}"
              if ! [[ "${count}" =~ ^[0-9]+$ ]]; then echo "unplanned"; return; fi
              if (( count > 0 )); then
                any_rows=1
                if [[ "${result}" != "success" ]]; then echo "${result:-missing}"; return; fi
              fi
            done
            if (( any_rows )); then echo success; else echo skipped; fi
          }
          main_unit_rows=unplanned
          if [[ "${MAIN_UNIT_FIRST_COUNT}" =~ ^[0-9]+$ && "${MAIN_UNIT_REST_COUNT}" =~ ^[0-9]+$ ]]; then
            main_unit_rows=$(( MAIN_UNIT_FIRST_COUNT + MAIN_UNIT_REST_COUNT ))
          fi
          MAIN_UNIT_RESULT="$(combine_main_unit "${MAIN_UNIT_PACKED_RESULT}:${main_unit_rows}" "${MAIN_UNIT_ARCHIVE_BUILD_RESULT}:${MAIN_ARCHIVE_BUILD_COUNT}" "${MAIN_UNIT_ARCHIVE_RUN_RESULT}:${MAIN_ARCHIVE_RUN_COUNT}")"
          echo "MAIN_UNIT_RESULT=${MAIN_UNIT_RESULT}" >> "${GITHUB_ENV:-/dev/null}"
          echo "plan: mode=${MODE} packages=${PACKAGE_COUNT} closure=${CLOSURE_COUNT} clippy_shards=${SHARD_COUNT} unit_shards=${UNIT_SHARD_COUNT} (${REASON})"
          if [[ -n "${UNIT_DEFERRED}" ]]; then
            echo "::notice::unit tests deferred to the push-to-main run (meerkat-mob compile chain): ${UNIT_DEFERRED}"
          fi
          if [[ -n "${DEFERRED_TO_PUSH}" ]]; then
            echo "::notice::left to the push (main or release/**): ${DEFERRED_TO_PUSH}"
          fi
          if [[ -n "${READER_NOT_RUN}" ]]; then
            echo "::notice::readers of changed files that need live-provider credentials run in no CI lane: ${READER_NOT_RUN}"
          fi
          echo "changes=${CHANGES_RESULT} fmt-governance=${FMT_GOVERNANCE_RESULT} ratchets=${RATCHETS_RESULT} governance-gates=${GOVERNANCE_GATES_RESULT} tlc-audits=${TLC_AUDITS_RESULT}"
          echo "clippy=${CLIPPY_RESULT} unit=${UNIT_RESULT} governed-jsonl=${GOVERNED_JSONL_RESULT} mcp-confinement-positive=${MCP_CONFINEMENT_POSITIVE_RESULT} integration=${INTEGRATION_RESULT} (${INTEGRATION_COUNT} suites) closure-tests=${CLOSURE_TESTS_RESULT} (${CLOSURE_TEST_COUNT} rows, ${HOOK_BINARY_COUNT} hook binaries, ${HOOK_RETAINED_COUNT} of them lib binaries left to the main and nightly unit lanes, ${TEST_SCOPE_COUNT}-package scope) main-unit=${MAIN_UNIT_RESULT} closure-check=${CLOSURE_CHECK_RESULT} rustdoc=${RUSTDOC_RESULT} feature-check=${FEATURE_CHECK_RESULT} wasm-check=${WASM_CHECK_RESULT} sdk-host=${SDK_HOST_RESULT} example-web=${EXAMPLE_WEB_RESULT} wasm-timers=${WASM_TIMERS_RESULT} bazel-graph=${BAZEL_GRAPH_RESULT}"
          failed=0
          require_success() {
            local lane="$1" result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${lane} must succeed on every run (result: ${result})."
              failed=1
            fi
          }
          require_ran() {
            local lane="$1" result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${lane} must run and succeed for a build-relevant change (result: ${result})."
              failed=1
            fi
          }
          forbid_failure() {
            local lane="$1" result="$2"
            case "${result}" in
              success|skipped) ;;
              *)
                echo "::error::${lane} did not complete successfully (result: ${result})."
                failed=1
                ;;
            esac
          }
          # The classifier is the fail-closed authority: if it did not
          # produce a plan, nothing below can be trusted.
          require_success "Change classification" "${CHANGES_RESULT}"
          require_success "Format + governance" "${FMT_GOVERNANCE_RESULT}"
          require_success "Generation ratchets" "${RATCHETS_RESULT}"
          # The rest waves and the short lanes wait for the stagger job.
          require_success "Stagger the short rows" "${STAGGER_RESULT}"
          # A release-projection plan runs no Clippy, unit, check, wasm, SDK or
          # example lane: it reuses the parent's workspace-mode exact-main run,
          # which the next step verifies. The readers of the changed files
          # still run (closure-tests and integration below). The plan must say
          # so consistently, or nothing below can be trusted either.
          if [[ "${RELEASE_PROJECTION}" == "true" ]]; then
            echo "release projection: lanes reuse CI run ${RELEASE_EVIDENCE_RUN_ID} attempt ${RELEASE_EVIDENCE_RUN_ATTEMPT} of ${RELEASE_EVIDENCE_COMMIT} (verified next)"
            if [[ "${MODE}" != "release-projection" || "${RUST_CHANGED}" != "false" || "${EXAMPLE_WEB}" != "false" || "${EXAMPLE_WEB_WASM}" != "false" || "${GENERATED_CONTRACT}" != "true" || "${BAZEL_GRAPH}" != "true" ]]; then
              echo "::error::an inconsistent release-projection plan (mode=${MODE} rust_changed=${RUST_CHANGED} example_web=${EXAMPLE_WEB} example_web_wasm=${EXAMPLE_WEB_WASM} generated_contract=${GENERATED_CONTRACT} bazel_graph=${BAZEL_GRAPH})."
              failed=1
            fi
            if ! [[ "${RELEASE_EVIDENCE_COMMIT}" =~ ^[0-9a-f]{40}$ && "${RELEASE_EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ && "${RELEASE_EVIDENCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::the release-projection plan names no completed CI run to reuse (commit='${RELEASE_EVIDENCE_COMMIT}' run='${RELEASE_EVIDENCE_RUN_ID}' attempt='${RELEASE_EVIDENCE_RUN_ATTEMPT}')."
              failed=1
            fi
            # The readers' and meerkat-contracts' lib and bin unit rows.
            if [[ "${UNIT_SHARD_COUNT}" =~ ^[0-9]+$ ]] && (( UNIT_SHARD_COUNT > 0 )); then
              require_ran "Unit tests" "${UNIT_RESULT}"
            else
              echo "::error::a release-projection plan must run its readers' unit rows (unit_shard_count='${UNIT_SHARD_COUNT}')."
              failed=1
            fi
          elif [[ "${MODE}" == "release-projection" ]]; then
            echo "::error::mode release-projection without the release_projection flag."
            failed=1
          fi
          if [[ "${MACHINE_AUTHORITY}" == "true" ]]; then
            require_ran "Bounded TLC audits" "${TLC_AUDITS_RESULT}"
          else
            forbid_failure "Bounded TLC audits" "${TLC_AUDITS_RESULT}"
          fi
          if [[ "${GOVERNANCE_GATES}" == "true" ]]; then
            require_ran "Typed governance gates" "${GOVERNANCE_GATES_RESULT}"
          else
            forbid_failure "Typed governance gates" "${GOVERNANCE_GATES_RESULT}"
          fi
          if [[ "${RUST_CHANGED}" == "true" ]]; then
            if ! [[ "${SHARD_COUNT}" =~ ^[0-9]+$ ]] || (( SHARD_COUNT < 1 )); then
              echo "::error::a build-relevant change produced no lanes (shard_count='${SHARD_COUNT}')."
              failed=1
            fi
            require_ran "Clippy" "${CLIPPY_RESULT}"
            # The push runs every lane; a pull request leaves these to it
            # (an exact-profile lane runs when it touches that lane's own
            # inputs). A push plan that deferred one cannot be trusted.
            push_plan_whole=true
            for flag in "${CLOSURE_CHECK}" "${RUSTDOC}" "${GOVERNED_JSONL}" "${MCP_CONFINEMENT_POSITIVE}"; do
              [[ "${flag}" == "true" ]] || push_plan_whole=false
            done
            if [[ "${PLAN_EVENT}" != "push" || -n "${DEFERRED_TO_PUSH}" ]]; then push_plan_whole=false; fi
            if [[ "${IS_PULL_REQUEST}" != "true" && "${push_plan_whole}" != "true" ]]; then
              echo "::error::a push plan left lanes to a later push (event=${PLAN_EVENT} closure_check=${CLOSURE_CHECK} rustdoc=${RUSTDOC} governed_jsonl=${GOVERNED_JSONL} mcp_confinement_positive=${MCP_CONFINEMENT_POSITIVE} deferred='${DEFERRED_TO_PUSH}')."
              failed=1
            fi
            if [[ "${CLOSURE_CHECK}" == "true" ]]; then
              require_ran "Closure check" "${CLOSURE_CHECK_RESULT}"
            else
              forbid_failure "Closure check" "${CLOSURE_CHECK_RESULT}"
            fi
            if [[ "${RUSTDOC}" == "true" ]]; then
              require_ran "Rustdoc" "${RUSTDOC_RESULT}"
            else
              forbid_failure "Rustdoc" "${RUSTDOC_RESULT}"
            fi
            if [[ "${GOVERNED_JSONL}" == "true" ]]; then
              require_ran "Governed JSONL" "${GOVERNED_JSONL_RESULT}"
            else
              forbid_failure "Governed JSONL" "${GOVERNED_JSONL_RESULT}"
            fi
            if [[ "${MCP_CONFINEMENT_POSITIVE}" == "true" ]]; then
              require_ran "MCP confinement positive" "${MCP_CONFINEMENT_POSITIVE_RESULT}"
            else
              forbid_failure "MCP confinement positive" "${MCP_CONFINEMENT_POSITIVE_RESULT}"
            fi
            if [[ "${FEATURE_CHECK_COUNT}" =~ ^[0-9]+$ ]] && (( FEATURE_CHECK_COUNT > 0 )); then
              require_ran "Feature combinations" "${FEATURE_CHECK_RESULT}"
            elif [[ "${FEATURE_CHECK_COUNT}" =~ ^[0-9]+$ ]]; then
              forbid_failure "Feature combinations" "${FEATURE_CHECK_RESULT}"
            else
              echo "::error::the plan carries no feature-combination count (feature_check_count='${FEATURE_CHECK_COUNT}')."
              failed=1
            fi
            # Fail closed on the unit plan: every changed package is either in
            # a pull-request unit shard, in a push's unit rows (which run in
            # the packed main unit lane, verbatim), or named as deferred to main.
            if [[ "${UNIT_SHARD_COUNT}" =~ ^[0-9]+$ ]] && (( UNIT_SHARD_COUNT > 0 )); then
              require_ran "Unit tests" "${UNIT_RESULT}"
            elif [[ "${UNIT_ROWS_ON_MAIN_COUNT}" =~ ^[0-9]+$ ]] && (( UNIT_ROWS_ON_MAIN_COUNT > 0 )); then
              echo "the push runs its unit rows in the main unit lane: ${UNIT_ROWS_ON_MAIN}"
              require_ran "Main unit tests (packed shards)" "${MAIN_UNIT_PACKED_RESULT}"
              forbid_failure "Unit tests" "${UNIT_RESULT}"
            elif [[ "${UNIT_DEFERRED_COUNT}" =~ ^[0-9]+$ ]] && (( UNIT_DEFERRED_COUNT > 0 )); then
              echo "no pull-request unit lane: every changed package (${UNIT_DEFERRED}) is in the meerkat-mob compile chain and runs on main."
              forbid_failure "Unit tests" "${UNIT_RESULT}"
            else
              echo "::error::a build-relevant change produced neither a unit lane nor a deferred package list."
              failed=1
            fi
          elif [[ "${CHANGES_RESULT}" == "success" ]]; then
            for lane in Clippy:"${CLIPPY_RESULT}" "Unit tests":"${UNIT_RESULT}" "Closure check":"${CLOSURE_CHECK_RESULT}" Rustdoc:"${RUSTDOC_RESULT}" "Governed JSONL":"${GOVERNED_JSONL_RESULT}" "MCP confinement positive":"${MCP_CONFINEMENT_POSITIVE_RESULT}" "Feature combinations":"${FEATURE_CHECK_RESULT}"; do
              forbid_failure "${lane%%:*}" "${lane##*:}"
            done
          fi
          if [[ "${IS_MAIN_PUSH}" == "true" && "${RUST_CHANGED}" == "true" ]]; then
            # Post-merge coverage of everything the pull request deferred.
            require_ran "Main unit tests" "${MAIN_UNIT_RESULT}"
            require_ran "wasm32 check" "${WASM_CHECK_RESULT}"
            require_ran "Python + TypeScript SDK suites" "${SDK_HOST_RESULT}"
          elif [[ "${IS_MAIN_PUSH}" == "true" ]]; then
            # No Rust-relevant change on main: no unit lanes are required,
            # exactly as on a pull request; the SDK suites run only when SDK
            # paths changed.
            echo "no Rust-relevant change: no unit lanes required on this main push."
            forbid_failure "Main unit tests" "${MAIN_UNIT_RESULT}"
            forbid_failure "wasm32 check" "${WASM_CHECK_RESULT}"
            if [[ "${SDK_HOST}" == "true" || "${EXAMPLES_BROWSER}" == "true" ]]; then
              require_ran "Python + TypeScript SDK suites" "${SDK_HOST_RESULT}"
            else
              forbid_failure "Python + TypeScript SDK suites" "${SDK_HOST_RESULT}"
            fi
          else
            forbid_failure "Main unit tests" "${MAIN_UNIT_RESULT}"
            # Pull requests run the wasm32 check when the plan's `wasm` flag
            # is set: a changed crate the web runtime compiles, its own
            # inputs, or a whole-workspace plan.
            if [[ "${WASM}" == "true" ]]; then
              require_ran "wasm32 check" "${WASM_CHECK_RESULT}"
            else
              forbid_failure "wasm32 check" "${WASM_CHECK_RESULT}"
            fi
            # Pull requests run the Node example suites of the SDK lane when
            # their inputs changed.
            if [[ "${EXAMPLES_BROWSER}" == "true" ]]; then
              require_ran "Python + TypeScript SDK suites (example suites)" "${SDK_HOST_RESULT}"
            else
              forbid_failure "Python + TypeScript SDK suites" "${SDK_HOST_RESULT}"
            fi
          fi
          # Integration suites: every selected suite (by trigger packages or
          # changed paths, Rust change or not) must run and pass; with none
          # selected the lane must not have failed.
          if [[ "${INTEGRATION_COUNT}" =~ ^[0-9]+$ ]] && (( INTEGRATION_COUNT > 0 )); then
            require_ran "Integration tests" "${INTEGRATION_RESULT}"
          elif [[ "${CHANGES_RESULT}" == "success" && ! "${INTEGRATION_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::the plan carries no integration suite count (integration_count='${INTEGRATION_COUNT}')."
            failed=1
          else
            forbid_failure "Integration tests" "${INTEGRATION_RESULT}"
          fi
          # Closure tests: the pre-push hook's cargo-test coverage for the
          # test scope. Every planned row must run and pass; the plan itself
          # fails when a hook binary in scope has no row.
          if [[ "${CLOSURE_TEST_COUNT}" =~ ^[0-9]+$ ]] && (( CLOSURE_TEST_COUNT > 0 )); then
            require_ran "Closure tests" "${CLOSURE_TESTS_RESULT}"
          elif [[ "${CHANGES_RESULT}" == "success" && ! "${CLOSURE_TEST_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::the plan carries no closure test count (closure_test_count='${CLOSURE_TEST_COUNT}')."
            failed=1
          else
            forbid_failure "Closure tests" "${CLOSURE_TESTS_RESULT}"
          fi
          # Example web suites: every main push but a release projection's
          # (it reuses its parent's), and pull requests that touch the web
          # runtime, its crates, or examples 031-033.
          if [[ ( "${IS_MAIN_PUSH}" == "true" && "${RELEASE_PROJECTION}" != "true" ) || "${EXAMPLE_WEB}" == "true" ]]; then
            require_ran "Example web suites" "${EXAMPLE_WEB_RESULT}"
          else
            forbid_failure "Example web suites" "${EXAMPLE_WEB_RESULT}"
          fi
          # WASM timer ownership runs with the suites' wasm build
          # (example_web_wasm), which a pull request that changes a crate the
          # web runtime builds on, or plans the whole workspace, leaves to the
          # push: it is required exactly when the job's condition selects it.
          if [[ ( "${IS_MAIN_PUSH}" == "true" && "${RELEASE_PROJECTION}" != "true" ) || "${EXAMPLE_WEB_WASM}" == "true" ]]; then
            require_ran "WASM timer ownership" "${WASM_TIMERS_RESULT}"
          else
            forbid_failure "WASM timer ownership" "${WASM_TIMERS_RESULT}"
          fi
          # Bazel graph check: every main push, and pull requests with a
          # Bazel-relevant change.
          if [[ "${IS_MAIN_PUSH}" == "true" || "${BAZEL_GRAPH}" == "true" ]]; then
            require_ran "Bazel graph check" "${BAZEL_GRAPH_RESULT}"
          else
            forbid_failure "Bazel graph check" "${BAZEL_GRAPH_RESULT}"
          fi
          if (( failed )); then
            exit 1
          fi
          echo "All selected lanes succeeded."

      # A release-projection plan skipped the lanes the parent's exact-main
      # CI ran over the whole workspace. Re-check the projection and the
      # evidence here, after the lanes, with the parent's own copies of the
      # scripts: the recorded attempt must be a completed, successful push run
      # of ci.yml on main at HEAD's first parent, and its schema-4 attestation
      # must name that commit and tree, plan the whole workspace with every
      # lane successful and not itself be a reuse. Anything else fails the
      # gate; the run and attempt are recorded in this run's attestation.
      - name: Checkout the release projection
        if: ${{ needs.changes.outputs.release_projection == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Setup Python for the release projection
        if: ${{ needs.changes.outputs.release_projection == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node for the release projection
        if: ${{ needs.changes.outputs.release_projection == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Verify reused release-projection evidence
        if: ${{ needs.changes.outputs.release_projection == 'true' }}
        id: release_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_COMMIT: ${{ needs.changes.outputs.release_evidence_commit }}
          RELEASE_EVIDENCE_RUN_ID: ${{ needs.changes.outputs.release_evidence_run_id }}
          RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ needs.changes.outputs.release_evidence_run_attempt }}
        run: |
          set -euo pipefail
          parent="$(git rev-parse --verify 'HEAD^1')"
          if [[ "${parent}" != "${RELEASE_EVIDENCE_COMMIT}" ]]; then
            echo "::error::the reused evidence names ${RELEASE_EVIDENCE_COMMIT}, not HEAD's first parent ${parent}."
            exit 1
          fi
          tools="${RUNNER_TEMP}/release-evidence-tools/scripts"
          mkdir -p "${tools}"
          for script in ci-release-evidence.mjs release-projection-only.mjs release-version-pins.mjs; do
            git show "${parent}:scripts/${script}" > "${tools}/${script}"
          done
          node "${tools}/ci-release-evidence.mjs" verify --repository "${GITHUB_REPOSITORY}" \
            --base "${parent}" --head HEAD --run-id "${RELEASE_EVIDENCE_RUN_ID}" \
            --run-attempt "${RELEASE_EVIDENCE_RUN_ATTEMPT}" --github-output "${GITHUB_OUTPUT}"

      - name: Enforce lane execution budget
        # Runs on every run that was not cancelled, including runs whose lane
        # check above failed, so a failed run also names its slowest lanes.
        # Enforced on pull requests only: the budget keeps pull-request
        # feedback fast. A push (it carries the lanes a pull request left to
        # it) and a dispatch (it plans the whole workspace) are full
        # validation runs with no wall-clock budget: there the step only
        # reports, and a failure to measure is a warning.
        #
        # Three numbers per lane, from the Actions jobs API:
        #   queued    created_at to started_at: waiting for a hosted runner
        #   ran       started_at to completed_at: the lane's own execution
        #   terminal  completed_at, timed from the start of the run attempt
        #             the lane ran in
        # The execution path of a lane is its own run time plus the change
        # classification's (every lane but classification and format +
        # governance waits for the plan) and, for a lane that waits for the
        # stagger job, the stagger job's. The budgets:
        #   - execution path <= CI_MAX_EXEC_SECONDS: fails (exec_over_budget)
        #   - terminal minus path queue <= CI_MAX_TERMINAL_SECONDS: fails
        #     (runaway); runner queue never counts toward a failure
        #   - critical-path queue >= CI_QUEUE_WARN_SECONDS: warns
        #     (queue_delayed), never fails
        # Run times belong to the job, so re-running only this gate cannot
        # launder an execution overrun. Terminals use per-attempt clocks: a
        # re-run lane gets a fresh clock, a carried-over lane keeps its own
        # attempt's clock.
        #
        # One exception, on a pull request only: an exact-profile lane
        # (governed JSONL, MCP confinement positive) that the plan ran only
        # because the change touched its inputs or changed its definition
        # (every reason in guard_lane_reasons is inputs_changed or
        # definition_changed) and that succeeded is left out of both budgets
        # and of their critical paths. Its cold build alone exceeds them (the
        # confinement lane's job comment), so such a pull request could never
        # pass otherwise. The lane check above still requires it to succeed,
        # its own timeout-minutes still bounds it, and this step names it,
        # with its seconds and the reason, in a "Guard lane outside the budget"
        # warning, the summary, the lane table and the
        # guard_lanes_outside_budget output. The plan's reasons are read, never
        # inferred here: a lane it ran on every Rust change or for an unknown
        # diff stays in the budget, and a reasons output that is missing or
        # unreadable, a lane GUARD_LANE_JOBS cannot name, or a named lane
        # with no completed job fails a pull request.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_EXEC_SECONDS: ${{ env.CI_MAX_EXEC_SECONDS }}
          MAX_TERMINAL_SECONDS: ${{ env.CI_MAX_TERMINAL_SECONDS }}
          QUEUE_WARN_SECONDS: ${{ env.CI_QUEUE_WARN_SECONDS }}
          ENFORCE_BUDGET: ${{ github.event_name == 'pull_request' }}
          GATE_JOB_NAME: CI gate
          CLASSIFICATION_JOB_NAME: Change classification
          ROOT_JOB_NAMES: Change classification,Format + governance
          STAGGER_JOB_NAME: Stagger the short rows
          # Why the plan ran each exact-profile lane, and those lanes' job
          # names (exact matches).
          GUARD_LANE_REASONS: ${{ needs.changes.outputs.guard_lane_reasons }}
          GUARD_LANE_JOBS: governed_jsonl=Governed JSONL,mcp_confinement_positive=MCP confinement positive (Linux)
          # Seconds to wait before each retry of a GitHub API request that
          # answered with a server error (5xx). Any other failure, or a
          # server error after the last retry, still fails a measurement the
          # run enforces.
          API_RETRY_DELAYS: 5 10 20
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          API_RETRY_DELAYS = [int(delay) for delay in os.environ.get("API_RETRY_DELAYS", "").split()]
          SERVER_ERROR = re.compile(r"HTTP 5\d\d")


          def api(path):
              delays = list(API_RETRY_DELAYS)
              while True:
                  result = subprocess.run(
                      ["gh", "api", "--paginate", "--slurp", path],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode == 0:
                      return json.loads(result.stdout)
                  if delays and SERVER_ERROR.search(result.stderr):
                      delay = delays.pop(0)
                      print(f"GitHub API server error for {path} ({result.stderr.strip()}); retrying in {delay} s")
                      time.sleep(delay)
                      continue
                  raise subprocess.CalledProcessError(
                      result.returncode, result.args, output=result.stdout, stderr=result.stderr
                  )


          def ts(value):
              return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))


          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          max_exec = int(os.environ["MAX_EXEC_SECONDS"])
          max_terminal = int(os.environ["MAX_TERMINAL_SECONDS"])
          queue_warn = int(os.environ["QUEUE_WARN_SECONDS"])
          enforce = os.environ["ENFORCE_BUDGET"] == "true"
          gate_name = os.environ["GATE_JOB_NAME"]
          classification_name = os.environ["CLASSIFICATION_JOB_NAME"]
          root_names = set(os.environ["ROOT_JOB_NAMES"].split(","))
          stagger_name = os.environ["STAGGER_JOB_NAME"]

          # On a pull request, the exact-profile lanes the plan ran only
          # because the change touched their inputs or changed their
          # definition, by job name, with their reasons. Read from the plan,
          # never inferred; fails closed.
          EXEMPT_REASONS = {"definition_changed", "inputs_changed"}
          guard_jobs = {}
          for entry in os.environ.get("GUARD_LANE_JOBS", "").split(","):
              lane_id, _, job_name = entry.partition("=")
              if lane_id and job_name:
                  guard_jobs[lane_id] = job_name
          exempt = {}
          if enforce:
              raw_reasons = os.environ.get("GUARD_LANE_REASONS", "")
              try:
                  plan_reasons = json.loads(raw_reasons)
                  if not isinstance(plan_reasons, dict) or not all(
                      isinstance(reasons, list) and all(isinstance(reason, str) for reason in reasons)
                      for reasons in plan_reasons.values()
                  ):
                      raise ValueError("expected an object of reason lists")
              except ValueError as error:
                  print(f"::error::the plan's guard_lane_reasons is unreadable ({raw_reasons!r}): {error}")
                  sys.exit(1)
              for lane_id, reasons in plan_reasons.items():
                  if lane_id not in guard_jobs:
                      print(
                          f"::error::the plan ran guard lane {lane_id} ({', '.join(reasons)}), "
                          f"which GUARD_LANE_JOBS does not name."
                      )
                      sys.exit(1)
                  if reasons and set(reasons) <= EXEMPT_REASONS:
                      exempt[guard_jobs[lane_id]] = reasons

          def collect_lanes():
              # Start of every attempt so far; a carried-over job belongs to the
              # latest attempt that had started when the job started.
              attempt_starts = []
              for n in range(1, attempt + 1):
                  page = api(f"/repos/{repo}/actions/runs/{run_id}/attempts/{n}")[0]
                  attempt_starts.append((n, ts(page["run_started_at"])))
              jobs = [
                  job
                  for page in api(
                      f"/repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100"
                  )
                  for job in page["jobs"]
              ]

              lanes = []
              for job in jobs:
                  if job["name"] == gate_name or job["conclusion"] in (None, "skipped"):
                      continue
                  if not job["started_at"] or not job["completed_at"]:
                      continue
                  started, completed = ts(job["started_at"]), ts(job["completed_at"])
                  if completed < started:
                      continue
                  created = ts(job["created_at"]) if job.get("created_at") else started
                  ran_in, clock = attempt_starts[0]
                  for n, begun in attempt_starts:
                      if begun <= started:
                          ran_in, clock = n, begun
                  lanes.append(
                      {
                          "name": job["name"],
                          "attempt": ran_in,
                          "created": created,
                          "completed": completed,
                          "queued": max(0, int((started - created).total_seconds())),
                          "duration": int((completed - started).total_seconds()),
                          "terminal": int((completed - clock).total_seconds()),
                          "conclusion": job["conclusion"],
                      }
                  )
              return lanes


          # Measurement needs the Actions API. A failure to measure fails a
          # pull request, whose budget is enforced, but only warns on a push
          # or a dispatch, where the budget is a report: a transient API error
          # must not turn main's CI gate red and block release readiness.
          try:
              lanes = collect_lanes()
          except (subprocess.CalledProcessError, KeyError, IndexError, TypeError, ValueError) as error:
              detail = (getattr(error, "stderr", None) or str(error)).strip()
              if enforce:
                  print(f"::error::could not measure the lane execution budget: {detail}")
                  sys.exit(1)
              print(f"::warning::lane execution budget report unavailable (budget not enforced): {detail}")
              sys.exit(0)
          if not lanes:
              level = "error" if enforce else "warning"
              print(f"::{level}::no completed lanes found for the lane execution budget.")
              sys.exit(1 if enforce else 0)

          # Every lane except the roots waits for the change classification,
          # so its execution path starts with the classification's run time
          # and its queue includes the classification's queue. The rest wave
          # of a two-wave lane and the short lanes also wait for the stagger
          # job. The jobs API does not list a job's needs, but it creates a
          # job when they complete: a lane created no earlier than the
          # stagger job completed, in the same attempt, waited for it (the
          # other lanes are created with the stagger job itself, when the
          # classification completes).
          classification = next((lane for lane in lanes if lane["name"] == classification_name), None)
          stagger = next((lane for lane in lanes if lane["name"] == stagger_name), None)
          if classification is None and enforce:
              print(f"::error::no completed {classification_name} job: the execution path is unmeasurable.")
              sys.exit(1)
          for lane in lanes:
              upstream = [classification] if lane["name"] not in root_names and classification else []
              if (
                  stagger is not None
                  and lane is not stagger
                  and lane["attempt"] == stagger["attempt"]
                  and lane["created"] >= stagger["completed"]
              ):
                  upstream.append(stagger)
              lane["exec_path"] = lane["duration"] + sum(job["duration"] for job in upstream)
              # A lane re-run in a later attempt did not wait for the
              # carried-over upstream jobs' runners.
              lane["path_queued"] = lane["queued"] + sum(
                  job["queued"] for job in upstream if job["attempt"] == lane["attempt"]
              )
              # The runaway ceiling is measured without runner queue: the
              # 40-job account cap is shared, so queue is reported, never
              # budgeted.
              lane["exec_terminal"] = max(0, lane["terminal"] - lane["path_queued"])

          # A lane the plan ran for its inputs or definition is outside the
          # budget only when it succeeded; failed or cancelled, it is
          # measured like any other.
          for job_name, reasons in exempt.items():
              if not any(lane["name"] == job_name for lane in lanes):
                  print(
                      f"::error::the plan ran {job_name} ({', '.join(reasons)}), but this attempt "
                      f"has no completed job of that name."
                  )
                  sys.exit(1)
          for lane in lanes:
              lane["outside_budget"] = lane["name"] in exempt and lane["conclusion"] == "success"
          budgeted = [lane for lane in lanes if not lane["outside_budget"]]
          outside = [lane for lane in lanes if lane["outside_budget"]]
          if not budgeted:
              print("::error::no completed lane is left in the lane execution budget.")
              sys.exit(1)

          exec_critical = max(budgeted, key=lambda lane: lane["exec_path"])
          critical = max(budgeted, key=lambda lane: lane["terminal"])
          runaway_critical = max(budgeted, key=lambda lane: lane["exec_terminal"])
          slowest = max(budgeted, key=lambda lane: lane["duration"])
          exec_path = exec_critical["exec_path"]
          terminal = critical["terminal"]
          queued = critical["path_queued"]
          exec_terminal = runaway_critical["exec_terminal"]

          # The verdict is the measurement; only pull requests fail on it.
          if exec_terminal > max_terminal:
              verdict_type = "runaway"
          elif exec_path > max_exec:
              verdict_type = "exec_over_budget"
          elif queued >= queue_warn:
              verdict_type = "queue_delayed"
          else:
              verdict_type = "within_budget"

          rows = sorted(lanes, key=lambda lane: lane["terminal"], reverse=True)
          table = [
              "| lane | attempt | queued s | ran s | exec path s | terminal s | terminal excl. queue s | result |",
              "| --- | --- | --- | --- | --- | --- | --- | --- |",
          ] + [
              f"| {r['name']} | {r['attempt']} | {r['queued']} | {r['duration']} | {r['exec_path']} | {r['terminal']} | {r['exec_terminal']} | {r['conclusion']}{' (outside the budget)' if r['outside_budget'] else ''} |"
              for r in rows[:12]
          ]
          because = {"definition_changed": "changed its definition", "inputs_changed": "touched its inputs"}
          outside_notes = [
              f"{lane['name']} ran {lane['duration']} s (execution path {lane['exec_path']} s, "
              f"push-to-terminal excluding runner queue {lane['exec_terminal']} s) outside the lane "
              f"budgets: the plan ran it because the change "
              f"{' and '.join(because[reason] for reason in exempt[lane['name']])} "
              f"({', '.join(exempt[lane['name']])}); it is still required to succeed, and its own "
              f"timeout-minutes bounds it."
              for lane in outside
          ]
          verdict = (
              f"Lane execution: {exec_path}/{max_exec} s (execution critical path: {exec_critical['name']}); "
              f"push-to-terminal: {terminal} s (critical path: {critical['name']}, "
              f"attempt {critical['attempt']}, {queued} s of it runner queue); "
              f"push-to-terminal excluding runner queue: {exec_terminal}/{max_terminal} s "
              f"(critical path: {runaway_critical['name']}); "
              f"slowest lane: {slowest['name']}, ran {slowest['duration']} s; verdict: {verdict_type}"
              + "".join(f"; outside the budget: {lane['name']}, ran {lane['duration']} s" for lane in outside)
          )
          print(verdict)
          print("\n".join(table))
          for note in outside_notes:
              print(f"::warning title=Guard lane outside the budget::{note}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(
                      f"### Lane execution budget\n\n{verdict}\n\n"
                      + "".join(f"Guard lane outside the budget: {note}\n\n" for note in outside_notes)
                      + "\n".join(table)
                      + "\n"
                  )
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write(
                      f"exec_path_seconds={exec_path}\n"
                      f"terminal_seconds={terminal}\n"
                      f"terminal_excluding_queue_seconds={exec_terminal}\n"
                      f"queue_seconds={queued}\n"
                      f"budget_verdict={verdict_type}\n"
                      "guard_lanes_outside_budget="
                      + json.dumps(
                          [
                              {
                                  "job": lane["name"],
                                  "reasons": exempt[lane["name"]],
                                  "ran_seconds": lane["duration"],
                                  "exec_path_seconds": lane["exec_path"],
                                  "terminal_excluding_queue_seconds": lane["exec_terminal"],
                              }
                              for lane in outside
                          ],
                          separators=(",", ":"),
                      )
                      + "\n"
                  )
          if queued >= queue_warn:
              print(
                  f"::warning title=CI runner queue wait::{critical['name']} waited {queued} s for hosted "
                  f"runners on the critical path (classification included); runner queue is reported, "
                  f"not budgeted."
              )
          failed = False
          if enforce and exec_path > max_exec:
              print(
                  f"::error::CI exceeded the {max_exec}-second lane execution budget "
                  f"({exec_path} s; execution critical path {exec_critical['name']}, slowest lane "
                  f"{slowest['name']} at {slowest['duration']} s)."
              )
              failed = True
          if enforce and exec_terminal > max_terminal:
              print(
                  f"::error::CI exceeded the {max_terminal}-second push-to-terminal runaway ceiling "
                  f"excluding runner queue ({exec_terminal} s; critical path {runaway_critical['name']}, "
                  f"which also waited {runaway_critical['path_queued']} s for runners, not counted)."
              )
              failed = True
          if failed:
              sys.exit(1)
          PY

      # The exact-tree attestation of a push to main or to a release/**
      # branch; it records the ref, and release.yml's require_ci_green accepts
      # it only from main or from the release branch of the tag's version (a
      # maintenance release). Pull-request and dispatch runs write none.
      - name: Checkout attested source tree
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build exact-tree CI attestation
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
        id: attestation
        shell: bash
        # CLIPPY_RESULT, CLOSURE_TESTS_RESULT and MAIN_UNIT_PACKED_RESULT come
        # from the check step: each combines its lane's two waves. So does
        # MAIN_UNIT_RESULT, the packed waves plus the archived lanes.
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FMT_GOVERNANCE_RESULT: ${{ needs.fmt-governance.result }}
          RATCHETS_RESULT: ${{ needs.ratchets.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          GOVERNED_JSONL_RESULT: ${{ needs.governed-jsonl.result }}
          MCP_CONFINEMENT_POSITIVE_RESULT: ${{ needs.mcp-confinement-positive.result }}
          CLOSURE_CHECK_RESULT: ${{ needs.closure-check.result }}
          RUSTDOC_RESULT: ${{ needs.rustdoc.result }}
          WASM_CHECK_RESULT: ${{ needs.wasm-check.result }}
          SDK_HOST_RESULT: ${{ needs.sdk-host.result }}
          EXAMPLE_WEB_RESULT: ${{ needs.example-web.result }}
          BAZEL_GRAPH_RESULT: ${{ needs.bazel-graph.result }}
          WASM_TIMERS_RESULT: ${{ needs.wasm-timers.result }}
          # Whether the ratchets job ran its generated-contract lanes (schema,
          # SDK codegen, wrapper and RPC/REST surface freshness): a release
          # tag skips its own Cargo validation only when this run did.
          GENERATED_CONTRACT: ${{ needs.changes.outputs.generated_contract }}
          MODE: ${{ needs.changes.outputs.mode }}
          PACKAGE_COUNT: ${{ needs.changes.outputs.package_count }}
          CLOSURE_COUNT: ${{ needs.changes.outputs.closure_count }}
          SHARD_COUNT: ${{ needs.changes.outputs.shard_count }}
          UNIT_SHARD_COUNT: ${{ needs.changes.outputs.unit_shard_count }}
          UNIT_ROWS_ON_MAIN_COUNT: ${{ needs.changes.outputs.unit_rows_on_main_count }}
          MAIN_UNIT_SHARD_COUNT: ${{ needs.changes.outputs.main_unit_shard_count }}
          # Set only by a release-projection plan's verified evidence.
          RELEASE_PROJECTION: ${{ needs.changes.outputs.release_projection }}
          REUSED_RUN_ID: ${{ steps.release_evidence.outputs.run_id }}
          REUSED_RUN_ATTEMPT: ${{ steps.release_evidence.outputs.run_attempt }}
          REUSED_COMMIT: ${{ steps.release_evidence.outputs.commit }}
          REUSED_TREE: ${{ steps.release_evidence.outputs.tree }}
          REUSED_ARTIFACT: ${{ steps.release_evidence.outputs.attestation_artifact }}
          REUSED_FROM_VERSION: ${{ steps.release_evidence.outputs.from_version }}
          REUSED_TO_VERSION: ${{ steps.release_evidence.outputs.to_version }}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/meerkat-ci-attestation"
          mkdir -p "${destination}"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          # A release-projection run attests its own lanes plus the parent
          # run whose test evidence it reused (verified by the gate above);
          # require_ci_green verifies that evidence again.
          reused='null'
          if [[ "${RELEASE_PROJECTION}" == "true" ]]; then
            if [[ "${MODE}" != "release-projection" || -z "${REUSED_RUN_ID}" || -z "${REUSED_RUN_ATTEMPT}" || -z "${REUSED_COMMIT}" || -z "${REUSED_TREE}" ]]; then
              echo "::error::a release-projection run without verified reused evidence cannot be attested."
              exit 1
            fi
            reused="$(jq -n \
              --arg base_commit_sha "${REUSED_COMMIT}" \
              --arg base_tree_sha "${REUSED_TREE}" \
              --arg workflow_run_id "${REUSED_RUN_ID}" \
              --arg workflow_run_attempt "${REUSED_RUN_ATTEMPT}" \
              --arg attestation_artifact "${REUSED_ARTIFACT}" \
              --arg from_version "${REUSED_FROM_VERSION}" \
              --arg to_version "${REUSED_TO_VERSION}" \
              '{
                classifier: "release-projection-only",
                from_version: $from_version,
                to_version: $to_version,
                base_commit_sha: $base_commit_sha,
                base_tree_sha: $base_tree_sha,
                workflow: "CI",
                workflow_run_id: $workflow_run_id,
                workflow_run_attempt: $workflow_run_attempt,
                attestation_artifact: $attestation_artifact
              }')"
          elif [[ "${MODE}" == "release-projection" ]]; then
            echo "::error::mode release-projection without the release_projection flag cannot be attested."
            exit 1
          fi
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg tree_sha "${tree_sha}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg changes "${CHANGES_RESULT}" \
            --arg fmt_governance "${FMT_GOVERNANCE_RESULT}" \
            --arg ratchets "${RATCHETS_RESULT}" \
            --arg clippy "${CLIPPY_RESULT}" \
            --arg unit "${UNIT_RESULT}" \
            --arg integration "${INTEGRATION_RESULT}" \
            --arg closure_tests "${CLOSURE_TESTS_RESULT}" \
            --arg governed_jsonl "${GOVERNED_JSONL_RESULT}" \
            --arg mcp_confinement_positive "${MCP_CONFINEMENT_POSITIVE_RESULT}" \
            --arg main_unit "${MAIN_UNIT_RESULT}" \
            --arg closure_check "${CLOSURE_CHECK_RESULT}" \
            --arg rustdoc "${RUSTDOC_RESULT}" \
            --arg wasm_check "${WASM_CHECK_RESULT}" \
            --arg sdk_host "${SDK_HOST_RESULT}" \
            --arg example_web "${EXAMPLE_WEB_RESULT}" \
            --arg wasm_timers "${WASM_TIMERS_RESULT}" \
            --arg bazel_graph "${BAZEL_GRAPH_RESULT}" \
            --arg mode "${MODE}" \
            --argjson package_count "${PACKAGE_COUNT:-0}" \
            --argjson closure_count "${CLOSURE_COUNT:-0}" \
            --argjson shard_count "${SHARD_COUNT:-0}" \
            --argjson unit_shard_count "${UNIT_SHARD_COUNT:-0}" \
            --argjson unit_rows_on_main_count "${UNIT_ROWS_ON_MAIN_COUNT:-0}" \
            --argjson main_unit_shard_count "${MAIN_UNIT_SHARD_COUNT:-0}" \
            --argjson generated_contract "$([[ "${GENERATED_CONTRACT}" == "true" ]] && echo true || echo false)" \
            --argjson reused "${reused}" \
            '{
              schema_version: 4,
              repository: $repository,
              commit_sha: $commit_sha,
              tree_sha: $tree_sha,
              workflow: $workflow,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              event: $event,
              ref: $ref,
              validation_backend: "github-hosted-cargo",
              validation_result: "success",
              plan: {
                mode: $mode,
                package_count: $package_count,
                closure_count: $closure_count,
                clippy_shard_count: $shard_count,
                unit_shard_count: $unit_shard_count,
                unit_rows_on_main_count: $unit_rows_on_main_count,
                main_unit_shard_count: $main_unit_shard_count,
                generated_contract: $generated_contract
              },
              component_results: {
                changes: $changes,
                fmt_governance: $fmt_governance,
                ratchets: $ratchets,
                clippy: $clippy,
                unit: $unit,
                integration: $integration,
                closure_tests: $closure_tests,
                governed_jsonl: $governed_jsonl,
                mcp_confinement_positive: $mcp_confinement_positive,
                main_unit: $main_unit,
                closure_check: $closure_check,
                rustdoc: $rustdoc,
                wasm_check: $wasm_check,
                sdk_host: $sdk_host,
                example_web: $example_web,
                wasm_timers: $wasm_timers,
                bazel_graph: $bazel_graph
              }
            } + (if $reused == null then {} else {reused_test_evidence: $reused} end)' > "${destination}/attestation.json"
          echo "tree_sha=${tree_sha}"
          echo "path=${destination}" >> "${GITHUB_OUTPUT}"

      - name: Upload exact-tree CI attestation
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meerkat-ci-attestation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.attestation.outputs.path }}/attestation.json
          if-no-files-found: error
          retention-days: 14
