name: Setup Rust CI
description: Install Meerkat's pinned Rust toolchain and force its binaries ahead of runner defaults.

inputs:
  components:
    description: Comma-separated Rust components required by this job.
    required: false
    default: rustfmt, clippy

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      with:
        # The CI lanes run fmt/clippy directly; the dtolnay action installs a
        # minimal profile, so name the components explicitly.
        components: ${{ inputs.components }}

    # From the action's own tree: a release job runs this action from its
    # tooling checkout (.release-tooling) beside an older tag's checkout.
    - name: Pin Rust toolchain binaries
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../../../scripts/ci-pin-rust-toolchain-env"
