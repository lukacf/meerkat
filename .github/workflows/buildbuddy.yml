name: GCP BuildBuddy CI

# The whole BuildBuddy/Bazel validation graph. Nightly and the release
# workflow call this reusable lane in `full-fresh` mode; pull-request CI
# (ci.yml) is Cargo-only on GitHub-hosted runners and does not call it.
#
# Default OFF: every job that touches GCP runs only while the repository
# variable MEERKAT_GCP_BUILDBUDDY_ENABLED is 'true'. With it unset nothing
# starts, syncs or scales, and the gate job fails, so a caller that does not
# skip this workflow itself (nightly and release.yml do) never reads a
# disabled graph as a pass.

on:
  workflow_call:
    inputs:
      mode:
        description: GCP BuildBuddy mode.
        required: false
        default: full-fresh
        type: string
      machine_authority_base_sha:
        description: Base revision for machine-authority change detection.
        required: false
        default: ""
        type: string
      machine_authority_head_sha:
        description: Head revision for machine-authority change detection.
        required: false
        default: ""
        type: string
      repository_cache:
        description: >-
          Bazel external repository cache of every lane: 'restore' restores
          it (this workflow's gcp-buildbuddy backend never saves it); 'false'
          neither restores nor saves it, which the release tag passes, so a
          tag run restores no cache entry another run saved.
        required: false
        default: restore
        type: string
    secrets:
      # The self-hosted control plane's own org API key for the CI
      # submitters. This workflow never reads the BuildBuddy Cloud key
      # (BUILDBUDDY_API_KEY). Callers list the secrets they pass; none uses
      # `secrets: inherit` (scripts/release-doctor checks every workflow).
      MEERKAT_GCP_BUILDBUDDY_API_KEY:
        required: false
      BUILDBUDDY_ENDPOINT:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      RKAT_ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      RKAT_OPENAI_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      RKAT_GEMINI_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      GOOGLE_APPLICATION_CREDENTIALS_JSON:
        required: false
      MEERKAT_E2E_AUTH_OPENAI_OAUTH_TOKENS_JSON:
        required: false
      MEERKAT_E2E_AUTH_ANTHROPIC_MODEL:
        required: false
      MEERKAT_E2E_AUTH_GEMINI_MODEL:
        required: false
      MEERKAT_E2E_AUTH_VERTEX_CANARY:
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: buildbuddy-gcp-executors
  # One run owns scale-up/scale-down of the shared GCP executor pool at a time.
  # Renovate is grouped and concurrency-limited so it cannot flood this lane.
  cancel-in-progress: false

env:
  CARGO_HOME: /tmp/meerkat-cargo-home
  RUSTUP_TOOLCHAIN: 1.97.0
  MEERKAT_BAZEL_BACKEND: gcp-buildbuddy
  BUILDBUDDY_BAZEL_CONFIG: buildbuddy-linux-gcp-ci-rbe
  BUILDBUDDY_API_KEY: ${{ secrets.MEERKAT_GCP_BUILDBUDDY_API_KEY }}
  BUILDBUDDY_ENDPOINT: ${{ secrets.BUILDBUDDY_ENDPOINT }}
  BUILDBUDDY_GRPC_URL: ""
  BUILDBUDDY_HTTP_URL: ""
  MEERKAT_GCP_PROJECT_ID: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
  MEERKAT_GCP_REGION: ${{ vars.MEERKAT_GCP_REGION || 'europe-west1' }}
  MEERKAT_GCP_ZONE: ${{ vars.MEERKAT_GCP_ZONE || 'europe-west1-b' }}
  MEERKAT_GCP_BUILDBUDDY_CONTROL_INSTANCE: ${{ vars.MEERKAT_GCP_BUILDBUDDY_CONTROL_INSTANCE || 'meerkat-bb-control' }}
  MEERKAT_GCP_BUILDBUDDY_CONTROL_MACHINE_TYPE: ${{ vars.MEERKAT_GCP_BUILDBUDDY_CONTROL_MACHINE_TYPE || 'c3d-standard-8' }}
  MEERKAT_GCP_BUILDBUDDY_CONTROL_DATA_DISK_GB: ${{ vars.MEERKAT_GCP_BUILDBUDDY_CONTROL_DATA_DISK_GB || '1000' }}
  MEERKAT_GCP_BUILDBUDDY_MIG: ${{ vars.MEERKAT_GCP_BUILDBUDDY_MIG || 'meerkat-bb-exec' }}
  MEERKAT_GCP_BUILDBUDDY_TARGET_SIZE: ${{ vars.MEERKAT_GCP_BUILDBUDDY_TARGET_SIZE || '12' }}
  MEERKAT_GCP_BUILDBUDDY_MACHINE_TYPE: ${{ vars.MEERKAT_GCP_BUILDBUDDY_MACHINE_TYPE || 'c3d-standard-30' }}
  MEERKAT_GCP_BUILDBUDDY_BOOT_DISK_GB: ${{ vars.MEERKAT_GCP_BUILDBUDDY_BOOT_DISK_GB || '100' }}
  MEERKAT_GCP_BUILDBUDDY_CACHE_DISK_GB: ${{ vars.MEERKAT_GCP_BUILDBUDDY_CACHE_DISK_GB || '1000' }}
  MEERKAT_GCP_BUILDBUDDY_CACHE_DISK_TYPE: ${{ vars.MEERKAT_GCP_BUILDBUDDY_CACHE_DISK_TYPE || 'pd-ssd' }}
  MEERKAT_GCP_BUILDBUDDY_DOWN_MODE: ${{ vars.MEERKAT_GCP_BUILDBUDDY_DOWN_MODE || 'stopped' }}
  # 50 minutes from control-plane start, sized from the first full-fresh runs
  # (2026-09-22/23): executors up + lane setup ~2 min; the cold `//...`
  # prebuild needs ~12-13 min of Bazel time (18 min on the v0.8.44 tag run)
  # and gates only the Bazel-native clippy lane that reads its cache; the
  # cold Cargo-equivalent unit and integration-fast lanes (~22-25 min each)
  # start with the executors instead; the SDK suites are bounded by the Web
  # suite, whose wasm-pack build plus tests ran 1912 s on its own executor.
  # 1200 s only ever held while the skipped `changed-paths` mode reported
  # unrun lanes as passed.
  MEERKAT_GCP_BUILDBUDDY_CI_MAX_SECONDS: "3000"
  MEERKAT_GCP_BUILDBUDDY_SDK_CI_MAX_SECONDS: "3000"
  MEERKAT_BUILDBUDDY_EXECUTOR_POOL: ${{ vars.MEERKAT_BUILDBUDDY_EXECUTOR_POOL || 'meerkat-ci' }}
  # Server, executor and action images, each pinned by digest
  # (<repository>[:tag]@sha256:<digest>) in repository variables; the scripts
  # and the Bazel wrapper refuse a reference without a digest.
  MEERKAT_GCP_BUILDBUDDY_CONTROL_IMAGE: ${{ vars.MEERKAT_GCP_BUILDBUDDY_CONTROL_IMAGE }}
  MEERKAT_BUILDBUDDY_EXECUTOR_IMAGE: ${{ vars.MEERKAT_BUILDBUDDY_EXECUTOR_IMAGE }}
  MEERKAT_BUILDBUDDY_CI_IMAGE: ${{ vars.MEERKAT_BUILDBUDDY_CI_IMAGE }}
  # Submitters authenticate with these to open their IAP tunnel.
  MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
  MEERKAT_GCP_SERVICE_ACCOUNT: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
  MEERKAT_HOST_CARGO_HOME: /usr/local/cargo
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  RKAT_ANTHROPIC_API_KEY: ${{ secrets.RKAT_ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  RKAT_OPENAI_API_KEY: ${{ secrets.RKAT_OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  RKAT_GEMINI_API_KEY: ${{ secrets.RKAT_GEMINI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
  MEERKAT_E2E_AUTH_OPENAI_OAUTH_TOKENS_JSON: ${{ secrets.MEERKAT_E2E_AUTH_OPENAI_OAUTH_TOKENS_JSON }}
  MEERKAT_E2E_AUTH_ANTHROPIC_MODEL: ${{ secrets.MEERKAT_E2E_AUTH_ANTHROPIC_MODEL }}
  MEERKAT_E2E_AUTH_GEMINI_MODEL: ${{ secrets.MEERKAT_E2E_AUTH_GEMINI_MODEL }}
  MEERKAT_E2E_AUTH_VERTEX_CANARY: ${{ secrets.MEERKAT_E2E_AUTH_VERTEX_CANARY }}
  MEERKAT_CLEAN_E2E_SCENARIO_TARGETS: "1"
  MEERKAT_BUILDBUDDY_CI_JOBS: ${{ vars.MEERKAT_BUILDBUDDY_CI_JOBS || '192' }}
  MEERKAT_BUILDBUDDY_BATCH_JOBS: ${{ vars.MEERKAT_BUILDBUDDY_BATCH_JOBS || '1' }}

jobs:
  control-plane-up:
    name: Control plane up
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # grpc_url is the submitters' local IAP tunnel, executor_grpc_url the
    # VM's internal address; both are gRPCS with the per-boot CA tls_ca_b64.
    outputs:
      grpc_url: ${{ steps.endpoint.outputs.grpc_url }}
      http_url: ${{ steps.endpoint.outputs.http_url }}
      executor_grpc_url: ${{ steps.endpoint.outputs.executor_grpc_url }}
      tls_ca_b64: ${{ steps.endpoint.outputs.tls_ca_b64 }}
      started_at_epoch: ${{ steps.capture-start.outputs.started_at_epoch }}
    steps:
      - name: Capture start time
        id: capture-start
        shell: bash
        run: echo "started_at_epoch=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      # The scripts below must still refuse what the contract test feeds
      # them before they touch GCP.
      - name: Check the self-hosted BuildBuddy contract
        shell: bash
        run: scripts/test-gcp-buildbuddy-hardening.sh

      - name: Require the self-hosted control-plane API key
        shell: bash
        run: |
          if [[ -z "${BUILDBUDDY_API_KEY}" ]]; then
            echo "::error::Secret MEERKAT_GCP_BUILDBUDDY_API_KEY (an org API key of the self-hosted control plane) is required."
            exit 1
          fi

      - name: Authenticate to GCP with Workload Identity
        if: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.MEERKAT_GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.MEERKAT_GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate to GCP with JSON fallback
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .; then
            exit 0
          fi
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" ]]; then
            echo "GCP auth is required for GCP BuildBuddy CI." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/gcp-key.json"
          printf '%s' "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" > "${key_file}"
          gcloud auth activate-service-account --key-file "${key_file}"
          rm -f "${key_file}"

      # Refuses (changing nothing) on any open, disabled, drifted or legacy
      # firewall rule, a VM or data disk not made from this rendering, or an
      # image not pinned by digest.
      - name: Ensure self-hosted BuildBuddy control plane
        shell: bash
        run: scripts/gcp-buildbuddy-control-plane ensure

      # The VM reports the sha256 of the config it installed this boot; it
      # must equal this checkout's rendering.
      - name: Verify the installed control-plane config
        shell: bash
        run: scripts/gcp-buildbuddy-control-plane verify --wait 480

      - name: Resolve self-hosted BuildBuddy endpoint
        id: endpoint
        shell: bash
        run: scripts/gcp-buildbuddy-control-plane endpoint github-output

  executors-up:
    name: Executors up
    needs: [control-plane-up]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.executor_grpc_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.executor_grpc_url }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Authenticate to GCP with Workload Identity
        if: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.MEERKAT_GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.MEERKAT_GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate to GCP with JSON fallback
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .; then
            exit 0
          fi
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" ]]; then
            echo "GCP auth is required for GCP BuildBuddy CI." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/gcp-key.json"
          printf '%s' "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" > "${key_file}"
          gcloud auth activate-service-account --key-file "${key_file}"
          rm -f "${key_file}"

      - name: Sync BuildBuddy executor secrets
        shell: bash
        run: scripts/gcp-buildbuddy-executor-pool sync-secrets

      - name: Scale up BuildBuddy executors
        shell: bash
        run: scripts/gcp-buildbuddy-executor-pool up

  prebuild-submit:
    name: Prebuild submitter
    needs: [control-plane-up, executors-up]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    # Cold `//...` (3,447 actions) needs ~12-13 min of Bazel time plus setup;
    # a 12-minute timeout cancelled it at 97% on 2026-09-22.
    timeout-minutes: 25
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-prebuild
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          lanes: |
            ci-prebuild

  static-submit:
    name: Static submitter
    needs: [control-plane-up, executors-up]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-static
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          lanes: |
            fmt-static

  native-submit:
    name: Native submitter
    needs: [control-plane-up, executors-up, prebuild-submit]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-rust-ci

      - name: Verify schema freshness
        run: make verify-schema-freshness

      - name: Verify SDK codegen freshness
        run: make verify-sdk-codegen-freshness

      - name: Verify RPC surface alignment
        run: make verify-rpc-surface-alignment

      # The Bazel-native all-features clippy lane reads the warm `//...`
      # prebuild cache, so it waits for the prebuild. The Cargo-equivalent
      # test lanes read nothing from it and run in native-cargo-submit.
      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          batch_jobs: "1"
          lanes: |
            cargo-all-features-clippy

  native-cargo-submit:
    name: Native Cargo-equivalent submitter
    # The unit and integration-fast lanes each run cold nested Cargo on one
    # heavy executor (//tools/buildbuddy:*_cargo_equivalent_test) and read
    # nothing the `//...` prebuild produces, so they start with the
    # executors, in parallel with the prebuild and with each other. Queued
    # behind the prebuild and a second submitter slot, integration-fast
    # started ~28 min into the 50-min SLO and still ran at the deadline on
    # the v0.8.43 and v0.8.44 tag runs (it needs ~22-25 min cold).
    needs: [control-plane-up, executors-up]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    # Above the SLO left when it starts, so the SLO watchdog, not a GitHub
    # timeout, stops an overrunning batch.
    timeout-minutes: 60
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-native-cargo
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          batch_jobs: "2"
          lanes: |
            test-unit
            integration-fast

  governance-submit:
    name: Governance submitter
    needs: [control-plane-up, executors-up]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Detect machine-authority changes
        id: machine-changes
        shell: bash
        env:
          MACHINE_AUTHORITY_BASE_SHA: ${{ inputs.machine_authority_base_sha || '' }}
          MACHINE_AUTHORITY_HEAD_SHA: ${{ inputs.machine_authority_head_sha || github.sha }}
        run: |
          changed=true
          if [[ -z "${MACHINE_AUTHORITY_BASE_SHA}" && "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if git fetch --no-tags --depth=1 origin main; then
              MACHINE_AUTHORITY_BASE_SHA="$(git rev-parse FETCH_HEAD)"
              echo "Using origin/main (${MACHINE_AUTHORITY_BASE_SHA}) as the workflow_dispatch diff base."
            else
              echo "Could not fetch origin/main; running machine authority conservatively."
            fi
          fi

          if [[ -n "${MACHINE_AUTHORITY_BASE_SHA}" && "${MACHINE_AUTHORITY_BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            if ! git cat-file -e "${MACHINE_AUTHORITY_BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${MACHINE_AUTHORITY_BASE_SHA}" || true
            fi
            set +e
            scripts/machine-authority-changed --base "${MACHINE_AUTHORITY_BASE_SHA}" --head "${MACHINE_AUTHORITY_HEAD_SHA}"
            status="$?"
            set -e
            case "${status}" in
              0) changed=true ;;
              1) changed=false ;;
              *)
                echo "Machine-authority diff failed; running conservative check."
                changed=true
                ;;
            esac
          else
            echo "No reliable diff base; running machine authority."
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        if: ${{ steps.machine-changes.outputs.changed == 'true' }}
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-governance
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          batch_jobs: "3"
          lanes: |
            seam-inventory
            rmat-audit
            machine-authority

  wasm-feature-changes:
    name: WASM, SDK, and feature change detection
    needs: [control-plane-up]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.edge-changes.outputs.changed }}
      wasm_changed: ${{ steps.edge-changes.outputs.wasm_changed }}
      sdk_changed: ${{ steps.edge-changes.outputs.sdk_changed }}
      minimal_changed: ${{ steps.edge-changes.outputs.minimal_changed }}
      feature_changed: ${{ steps.edge-changes.outputs.feature_changed }}
      audit_changed: ${{ steps.edge-changes.outputs.audit_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Detect WASM, SDK, feature, or audit changes
        id: edge-changes
        shell: bash
        env:
          BASE_SHA: ${{ inputs.machine_authority_base_sha || '' }}
          HEAD_SHA: ${{ inputs.machine_authority_head_sha || github.sha }}
        run: scripts/buildbuddy-edge-changes "${BASE_SHA}" "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  wasm-sdk-submit:
    name: SDK suites submitter
    needs: [control-plane-up, executors-up, wasm-feature-changes]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' && needs.wasm-feature-changes.outputs.sdk_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
      MEERKAT_GCP_BUILDBUDDY_CI_MAX_SECONDS: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-sdk-suites
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          lanes: |
            sdk-suites

  wasm-check-submit:
    name: WASM check submitter
    needs: [control-plane-up, executors-up, wasm-feature-changes]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' && needs.wasm-feature-changes.outputs.wasm_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-wasm-check
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          lanes: |
            wasm-check

  minimal-feature-submit:
    name: Minimal feature submitter
    needs: [control-plane-up, executors-up, wasm-feature-changes]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' && needs.wasm-feature-changes.outputs.minimal_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-minimal-feature
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          lanes: |
            test-minimal

  feature-submit:
    name: Feature matrix submitter
    needs: [control-plane-up, executors-up, wasm-feature-changes]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' && needs.wasm-feature-changes.outputs.feature_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-feature-matrix
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          # Both lanes in parallel, as Governance runs its three: back to back
          # they did not fit the 20-minute job even on a warm cache (0.8.51
          # pre-tag graph 37247648542: test-feature-matrix-lib alone took
          # 1172 s, so surface-checks started at the timeout).
          batch_jobs: "2"
          lanes: |
            test-feature-matrix-lib
            test-feature-matrix-surface-checks

  audit-submit:
    name: Security audit submitter
    needs: [control-plane-up, executors-up, wasm-feature-changes]
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' && needs.wasm-feature-changes.outputs.audit_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILDBUDDY_GRPC_URL: ${{ needs.control-plane-up.outputs.grpc_url }}
      BUILDBUDDY_HTTP_URL: ${{ needs.control-plane-up.outputs.http_url }}
      BUILDBUDDY_ENDPOINT: ${{ needs.control-plane-up.outputs.grpc_url }}
      CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
      BUILDBUDDY_TLS_CA_B64: ${{ needs.control-plane-up.outputs.tls_ca_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/run-buildbuddy-ci-lane-batch
        with:
          repository-cache: ${{ inputs.repository_cache }}
          group: gcp-security-audit
          profile: submitter
          mode: ${{ inputs.mode || 'full-fresh' }}
          lanes: |
            audit

  executors-down:
    name: Executors down
    if: ${{ always() && vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    needs:
      - executors-up
      - prebuild-submit
      - static-submit
      - native-submit
      - native-cargo-submit
      - governance-submit
      - wasm-feature-changes
      - wasm-sdk-submit
      - wasm-check-submit
      - minimal-feature-submit
      - feature-submit
      - audit-submit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Authenticate to GCP with Workload Identity
        if: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.MEERKAT_GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.MEERKAT_GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate to GCP with JSON fallback
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .; then
            exit 0
          fi
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" ]]; then
            echo "GCP auth is required to scale down GCP BuildBuddy executors." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/gcp-key.json"
          printf '%s' "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" > "${key_file}"
          gcloud auth activate-service-account --key-file "${key_file}"
          rm -f "${key_file}"

      - name: Scale down BuildBuddy executors
        shell: bash
        env:
          MEERKAT_GCP_BUILDBUDDY_WAIT_ON_DOWN: ${{ vars.MEERKAT_GCP_BUILDBUDDY_WAIT_ON_DOWN || '0' }}
          MEERKAT_GCP_BUILDBUDDY_WAIT_TIMEOUT: ${{ vars.MEERKAT_GCP_BUILDBUDDY_WAIT_TIMEOUT || '900' }}
        run: scripts/gcp-buildbuddy-executor-pool down

  # The control plane runs only while a run uses it; the data disk keeps the
  # cache. Stopped last, after the executors are parked.
  control-plane-down:
    name: Control plane down
    if: ${{ always() && vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    needs: [control-plane-up, executors-down]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Authenticate to GCP with Workload Identity
        if: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.MEERKAT_GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.MEERKAT_GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate to GCP with JSON fallback
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .; then
            exit 0
          fi
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" ]]; then
            echo "GCP auth is required for GCP BuildBuddy CI." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/gcp-key.json"
          printf '%s' "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" > "${key_file}"
          gcloud auth activate-service-account --key-file "${key_file}"
          rm -f "${key_file}"

      - name: Stop the control plane
        shell: bash
        env:
          MEERKAT_GCP_BUILDBUDDY_WAIT_ON_DOWN: ${{ vars.MEERKAT_GCP_BUILDBUDDY_WAIT_ON_DOWN || '0' }}
        run: scripts/gcp-buildbuddy-control-plane stop

  gate:
    name: GCP BuildBuddy gate
    if: ${{ always() }}
    needs:
      - control-plane-up
      - executors-up
      - prebuild-submit
      - static-submit
      - native-submit
      - native-cargo-submit
      - governance-submit
      - wasm-feature-changes
      - wasm-sdk-submit
      - wasm-check-submit
      - minimal-feature-submit
      - feature-submit
      - audit-submit
      - executors-down
      - control-plane-down
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the self-hosted graph to be enabled
        if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED != 'true' }}
        run: |
          echo "::error::BuildBuddy graph is disabled (repository variable MEERKAT_GCP_BUILDBUDDY_ENABLED is not 'true'): nothing was started and nothing was validated. Release tags validate on their exact-tree CI attestation while it is off."
          exit 1
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "GCP BuildBuddy CI failed"
            exit 1
          fi
      - name: Check GCP CI duration SLO
        shell: bash
        env:
          CI_STARTED_AT_EPOCH: ${{ needs.control-plane-up.outputs.started_at_epoch }}
          MAX_SECONDS: "3000"
        run: |
          if ! [[ "${CI_STARTED_AT_EPOCH}" =~ ^[0-9]+$ ]]; then
            echo "::error::Missing or invalid GCP BuildBuddy CI start timestamp: '${CI_STARTED_AT_EPOCH}'"
            exit 1
          fi
          if ! [[ "${MAX_SECONDS}" =~ ^[0-9]+$ ]] || [[ "${MAX_SECONDS}" == "0" ]]; then
            echo "::error::Invalid MEERKAT_GCP_BUILDBUDDY_CI_MAX_SECONDS: '${MAX_SECONDS}'"
            exit 1
          fi
          elapsed="$(($(date +%s) - CI_STARTED_AT_EPOCH))"
          echo "GCP BuildBuddy CI elapsed seconds: ${elapsed}/${MAX_SECONDS}"
          if ((elapsed > MAX_SECONDS)); then
            echo "::error::GCP BuildBuddy CI exceeded ${MAX_SECONDS}s SLO (${elapsed}s)."
            exit 1
          fi
