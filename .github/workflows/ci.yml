      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Download nextest archive
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nextest-${{ matrix.archive }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nextest-archive

      - name: Unit tests (archived lane partition)
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          PARTITION: ${{ matrix.partition }}
          # Set only on rows whose tests need a deeper test-thread stack than
          # the 8 MiB .cargo/config.toml default (see FEATURE_UNIT_SUITES).
          MIN_STACK: ${{ matrix.rust_min_stack }}
        run: |
          set -euo pipefail
          [[ -n "${ARCHIVE}" && -n "${PARTITION}" ]] || { echo "::error::empty archived unit partition"; exit 1; }
          # The archive's binaries run against this checkout; .cargo/config.toml
          # does not apply outside cargo builds, so its test-thread stack is
          # exported here, and an explicit row stack overrides it.
          export RUST_MIN_STACK="${MIN_STACK:-8388608}"
          cargo-nextest nextest run --archive-file "${RUNNER_TEMP}/nextest-archive/nextest-${ARCHIVE}.tar.zst" \
            --workspace-remap "${GITHUB_WORKSPACE}" --partition "${PARTITION}" --profile ci-pr \
            --no-tests=pass --no-fail-fast --status-level fail --final-status-level fail

  closure-check:
    name: Closure check (${{ needs.changes.outputs.closure_count }} crates)
    needs: [changes, stagger]
    # Push only: a pull request's Clippy lanes compile its changed packages
    # under every feature (a whole-workspace plan lints every package, a
    # superset of this check), and the dependents compile here on the push.
    if: ${{ needs.changes.outputs.closure_check == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Check the reverse-dependency closure
        shell: bash
        env:
          CLOSURE: ${{ needs.changes.outputs.closure_flags }}
        run: |
          set -euo pipefail
          [[ -n "${CLOSURE}" ]] || { echo "::error::empty closure in the closure-check lane"; exit 1; }
          targets=()
          if [[ "${CLOSURE_CHECK_TARGETS}" == "all" ]]; then
            targets+=(--all-targets)
          fi
          # shellcheck disable=SC2086
          ./scripts/repo-cargo check ${CLOSURE} "${targets[@]}" --all-features

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-closure-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  rustdoc:
    name: Rustdoc (whole workspace, ${{ matrix.features }} features)
    needs: changes
    # Push only, like the closure check: every crate documented with
    # rustdoc's lints denied, in two parallel legs, default features and
    # --all-features (feature-gated docs included). A broken, private or
    # redundant intra-doc link, a bare URL or an unclosed HTML tag fails it.
    # It documents the whole workspace, where Cargo unifies features across
    # members, so an error that only a crate documented alone shows
    # (`cargo doc -p <crate>`, the way docs.rs builds a published crate) is
    # outside it. A pull request names it in deferred_to_push: it documents
    # meerkat-mob and every crate built on it, which does not fit the
    # pull-request budget.
    if: ${{ needs.changes.outputs.rustdoc == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        features: [default, all]
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      # --keep-going reports every crate that fails, not only the first.
      - name: Document the workspace with rustdoc's lints denied (${{ matrix.features }} features)
        env:
          RUSTDOCFLAGS: -Dwarnings
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          case "${FEATURES}" in
            default) ./scripts/repo-cargo doc --workspace --no-deps --keep-going ;;
            all) ./scripts/repo-cargo doc --workspace --no-deps --keep-going --all-features ;;
            *) echo "::error::unexpected rustdoc features '${FEATURES}'"; exit 1 ;;
          esac

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-rustdoc-${{ matrix.features }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  feature-check:
    name: Feature combinations (${{ matrix.name }})
    needs: changes
    # Compile-only checks of the changed packages under the feature sets the
    # Cargo lanes never build, which the Bazel graph (nightly and the release
    # tag only) and the nightly feature matrix do (#1687):
    #   - the Bazel test feature set from each package's generated BUILD.bazel
    #     (`check --lib --bins --tests`; #1595 broke meerkat-mob-mcp's lib
    #     tests under `openai-live` alone);
    #   - its other Bazel library/binary sets (production variants without
    #     `test-support`, surface variants);
    #   - the `$(CARGO) check` rows of `make test-minimal` and
    #     `make test-feature-matrix-lib` (#1558 broke `meerkat-mob
    #     --no-default-features`).
    # Two jobs per clippy shard, over that shard's packages: the Bazel test-set
    # check, and the other rows (one job reached 1568 s cold on #1763).
    # Push only: a pull request plans no rows (on run 38859112297 the 16 jobs
    # of a whole-workspace plan took 119-1303 s).
    if: ${{ needs.changes.outputs.rust_changed == 'true' && needs.changes.outputs.feature_check_first_count != '0' }}
    runs-on: ubuntu-24.04
    # A row whose objects are not in sccache yet runs long: the rkat+6 matrix
    # row (402-1054 s warm) hit a 30-minute timeout on main push run
    # 39186529346 and on release-branch dispatches. Cold after a change to
    # meerkat-core it took 41m23s on dispatch 39211283488, and on main push
    # 39213218053 its eight commands took 44m29s, so the 45-minute cap
    # cancelled it after the last one finished. 60 minutes is about a third
    # above that.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.feature_check_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          # Registry index and crate sources only; compiled objects come from
          # sccache (see the closure-check lane).
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Check each feature combination
        shell: bash
        env:
          COMMANDS: ${{ matrix.commands }}
        run: |
          set -euo pipefail
          [[ -n "${COMMANDS}" ]] || { echo "::error::empty feature-combination row"; exit 1; }
          failed=0
          while IFS= read -r args; do
            [[ -n "${args}" ]] || continue
            echo "::group::cargo check ${args}"
            # shellcheck disable=SC2086
            if ! ./scripts/repo-cargo check ${args}; then
              echo "::error::cargo check ${args} failed"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "${COMMANDS}"
          exit "${failed}"

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-feature-check-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  feature-check-rest:
    name: Feature combinations (${{ matrix.name }})
    needs: [changes, stagger]
    # The rest wave of `feature-check` (long rows first, scripts/ci-cargo-lanes.mjs):
