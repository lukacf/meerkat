  release-stack-budget:
    name: Release worker-stack budget (rkat-rpc dispatch path)
    needs: gcp-buildbuddy
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-release-stack
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      # Release codegen colours stack slots, so this measures the property
      # the shipped binaries actually have. It lives on the nightly, not the
      # release path: a release build of meerkat-rpc's tests is minutes of
      # runner time that would land on every tag otherwise.
      - name: RPC router tests on a 1 MiB release stack
        run: make stack-budget-release

  e2e-system:
    name: System e2e lane
    needs: gcp-buildbuddy
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
