[package]
name = "meerkat-llm-core"
description = "LLM wire client trait + streaming plumbing for Meerkat. Provider-neutral."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
meerkat-core = { workspace = true }
meerkat-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
slab = "0.4"
indexmap = "2"
parking_lot = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# Enables `workspace-tests` for this crate's own tests; path-only, so the
# published package does not carry it. It adds nothing else: with default
# features on, every test build would turn them back on, and a
# `--no-default-features` test build would not check the feature set it
# names.
meerkat-llm-core = { path = ".", default-features = false, features = ["workspace-tests"] }
meerkat-models = { path = "../meerkat-models" }
tokio = { workspace = true, features = ["test-util", "macros"] }

[package.metadata.cargo-machete]
ignored = ["getrandom", "slab", "base64", "parking_lot"]

[features]
default = []
experimental-gpt-live = []
# Internal, not for consumers: compiles the unit tests that need the
# workspace (a crate this one cannot depend on once published). Only the
# path-only self dev-dependency enables it, and `cargo package` strips that
# dev-dependency, so the published package compiles those tests out
# (ci/standalone-workspace-only.toml names them).
workspace-tests = []

[lints]
workspace = true
