name: CI

# Pull-request CI: Cargo only, on GitHub-hosted runners, sized to a
# 25-minute push-to-terminal budget. The lanes are selected from the changed
# paths by scripts/ci-cargo-lanes.mjs, which fails closed: any change that can
# alter what Cargo compiles yields at least one clippy lane and one unit lane,
# and the aggregate gate asserts that those lanes ran.
#
# Jobs:
#   changes         - changed-path classification (packages, shards, closure,
#                     conditional-lane flags)
#   fmt-governance  - always: fmt, docs, semver self-test, version parity,
#                     lock consistency, classifier self-tests, and the
#                     ripgrep tombstone scans (legacy surface names,
#                     session-control routes, deprecated backend)
#   ratchets        - generated-contract freshness when contract paths
#                     changed; machine/protocol drift when machine authority
#                     changed
#   clippy (xN)     - one lane per shard of directly changed packages:
#                     clippy --no-deps --all-targets --all-features
#   unit (xN)       - pull request: one lane per shard of the directly
#                     changed packages OUTSIDE the meerkat-mob compile chain:
#                     nextest --lib --bins --profile ci-pr (ci-pr = fast),
#                     plus the feature-gated suites of those packages
#                     (FEATURE_UNIT_SUITES in scripts/ci-cargo-lanes.mjs)
#   integration     - (xN) the tests/*.rs binaries of each integration
#                     suite whose trigger packages or paths changed
#                     (INTEGRATION_SUITES in scripts/ci-cargo-lanes.mjs):
#                     nextest -p <package> --test '*'; pull requests and
#                     main pushes alike
#   closure-check   - cargo check (lib and bin targets) over the
#                     reverse-dependency closure of the changed packages
#   example-web     - sdks/web wasm runtime build plus the example 031, 032
#                     and 033 browser suites; every main push, and pull
#                     requests that touch the runtime, its crates, or those
#                     examples
#   wasm-timers     - shared timer ownership in Chrome and Node, selected
#                     with the web runtime suites
#   gate            - "CI gate": fail-closed aggregate; on pull requests a
#                     1500-second lane execution budget (classification plus
#                     each lane's own run time, runner queue excluded) and a
#                     2700-second push-to-terminal runaway ceiling, also
#                     runner queue excluded; runner queue wait is reported as
#                     a warning (the critical path,
#                     slowest lane and queue are reported on every run that
#                     was not cancelled, failed runs included); schema-4
#                     exact-tree attestation on main
#
# Push to main only (no wall-clock budget):
#   main-unit (xN)  - nextest --lib --bins over the whole workspace in eight
#                     cost-packed shards (this is where the meerkat-mob chain's
#                     unit tests run: mob, mob-adaptive, mob-mcp, mob-pack,
#                     rpc, rest, mcp-server, rkat, web-runtime,
#                     integration-tests, machine-codegen; their lanes
#                     compile mob's 442k lines and cannot fit the budget;
#                     xtask and machine-dsl-tests do not build mob and run
#                     in the pull request),
#                     plus one lane per feature-gated suite: the default
#                     feature lanes cannot reach a test behind a non-default
#                     feature (FEATURE_UNIT_SUITES in ci-cargo-lanes.mjs)
#   main-unit-archive-build / main-unit-archive-run
#                   - ARCHIVED_UNIT_LANES (meerkat-mob and its feature suites):
#                     one job compiles the lib-test binary into a nextest
#                     archive, and partition jobs run it with
#                     --partition hash:k/n, since that crate's compile alone
#                     fills most of a 4-vCPU lane
#   wasm-check      - wasm32 check of meerkat-web-runtime
#   sdk-host        - Python + TypeScript SDK suites
#
# Everything else (integration-fast, e2e-fast, the dense Mob topology
# stress, bounded TLC, feature matrices, minimal builds, audit, the Web SDK
# and browser contract suites, and the whole Bazel graph) runs in nightly.yml
# and in the release workflow; PR CI never starts the remote Bazel fleet.

on:
  # Pushes run on main (the attestation boundary) and on release
  # integration branches. Pull requests into a release branch unit-test only
  # the crates they change, so a merge there must run the push-only lanes
  # (main-unit over the whole workspace, wasm-check, sdk-host) or
  # reverse-dependency suites first run at the final merge to main: #1541
  # broke two facade tests that no release-branch run executed. A merge
  # commit is never a PR head, so no head runs twice; every other branch
  # still gets CI only through its pull request. Attestation stays
  # main-only (its steps check refs/heads/main).
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch: {}

# Pull requests: one group per PR, a newer push cancels the older run.
#
# Pushes to main: a newer main commit supersedes the still-running run of an
# older one (group main-<ref>-superseded, cancelled). The account runs at most
# 40 hosted jobs at once, a main run starts 35-50 of them, and merges arrive
# about every 13-32 minutes against a 20-34 minute main run, so completing
# every main run starved pull-request CI of runners: in the 02:27-03:50 UTC
# merge burst of 2026-10-01, 806 of the 1760 main-run job-minutes (46%) ran
# after a newer main commit had already been pushed. The newest main commit
# is still fully tested, and its run covers every superseded commit's change.
#
# Never superseded, one group per commit (main-<ref>-<sha>):
#   - a release commit ("chore: release v..." in the head commit message),
#     because the release workflow's require_ci_green needs a successful
#     exact-main run on exactly that commit;
#   - every re-run attempt (run_attempt > 1). A superseded commit that turns
#     out to be needed (a tag on it, or bisecting a red main) gets its
#     attestation with `gh run rerun <id>`, and that attempt runs to the end;
#   - workflow_dispatch runs;
#   - every push to a release/** integration branch. Each merge there needs
#     its own verdict: with superseding, a busy merge train cancelled every
#     run after 21d00220a (#1575) and about 15 merges went without full CI,
#     hiding the public_broker_* failure #1556 introduced.
# A cancelled run never reaches the CI gate (it runs under !cancelled()), so
# it leaves no exact-tree attestation; require_ci_green only accepts a run
# that completed with success. A per-ref group with cancellation for every
# main push once cancelled 35918370610 and 35920687943 before their gates;
# the exemptions above are what makes cancellation safe for releases.
concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      (github.event_name == 'push' && github.run_attempt == 1 && !contains(github.event.head_commit.message, 'chore: release v') && !startsWith(github.ref, 'refs/heads/release/')) && format('main-{0}-superseded', github.ref_name) ||
      format('main-{0}-{1}', github.ref_name, github.sha)
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.run_attempt == 1 && !contains(github.event.head_commit.message, 'chore: release v') && !startsWith(github.ref, 'refs/heads/release/'))
    }}

permissions:
  actions: read
  contents: read
  # Workload identity for the GCS object cache; forks do not get it and
  # run with a local disk cache only.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Stable per-VM Cargo home: hosted runners are fresh per job, and cache
  # reuse (rust-cache + sccache) requires registry source paths that do not
  # change between runs.
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.94.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The server's own log; every compile lane uploads it, because with the
  # IO-error fallback a dead server means silent cold compiles (the
  # mob unit lane of run 35864652602 compiled 15 minutes with 0 requests).
  # Literal runner temp path: the `runner` context is not available in
  # workflow-level env, and upload-artifact rejects paths containing `..`.
  SCCACHE_ERROR_LOG: /home/runner/work/_temp/sccache.log
  SCCACHE_LOG: info
  # Never exit on idle: the mob lib-test link runs for minutes with no rustc
  # request, the default 600 s idle exit took the server down mid-lane, and
  # the post-step then reported a fresh server's zero statistics.
  SCCACHE_IDLE_TIMEOUT: "0"
  # One stable repo-cargo lane key on every runner, so the generated
  # toolchain wrapper path is identical across runs and lanes.
  RUST_LANE_ID: ci
  # Compiled objects live in the GCS bucket named by the repository variable
  # MEERKAT_SCCACHE_GCS_BUCKET (default: the project bucket below), selected
  # per job by .github/actions/setup-sccache-ci; with the GCP identity
  # unavailable (fork pull requests) a lane runs with a local disk cache
  # only. The GitHub Actions cache is 10 GB per repository and one
  # workspace-mode run exceeds it, so writes failed at the quota and every run
  # stayed cold; it now keeps only the cargo registry. Debuginfo is off
  # (above) so the objects stay small.
  SCCACHE_GCS_BUCKET_NAME: ${{ vars.MEERKAT_SCCACHE_GCS_BUCKET || 'meerkat-sccache-king-dnn-training-dev' }}
  # Pull-request wall-clock budget, split by who controls the time. It exists
  # to catch runaway CI (a lane that grows, aggregate drift), not to police a
  # single lane; every lane's own timeout-minutes does that.
  #
  # CI_MAX_EXEC_SECONDS bounds the execution path: for each lane, the change
  # classification's run time plus the lane's own run time (started_at to
  # completed_at), and the slowest such path. That is the time the code
  # controls. Runner queue wait (created_at to started_at) is not in it: the
  # account runs at most 40 hosted jobs at once, shared by every pull
  # request, main push and nightly, and a busy hour fills that cap.
  # CI_MAX_TERMINAL_SECONDS is the runaway backstop on the latest lane
  # terminal minus the runner queue on that lane's path (its own queue plus
  # the classification's, in the same attempt): a CI whose jobs are stuck
  # still fails, but one that only waited for runners does not. Queue is
  # reported, never budgeted (#1526 run 37062437146 failed this ceiling at
  # 3167 s with every lane green and 2817 s of runner queue).
  # Queue wait on the critical path at or above CI_QUEUE_WARN_SECONDS is a
  # warning with a typed verdict (queue_delayed), never a failure.
  #
  # Sizing (66 pull-request run attempts, 2026-09-30 to 2026-10-01):
  #   execution path      p50 816 s, p90 968 s, max 1244 s
  #   critical-path queue p50  39 s, p90 474 s, max 742 s
  #   terminal            p50 897 s, p90 1173 s, max 1492 s
  # The execution tail is the example-web lane's cold wasm release build
  # (up to 1002 s of a 1172 s lane). The concurrent hosted jobs sat at 34-40
  # for most of 02:00-04:30 UTC on 2026-10-01. Run 36809608388 failed the
  # previous 1500 s push-to-terminal budget at 1511 s with every lane passing
  # and an execution path of 1009 s: its closure check waited 647 s for a
  # runner. 1500 s of execution is about 20% above the observed maximum and
  # below the 40-minute lane timeouts, which only stop a hung lane. 2700 s of
  # terminal is the 40-minute lane timeout plus classification and queue
  # headroom: past it a run is stuck, whatever the cause.
  CI_MAX_EXEC_SECONDS: "1500"
  CI_MAX_TERMINAL_SECONDS: "2700"
  CI_QUEUE_WARN_SECONDS: "300"
  # Target set for the closure-check lane: "lib" checks lib and bin targets
  # of the closure; "all" adds every test target (--all-targets), which
  # measured 16 min after a meerkat-mob change and does not fit the budget.
  CLOSURE_CHECK_TARGETS: lib

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust_changed: ${{ steps.plan.outputs.rust_changed }}
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      generated_contract: ${{ steps.plan.outputs.generated_contract }}
      machine_authority: ${{ steps.plan.outputs.machine_authority }}
      machine_posters: ${{ steps.plan.outputs.machine_posters }}
      wasm: ${{ steps.plan.outputs.wasm }}
      sdk_host: ${{ steps.plan.outputs.sdk_host }}
      bazel_graph: ${{ steps.plan.outputs.bazel_graph }}
      examples_browser: ${{ steps.plan.outputs.examples_browser }}
      example_web: ${{ steps.plan.outputs.example_web }}
      package_count: ${{ steps.plan.outputs.package_count }}
      closure_count: ${{ steps.plan.outputs.closure_count }}
      closure_flags: ${{ steps.plan.outputs.closure_flags }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
      unit_shard_count: ${{ steps.plan.outputs.unit_shard_count }}
      unit_shard_matrix: ${{ steps.plan.outputs.unit_shard_matrix }}
      unit_deferred: ${{ steps.plan.outputs.unit_deferred }}
      unit_deferred_count: ${{ steps.plan.outputs.unit_deferred_count }}
      main_unit_shard_count: ${{ steps.plan.outputs.main_unit_shard_count }}
      main_unit_shard_matrix: ${{ steps.plan.outputs.main_unit_shard_matrix }}
      main_archive_build_count: ${{ steps.plan.outputs.main_archive_build_count }}
      main_archive_build_matrix: ${{ steps.plan.outputs.main_archive_build_matrix }}
      main_archive_run_count: ${{ steps.plan.outputs.main_archive_run_count }}
      main_archive_run_matrix: ${{ steps.plan.outputs.main_archive_run_matrix }}
      integration_count: ${{ steps.plan.outputs.integration_count }}
      integration_matrix: ${{ steps.plan.outputs.integration_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Classify changed paths
        id: plan
        shell: bash
        env:
          BASE_SHA: >-
            ${{
              github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
              github.event_name == 'push' && github.event.before ||
              ''
            }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A pull_request checkout is refs/pull/N/merge; classify against its
          # base-branch parent, not the payload base read when the run was
          # queued (main may have moved in between). Fails closed if the
          # checkout is not the expected merge commit.
          classification_base="$(scripts/ci-pr-classification-base "${EVENT_NAME}" "${BASE_SHA}")"
          # The classifier exits non-zero rather than emit an empty plan for a
          # build-relevant change; a failure here fails the CI gate.
          node scripts/ci-cargo-lanes.mjs --format github --base "${classification_base}" --head HEAD \
            | tee "${RUNNER_TEMP}/ci-cargo-lanes.txt" >> "${GITHUB_OUTPUT}"
          grep -vE '^(closure_flags|shard_matrix|unit_shard_matrix|main_unit_shard_matrix|main_archive_build_matrix|main_archive_run_matrix|integration_matrix)=' "${RUNNER_TEMP}/ci-cargo-lanes.txt"

  fmt-governance:
    name: Format + governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
    steps:
      # Depth 2, not 1: a depth-1 clone grafts HEAD to have no parents, which
      # hides the merge topology the lock-consistency gate reports on.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Format check
        run: make fmt-check

      - name: Docs validation
        run: make docs-check

      # The release-time semver-breaks gate needs cargo-semver-checks; its
      # analyser does not. Run the analyser's unit tests on every PR so parser
      # drift is caught here rather than at the tag.
      - name: Semver-breaks analyser self-test
        run: make semver-breaks-selftest

      - name: Verify version parity
        run: make verify-version-parity

      # The pull_request checkout is refs/pull/N/merge, and that merge preview
      # is the only place a merge-manufactured dangling lock reference exists.
      - name: Cargo.lock resolves under --locked
        run: make verify-lock-consistency

      - name: MODULE.bazel.lock recorded inputs
        run: make verify-bazel-module-lock-inputs

      - name: Verify Rust release configuration
        run: make check-rust-release-config

      - name: CI lane classifier fails closed
        run: make ci-lanes-selftest

      # The shell path classifiers (scripts/machine-authority-changed, the
      # remote-graph edge classifier and scripts/cargo-agent-gate) silently
      # stopped matching after the crates/ layout move because nothing ran
      # their pinning tests.
      - name: Path classifiers route gate inputs
        run: make path-classifier-selftest

      - name: Release doctor workflow assertions still bind
        run: scripts/test-release-doctor-workflow-contract.sh

      # The tombstone scans (retired public names, session-control routes,
      # the deprecated backend) are ripgrep text scans. The hosted image
      # does not ship ripgrep, and each scan refuses to run without it
      # rather than report a false green, so install it and prove it is on
      # PATH before the scans run. These used to run only in make ci and the
      # uncalled cargo.yml, which let a retired route reach a release branch.
      - name: Install ripgrep for the tombstone scans
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          rg --version

      - name: Legacy public surface names stay retired
        run: make legacy-surface-gate

      - name: Retired session-control routes stay retired
        run: make session-control-gate

      - name: Turbo S scenarios carry no soft checks
        run: make turbo-s-oracle-gate

      - name: Deprecated backend stays unreferenced
        run: make deprecated-backend-gate

  ratchets:
    name: Generation ratchets
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Report selected ratchets
        shell: bash
        env:
          GENERATED_CONTRACT: ${{ needs.changes.outputs.generated_contract }}
          MACHINE_AUTHORITY: ${{ needs.changes.outputs.machine_authority }}
          MACHINE_POSTERS: ${{ needs.changes.outputs.machine_posters }}
        run: |
          echo "generated contract paths changed: ${GENERATED_CONTRACT}"
          echo "machine authority paths changed: ${MACHINE_AUTHORITY}"
          echo "machine poster inputs changed: ${MACHINE_POSTERS}"

      - name: Verify schema freshness
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-schema-freshness
        env:
          MEERKAT_SCHEMA_DIAGNOSTIC_DIR: ${{ github.workspace }}/schema-freshness-output

      - name: Upload fresh schemas after freshness failure
        if: ${{ failure() && needs.changes.outputs.generated_contract == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fresh-contract-schemas
          path: schema-freshness-output
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify SDK codegen freshness
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-sdk-codegen-freshness

      - name: Verify SDK event inventory
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-sdk-event-inventory

      - name: Verify RPC surface alignment
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-rpc-surface-alignment

      - name: Verify REST surface alignment
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-rest-surface-alignment

      - name: Verify SDK wrapper freshness
        if: ${{ needs.changes.outputs.generated_contract == 'true' }}
        run: make verify-sdk-wrapper-freshness

      - name: Verify generated machine kernels are not stale
        if: ${{ needs.changes.outputs.machine_authority == 'true' }}
        id: machine_drift
        shell: bash
        run: |
          if make machine-check-drift; then
            exit 0
          fi
          # Preserve the exact generated side of the failed comparison so the
          # drift can be repaired without a second local Rust build.
          make machine-codegen
          exit 1

      - name: Upload fresh machine artifacts after drift failure
        if: ${{ failure() && steps.machine_drift.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: fresh-machine-artifacts
          path: |
            specs/machines
            specs/compositions
            crates/meerkat-machine-kernels/src/generated
          if-no-files-found: error
          retention-days: 1

      - name: Verify generated protocol artifacts are not stale
        if: ${{ needs.changes.outputs.machine_authority == 'true' }}
        id: protocol_drift
        shell: bash
        run: |
          if make protocol-check-drift; then
            exit 0
          fi
          make protocol-codegen
          exit 1

      - name: Upload fresh protocol artifacts after drift failure
        if: ${{ failure() && steps.protocol_drift.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: fresh-protocol-artifacts
          path: |
            crates/meerkat-core/src/generated
            crates/meerkat-session/src/generated
            crates/meerkat-mob/src/generated
            crates/meerkat-mcp/src/generated
            crates/meerkat-runtime/src/generated
            crates/meerkat-workgraph/src/generated
          if-no-files-found: error
          retention-days: 1

      # The posters render the canonical machine catalog, TLA specs and
      # contracts. The gate used to run only in cargo.yml, which nothing calls,
      # so the script's paths and the rendered HTML drifted unnoticed. It
      # runs when machine authority changes (what the posters render) or when
      # a poster input changes (scripts/machine-posters-changed, kept apart
      # from the machine-authority classifier so a poster-only change never
      # starts the machine lanes). `make verify-machine-poster-coverage` is
      # the same command locally.
      - name: Verify machine poster coverage and freshness
        if: ${{ needs.changes.outputs.machine_authority == 'true' || needs.changes.outputs.machine_posters == 'true' }}
        run: make verify-machine-poster-coverage

  # Bounded TLC on machine-authority changes. The hand-written audits model
  # check the generated machines against their invariants and goals (drift
  # in `ratchets` only proves the artifacts match the DSL). Each shard of
  # the canonical TLC lane needs only a JDK and the TLC jar
  # (setup-tlc-ci; the audit parts never run xtask), runs in parallel, and
  # fits the PR budget.
  # The `machine-verify --all` sweep stays on nightly, the release gate and
  # the release-tag graph.
  tlc-audits:
    name: Bounded TLC audits (${{ matrix.part }})
    needs: changes
    if: ${{ needs.changes.outputs.machine_authority == 'true' }}
    runs-on: ubuntu-24.04
    # Past ~24 minutes a shard fails the PR execution budget anyway; 20 leaves
    # headroom over the expected 5-8 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [audits-a, audits-b]
    env:
      # A 4-vCPU runner: four TLC workers, and a heap that leaves room for
      # the runner.
      TLC_WORKERS: "4"
      JAVA_TOOL_OPTIONS: -Xmx8g
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup TLC
        uses: ./.github/actions/setup-tlc-ci

      - name: Run the audit shard
        shell: bash
        run: |
          set -euo pipefail
          # The audit parts never execute xtask, so they take no xtask
          # argument; the lane rejects an unknown part.
          bash crates/xtask/tests/machine_verify_all_tlc_test.sh --part "${{ matrix.part }}"

  clippy:
    name: Clippy (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.rust_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.shard_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Clippy (changed packages, all targets, all features)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in a clippy lane"; exit 1; }
          # shellcheck disable=SC2086
          ./scripts/repo-cargo clippy ${PACKAGES} --no-deps --all-targets --all-features -- -D warnings

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sccache-log-clippy-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  unit:
    name: Unit tests (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.rust_changed == 'true' && needs.changes.outputs.unit_shard_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_shard_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Unit tests (changed packages, lib and bin targets)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          # Set only on feature-suite rows whose tests need a deeper test-thread
          # stack than the 8 MiB .cargo/config.toml default (see FEATURE_UNIT_SUITES).
          MIN_STACK: ${{ matrix.rust_min_stack }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in a unit lane"; exit 1; }
          # An empty RUST_MIN_STACK would drop tests to Rust's 2 MiB default, so it
          # is exported only when the row sets one.
          if [[ -n "${MIN_STACK}" ]]; then export RUST_MIN_STACK="${MIN_STACK}"; fi
          # Tests of crates that dev-depend on mcp-test-server spawn this exact
          # fixture and fail without it (mcp_test_server::fixture_binary).
          # shellcheck disable=SC2086
          fixture="$(scripts/mcp-test-server-fixture --if-needed ${PACKAGES})"
          if [[ -n "${fixture}" ]]; then
            export MEERKAT_MCP_TEST_SERVER="${fixture}"
            echo "mcp-test-server fixture: ${MEERKAT_MCP_TEST_SERVER}"
          fi
          # shellcheck disable=SC2086
          ./scripts/repo-cargo nextest run ${PACKAGES} --lib --bins --profile ci-pr \
            --no-tests=pass --no-fail-fast --status-level fail --final-status-level fail

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sccache-log-unit-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  integration:
    name: Integration tests (${{ matrix.name }})
    needs: changes
    # A crate's tests/*.rs binaries run in no unit lane (those run --lib
    # --bins). Each row is an integration suite whose trigger packages
    # changed (INTEGRATION_SUITES in scripts/ci-cargo-lanes.mjs); measured on
    # 4 cores after a meerkat-runtime change: runtime 168 s, machine-codegen
    # 396 s, so about 6 and 13 minutes on a hosted runner, well inside the
    # lane execution budget; xtask (with machine-authority, 163 tests,
    # selected also by workflow edits) 169 s.
    # Selected by the suite count alone: a suite can be selected by changed
    # paths in a plan with no Rust change (xtask's workflow pins).
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.integration_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.integration_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Registry only; compiled objects come from sccache (see the unit lanes).
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Integration tests (tests/*.rs binaries of the suite package, or its named targets)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          # A suite may name its test targets; otherwise every tests/*.rs one.
          TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in an integration lane"; exit 1; }
          if [[ -n "${TESTS}" ]]; then
            read -r -a test_flags <<<"${TESTS}"
          else
            test_flags=(--test '*')
          fi
          # --no-tests=fail: a suite whose package lost its tests/ binaries
          # must be removed from INTEGRATION_SUITES, not pass silently.
          # Tests of crates that dev-depend on mcp-test-server spawn this exact
          # fixture and fail without it (mcp_test_server::fixture_binary).
          # shellcheck disable=SC2086
          fixture="$(scripts/mcp-test-server-fixture --if-needed ${PACKAGES})"
          if [[ -n "${fixture}" ]]; then
            export MEERKAT_MCP_TEST_SERVER="${fixture}"
            echo "mcp-test-server fixture: ${MEERKAT_MCP_TEST_SERVER}"
          fi
          # shellcheck disable=SC2086
          # Status level slow: the suites hold known heavy tests with exact-case
          # timeout overrides in .config/nextest.toml; their durations stay visible.
          ./scripts/repo-cargo nextest run ${PACKAGES} "${test_flags[@]}" --profile ci-pr \
            --no-tests=fail --no-fail-fast --status-level slow --final-status-level slow

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sccache-log-integration-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  main-unit:
    name: Main unit tests (${{ matrix.name }})
    needs: changes
    # Post-merge only: the whole workspace, including the meerkat-mob compile
    # chain that the pull-request unit lane defers; no wall-clock budget. A
    # push with no Rust-relevant change (a docs-only merge) has no unit lanes,
    # exactly as on a pull request. A manual dispatch runs them too, so a
    # branch can measure the main lanes before it merges.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.rust_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.main_unit_shard_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Unit tests (workspace shard, lib and bin targets)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          # Set only on feature-suite rows whose tests need a deeper test-thread
          # stack than the 8 MiB .cargo/config.toml default (see FEATURE_UNIT_SUITES).
          MIN_STACK: ${{ matrix.rust_min_stack }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in a main unit lane"; exit 1; }
          # An empty RUST_MIN_STACK would drop tests to Rust's 2 MiB default, so it
          # is exported only when the row sets one.
          if [[ -n "${MIN_STACK}" ]]; then export RUST_MIN_STACK="${MIN_STACK}"; fi
          # Tests of crates that dev-depend on mcp-test-server spawn this exact
          # fixture and fail without it (mcp_test_server::fixture_binary).
          # shellcheck disable=SC2086
          fixture="$(scripts/mcp-test-server-fixture --if-needed ${PACKAGES})"
          if [[ -n "${fixture}" ]]; then
            export MEERKAT_MCP_TEST_SERVER="${fixture}"
            echo "mcp-test-server fixture: ${MEERKAT_MCP_TEST_SERVER}"
          fi
          # shellcheck disable=SC2086
          ./scripts/repo-cargo nextest run ${PACKAGES} --lib --bins --profile ci-pr \
            --no-tests=pass --no-fail-fast --status-level fail --final-status-level fail

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sccache-log-main-unit-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  main-unit-archive-build:
    name: Main unit build (${{ matrix.name }})
    needs: changes
    # The packages in ARCHIVED_UNIT_LANES (ci-cargo-lanes.mjs) compile their
    # lib-test binary once here into a nextest archive; main-unit-archive-run
    # fans its execution out over partitions. Same trigger as main-unit.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.rust_changed == 'true' && needs.changes.outputs.main_archive_build_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.main_archive_build_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Build nextest archive (lib and bin targets)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" && -n "${ARCHIVE}" ]] || { echo "::error::empty archived unit lane"; exit 1; }
          # Built into the target directory, the fixture rides in the archive
          # (archive.include, .config/nextest.toml) and sits next to the
          # extracted test binaries' deps/, where
          # mcp_test_server::fixture_binary() resolves it.
          # shellcheck disable=SC2086
          fixture="$(scripts/mcp-test-server-fixture --if-needed ${PACKAGES})"
          if [[ -n "${fixture}" ]]; then echo "mcp-test-server fixture (archived): ${fixture}"; fi
          # shellcheck disable=SC2086
          ./scripts/repo-cargo nextest archive ${PACKAGES} --lib --bins \
            --archive-file "${RUNNER_TEMP}/nextest-${ARCHIVE}.tar.zst"

      - name: Verify the partitions cover every test exactly once
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          PARTITIONS: ${{ matrix.partitions }}
        run: |
          set -euo pipefail
          [[ "${PARTITIONS}" =~ ^[0-9]+$ ]] && (( PARTITIONS >= 2 )) || { echo "::error::archived lane without a partition count"; exit 1; }
          archive="${RUNNER_TEMP}/nextest-${ARCHIVE}.tar.zst"
          list() {
            cargo-nextest nextest list --archive-file "${archive}" --workspace-remap "${GITHUB_WORKSPACE}" \
              --profile ci-pr --message-format oneline "$@" | LC_ALL=C sort
          }
          list > "${RUNNER_TEMP}/all.txt"
          : > "${RUNNER_TEMP}/union.txt"
          for (( index = 1; index <= PARTITIONS; index++ )); do
            list --partition "hash:${index}/${PARTITIONS}" >> "${RUNNER_TEMP}/union.txt"
          done
          LC_ALL=C sort "${RUNNER_TEMP}/union.txt" -o "${RUNNER_TEMP}/union.txt"
          duplicates="$(uniq -d "${RUNNER_TEMP}/union.txt" | wc -l)"
          if [[ "${duplicates}" != "0" ]] || ! cmp -s "${RUNNER_TEMP}/all.txt" "${RUNNER_TEMP}/union.txt"; then
            echo "::error::the ${PARTITIONS} partitions of ${ARCHIVE} do not cover its $(wc -l < "${RUNNER_TEMP}/all.txt") tests exactly once (duplicates: ${duplicates})"
            diff "${RUNNER_TEMP}/all.txt" "${RUNNER_TEMP}/union.txt" | head -20 || true
            exit 1
          fi
          echo "${ARCHIVE}: ${PARTITIONS} partitions cover all $(wc -l < "${RUNNER_TEMP}/all.txt") tests exactly once"

      - name: Upload nextest archive
        uses: actions/upload-artifact@v7
        with:
          # Keyed by run, not attempt: re-running only a failed partition job
          # (attempt 2+) does not re-run this build job, so the partition must
          # find the archive an earlier attempt uploaded. A full re-run rebuilds
          # and replaces it.
          name: nextest-${{ matrix.archive }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nextest-${{ matrix.archive }}.tar.zst
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sccache-log-main-unit-archive-${{ matrix.archive }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  main-unit-archive-run:
    name: Main unit tests (${{ matrix.name }})
    needs: [changes, main-unit-archive-build]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.rust_changed == 'true' && needs.changes.outputs.main_archive_run_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.main_archive_run_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Download nextest archive
        uses: actions/download-artifact@v5
        with:
          name: nextest-${{ matrix.archive }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nextest-archive

      - name: Unit tests (archived lane partition)
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          PARTITION: ${{ matrix.partition }}
          # Set only on rows whose tests need a deeper test-thread stack than
          # the 8 MiB .cargo/config.toml default (see FEATURE_UNIT_SUITES).
          MIN_STACK: ${{ matrix.rust_min_stack }}
        run: |
          set -euo pipefail
          [[ -n "${ARCHIVE}" && -n "${PARTITION}" ]] || { echo "::error::empty archived unit partition"; exit 1; }
          # The archive's binaries run against this checkout; .cargo/config.toml
          # does not apply outside cargo builds, so its test-thread stack is
          # exported here, and an explicit row stack overrides it.
          export RUST_MIN_STACK="${MIN_STACK:-8388608}"
          cargo-nextest nextest run --archive-file "${RUNNER_TEMP}/nextest-archive/nextest-${ARCHIVE}.tar.zst" \
            --workspace-remap "${GITHUB_WORKSPACE}" --partition "${PARTITION}" --profile ci-pr \
            --no-tests=pass --no-fail-fast --status-level fail --final-status-level fail

  closure-check:
    name: Closure check (${{ needs.changes.outputs.closure_count }} crates)
    needs: changes
    if: ${{ needs.changes.outputs.rust_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Check the reverse-dependency closure
        shell: bash
        env:
          CLOSURE: ${{ needs.changes.outputs.closure_flags }}
        run: |
          set -euo pipefail
          [[ -n "${CLOSURE}" ]] || { echo "::error::empty closure in the closure-check lane"; exit 1; }
          targets=()
          if [[ "${CLOSURE_CHECK_TARGETS}" == "all" ]]; then
            targets+=(--all-targets)
          fi
          # shellcheck disable=SC2086
          ./scripts/repo-cargo check ${CLOSURE} "${targets[@]}" --all-features

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sccache-log-closure-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

  wasm-check:
    name: wasm32 check
    needs: changes
    # Post-merge only (12 min measured); pull requests defer it.
    if: ${{ github.event_name == 'push' && needs.changes.outputs.rust_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: WASM runtime check
        run: make wasm-check

  sdk-host:
    name: Python + TypeScript SDK suites
    needs: changes
    # The Python + TypeScript SDK suites are post-merge only (13 min
    # measured); pull requests defer them. The Node example suites
    # (examples/037-live-webrtc-web in Playwright Chromium and the examples
    # SDK suite) also run on pull requests that touch their inputs, without
    # the Rust build.
    if: ${{ (github.event_name == 'push' && (needs.changes.outputs.rust_changed == 'true' || needs.changes.outputs.sdk_host == 'true' || needs.changes.outputs.examples_browser == 'true')) || (github.event_name != 'push' && needs.changes.outputs.examples_browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup sccache
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        if: ${{ github.event_name == 'push' }}
        uses: rui314/setup-mold@v1

      - name: Cache cargo registry
        if: ${{ github.event_name == 'push' }}
        uses: Swatinem/rust-cache@v2
        with:
          # Registry index and crate sources only, one key for every lane.
          # Compiled objects come from sccache: content-addressed, shared by
          # every lane and readable from main by every pull request, and
          # about 1.5 GB for the whole workspace. Per-lane target-directory
          # caches were 300-480 MB each and filled the repository's 10 GB
          # cache limit in one pull request, so they were evicted between
          # PRs and every plan was cold in practice.
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Build RPC binary for SDK smoke tests
        if: ${{ github.event_name == 'push' }}
        run: ./scripts/repo-cargo build -p meerkat-rpc

      - name: Python + TypeScript SDK tests
        if: ${{ github.event_name == 'push' }}
        run: make -j2 test-sdk-python test-sdk-typescript

      - name: Build TypeScript SDK for the examples
        working-directory: sdks/typescript
        # The SDK has no lockfile; the examples link it through file:.
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Install example dependencies
        run: |
          npm ci --no-fund --no-audit --prefix examples
          npm ci --no-fund --no-audit --prefix examples/037-live-webrtc-web

      - name: Install Playwright Chromium
        working-directory: examples/037-live-webrtc-web
        run: npx playwright install --with-deps chromium

      - name: Live WebRTC example browser tests
        working-directory: examples/037-live-webrtc-web
        run: npm test

      - name: Examples SDK suite
        working-directory: examples
        run: npm run test:sdk

  example-web:
    name: Example web suites
    needs: changes
    # Examples 031, 032 and 033 execute the sdks/web wasm runtime in
    # Playwright Chromium. Every main push runs them; pull requests run them
    # when the runtime, the crates it builds from, or those examples change.
    # Independent of the Rust lanes, so it stays off the critical path.
    if: ${{ github.event_name == 'push' || needs.changes.outputs.example_web == 'true' }}
    runs-on: ubuntu-24.04
    # Sized from measurement (2026-09-29). Warm (sccache 100% hits, e.g. job
    # 109577859270): 4.5 min, 2 min of it the wasm build. Cold, a pull request
    # that changes meerkat-core, so all 27 workspace crates of the wasm graph
    # miss sccache and rebuild at opt-level "s" while dependencies still hit
    # (86.8% hits): jobs 109538182678 1097 s, 109573573790 1125 s,
    # 109561685236 1146 s, 109576652284 1199 s (its build step 1038 s; every
    # step passed but the old 20-minute timeout cancelled it). This is the
    # cost of compiling the crates, not a cache that misses. 25 minutes is
    # about 25% above the slowest cold run, so a legitimate cold run is never
    # cancelled here; the gate's CI_MAX_EXEC_SECONDS (1500 s of execution,
    # about 60 s of it the change classification) still caps it.
    timeout-minutes: 25
    env:
      RUSTC_WRAPPER: sccache
      # The suites need a working runtime, not a size-optimized one: skip
      # wasm-opt, which spends many minutes on the release build.
      MEERKAT_WEB_WASM_OPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Registry index and crate sources only; compiled objects come from
          # sccache (see the wasm32 check lane).
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Build the sdks/web wasm runtime
        working-directory: sdks/web
        # Built once; all three suites read sdks/web/wasm (033 through its
        # sync:runtime copy). The SDK has no lockfile.
        run: |
          npm install --no-fund --no-audit --ignore-scripts
          npm run build

      - name: Install example dependencies
        run: |
          npm ci --no-fund --no-audit --prefix examples/031-wasm-mini-diplomacy-sh/web
          npm ci --no-fund --no-audit --prefix examples/032-wasm-webcm-agent/web
          npm ci --no-fund --no-audit --prefix examples/033-the-office-demo-sh/web

      - name: Install Playwright Chromium
        # The three examples lock the same Playwright release.
        working-directory: examples/033-the-office-demo-sh/web
        run: npx playwright install --with-deps chromium

      - name: Direct WASM runtime browser contracts
        working-directory: sdks/web
        run: npm run test:browser

      - name: WASM package lifecycle and natural process shutdown
        working-directory: sdks/web
        timeout-minutes: 2
        run: |
          node --test tests/e2e_wasm_runtime.test.mjs tests/wasm_mob_comms.test.mjs
          npm run test:packed

      - name: 031 wasm mini diplomacy suite
        working-directory: examples/031-wasm-mini-diplomacy-sh/web
        run: npm test

      - name: 032 wasm WebCM agent suite
        working-directory: examples/032-wasm-webcm-agent/web
        run: npm test

      - name: 033 office demo suites
        working-directory: examples/033-the-office-demo-sh/web
        # test runs the fixture groups; test:offline loads the built page
        # with the synced runtime.
        run: |
          npm run build
          npm test
          npm run test:offline

  wasm-timers:
    name: WASM timer ownership
    needs: changes
    # Compile the Rust regression binaries independently of the example build
    # so both lanes retain the pull-request wall-clock budget.
    if: ${{ github.event_name == 'push' || needs.changes.outputs.example_web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="wasm_js" -C link-arg=-zstack-size=8388608'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache-ci
        with:
          bucket: ${{ env.SCCACHE_GCS_BUCKET_NAME }}
          workload_identity_provider: ${{ vars.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MEERKAT_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.MEERKAT_GCP_PROJECT_ID }}
          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Browser status deadline and timer ownership regressions
        shell: bash
        run: |
          export CARGO="$PWD/scripts/repo-cargo"
          wasm-pack test --headless --chrome --release crates/meerkat-web-runtime --test browser_contract --test wasm_timers
          wasm-pack test --node --release crates/meerkat-web-runtime --test wasm_timers_node

  bazel-graph:
    name: Bazel graph check
    needs: changes
    # Proves the Bazel graph loads and analyses (plain local Bazel, no
    # remote execution, nothing is compiled). Pull requests run it when the
    # classifier sees a Bazel-relevant path: BUILD/Starlark/module inputs,
    # the BUILD generator, the tools/ Bazel and remote-execution configs,
    # any Cargo manifest, or a moved or deleted Rust file. Every main push
    # runs it.
    if: ${{ github.event_name == 'push' || needs.changes.outputs.bazel_graph == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bazelisk
        # Bazelisk downloads the Bazel release pinned in .bazelversion (9.1.1).
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel repository and disk caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-graph-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-graph-${{ runner.os }}-

      - name: Bazel query
        run: bazel query //... --repository_cache="${HOME}/.cache/bazel-repo" >/dev/null

      - name: Bazel analysis
        run: bazel build --nobuild //... --repository_cache="${HOME}/.cache/bazel-repo" --disk_cache="${HOME}/.cache/bazel-disk"

  gate:
    name: CI gate
    # Not `always()`: a superseded run (cancel-in-progress) must surface as
    # cancelled, not leave a FAILURE "CI gate" check on the head.
    if: ${{ !cancelled() }}
    needs:
      - changes
      - fmt-governance
      - ratchets
      - tlc-audits
      - clippy
      - unit
      - integration
      - main-unit
      - main-unit-archive-build
      - main-unit-archive-run
      - closure-check
      - wasm-check
      - sdk-host
      - example-web
      - wasm-timers
      - bazel-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check lane results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FMT_GOVERNANCE_RESULT: ${{ needs.fmt-governance.result }}
          RATCHETS_RESULT: ${{ needs.ratchets.result }}
          TLC_AUDITS_RESULT: ${{ needs.tlc-audits.result }}
          MACHINE_AUTHORITY: ${{ needs.changes.outputs.machine_authority }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INTEGRATION_COUNT: ${{ needs.changes.outputs.integration_count }}
          MAIN_UNIT_PACKED_RESULT: ${{ needs.main-unit.result }}
          MAIN_UNIT_ARCHIVE_BUILD_RESULT: ${{ needs.main-unit-archive-build.result }}
          MAIN_UNIT_ARCHIVE_RUN_RESULT: ${{ needs.main-unit-archive-run.result }}
          CLOSURE_CHECK_RESULT: ${{ needs.closure-check.result }}
          WASM_CHECK_RESULT: ${{ needs.wasm-check.result }}
          SDK_HOST_RESULT: ${{ needs.sdk-host.result }}
          EXAMPLE_WEB_RESULT: ${{ needs.example-web.result }}
          WASM_TIMERS_RESULT: ${{ needs.wasm-timers.result }}
          BAZEL_GRAPH_RESULT: ${{ needs.bazel-graph.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' }}
          SDK_HOST: ${{ needs.changes.outputs.sdk_host }}
          BAZEL_GRAPH: ${{ needs.changes.outputs.bazel_graph }}
          EXAMPLES_BROWSER: ${{ needs.changes.outputs.examples_browser }}
          EXAMPLE_WEB: ${{ needs.changes.outputs.example_web }}
          MODE: ${{ needs.changes.outputs.mode }}
          REASON: ${{ needs.changes.outputs.reason }}
          SHARD_COUNT: ${{ needs.changes.outputs.shard_count }}
          UNIT_SHARD_COUNT: ${{ needs.changes.outputs.unit_shard_count }}
          UNIT_DEFERRED: ${{ needs.changes.outputs.unit_deferred }}
          UNIT_DEFERRED_COUNT: ${{ needs.changes.outputs.unit_deferred_count }}
          PACKAGE_COUNT: ${{ needs.changes.outputs.package_count }}
          CLOSURE_COUNT: ${{ needs.changes.outputs.closure_count }}
        run: |
          set -euo pipefail
          # Main unit coverage is the packed shards plus the archived lanes
          # (build once, partitioned runs): one failure or cancellation fails
          # it, and it counts as skipped only when all three were skipped.
          combine_main_unit() {
            local result any_ran=0
            for result in "$@"; do
              case "${result}" in
                failure|cancelled) echo "${result}"; return ;;
                success) any_ran=1 ;;
              esac
            done
            if (( any_ran )); then echo success; else echo skipped; fi
          }
          MAIN_UNIT_RESULT="$(combine_main_unit "${MAIN_UNIT_PACKED_RESULT}" "${MAIN_UNIT_ARCHIVE_BUILD_RESULT}" "${MAIN_UNIT_ARCHIVE_RUN_RESULT}")"
          echo "plan: mode=${MODE} packages=${PACKAGE_COUNT} closure=${CLOSURE_COUNT} clippy_shards=${SHARD_COUNT} unit_shards=${UNIT_SHARD_COUNT} (${REASON})"
          if [[ -n "${UNIT_DEFERRED}" ]]; then
            echo "::notice::unit tests deferred to the push-to-main run (meerkat-mob compile chain): ${UNIT_DEFERRED}"
          fi
          echo "changes=${CHANGES_RESULT} fmt-governance=${FMT_GOVERNANCE_RESULT} ratchets=${RATCHETS_RESULT} tlc-audits=${TLC_AUDITS_RESULT}"
          echo "clippy=${CLIPPY_RESULT} unit=${UNIT_RESULT} integration=${INTEGRATION_RESULT} (${INTEGRATION_COUNT} suites) main-unit=${MAIN_UNIT_RESULT} closure-check=${CLOSURE_CHECK_RESULT} wasm-check=${WASM_CHECK_RESULT} sdk-host=${SDK_HOST_RESULT} example-web=${EXAMPLE_WEB_RESULT} wasm-timers=${WASM_TIMERS_RESULT} bazel-graph=${BAZEL_GRAPH_RESULT}"
          failed=0
          require_success() {
            local lane="$1" result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${lane} must succeed on every run (result: ${result})."
              failed=1
            fi
          }
          require_ran() {
            local lane="$1" result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${lane} must run and succeed for a build-relevant change (result: ${result})."
              failed=1
            fi
          }
          forbid_failure() {
            local lane="$1" result="$2"
            case "${result}" in
              success|skipped) ;;
              *)
                echo "::error::${lane} did not complete successfully (result: ${result})."
                failed=1
                ;;
            esac
          }
          # The classifier is the fail-closed authority: if it did not
          # produce a plan, nothing below can be trusted.
          require_success "Change classification" "${CHANGES_RESULT}"
          require_success "Format + governance" "${FMT_GOVERNANCE_RESULT}"
          require_success "Generation ratchets" "${RATCHETS_RESULT}"
          if [[ "${MACHINE_AUTHORITY}" == "true" ]]; then
            require_ran "Bounded TLC audits" "${TLC_AUDITS_RESULT}"
          else
            forbid_failure "Bounded TLC audits" "${TLC_AUDITS_RESULT}"
          fi
          if [[ "${RUST_CHANGED}" == "true" ]]; then
            if ! [[ "${SHARD_COUNT}" =~ ^[0-9]+$ ]] || (( SHARD_COUNT < 1 )); then
              echo "::error::a build-relevant change produced no lanes (shard_count='${SHARD_COUNT}')."
              failed=1
            fi
            require_ran "Clippy" "${CLIPPY_RESULT}"
            require_ran "Closure check" "${CLOSURE_CHECK_RESULT}"
            # Fail closed on the unit plan: every changed package is either in
            # a pull-request unit shard or named as deferred to main.
            if [[ "${UNIT_SHARD_COUNT}" =~ ^[0-9]+$ ]] && (( UNIT_SHARD_COUNT > 0 )); then
              require_ran "Unit tests" "${UNIT_RESULT}"
            elif [[ "${UNIT_DEFERRED_COUNT}" =~ ^[0-9]+$ ]] && (( UNIT_DEFERRED_COUNT > 0 )); then
              echo "no pull-request unit lane: every changed package (${UNIT_DEFERRED}) is in the meerkat-mob compile chain and runs on main."
              forbid_failure "Unit tests" "${UNIT_RESULT}"
            else
              echo "::error::a build-relevant change produced neither a unit lane nor a deferred package list."
              failed=1
            fi
          elif [[ "${CHANGES_RESULT}" == "success" ]]; then
            for lane in Clippy:"${CLIPPY_RESULT}" "Unit tests":"${UNIT_RESULT}" "Closure check":"${CLOSURE_CHECK_RESULT}"; do
              forbid_failure "${lane%%:*}" "${lane##*:}"
            done
          fi
          if [[ "${IS_MAIN_PUSH}" == "true" && "${RUST_CHANGED}" == "true" ]]; then
            # Post-merge coverage of everything the pull request deferred.
            require_ran "Main unit tests" "${MAIN_UNIT_RESULT}"
            require_ran "wasm32 check" "${WASM_CHECK_RESULT}"
            require_ran "Python + TypeScript SDK suites" "${SDK_HOST_RESULT}"
          elif [[ "${IS_MAIN_PUSH}" == "true" ]]; then
            # No Rust-relevant change on main: no unit lanes are required,
            # exactly as on a pull request; the SDK suites run only when SDK
            # paths changed.
            echo "no Rust-relevant change: no unit lanes required on this main push."
            forbid_failure "Main unit tests" "${MAIN_UNIT_RESULT}"
            forbid_failure "wasm32 check" "${WASM_CHECK_RESULT}"
            if [[ "${SDK_HOST}" == "true" || "${EXAMPLES_BROWSER}" == "true" ]]; then
              require_ran "Python + TypeScript SDK suites" "${SDK_HOST_RESULT}"
            else
              forbid_failure "Python + TypeScript SDK suites" "${SDK_HOST_RESULT}"
            fi
          else
            for lane in "Main unit tests":"${MAIN_UNIT_RESULT}" "wasm32 check":"${WASM_CHECK_RESULT}"; do
              forbid_failure "${lane%%:*}" "${lane##*:}"
            done
            # Pull requests run the Node example suites of the SDK lane when
            # their inputs changed.
            if [[ "${EXAMPLES_BROWSER}" == "true" ]]; then
              require_ran "Python + TypeScript SDK suites (example suites)" "${SDK_HOST_RESULT}"
            else
              forbid_failure "Python + TypeScript SDK suites" "${SDK_HOST_RESULT}"
            fi
          fi
          # Integration suites: every selected suite (by trigger packages or
          # changed paths, Rust change or not) must run and pass; with none
          # selected the lane must not have failed.
          if [[ "${INTEGRATION_COUNT}" =~ ^[0-9]+$ ]] && (( INTEGRATION_COUNT > 0 )); then
            require_ran "Integration tests" "${INTEGRATION_RESULT}"
          elif [[ "${CHANGES_RESULT}" == "success" && ! "${INTEGRATION_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::the plan carries no integration suite count (integration_count='${INTEGRATION_COUNT}')."
            failed=1
          else
            forbid_failure "Integration tests" "${INTEGRATION_RESULT}"
          fi
          # Example web suites: every main push, and pull requests that touch
          # the web runtime, its crates, or examples 031-033.
          if [[ "${IS_MAIN_PUSH}" == "true" || "${EXAMPLE_WEB}" == "true" ]]; then
            require_ran "Example web suites" "${EXAMPLE_WEB_RESULT}"
            require_ran "WASM timer ownership" "${WASM_TIMERS_RESULT}"
          else
            forbid_failure "Example web suites" "${EXAMPLE_WEB_RESULT}"
            forbid_failure "WASM timer ownership" "${WASM_TIMERS_RESULT}"
          fi
          # Bazel graph check: every main push, and pull requests with a
          # Bazel-relevant change.
          if [[ "${IS_MAIN_PUSH}" == "true" || "${BAZEL_GRAPH}" == "true" ]]; then
            require_ran "Bazel graph check" "${BAZEL_GRAPH_RESULT}"
          else
            forbid_failure "Bazel graph check" "${BAZEL_GRAPH_RESULT}"
          fi
          if (( failed )); then
            exit 1
          fi
          echo "All selected lanes succeeded."

      - name: Enforce lane execution budget
        # Runs on every run that was not cancelled, including runs whose lane
        # check above failed, so a failed run also names its slowest lanes.
        # Enforced on pull requests only (the push-to-main run carries the
        # deferred lanes and has no wall-clock budget; there it only reports,
        # and a failure to measure is a warning).
        #
        # Three numbers per lane, from the Actions jobs API:
        #   queued    created_at to started_at: waiting for a hosted runner
        #   ran       started_at to completed_at: the lane's own execution
        #   terminal  completed_at, timed from the start of the run attempt
        #             the lane ran in
        # The execution path of a lane is its own run time plus the change
        # classification's (every lane but classification and format +
        # governance waits for the plan). The budgets:
        #   - execution path <= CI_MAX_EXEC_SECONDS: fails (exec_over_budget)
        #   - terminal minus path queue <= CI_MAX_TERMINAL_SECONDS: fails
        #     (runaway); runner queue never counts toward a failure
        #   - critical-path queue >= CI_QUEUE_WARN_SECONDS: warns
        #     (queue_delayed), never fails
        # Run times belong to the job, so re-running only this gate cannot
        # launder an execution overrun. Terminals use per-attempt clocks: a
        # re-run lane gets a fresh clock, a carried-over lane keeps its own
        # attempt's clock.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_EXEC_SECONDS: ${{ env.CI_MAX_EXEC_SECONDS }}
          MAX_TERMINAL_SECONDS: ${{ env.CI_MAX_TERMINAL_SECONDS }}
          QUEUE_WARN_SECONDS: ${{ env.CI_QUEUE_WARN_SECONDS }}
          ENFORCE_BUDGET: ${{ github.event_name != 'push' }}
          GATE_JOB_NAME: CI gate
          CLASSIFICATION_JOB_NAME: Change classification
          ROOT_JOB_NAMES: Change classification,Format + governance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess
          import sys


          def api(path):
              out = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp", path],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              return json.loads(out)


          def ts(value):
              return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))


          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          max_exec = int(os.environ["MAX_EXEC_SECONDS"])
          max_terminal = int(os.environ["MAX_TERMINAL_SECONDS"])
          queue_warn = int(os.environ["QUEUE_WARN_SECONDS"])
          enforce = os.environ["ENFORCE_BUDGET"] == "true"
          gate_name = os.environ["GATE_JOB_NAME"]
          classification_name = os.environ["CLASSIFICATION_JOB_NAME"]
          root_names = set(os.environ["ROOT_JOB_NAMES"].split(","))

          def collect_lanes():
              # Start of every attempt so far; a carried-over job belongs to the
              # latest attempt that had started when the job started.
              attempt_starts = []
              for n in range(1, attempt + 1):
                  page = api(f"/repos/{repo}/actions/runs/{run_id}/attempts/{n}")[0]
                  attempt_starts.append((n, ts(page["run_started_at"])))
              jobs = [
                  job
                  for page in api(
                      f"/repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100"
                  )
                  for job in page["jobs"]
              ]

              lanes = []
              for job in jobs:
                  if job["name"] == gate_name or job["conclusion"] in (None, "skipped"):
                      continue
                  if not job["started_at"] or not job["completed_at"]:
                      continue
                  started, completed = ts(job["started_at"]), ts(job["completed_at"])
                  if completed < started:
                      continue
                  created = ts(job["created_at"]) if job.get("created_at") else started
                  ran_in, clock = attempt_starts[0]
                  for n, begun in attempt_starts:
                      if begun <= started:
                          ran_in, clock = n, begun
                  lanes.append(
                      {
                          "name": job["name"],
                          "attempt": ran_in,
                          "queued": max(0, int((started - created).total_seconds())),
                          "duration": int((completed - started).total_seconds()),
                          "terminal": int((completed - clock).total_seconds()),
                          "conclusion": job["conclusion"],
                      }
                  )
              return lanes


          # Measurement needs the Actions API. A failure to measure fails a
          # pull request, whose budget is enforced, but only warns on a push
          # to main, where the budget is a report: a transient API error must
          # not turn main's CI gate red and block release readiness.
          try:
              lanes = collect_lanes()
          except (subprocess.CalledProcessError, KeyError, IndexError, TypeError, ValueError) as error:
              detail = (getattr(error, "stderr", None) or str(error)).strip()
              if enforce:
                  print(f"::error::could not measure the lane execution budget: {detail}")
                  sys.exit(1)
              print(f"::warning::lane execution budget report unavailable (budget not enforced): {detail}")
              sys.exit(0)
          if not lanes:
              level = "error" if enforce else "warning"
              print(f"::{level}::no completed lanes found for the lane execution budget.")
              sys.exit(1 if enforce else 0)

          # Every lane except the roots waits for the change classification,
          # so its execution path starts with the classification's run time
          # and its queue includes the classification's queue.
          classification = next((lane for lane in lanes if lane["name"] == classification_name), None)
          if classification is None and enforce:
              print(f"::error::no completed {classification_name} job: the execution path is unmeasurable.")
              sys.exit(1)
          for lane in lanes:
              upstream = classification if lane["name"] not in root_names and classification else None
              lane["exec_path"] = lane["duration"] + (upstream["duration"] if upstream else 0)
              # A lane re-run in a later attempt did not wait for the
              # carried-over classification's runner.
              same_attempt = upstream is not None and upstream["attempt"] == lane["attempt"]
              lane["path_queued"] = lane["queued"] + (upstream["queued"] if same_attempt else 0)
              # The runaway ceiling is measured without runner queue: the
              # 40-job account cap is shared, so queue is reported, never
              # budgeted.
              lane["exec_terminal"] = max(0, lane["terminal"] - lane["path_queued"])

          exec_critical = max(lanes, key=lambda lane: lane["exec_path"])
          critical = max(lanes, key=lambda lane: lane["terminal"])
          runaway_critical = max(lanes, key=lambda lane: lane["exec_terminal"])
          slowest = max(lanes, key=lambda lane: lane["duration"])
          exec_path = exec_critical["exec_path"]
          terminal = critical["terminal"]
          queued = critical["path_queued"]
          exec_terminal = runaway_critical["exec_terminal"]

          # The verdict is the measurement; only pull requests fail on it.
          if exec_terminal > max_terminal:
              verdict_type = "runaway"
          elif exec_path > max_exec:
              verdict_type = "exec_over_budget"
          elif queued >= queue_warn:
              verdict_type = "queue_delayed"
          else:
              verdict_type = "within_budget"

          rows = sorted(lanes, key=lambda lane: lane["terminal"], reverse=True)
          table = [
              "| lane | attempt | queued s | ran s | exec path s | terminal s | terminal excl. queue s | result |",
              "| --- | --- | --- | --- | --- | --- | --- | --- |",
          ] + [
              f"| {r['name']} | {r['attempt']} | {r['queued']} | {r['duration']} | {r['exec_path']} | {r['terminal']} | {r['exec_terminal']} | {r['conclusion']} |"
              for r in rows[:12]
          ]
          verdict = (
              f"Lane execution: {exec_path}/{max_exec} s (execution critical path: {exec_critical['name']}); "
              f"push-to-terminal: {terminal} s (critical path: {critical['name']}, "
              f"attempt {critical['attempt']}, {queued} s of it runner queue); "
              f"push-to-terminal excluding runner queue: {exec_terminal}/{max_terminal} s "
              f"(critical path: {runaway_critical['name']}); "
              f"slowest lane: {slowest['name']}, ran {slowest['duration']} s; verdict: {verdict_type}"
          )
          print(verdict)
          print("\n".join(table))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"### Lane execution budget\n\n{verdict}\n\n" + "\n".join(table) + "\n")
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write(
                      f"exec_path_seconds={exec_path}\n"
                      f"terminal_seconds={terminal}\n"
                      f"terminal_excluding_queue_seconds={exec_terminal}\n"
                      f"queue_seconds={queued}\n"
                      f"budget_verdict={verdict_type}\n"
                  )
          if queued >= queue_warn:
              print(
                  f"::warning title=CI runner queue wait::{critical['name']} waited {queued} s for hosted "
                  f"runners on the critical path (classification included); runner queue is reported, "
                  f"not budgeted."
              )
          failed = False
          if enforce and exec_path > max_exec:
              print(
                  f"::error::CI exceeded the {max_exec}-second lane execution budget "
                  f"({exec_path} s; execution critical path {exec_critical['name']}, slowest lane "
                  f"{slowest['name']} at {slowest['duration']} s)."
              )
              failed = True
          if enforce and exec_terminal > max_terminal:
              print(
                  f"::error::CI exceeded the {max_terminal}-second push-to-terminal runaway ceiling "
                  f"excluding runner queue ({exec_terminal} s; critical path {runaway_critical['name']}, "
                  f"which also waited {runaway_critical['path_queued']} s for runners, not counted)."
              )
              failed = True
          if failed:
              sys.exit(1)
          PY

      - name: Checkout attested source tree
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v6

      - name: Build exact-tree CI attestation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: attestation
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FMT_GOVERNANCE_RESULT: ${{ needs.fmt-governance.result }}
          RATCHETS_RESULT: ${{ needs.ratchets.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          MAIN_UNIT_PACKED_RESULT: ${{ needs.main-unit.result }}
          MAIN_UNIT_ARCHIVE_BUILD_RESULT: ${{ needs.main-unit-archive-build.result }}
          MAIN_UNIT_ARCHIVE_RUN_RESULT: ${{ needs.main-unit-archive-run.result }}
          CLOSURE_CHECK_RESULT: ${{ needs.closure-check.result }}
          WASM_CHECK_RESULT: ${{ needs.wasm-check.result }}
          SDK_HOST_RESULT: ${{ needs.sdk-host.result }}
          EXAMPLE_WEB_RESULT: ${{ needs.example-web.result }}
          BAZEL_GRAPH_RESULT: ${{ needs.bazel-graph.result }}
          WASM_TIMERS_RESULT: ${{ needs.wasm-timers.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          PACKAGE_COUNT: ${{ needs.changes.outputs.package_count }}
          CLOSURE_COUNT: ${{ needs.changes.outputs.closure_count }}
          SHARD_COUNT: ${{ needs.changes.outputs.shard_count }}
          UNIT_SHARD_COUNT: ${{ needs.changes.outputs.unit_shard_count }}
          MAIN_UNIT_SHARD_COUNT: ${{ needs.changes.outputs.main_unit_shard_count }}
        run: |
          set -euo pipefail
          # Main unit coverage is the packed shards plus the archived lanes
          # (build once, partitioned runs): one failure or cancellation fails
          # it, and it counts as skipped only when all three were skipped.
          combine_main_unit() {
            local result any_ran=0
            for result in "$@"; do
              case "${result}" in
                failure|cancelled) echo "${result}"; return ;;
                success) any_ran=1 ;;
              esac
            done
            if (( any_ran )); then echo success; else echo skipped; fi
          }
          MAIN_UNIT_RESULT="$(combine_main_unit "${MAIN_UNIT_PACKED_RESULT}" "${MAIN_UNIT_ARCHIVE_BUILD_RESULT}" "${MAIN_UNIT_ARCHIVE_RUN_RESULT}")"
          destination="${RUNNER_TEMP}/meerkat-ci-attestation"
          mkdir -p "${destination}"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg tree_sha "${tree_sha}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg changes "${CHANGES_RESULT}" \
            --arg fmt_governance "${FMT_GOVERNANCE_RESULT}" \
            --arg ratchets "${RATCHETS_RESULT}" \
            --arg clippy "${CLIPPY_RESULT}" \
            --arg unit "${UNIT_RESULT}" \
            --arg integration "${INTEGRATION_RESULT}" \
            --arg main_unit "${MAIN_UNIT_RESULT}" \
            --arg closure_check "${CLOSURE_CHECK_RESULT}" \
            --arg wasm_check "${WASM_CHECK_RESULT}" \
            --arg sdk_host "${SDK_HOST_RESULT}" \
            --arg example_web "${EXAMPLE_WEB_RESULT}" \
            --arg wasm_timers "${WASM_TIMERS_RESULT}" \
            --arg bazel_graph "${BAZEL_GRAPH_RESULT}" \
            --arg mode "${MODE}" \
            --argjson package_count "${PACKAGE_COUNT:-0}" \
            --argjson closure_count "${CLOSURE_COUNT:-0}" \
            --argjson shard_count "${SHARD_COUNT:-0}" \
            --argjson unit_shard_count "${UNIT_SHARD_COUNT:-0}" \
            --argjson main_unit_shard_count "${MAIN_UNIT_SHARD_COUNT:-0}" \
            '{
              schema_version: 4,
              repository: $repository,
              commit_sha: $commit_sha,
              tree_sha: $tree_sha,
              workflow: $workflow,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              event: $event,
              ref: $ref,
              validation_backend: "github-hosted-cargo",
              validation_result: "success",
              plan: {
                mode: $mode,
                package_count: $package_count,
                closure_count: $closure_count,
                clippy_shard_count: $shard_count,
                unit_shard_count: $unit_shard_count,
                main_unit_shard_count: $main_unit_shard_count
              },
              component_results: {
                changes: $changes,
                fmt_governance: $fmt_governance,
                ratchets: $ratchets,
                clippy: $clippy,
                unit: $unit,
                integration: $integration,
                main_unit: $main_unit,
                closure_check: $closure_check,
                wasm_check: $wasm_check,
                sdk_host: $sdk_host,
                example_web: $example_web,
                wasm_timers: $wasm_timers,
                bazel_graph: $bazel_graph
              }
            }' > "${destination}/attestation.json"
          echo "tree_sha=${tree_sha}"
          echo "path=${destination}" >> "${GITHUB_OUTPUT}"

      - name: Upload exact-tree CI attestation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: meerkat-ci-attestation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.attestation.outputs.path }}/attestation.json
          if-no-files-found: error
          retention-days: 14
