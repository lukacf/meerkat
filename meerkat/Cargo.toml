    "jsonschema",
    "__meerkat-facade-agent-factory-build",
] }
meerkat-llm-core = { workspace = true }
meerkat-models = { workspace = true }
meerkat-client = { workspace = true, default-features = false }
meerkat-anthropic = { workspace = true, optional = true, default-features = false }
meerkat-openai = { workspace = true, optional = true, default-features = false }
meerkat-gemini = { workspace = true, optional = true, default-features = false }
meerkat-copilot = { workspace = true, optional = true, default-features = false }
meerkat-schedule = { workspace = true }
meerkat-workgraph = { workspace = true }
meerkat-store = { workspace = true }
meerkat-runtime = { workspace = true }
meerkat-tools = { workspace = true }
meerkat-session = { workspace = true }
meerkat-live = { workspace = true, optional = true }
meerkat-memory = { workspace = true, optional = true }
meerkat-mcp = { workspace = true, optional = true }
meerkat-comms = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
meerkat-hooks = { workspace = true }
meerkat-contracts = { workspace = true }
meerkat-jobs = { workspace = true }
meerkat-skills = { workspace = true, optional = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
meerkat-sqlite = { workspace = true }
meerkat-providers = { workspace = true, default-features = false, features = [
    "oauth",
