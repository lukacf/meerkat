name: Validate Windows cross-build

# Exercises the Windows release lane (Linux cross-compile with cargo-xwin, then
# native verification on a Windows runner) against any ref without cutting a
# tag. It publishes nothing and attests nothing. workflow_dispatch resolves
# only once the file exists on the default branch, so ci/windows-cross-*
# branches also trigger it on push.
on:
  workflow_dispatch:
  push:
    branches:
      - "ci/windows-cross-*"

permissions:
  contents: read

jobs:
  build_windows_cross:
    name: Cross-compile Windows binaries on Linux
    runs-on: ubuntu-24.04
    # Same build as release.yml's build_binaries_windows_cross; see its measured durations.
    timeout-minutes: 150
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-rust-ci

      - name: Resolve workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^\[workspace.package\]/ { in_pkg = 1 } in_pkg && /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          [[ -n "${version}" ]] || { echo "workspace version not found" >&2; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and package
        uses: ./.github/actions/build-windows-cross
        with:
          version: ${{ steps.version.outputs.version }}
          # Release builds restore this cache: a dispatch on main would save
          # it into the default branch's scope, which tag runs restore.
          save-sdk-cache: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meerkat-x86_64-pc-windows-msvc-windows-latest
          path: dist/*
          if-no-files-found: error

  verify_windows_binaries:
    name: Verify Windows binaries on windows-2025-vs2026
    needs: build_windows_cross
    # A pinned runner image: windows-latest moves to a new image on GitHub's
    # schedule. The windows-2025-vs2026 label is offered to public
    # repositories only.
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meerkat-x86_64-pc-windows-msvc-windows-latest
          path: dist

      - name: Run each binary
        shell: pwsh
        env:
          VERSION: ${{ needs.build_windows_cross.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          if (-not $version) { throw 'version output missing' }
          New-Item -ItemType Directory -Force -Path extracted | Out-Null
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath extracted -Force
          }
          foreach ($bin in @('rkat', 'rkat-rpc', 'rkat-rest', 'rkat-mcp')) {
            $exe = Join-Path extracted "$bin.exe"
            if (-not (Test-Path $exe)) { throw "missing $exe" }
            $out = & $exe --version 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "$bin --version exited $LASTEXITCODE`n$out" }
            if ($out -notmatch [regex]::Escape($version)) { throw "$bin --version did not report $version`n$out" }
            Write-Host "$bin --version: $($out.Trim())"
          }
          & (Join-Path extracted 'rkat.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "rkat --help exited $LASTEXITCODE" }
          Write-Host "all four Windows binaries run on windows-2025-vs2026"
