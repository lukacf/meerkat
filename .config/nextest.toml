# Nextest configuration for meerkat-0.6-cleanups.
#
# Retry policy is scoped narrowly: the known pre-existing flakes are retried
# once, everything else runs to completion without retries. The BuildBuddy
# Turbo-S live-smoke cohort is a Bazel sh_test suite, so its serialization and
# retry policy belongs to scripts/buildbuddy-bazel-poc rather than here.

[profile.ci-unit]
# CI unit shards normally finish in a few minutes total. Bound any single test
# that stops making progress so nextest reports its name instead of leaving an
# anonymous shard running until a human cancels the workflow. Integration and
# e2e lanes intentionally do not select this profile.
inherits = "default"
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.mob-dense-topology]
# The dedicated GitHub-hosted scalability lane runs exactly one ignored-on-Linux
# test. The test enforces its five-minute wire budget directly; this outer
# deadline also bounds member spawn and result verification stalls.
inherits = "default"
default-filter = 'package(meerkat-mob) and test(=runtime::tests::test_wire_members_batch_materializes_300_by_150_dense_topology_in_seconds)'
slow-timeout = { period = "60s", terminate-after = 8 }
test-threads = 1
status-level = "slow"
final-status-level = "slow"
success-output = "immediate-final"

[[profile.ci-unit.overrides]]
# This workflow-style xtask test performs nested machine-authority compilation.
# Its measured healthy runtime is about 4.5 minutes on GitHub-hosted runners,
# so give only this exact case additional headroom without weakening the unit
# lane's general four-minute attribution bound.
filter = 'test(=machines::tests::machine_workflow_red_ok_detects_missing_and_stale_generated_artifacts)'
slow-timeout = { period = "60s", terminate-after = 8 }

[profile.fast]
# Cargo's default fast lane: unit + integration-fast, with dedicated e2e lane
# wrappers left behind explicit `cargo e2e-*` aliases. Report every test still
# running at one-minute intervals without killing it. CI integration shards
# surface those observations by raising their status levels; local fast aliases
# deliberately keep status output quiet.
default-filter = 'not binary(e2e_auth_lane) and not binary(e2e_build_lane) and not binary(e2e_fast_lane) and not binary(e2e_system_lane) and not binary(e2e_live_lane) and not binary(e2e_smoke_lane) and not binary(e2e_models_lane)'
slow-timeout = { period = "60s" }

# Real-loopback mob integration tests previously shared a process-local mutex,
# but Nextest runs each test in its own process. On macOS, concurrent binaries
# can therefore exhaust the 16k ephemeral-port range because every comms
# envelope opens a fresh TCP connection. This group restores the intended
# serialization for only that network cohort; unrelated tests stay parallel.
[test-groups.mob-real-comms-macos]
max-threads = 1

[[profile.fast.overrides]]
filter = '''
binary(cross_host_events)
or binary(cross_host_flows)
or binary(cross_host_live)
or binary(cross_host_wiring)
or binary(host_actor_persistence)
or binary(host_bind_ceremony)
or binary(host_materialize_serving)
or binary(host_member_release)
or binary(host_member_revival)
or binary(host_orphan_reconciliation)
or binary(host_resume_recovery)
or binary(member_upcall_lane)
or binary(placed_member_respawn)
or binary(remote_spawn_ladder)
or binary(remote_spawn_materialization)
or (binary(scope_matrix) and (
    test(live_granted_principal_opens_end_to_end)
    or test(live_family_denies_without_live_scope_and_mutates_nothing)
))
'''
platform = 'cfg(target_os = "macos")'
test-group = 'mob-real-comms-macos'

# The macOS ephemeral-port cohort above lists integration BINARIES, but three
# meerkat-mob LIB tests also bind a real external TCP listener and drive peer
# turns across it. Being outside the group, they raced the same 16k port range
# and failed with "Connection refused (os error 61)" - reported as an ambiguous
# delivery, which reads as a comms defect rather than a port shortage. Same
# cohort, same reason; the filter is the family, not the one that happened to
# fail.
#
# THE COHORT IS NOT THE WHOLE STORY, and the retries below are an admission
# rather than a fix. These three still rely on `lock_real_comms_tests()`, a
# PROCESS-LOCAL mutex, which nextest's process-per-test model defeats outright -
# the same obsolescence this file's header already notes for the integration
# binaries. They also reserve a port by binding :0, reading the assigned port,
# and then binding it AGAIN for real while the reservation is still open, so
# there is a window either way. The flake predates 0.8.24 (the test is on
# origin/main) and reproduces at roughly one run in two even when the three run
# alone and serialized, which is why port pressure alone does not explain it.
# Retries keep a pre-existing intermittent failure from gating an unrelated
# release; the real fix is cross-process serialization plus a reservation that
# is handed over rather than re-bound.
[[profile.fast.overrides]]
filter = 'test(~test_external_tcp)'
platform = 'cfg(target_os = "macos")'
test-group = 'mob-real-comms-macos'
retries = 2

[[profile.default.overrides]]
# The workspace unit lane uses the default profile and discovers these lib
# tests too, so the cohort has to hold there as well.
filter = 'test(~test_external_tcp)'
platform = 'cfg(target_os = "macos")'
test-group = 'mob-real-comms-macos'
retries = 2

[[profile.fast.overrides]]
# Dense mob-topology materialization is intentionally a high-blast stress test:
# it spawns 300 local members and installs 45k directional trust writes while
# asserting a wall-clock budget. Keep the test concurrent internally, but do
# not run other nextest cases beside it.
filter = 'test(~test_wire_members_batch_materializes_300_by_150_dense_topology_in_seconds)'
threads-required = "num-cpus"

[[profile.default.overrides]]
# The workspace unit lane uses the default profile and discovers this lib test
# too. Keep the wall-clock stress case isolated there as well as in fast.
filter = 'test(~test_wire_members_batch_materializes_300_by_150_dense_topology_in_seconds)'
threads-required = "num-cpus"

[[profile.fast.overrides]]
# A staged-run choreography case: it waits on machine-owned state transitions
# through Tokio notifications, so every wait is for a STRUCTURAL property that
# either happens or never does. Under a saturated lane its executor can be
# starved past the bound, which measures runner load rather than the property.
# Raising the bound was tried first and did not hold - it failed again at 60s
# while passing standalone in 0.03s - so reserve the lane instead, matching the
# treatment the other wall-clock-sensitive cases in this file already get.
filter = 'test(~mixed_directed_max_attempt_failure_terminalizes_only_exhausted_contributor)'
threads-required = "num-cpus"

[[profile.default.overrides]]
# The workspace unit lane uses the default profile and discovers this lib test
# too, and that is where it has actually been failing.
filter = 'test(~mixed_directed_max_attempt_failure_terminalizes_only_exhausted_contributor)'
threads-required = "num-cpus"

[[profile.fast.overrides]]
# These process-backed monitor tests are normally sub-second, but a
# concurrently saturating topology/codegen case can starve their Tokio/process
# readers until the contract timeout. Reserve the lane; each command still
# exercises its own stdout, framing, or credential-resolution concurrency
# internally.
filter = 'test(~explicit_completion_cannot_deadlock_behind_post_complete_stdout_flood) or test(~framed_monitor_notifies_checkpoints_and_continues_until_explicit_completion) or test(~resolved_monitor_credentials_are_redacted_without_entering_durable_spec_or_output)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'test(~explicit_completion_cannot_deadlock_behind_post_complete_stdout_flood) or test(~framed_monitor_notifies_checkpoints_and_continues_until_explicit_completion) or test(~resolved_monitor_credentials_are_redacted_without_entering_durable_spec_or_output)'
threads-required = "num-cpus"

[[profile.fast.overrides]]
# Mob reconstruction mutates a process-global runtime-adapter registration.
# Keep the tool-wiring resume contract isolated from other runtime tests while
# preserving all of its internal async work.
filter = 'test(~test_resume_restores_missing_sessions_with_tool_wiring)'
threads-required = "num-cpus"

[[profile.fast.overrides]]
# These queued-fallback regressions deliberately hold one runtime apply at a
# boundary while proving that a second durable admission progresses after the
# release. Running them beside the full mob shard can starve the Tokio workers
# long enough to consume the assertion budget without exercising a product
# failure. Reserve the lane while preserving each test's internal concurrency.
filter = 'test(~test_turn_driven_submit_work_steer_queues_when_exact_boundary_is_unavailable) or test(~test_member_send_steer_queues_when_exact_boundary_is_unavailable)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'test(~test_resume_restores_missing_sessions_with_tool_wiring)'
threads-required = "num-cpus"

[[profile.fast.overrides]]
# Issue #1104: these cases bound a FULL round trip on wall clock - a prompt
# turn through accept_input_with_completion (10 s), or a MaterializeMember
# bridge reply (REPLY_TIMEOUT) - and each failed only while a saturated gate
# ran beside them (load 257 on 192 cores) and passed unchanged at low load.
# The bound measures runner load, not the property, so raising it is not a
# fix; reserve the lane instead, matching the treatment above. Each case keeps
# every internal wait and its own bound.
filter = 'binary(cold_restart_resume_after_compaction) or (binary(host_bind_ceremony) and test(=rebind_same_supervisor_identity_replaces_stale_address))'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'test(~test_turn_driven_submit_work_steer_queues_when_exact_boundary_is_unavailable) or test(~test_member_send_steer_queues_when_exact_boundary_is_unavailable)'
threads-required = "num-cpus"

[[profile.fast.overrides]]
# Raw SQLite writes are observed through filesystem notification with a
# five-second safety sweep. Keep this wall-clock fallback contract away from
# CPU-saturating topology and nested-codegen tests.
filter = 'test(~test_sqlite_event_store_subscribe_receives_raw_sqlite_append)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'test(~test_sqlite_event_store_subscribe_receives_raw_sqlite_append)'
threads-required = "num-cpus"

[[profile.fast.overrides]]
# Branch-winner mob flow tests drive full in-memory runtimes and wait on
# scheduler progress, so running them beside codegen canaries or parity audits
# can consume their terminal-state wait budget without surfacing a product
# failure. Keep each case isolated in the fast profile; the tests still execute
# their branch/join concurrency internally.
filter = 'test(~test_branch_winner_and_join_any_behavior) or test(~test_branch_winner_is_selected_only_after_success_allowing_fallback)'
threads-required = "num-cpus"

[[profile.fast.overrides]]
# This peer-webhook capacity test holds the admission semaphore full while a
# running target terminalizes through the REST path. It passed 10/10 in
# isolation but returned HTTP 500 once beside the saturated workspace gate,
# so reserve the lane without changing the production timeout or semantics.
filter = 'test(~rest_peer_terminal_webhook_allows_running_target_when_capacity_full)'
threads-required = "num-cpus"

[[profile.default.overrides]]
# The authoritative workspace unit gate uses the default profile.
filter = 'test(~rest_peer_terminal_webhook_allows_running_target_when_capacity_full)'
threads-required = "num-cpus"

[[profile.default.overrides]]
# System-lane tests spawn nested cargo invocations and copy binaries into
# scenario-specific target directories. Running them concurrently under a broad
# workspace nextest run causes cargo lock contention and 300s wrapper timeouts;
# the wrapper binary serializes scenarios through a process-local lock.
filter = 'binary(e2e_system_lane)'
threads-required = "num-cpus"

[[profile.default.overrides]]
# D4 / issue #260: provider_tool_use_boundary race. Reduced from ~20% to ~10%
# by drain-and-clear-dirty logic; full elimination blocked on deeper
# runtime-append synchronization work.
filter = 'test(provider_tool_use_boundary_does_not_surface_public_turn_completed_or_flush_canonical_output)'
retries = 2

[[profile.default.overrides]]
# Pre-existing pending-spawn alignment race in concurrent-spawn orchestration.
# Observed historically and by actor-cutover-3 during T5-prep. Not a
# regression introduced by this PR; retries until we land a targeted fix.
filter = 'test(test_concurrent_spawns_parallelize_provisioning)'
retries = 2

# W2-E (#264): the two retries that used to sit here for
# `audio_input_uses_product_session_factory_and_streams_provider_events`
# and `product_session_tool_call_routes_through_session_service_and_continues_provider`
# are gone. The underlying two-read race on `session.state.updated_at`
# between the consumer snapshot and the refresh task's baseline read has
# been eliminated: the realtime socket now reads its baseline atomically
# from the session's DSL-owned `SessionContextHandle` (the same authority
# the DSL emits `SessionContextAdvanced` from), so the consumer and the
# effect stream agree on the frontier by construction.
#
# PR #286 also removed the s44 retry=2 entry that had been added by
# smoke-fixes PR #285 — the lexically-orthogonal SWARM_MARKER_7F3X2A
# marker + the fix in `meerkat-openai/src/live.rs` obviated the need for
# retry absorption on that scenario.
