[package]
name = "meerkat-machine-codegen"
description = "Code generation of Meerkat machine kernels and authority modules from machine schemas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # reads meerkat-mob's and meerkat-runtime's production sources and calls meerkat-mob
    "tests/render_contracts.rs",
    # compares the generated alphabets with meerkat-runtime's and meerkat-mob's catalogs
    "tests/runtime_alphabet_parity.rs",
    # compares production schemas of meerkat-runtime, meerkat-mob, meerkat-schedule and
    # meerkat-workgraph and embeds meerkat-machine-kernels' generated sources
    "tests/runtime_schema_parity.rs",
]

[dependencies]
meerkat-core = { workspace = true }
meerkat-machine-schema = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# `sqlite-store` mirrors meerkat-runtime's own path-only self-dependency: the
# recovery/commit wire types in meerkat-runtime::store are gated on it, so a
# default-feature build of that crate reports them as dead code. Without this,
# `clippy -p meerkat-machine-codegen --all-targets -- -D warnings` (the
# changed-crate pre-push gate) fails inside an untouched dependency.
meerkat-runtime = { path = "../meerkat-runtime", features = ["sqlite-store"] }
meerkat-mob = { path = "../meerkat-mob" }
meerkat-schedule = { path = "../meerkat-schedule", features = ["machine-schema-exports"] }
meerkat-workgraph = { path = "../meerkat-workgraph", features = ["machine-schema-exports"] }

[lints]
workspace = true
