[package]
name = "toolkit-store"
version = "0.9.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.release]
# Core's `cargo release` (shared version, tag v{{version}}) must never bump
# this crate: its product releases on a version line of its own
# (ci/products.json).
release = false

# This crate denies unsafe code by default. The macOS custody helper has one
# audited FFI exception; other crates retain the workspace-wide prohibition.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"

[dependencies]
async-trait.workspace = true
hex = "0.4"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["functions"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
