[package]
name = "meerkat-comms"
description = "Inter-agent communication for Meerkat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/inbox_admission_toctou.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/inproc_canonical_peer_routing.rs",
    # live or system lane (integration-real-tests): needs provider credentials, built binaries or repository fixtures
    "tests/e2e.rs",
    # live or system lane (integration-real-tests): needs provider credentials, built binaries or repository fixtures
    "tests/router_integration.rs",
]

[dependencies]
# Internal crates
meerkat-capabilities = { workspace = true }
meerkat-core = { workspace = true }
meerkat-contracts = { workspace = true, features = ["schema"] }
meerkat-skills = { workspace = true }
inventory = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
ciborium = { workspace = true }
schemars = { workspace = true }

# Encryption/Identity
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
zeroize = "1"

# Async runtime
futures = { workspace = true }
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true, features = ["v4"] }
base64 = "0.23"
sha2 = { workspace = true }
rand_core = { version = "0.10", features = ["getrandom"] }
parking_lot = "0.13"
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "sync", "rt", "io-util", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = { workspace = true }
bytes = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.4", features = ["js"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros", "time", "test-util"] }
tempfile = { workspace = true }
ciborium = { workspace = true }
meerkat-runtime = { path = "../meerkat-runtime", features = ["test-support"] }

[features]
default = ["capability"]
capability = []
integration-real-tests = []
# Internal, not for consumers: compiles the unit tests that need the
# workspace (a crate this one cannot depend on once published). Only the
# workspace's own test builds turn it on (they pass every crate's test
# features: scripts/core-workspace-args.mjs --tests), so the published
# package compiles those tests out (ci/standalone-workspace-only.toml
# names them).
workspace-tests = []

[[test]]
name = "router_integration"
path = "tests/router_integration.rs"
required-features = ["integration-real-tests"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["integration-real-tests"]

[package.metadata.cargo-machete]
ignored = ["getrandom", "toml"]  # cfg(target_arch = "wasm32") / feature-gated

[lints]
workspace = true
