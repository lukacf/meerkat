SPECIFICATION Spec
CONSTANTS
  ApprovalLifecycleDecisionValues = {"Approve", "Deny"}
  ApprovalLifecycleRejectionReasonValues = {"NotFound", "AlreadyExists", "AlreadyDecided", "Expired", "InvalidDecision", "EmptyAllowedDecisions", "InvalidRestoredRecord", "ReviewRetired", "ReviewNotSatisfied", "ReviewPending", "AuthenticationRequired", "ConsentLinked", "ConsentMismatch", "AlreadyConsumed", "NotConsent"}
