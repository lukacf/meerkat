name: Publish docs

# Documentation represents whatever is on main. Every push to main that
# touches docs/ tells docs.rkat.ai (lukacf/meerkat, workflow
# "Publish Meta docs") to regenerate its Meta mirror from this exact
# commit. Releases do not publish documentation; a doc fix lands the moment
# it merges. The manual trigger re-sends the current main head, for example
# after a failed publication on the receiving side.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch docs.rkat.ai mirroring
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch docs.rkat.ai publication
        env:
          # The same fine-grained token the release workflow used for its
          # dispatch: contents: write on lukacf/meerkat (repository_dispatch
          # needs it), nothing on this repository.
          GH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::DOCS_PUBLISH_TOKEN is required to dispatch documentation mirroring" >&2
            exit 1
          fi
          jq -n \
            --arg sha "$SOURCE_SHA" \
            '{
              event_type: "meta-docs-updated",
              client_payload: {
                sha: $sha,
                ref: "main"
              }
            }' | gh api --method POST repos/lukacf/meerkat/dispatches --input -
          echo "Dispatched docs.rkat.ai mirroring of main at ${SOURCE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
