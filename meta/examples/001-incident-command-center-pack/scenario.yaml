scenario_id: incident-command-center
namespace: incident-command-center
listen_addr: 127.0.0.1:63210
approver_id: console-ops-lead

# Topology mutation is a deliberate, bounded opt-in. Other Meta consumers
# retain the disabled default and never see connection-management controls.
topology_control:
  mode: editable
  allow_bulk: false
  max_batch_size: 1
  allow_cross_authority: false
  receipt_limit: 64

identities:
  - identity: incident-commander
    profile: commander
    display_name: Incident Commander
    group: Coordinators
    addressable: true
    labels:
      console_watched: "true"
      console_alert_level: critical
      console_prompt_1_label: Status sweep
      console_prompt_1_value: >
        Run a status sweep for the fictional CardinalPay payments incident. Use the peers tool
        first, then use the send tool with kind "peer_request" to ask payments-sre,
        merchant-comms, and scribe for updates. Send plain-text body messages only. Then call
        inspect_service with {"service":"payments-api"} and analyze_customer_impact with
        {"cohort":"enterprise-merchants"}. Wait for at least one peer reply before answering,
        and mention which teammates you consulted in one concise operator-facing paragraph.
      console_prompt_2_label: Rollback guardrails
      console_prompt_2_value: >
        In one short sentence, summarize rollback guardrails for the fictional eu-west-1
        mitigation path.
      console_prompt_3_label: Merchant impact
      console_prompt_3_value: >
        In one short sentence, summarize current customer impact for major merchants in the
        fictional incident.
  - identity: payments-sre
    profile: payments_sre
    display_name: Payments SRE
    group: Responders
    addressable: true
    labels:
      console_watched: "true"
      console_degraded: "true"
      console_degraded_reason: elevated_error_rate
  - identity: api-investigator
    profile: api_investigator
    display_name: API Investigator
    group: Responders
    addressable: true
    labels:
      console_watched: "true"
  - identity: merchant-comms
    profile: merchant_comms
    display_name: Merchant Comms
    group: Communications
    addressable: true
    labels:
      console_watched: "true"
  - identity: merchant-success
    profile: merchant_success
    display_name: Merchant Success
    group: Communications
    addressable: true
    labels:
      console_prompt_1_label: Merchant status
      console_prompt_1_value: >
        Give a one-sentence merchant-success update for the current fictional incident. Be concise.
      console_prompt_2_label: VIP update
      console_prompt_2_value: >
        Draft a one-sentence reassurance update for enterprise merchants affected by the fictional
        CardinalPay incident.
  - identity: scribe
    profile: scribe
    display_name: Scribe
    group: Coordinators
    addressable: true
  - identity: approval-gate
    profile: approval_gate
    display_name: Approval Gate
    group: Internal
    addressable: false
  - identity: health-monitor
    profile: health_monitor
    display_name: Health Monitor
    group: Internal
    addressable: false
    labels:
      console_degraded: "true"
      console_degraded_reason: peer_unreachable

links:
  - from: incident-commander
    to: payments-sre
  - from: incident-commander
    to: merchant-comms
  - from: api-investigator
    to: payments-sre
  - from: scribe
    to: incident-commander
  - from: scribe
    to: payments-sre
  - from: scribe
    to: api-investigator
  - from: scribe
    to: merchant-comms
  - from: scribe
    to: merchant-success
  - from: merchant-comms
    to: approval-gate

routes:
  - route_key: incident-statuspage
    recipient: statuspage@example.test
    channel: status
    sink: email
    retry_max: 1
    backoff_ms: 25
    rate_limit_per_minute: 30
  - route_key: incident-major-accounts
    recipient: major-accounts@example.test
    channel: merchant
    sink: email
    retry_max: 0
    backoff_ms: 10
    rate_limit_per_minute: 20
  - route_key: incident-approvals
    recipient: approvals@example.test
    channel: approval
    sink: email
    retry_max: 0
    backoff_ms: 10
    rate_limit_per_minute: 10

deliveries:
  - recipient: statuspage@example.test
    channel: status
    idempotency_key: incident-seed-statuspage
    payload:
      subject: Seeded status page note
      message: Investigating elevated payment failures in eu-west-1.
  - recipient: major-accounts@example.test
    channel: merchant
    idempotency_key: incident-seed-major-accounts
    payload:
      subject: Seeded merchant heads-up
      message: Major accounts notification staged for review.

gating:
  - action: publish_status_update
    actor_id: merchant-comms
    risk_tier: r3
    requested_approver: console-ops-lead
    approval_recipient: approvals@example.test
    approval_channel: approval
    approval_timeout_ms: 600000
    rationale: Needs review before external publication
    entity: incident
    topic: cardinalpay-payments

smoke:
  watched_identities:
    - incident-commander
    - payments-sre
    - api-investigator
    - merchant-comms
  degraded_identities:
    - payments-sre
    - health-monitor
  critical_identities:
    - incident-commander
  prompts:
    tool_sweep: >
      Run a status sweep for the fictional CardinalPay payments incident. Use the peers tool
      first, then use the send tool with kind "peer_request" to contact payments-sre,
      merchant-comms, and scribe. Send plain-text body messages only. Then call
      inspect_service with {"service":"payments-api"} and analyze_customer_impact with
      {"cohort":"enterprise-merchants"}. Wait for at least one peer reply before answering,
      and mention which teammates you consulted in one concise operator-facing paragraph.
    delegate_probe: >
      Create one visible worker meerkat in the existing incident-command-center mob using the
      worker profile and your mob tools. Do not create a new profile or a new mob. Ask it to
      summarize one fictional payments-api rollback risk, then answer in one sentence with the
      created worker identity and what it was asked to check.
    merchant_status: >
      Give a one-sentence merchant-success update for the current fictional incident. Be concise.
    alpha_follow_up: >
      Panel alpha follow-up: in one short sentence, summarize rollback guardrails for the
      fictional eu-west-1 mitigation path.
    bravo_follow_up: >
      Panel bravo follow-up: in one short sentence, summarize current customer impact for
      major merchants in the fictional incident.
