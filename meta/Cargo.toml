[workspace]
members = [
    "crates/meerkat-meta",
    "crates/meta-extension-state",
    "crates/meta-store-conformance",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.9.5"
authors = ["Luka Crnkovic-Friis"]
repository = "https://github.com/lukacf/meerkat-meta"
homepage = "https://docs.rkat.ai/meta/introduction"
documentation = "https://docs.rkat.ai/meta/introduction"
keywords = ["agent", "llm", "ai", "meerkat", "orchestration"]
categories = ["development-tools", "api-bindings"]
rust-version = "1.94.0"
description = "Companion orchestration platform for the Meerkat multi-agent runtime"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Lint groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Hard denies
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
mutex_integer = "deny"
mutex_atomic = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "allow"
print_stderr = "allow"

# Pedantic allows (noisy or inapplicable)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
return_self_not_must_use = "allow"
manual_string_new = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
missing_fields_in_debug = "allow"
unreadable_literal = "allow"
float_cmp = "allow"
single_match_else = "allow"
similar_names = "allow"
doc_markdown = "allow"
match_bool = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
# Large async orchestration futures are expected here (meerkat allows this too);
# boxing every one is noise. meerkat 0.7.4 nudged an rpc dispatch future over the limit.
large_futures = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
needless_pass_by_value = "allow"
needless_continue = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
struct_field_names = "allow"
doc_link_with_quotes = "allow"
missing_const_for_fn = "allow"
default_trait_access = "allow"
let_underscore_untyped = "allow"
allow_attributes_without_reason = "allow"
ignore_without_reason = "allow"
manual_let_else = "allow"
unused_async = "allow"
assigning_clones = "allow"
format_push_string = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
map_unwrap_or = "allow"
case_sensitive_file_extension_comparisons = "allow"
ref_option = "allow"
# Cargo
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "Release v{{version}}"
pre-release-hook = ["bash", "-c", "$(git rev-parse --show-toplevel)/scripts/release-hook.sh {{version}}"]
publish = false
push = true

# The release gateway binary is built fast on purpose. opt-level 1 keeps an
# I/O-bound orchestration server plenty fast at runtime while compiling far
# quicker — and using far less memory — than opt-level 3. Together with
# per-target build caching and larger macOS runners, this keeps the release
# binary build inside its time budget. Profile settings apply only within this
# workspace; downstream consumers of the published crate use their own profiles.
[profile.release]
opt-level = 1

# Release-build memory workaround for the machine-authority schema crate.
#
# `meerkat-machine-schema` expands the `machine!` DSL into single, enormous
# generated functions: `MeerkatMachine::apply()` is one `match` with 265 arms
# and `MobMachine::apply()` one with 121. At opt-level >= 1 LLVM's CFG/dominance
# and dataflow passes balloon past available RAM on those single functions and
# OOM-kill rustc during the `--release` gateway-binary build — this is what made
# every 0.7.x `Build gateway binary` CI leg fail (it errored even with
# codegen-units=256, because codegen-units cannot split one function). opt-level=0
# skips those passes and compiles the crate cheaply (~5.8 GB peak vs OOM).
#
# This crate is cold-path machine-authority schema/transition code, so dropping
# its optimization below the workspace default has no measurable effect on the
# gateway's runtime hot path.
[profile.release.package.meerkat-machine-schema]
opt-level = 0

# Same memory workaround, same reasoning, for the other meerkat mega-crates:
# each is one enormous rustc/LLVM invocation (meerkat-runtime ~107 modules in
# one compile) that at opt-level 1 drives LLVM past hosted-runner RAM. The
# v0.7.22 GHA binary matrix lost 4/5 legs to rustc SIGKILL / "rustc-LLVM
# ERROR: out of memory" on these crates even with CARGO_BUILD_JOBS=2. They are
# cold-path, I/O-bound orchestration crates (the bazel-era release proved
# opt-0 has no measurable runtime effect and turns 40-100 min LLVM runs into
# seconds). The gateways' own crate (meerkat-meta) stays at the workspace
# opt-level.
[profile.release.package.meerkat-core]
opt-level = 0

[profile.release.package.meerkat-runtime]
opt-level = 0

[profile.release.package.meerkat-mob]
opt-level = 0

[profile.release.package.meerkat-live]
opt-level = 0
