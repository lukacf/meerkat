      - name: Real-binary system lane
        run: make e2e-system

  sdk-web:
    name: Web SDK build + tests
    needs: e2e-system
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install wasm-pack
        shell: bash
        # Through the GitHub API with the job's token first, from the
        # anonymous release URL only when there is no token or that fails
        # (scripts/ci-release-asset-download).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          fetched=false
          if scripts/ci-release-asset-download wasm-bindgen/wasm-pack "v${version}" "${archive}" "/tmp/${archive}"; then
            fetched=true
          fi
          unset GH_TOKEN
          if [[ "${fetched}" != true ]]; then
            curl --fail --location --retry 5 --retry-delay 2 \
              "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
              --output "/tmp/${archive}"
          fi
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-sdk-web
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"

      - name: Web SDK build and tests
        run: make test-sdk-web

  wasm-contract:
    name: WASM browser contract
    needs: dense-topology
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      # Link the 8 MiB wasm stack sdks/web/scripts/build-wasm.mjs asks for.
      # At the 1 MiB default this unoptimized test build overflows the stack
      # in its first turn ("RuntimeError: memory access out of bounds").
      # No published @rkat/web has ever shipped this stack. Releases before
      # 0.7.0 never asked for it, and every release since the flag was
      # introduced (0.7.0) through 0.8.44 lost it to an ambient RUSTFLAGS and
      # shipped 1 MiB (#1211 fixes the release build).
      RUSTFLAGS: '--cfg getrandom_backend="wasm_js" -C link-arg=-zstack-size=8388608'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        shell: bash
        # Through the GitHub API with the job's token first, from the
        # anonymous release URL only when there is no token or that fails
        # (scripts/ci-release-asset-download).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          fetched=false
          if scripts/ci-release-asset-download wasm-bindgen/wasm-pack "v${version}" "${archive}" "/tmp/${archive}"; then
            fetched=true
          fi
          unset GH_TOKEN
          if [[ "${fetched}" != true ]]; then
            curl --fail --location --retry 5 --retry-delay 2 \
              "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
              --output "/tmp/${archive}"
          fi
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-wasm-contract
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"

      - name: Build browser contract test (wasm32)
        run: ./scripts/repo-cargo test -p meerkat-web-runtime --target wasm32-unknown-unknown --test browser_contract --no-run

      - name: Browser contract test (headless Chrome)
        run: wasm-pack test --headless --chrome crates/meerkat-web-runtime --test browser_contract

  release-packaging:
    name: Release packaging dry-run
    needs: gcp-buildbuddy
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      # Four slots of four Cargo jobs ran up to 16 rustc processes, each slot
      # building its own copy of the heavy crates in its own target
      # directory, and the 16 GB runner lost the job every night from
      # 2026-10-05 (at about 70 minutes from 10-13, when the mob-family
      # slots overlapped). Two slots of two jobs keep at most four alive.
      MEERKAT_RELEASE_PACKAGING_JOBS: "2"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-packaging
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"

      - name: Check Rust release packaging
        run: make check-rust-release-packaging

  audit:
    name: Security audit
    needs: sdk-web
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Install cargo-deny
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: cargo-deny
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Cargo deny
        run: make audit

  meta-docs-lag:
    name: Meta docs mirror lag
    needs: release-packaging
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    steps:
      # The lag is read from this repository's own history (Meta's docs
      # are meta/docs here), so the checkout needs all of it: a shallow
      # checkout cannot place the mirrored commit and fails as "lag unknown"
      # rather than report zero lag.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Compare the mirrored commit with the main commits that changed meta/docs
        run: |
          set -euo pipefail
          python3 scripts/check-meta-docs-lag.py \
            --manifest docs/meta/_source.json \
            --max-lag 0
