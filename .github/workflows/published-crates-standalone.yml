name: Published crates standalone

# The published crates' tests must pass from their packages alone: a
# downloader, crater or a distro packager runs plain `cargo test` in the
# unpacked package, with no repository around it and no path-only
# dev-dependency. scripts/published_crates_standalone.py census packages
# every release crate, unpacks them into a synthetic workspace that patches
# each crate to its unpacked copy, and per crate (no sibling feature
# unification):
#   - compiles the naive consumer command, `cargo test --no-run`;
#   - runs `cargo test` with the feature set the crate publishes in
#     [package.metadata.meerkat.standalone-tests] (its README prints it);
#   - compares the test names per target with the workspace's: the package
#     must run exactly the workspace's tests minus the files and tests
#     ci/standalone-workspace-only.toml declares workspace-only.
# The pull-request side is the static guard in ci.yml
# (`make check-published-crates-standalone-guard`).
#
# Runs nightly, after nightly.yml's chains have released their hosted slots,
# and on demand:
#   gh workflow run published-crates-standalone.yml --ref main
# scripts/release-require-standalone-green checks that a run on main passed
# at a given commit; it reads main runs only. The release workflow does not
# require one yet: that gate returns once a nightly run has passed and its
# duration is measured.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-crates-standalone-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.97.0
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  census:
    name: Standalone census (${{ matrix.shard }}/8)
    runs-on: ${{ fromJSON(vars.MEERKAT_CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      RUSTC_WRAPPER: sccache
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: published-crates-standalone
          # Registry only: compiled objects come from sccache.
          cache-targets: "false"

      - name: Standalone census
        run: >-
          make published-crates-standalone-census
          STANDALONE_CENSUS_OUT="${{ runner.temp }}/standalone-census"
          STANDALONE_CENSUS_ARGS="--shard ${{ matrix.shard }}/8"

      - name: Upload census report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-crates-standalone-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/standalone-census/census.json
            ${{ runner.temp }}/standalone-census/logs
          if-no-files-found: warn
          retention-days: 30

  gate:
    name: Published crates standalone gate
    needs: census
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every census shard
        env:
          CENSUS_RESULT: ${{ needs.census.result }}
        run: |
          if [[ "${CENSUS_RESULT}" != "success" ]]; then
            echo "The standalone census did not pass on every shard (result: ${CENSUS_RESULT})." >&2
            exit 1
          fi
          echo "Every published crate's tests pass from its package at ${GITHUB_SHA}."
