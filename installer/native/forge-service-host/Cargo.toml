[package]
name = "forge-service-host"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Native application composition. The executable is source-only until the
# existing owner lane qualifies this exact graph and protected installation.
[workspace]

[features]
linux-startup-controls = []

[[test]]
name = "startup_ownership"
path = "tests/startup_ownership.rs"
harness = false
required-features = ["linux-startup-controls"]

[dependencies]
forge-ghe-collections = { path = "../ghe-collections" }
forge-history-archive = { path = "../history-archive" }
# Connect 0.9.5 with the feature set of its gateway build, so both programs
# compile the same Connect library units.
meerkat-connect = { git = "https://github.com/lukacf/meerkat-connect.git", rev = "bf183e2a5e9aaaf234723d6fb2b565c4b93cf9ca", features = ["console"] }
meerkat-core = "=0.9.8"
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }

[lints.rust]
unsafe_code = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
# Exact versions in the selected Connect native-candidate lock.
libc = "=0.2.189"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time", "io-util", "net", "process"] }

# The development profile of Connect's native-candidate workspace. Profiles
# come only from the workspace root, so this application repeats them.
[profile.dev]
debug = 1

[profile.dev.package."sha2:0.10.9"]
opt-level = 3

# One Core source for the whole graph: the Core 0.9.8 commit that Connect's
# native-candidate workspace selects, never the registry release of 0.9.8.
# Connect, Meta and this application then share each Core package.
[patch.crates-io]
meerkat = { git = "https://github.com/lukacf/meerkat", rev = "a7a81ffc159c1ebdb57db5d6aecb6bc1a0d74084" }
