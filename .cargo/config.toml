# Meerkat cargo configuration

# Test-thread stack size for the debug (opt-level 0) test graph.
#
# At opt-level 0 LLVM does not colour stack slots, so a function's frame is
# the SUM of its branches' locals. The RPC router harness needed 24 MiB until
# its dispatch match, the machine control executor, the session archive
# handler and the unregister saga built their branches in their own frames
# (`meerkat_runtime::stack_relief::box_in_own_frame`); it now fits 4 MiB, and
# `rpc_dispatch_path_fits_debug_worker_stack_budget` pins that. 8 MiB keeps a
# 2x margin for the rest of the workspace's debug tests. The remaining gap to
# Rust's 2 MiB default is the turn/start path through the agent run loop;
# close that (see issue #301) before deleting this block.
[env]
RUST_MIN_STACK = "8388608"
# The bundled SQLite's lock profile, meerkat_sqlite::REQUIRED_LIBSQLITE3_FLAGS:
# no allocator statistics, one page cache per connection and no page-cache
# overflow statistics, so concurrent sessions in one process do not queue on
# SQLite's process-wide mutexes. `force` keeps a value inherited from the
# environment from replacing it. MODULE.bazel sets the same value for Bazel;
# meerkat-sqlite's lock_profile_sources test keeps the two in step.
LIBSQLITE3_FLAGS = { value = "-DSQLITE_DEFAULT_MEMSTATUS=0 -USQLITE_ENABLE_MEMORY_MANAGEMENT -DSQLITE_DISABLE_PAGECACHE_OVERFLOW_STATS", force = true }
# Arms the test-feature canaries. A crate's tests build with its test
# features (its [package.metadata.meerkat.standalone-tests] features and
# `workspace-tests` when it declares that feature), which no dev-dependency
# turns on: every test command here passes them (`node
# scripts/core-workspace-args.mjs --tests` prints them). A test build of such
# a crate without them fails to compile in this repository (the const assert
# in its lib.rs reads this variable) instead of compiling the tests they gate
# out. The published packages build outside this configuration, so their
# plain `cargo test` never sees it.
MEERKAT_WORKSPACE_TEST_FEATURES = "required"

[alias]
# Machine-authority workflow entrypoint
xtask = "run -p xtask --features machine-authority --"

# Fast test suite (unit + integration-fast, skips doctests). Dedicated e2e
# lane binaries stay behind their explicit aliases below.
#
# The workspace aliases name no package selection: Cargo then builds the
# workspace's default members, which are Core's (Cargo.toml default-members;
# the CI planner and scripts/core-workspace-args.mjs refuse a workspace whose
# default members are not exactly Core's members). `--workspace` would add the
# other products' packages and their feature requests on Core's crates; their
# own lanes test them.
#
# The test aliases pass every Core member's test features (the `--features`
# that `node scripts/core-workspace-args.mjs --tests` prints; no
# dev-dependency turns them on, and a test build without them fails to
# compile). make ci-lanes-selftest fails when a list here differs from it.
fast = [
  "nextest",
  "run",
  "--features",
  "meerkat/local-authorization,meerkat/session-store,meerkat/session-compaction,meerkat/jsonl-store,meerkat/memory-store,meerkat/memory-store-session,meerkat/comms,meerkat/mcp,meerkat/skills,meerkat/schedule,meerkat/workgraph,meerkat/atif,meerkat/workspace-tests,meerkat-auth-core/workspace-tests,meerkat-authorization/workspace-tests,meerkat-comms/workspace-tests,meerkat-core/workspace-tests,meerkat-llm-core/workspace-tests,meerkat-mcp/workspace-tests,meerkat-mob/test-support,meerkat-openai/workspace-tests,meerkat-rpc/workspace-tests,meerkat-runtime/test-support,meerkat-runtime/sqlite-store,meerkat-runtime/live,meerkat-runtime/local-authorization",
  "--profile",
  "fast",
  "--show-progress",
  "none",
  "--status-level",
  "none",
  "--final-status-level",
  "fail",
]
rct = [
  "nextest",
  "run",
  "--features",
  "meerkat/local-authorization,meerkat/session-store,meerkat/session-compaction,meerkat/jsonl-store,meerkat/memory-store,meerkat/memory-store-session,meerkat/comms,meerkat/mcp,meerkat/skills,meerkat/schedule,meerkat/workgraph,meerkat/atif,meerkat/workspace-tests,meerkat-auth-core/workspace-tests,meerkat-authorization/workspace-tests,meerkat-comms/workspace-tests,meerkat-core/workspace-tests,meerkat-llm-core/workspace-tests,meerkat-mcp/workspace-tests,meerkat-mob/test-support,meerkat-openai/workspace-tests,meerkat-rpc/workspace-tests,meerkat-runtime/test-support,meerkat-runtime/sqlite-store,meerkat-runtime/live,meerkat-runtime/local-authorization",
  "--profile",
  "fast",
  "--show-progress",
  "none",
  "--status-level",
  "none",
  "--final-status-level",
  "fail",
]

# Unit tests only (no integration tests, skips doctests)
unit = "nextest run --lib --features meerkat/local-authorization,meerkat/session-store,meerkat/session-compaction,meerkat/jsonl-store,meerkat/memory-store,meerkat/memory-store-session,meerkat/comms,meerkat/mcp,meerkat/skills,meerkat/schedule,meerkat/workgraph,meerkat/atif,meerkat/workspace-tests,meerkat-auth-core/workspace-tests,meerkat-authorization/workspace-tests,meerkat-comms/workspace-tests,meerkat-core/workspace-tests,meerkat-llm-core/workspace-tests,meerkat-mcp/workspace-tests,meerkat-mob/test-support,meerkat-openai/workspace-tests,meerkat-rpc/workspace-tests,meerkat-runtime/test-support,meerkat-runtime/sqlite-store,meerkat-runtime/live,meerkat-runtime/local-authorization --show-progress none --status-level none --final-status-level fail"

# Integration-fast tests only (ignored tests are not run). Exclude the
# dedicated e2e lane wrapper binaries; they have their own CI jobs and are not
# appropriate for the fast lane.
int = [
  "nextest",
  "run",
  "--tests",
  "--features",
  "meerkat/local-authorization,meerkat/session-store,meerkat/session-compaction,meerkat/jsonl-store,meerkat/memory-store,meerkat/memory-store-session,meerkat/comms,meerkat/mcp,meerkat/skills,meerkat/schedule,meerkat/workgraph,meerkat/atif,meerkat/workspace-tests,meerkat-auth-core/workspace-tests,meerkat-authorization/workspace-tests,meerkat-comms/workspace-tests,meerkat-core/workspace-tests,meerkat-llm-core/workspace-tests,meerkat-mcp/workspace-tests,meerkat-mob/test-support,meerkat-openai/workspace-tests,meerkat-rpc/workspace-tests,meerkat-runtime/test-support,meerkat-runtime/sqlite-store,meerkat-runtime/live,meerkat-runtime/local-authorization",
  "--profile",
  "fast",
  "--show-progress",
  "none",
  "--status-level",
  "none",
  "--final-status-level",
  "fail",
]

# Canonical e2e lanes
e2e-fast = "nextest run -p meerkat-integration-tests --test e2e_fast_lane --no-fail-fast --show-progress none --status-level none --final-status-level fail"
e2e-build = "nextest run -p meerkat-integration-tests --test e2e_build_lane --run-ignored ignored-only --no-fail-fast --show-progress none --status-level none --final-status-level fail --test-threads=1"
e2e-system = "nextest run -p meerkat-integration-tests --test e2e_system_lane --run-ignored ignored-only --no-fail-fast --no-capture --show-progress none --status-level all --final-status-level fail"
e2e-live = "nextest run -p meerkat-integration-tests --test e2e_live_lane --run-ignored ignored-only --no-fail-fast --show-progress none --status-level none --final-status-level fail --test-threads=1"
e2e-smoke = "nextest run -p meerkat-integration-tests --test e2e_smoke_lane --run-ignored ignored-only --no-fail-fast --show-progress none --status-level none --final-status-level fail --test-threads=3"
e2e-models = "nextest run -p meerkat-integration-tests --test e2e_models_lane --run-ignored ignored-only --no-fail-fast --show-progress none --status-level none --final-status-level fail --test-threads=1"
e2e-auth = "nextest run -p meerkat-integration-tests --test e2e_auth_lane --run-ignored ignored-only --no-fail-fast --show-progress none --status-level none --final-status-level fail --test-threads=1"

# Temporary compatibility shims during lane migration.
int-real = "!./scripts/repo-cargo e2e-system"
e2e = "!./scripts/repo-cargo e2e-live && ./scripts/repo-cargo e2e-smoke"

# Feature matrix helpers (shell aliases to make targets)
test-minimal = "!make test-minimal"
test-feature-matrix-lib = "!make test-feature-matrix-lib"
test-feature-matrix-surface = "!make test-feature-matrix-surface"
test-feature-matrix = "!make test-feature-matrix"

# Do not set a global wasm32 test runner here. Clean environments generally do
# not have `wasm-bindgen-test-runner` installed, so repository-wide Cargo
# config must not make raw `cargo test --target wasm32-unknown-unknown` depend
# on an external binary. Use explicit wasm test tooling when needed, and keep
# bare Cargo wasm lanes compile-only (`--no-run`).
