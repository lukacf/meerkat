[package]
name = "meerkat-core"
description = "Foundational agent contracts, config, and runtime-neutral logic for Meerkat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
links = "meerkat_core"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# The released recovery-migration fixture is read only by in-repo tests
# (`#[cfg(test)]` modules and integration tests), so it stays out of the
# published package.
exclude = [
    "tests/fixtures/v0_8_10_recovery_migration_session.json",
    "tests/fixtures/v0_8_10_recovery_migration_session.provenance.json",
    # Its integration test embeds the two files above, so it is excluded too.
    "tests/v0_8_10_recovery_migration.rs",
    # needs meerkat-machine-schema, which depends on this crate
    "tests/session_document_strict_read_parity.rs",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
humantime-serde = { workspace = true }
jsonschema = { workspace = true, optional = true }
schemars = { workspace = true }
strum = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
parking_lot = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs4 = "0.13"
getrandom = "0.4"
tokio = { workspace = true }
toml_edit = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }
wasm-bindgen = "0.2.116"
js-sys = "0.3"
web-time = { version = "1", features = ["serde"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde", "js"] }

[features]
default = ["schema", "jsonschema"]
schema = []
jsonschema = ["dep:jsonschema"]
__meerkat-facade-agent-factory-build = []
__meerkat-generated-authority-bridge = []
__meerkat-live-authority-bridge = []
test-support = []
# Internal, not for consumers: compiles the unit tests that need the
# workspace (a crate this one cannot depend on once published). Only the
# path-only self dev-dependency enables it, and `cargo package` strips that
# dev-dependency, so the published package compiles those tests out
# (ci/standalone-workspace-only.toml names them).
workspace-tests = []

[dev-dependencies]
# Enables `workspace-tests` for this crate's own tests; path-only, so the
# published package does not carry it. It adds nothing else: with default
# features on, every test build would turn them back on, and a
# `--no-default-features` test build would not check the feature set it
# names.
meerkat-core = { path = ".", default-features = false, features = ["workspace-tests"] }
# Path-only (no version): dev-deps that cycle back to meerkat-core are
# stripped from the published tarball, which is the canonical cargo answer
# to dev-dependency cycles (consumers never see dev-deps).
meerkat-machine-kernels = { path = "../meerkat-machine-kernels", features = ["test-oracle"] }
meerkat-machine-schema = { path = "../meerkat-machine-schema" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }

[package.metadata.cargo-machete]
ignored = ["getrandom", "js-sys"]  # cfg(target_arch = "wasm32")

[lints]
workspace = true
