[package]
name = "meerkat-runtime"
description = "v9 runtime control-plane for Meerkat agent lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # reads meerkat-core, meerkat-machine-schema, meerkat-mcp-server and surface sources
    "tests/core_apply_terminal_truth.rs",
    # reads meerkat-contracts' wire source to pin the command manifest against the BridgeCommand enum
    "tests/supervisor_bridge_command_manifest.rs",
]

[dependencies]
meerkat-core = { workspace = true, features = ["__meerkat-generated-authority-bridge"] }
meerkat-live = { workspace = true, optional = true, features = ["__meerkat-generated-authority-bridge"] }
meerkat-llm-core = { workspace = true, optional = true }
meerkat-machine-dsl = { workspace = true }
meerkat-machine-kernels = { workspace = true }
meerkat-machine-schema = { workspace = true }
meerkat-contracts = { workspace = true }
meerkat-authorization-contracts = { workspace = true }
meerkat-authorization = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
meerkat-machine-derive = { workspace = true }
rusqlite = { workspace = true, optional = true }
meerkat-sqlite = { workspace = true, optional = true }
tracing = { workspace = true }
meerkat-store = { workspace = true, optional = true }
futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meerkat-auth-core = { workspace = true, features = ["oauth"] }
tokio = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi-util = { version = "0.1.11", optional = true }

[features]
default = []
local-authorization = ["dep:meerkat-authorization"]
live = [
    "dep:meerkat-live",
    "dep:meerkat-llm-core",
    "meerkat-core/__meerkat-live-authority-bridge",
]
sqlite-store = ["dep:rusqlite", "dep:meerkat-sqlite", "dep:meerkat-store", "meerkat-store/sqlite", "dep:winapi-util"]
test-support = []

[dev-dependencies]
meerkat-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tempfile = { workspace = true }
meerkat-store = { workspace = true, features = ["memory", "sqlite"] }
meerkat-machine-schema = { workspace = true }
meerkat-machine-kernels = { workspace = true, features = ["test-oracle"] }
meerkat-comms = { workspace = true }
# Integration tests drive the offline schema bridge directly against realms
# written by published pre-0.8.10 binaries. `test-support` lets the store's
# unit tests commit a concurrent schema change inside an open's preflight.
meerkat-sqlite = { workspace = true, features = ["test-support"] }
rusqlite = { workspace = true }

# The feature set this crate's own tests need. No dev-dependency turns
# them on: the workspace's test builds pass them (scripts/core-workspace-args.mjs
# --tests, the CI planner and the Bazel generator read them from here), the
# published package's README.md prints the command with them, and the
# standalone test lane (scripts/published_crates_standalone.py) reads them
# from here too.
#
# `sqlite-store` gates the release-boundary corpora (`recovery_contract`,
# `pre_ledger_realm_bridge`), and `live` the live-context mirror and the live
# execution authority with their unit tests: without them a package-scoped
# test run compiles those away and passes over fewer tests.
[package.metadata.meerkat.standalone-tests]
features = ["test-support", "sqlite-store", "live", "local-authorization"]
# The README's command sets this thread stack, the workspace's
# (.cargo/config.toml [env]); the suite is not checked at Rust's 2 MiB default.
min-stack = 8388608

[lints]
workspace = true
