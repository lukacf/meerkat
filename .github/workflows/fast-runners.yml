name: Fast runners

# Owner-only ephemeral GCP runner pool (scripts/fast-runners), called by
# ultrafast.yml in lukacf/meerkat and lukacf/meerkat-meta: `action: up`
# before the lanes, `action: down` after them under always().
#
# Default OFF: unless the repository variable MEERKAT_FAST_RUNNERS_ENABLED is
# 'true', no job here starts, nothing in GCP or in the repository's runner
# list changes, and callers resolve every lane to its GitHub-hosted runner.
#
# The guards below only keep ineligible runs from trying. The boundaries are
# GitHub-signed, GitHub-enforced or runner-side:
#   - the Workload Identity Federation provider admits only a token of an
#     owner workflow_dispatch of an allowlisted ultrafast.yml on
#     refs/heads/main; the launcher identity needs this file at
#     refs/heads/main on a GitHub-hosted runner in the meerkat-fast-runners
#     environment, and the delete-only teardown identity the same in the
#     meerkat-fast-teardown environment (scripts/fast-runners wif);
#   - the main ruleset (owner code review, see DESIGN.md) guards what this
#     file and the launcher scripts contain; up refuses while it is missing;
#   - both jobs run the launcher scripts from exactly the commit of this file
#     (their token's job_workflow_sha), never from main's moving tip;
#   - each VM registers one just-in-time runner with one label unique to its
#     lane, the run, the attempt and a nonce, and its job-started hook
#     (scripts/fast-runners-job-started-hook) fails, before any step, every
#     job that is not that run's owner dispatch on main.
# Actions are pinned to commit SHAs.

on:
  workflow_call:
    inputs:
      action:
        description: up (create this run's runners) or down (delete them).
        required: true
        type: string
      backend:
        description: auto (pool when it comes up, else GitHub-hosted), fast (pool or fail), hosted (never the pool).
        required: false
        default: auto
        type: string
      runners:
        description: JSON list of {"lane", "class"}, one runner per pool lane; up and down must pass the same value.
        required: true
        type: string
      up_backend:
        description: For down, the backend up reported (empty when up was cancelled or crashed).
        required: false
        default: ""
        type: string
    outputs:
      backend:
        description: fast when this run's runners are online, otherwise hosted.
        value: ${{ jobs.runners-up.outputs.backend || 'hosted' }}
      runs_on:
        description: JSON object mapping each pool lane to its own runner label ({} when hosted).
        value: ${{ jobs.runners-up.outputs.runs_on || '{}' }}
      attempt:
        description: The run attempt the runners were made for.
        value: ${{ jobs.runners-up.outputs.attempt || '0' }}

permissions:
  contents: read
  id-token: write

jobs:
  runners-up:
    name: Runners up
    if: >-
      ${{ inputs.action == 'up'
          && inputs.backend != 'hosted'
          && vars.MEERKAT_FAST_RUNNERS_ENABLED == 'true'
          && github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && github.repository_owner == 'lukacf'
          && github.actor == 'lukacf'
          && github.triggering_actor == 'lukacf'
          && (github.repository == 'lukacf/meerkat' || github.repository == 'lukacf/meerkat-meta') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # GitHub-side gate independent of this file's content: the environment's
    # deployment branch policy admits only main, and the launcher identity
    # requires the environment claim. No required reviewers.
    environment: meerkat-fast-runners
    outputs:
      backend: ${{ steps.up.outputs.backend || steps.fallback.outputs.backend }}
      runs_on: ${{ steps.up.outputs.runs_on || steps.fallback.outputs.runs_on }}
      attempt: ${{ steps.up.outputs.attempt || steps.fallback.outputs.attempt }}
    env:
      MEERKAT_FAST_RUNNERS_ENABLED: ${{ vars.MEERKAT_FAST_RUNNERS_ENABLED }}
      MEERKAT_FAST_RUNNERS_APP_ID: ${{ vars.MEERKAT_FAST_RUNNERS_APP_ID }}
      MEERKAT_FAST_RUNNERS_PROJECT: ${{ vars.MEERKAT_FAST_RUNNERS_PROJECT }}
      FAST_RUNNERS_BACKEND: ${{ inputs.backend }}
      FAST_RUNNERS_SPEC: ${{ inputs.runners }}
      FAST_RUNNERS_CODEOWNERS_CALLER: fast-runners-caller/.github/CODEOWNERS
      FAST_RUNNERS_CODEOWNERS_LAUNCHER: fast-runners-launcher/.github/CODEOWNERS
    steps:
      # The launcher scripts come from exactly the commit of this workflow
      # file (the job_workflow_sha of this job's GitHub-signed token), never
      # from main's current tip, and that commit must be on main.
      - name: Resolve the launcher commit
        id: launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$(curl -fsS -H @<(printf 'Authorization: bearer %s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}") \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meerkat-fast-runners-launcher" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          sha="$(printf '%s' "${token}" | python3 -c '
          import base64, json, sys
          part = sys.stdin.read().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          if claims.get("job_workflow_ref") != "lukacf/meerkat/.github/workflows/fast-runners.yml@refs/heads/main":
              sys.exit("this job does not run the launcher at refs/heads/main")
          print(claims["job_workflow_sha"])')"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          status="$(gh api "repos/lukacf/meerkat/compare/${sha}...main" --jq .status)"
          if [[ "${status}" != "identical" && "${status}" != "ahead" ]]; then
            echo "::error::launcher commit ${sha} is not on main (${status})"
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out the launcher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lukacf/meerkat
          ref: ${{ steps.launcher.outputs.sha }}
          path: fast-runners-launcher
          persist-credentials: false
          sparse-checkout: |
            .github/CODEOWNERS
            scripts/fast-runners
            scripts/fast-runners-job-started-hook
          sparse-checkout-cone-mode: false

      # The calling repository's CODEOWNERS at the dispatched commit, for the
      # review tripwire.
      - name: Check out the caller's CODEOWNERS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: fast-runners-caller
          persist-credentials: false
          sparse-checkout: |
            .github/CODEOWNERS
          sparse-checkout-cone-mode: false

      - name: Check the trigger
        run: fast-runners-launcher/scripts/fast-runners check-trigger

      - name: Authenticate to GCP as the fast-runner launcher
        id: gcp
        continue-on-error: ${{ inputs.backend == 'auto' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.MEERKAT_FAST_RUNNERS_WIF_PROVIDER }}
          service_account: ${{ vars.MEERKAT_FAST_RUNNERS_LAUNCHER_SA }}

      # gcloud ships on the GitHub-hosted image and picks up the credentials
      # the auth step exported.
      - name: Create this run's runners
        id: up
        if: ${{ steps.gcp.outcome == 'success' }}
        continue-on-error: ${{ inputs.backend == 'auto' }}
        run: fast-runners-launcher/scripts/fast-runners up

      # Decided before any lane is queued: a lane gets either its own pool
      # label (served only by its online JIT runner) or its GitHub-hosted
      # label, never a timeout race between them.
      - name: Fall back to GitHub-hosted runners
        id: fallback
        if: ${{ steps.up.outputs.backend != 'fast' }}
        run: fast-runners-launcher/scripts/fast-runners fallback

  runners-down:
    name: Runners down
    # always(): a cancelled run still tears down. No `needs`; the caller's
    # down job runs under always() and needs up and every pool lane.
    if: >-
      ${{ always()
          && inputs.action == 'down'
          && inputs.backend != 'hosted'
          && vars.MEERKAT_FAST_RUNNERS_ENABLED == 'true'
          && github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && github.repository_owner == 'lukacf'
          && github.actor == 'lukacf'
          && github.triggering_actor == 'lukacf'
          && (github.repository == 'lukacf/meerkat' || github.repository == 'lukacf/meerkat-meta') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Its own environment selects the delete-only teardown identity: no KMS,
    # no App key, no create.
    environment: meerkat-fast-teardown
    env:
      MEERKAT_FAST_RUNNERS_ENABLED: ${{ vars.MEERKAT_FAST_RUNNERS_ENABLED }}
      MEERKAT_FAST_RUNNERS_PROJECT: ${{ vars.MEERKAT_FAST_RUNNERS_PROJECT }}
      FAST_RUNNERS_BACKEND: ${{ inputs.backend }}
      FAST_RUNNERS_SPEC: ${{ inputs.runners }}
      FAST_RUNNERS_UP_BACKEND: ${{ inputs.up_backend }}
    steps:
      - name: Resolve the launcher commit
        id: launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$(curl -fsS -H @<(printf 'Authorization: bearer %s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}") \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meerkat-fast-runners-launcher" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          sha="$(printf '%s' "${token}" | python3 -c '
          import base64, json, sys
          part = sys.stdin.read().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          if claims.get("job_workflow_ref") != "lukacf/meerkat/.github/workflows/fast-runners.yml@refs/heads/main":
              sys.exit("this job does not run the launcher at refs/heads/main")
          print(claims["job_workflow_sha"])')"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          status="$(gh api "repos/lukacf/meerkat/compare/${sha}...main" --jq .status)"
          if [[ "${status}" != "identical" && "${status}" != "ahead" ]]; then
            echo "::error::launcher commit ${sha} is not on main (${status})"
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out the launcher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lukacf/meerkat
          ref: ${{ steps.launcher.outputs.sha }}
          path: fast-runners-launcher
          persist-credentials: false
          sparse-checkout: |
            scripts/fast-runners
            scripts/fast-runners-job-started-hook
          sparse-checkout-cone-mode: false

      - name: Authenticate to GCP as the teardown identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.MEERKAT_FAST_RUNNERS_WIF_PROVIDER }}
          service_account: ${{ vars.MEERKAT_FAST_RUNNERS_TEARDOWN_SA }}

      # Deletes by the deterministic names up uses, so it also cleans up
      # after an up that failed or was cancelled half way. The VMs' GCE
      # max-run-duration and the scheduled reaper delete anything this misses.
      - name: Delete this run's runners
        run: fast-runners-launcher/scripts/fast-runners down
