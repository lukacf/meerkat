[package]
name = "codemob-mcp"
version = "0.0.1"
edition = "2021"
publish = false

[workspace]  # standalone, not part of the main workspace

[[bin]]
name = "codemob-mcp"
path = "src/main.rs"

[dependencies]
meerkat = { path = "../../crates/meerkat", features = ["comms", "session-compaction", "memory-store-session"] }
meerkat-core = { path = "../../crates/meerkat-core" }
meerkat-mob = { path = "../../crates/meerkat-mob" }
meerkat-mob-mcp = { path = "../../crates/meerkat-mob-mcp" }
meerkat-session = { path = "../../crates/meerkat-session" }
meerkat-runtime = { path = "../../crates/meerkat-runtime", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
meerkat-client = { path = "../../crates/meerkat-client" }

# Exercise real multi-step provenance validation within the unchanged test deadlines.
[profile.test.package.meerkat-mob]
opt-level = 1
