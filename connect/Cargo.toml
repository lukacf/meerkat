[workspace]
members = ["crates/toolkit-package"]
exclude = ["native-candidate", "crates/meerkat-connect", "crates/toolkit-catalog", "crates/meerkat-toolkit", "crates/toolkit-mobkit", "crates/toolkit-mcp", "crates/toolkit-store"]
resolver = "2"

[workspace.package]
version = "0.9.4"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
toolkit-package = { path = "crates/toolkit-package" }
toolkit-store = { path = "crates/toolkit-store" }
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 1
