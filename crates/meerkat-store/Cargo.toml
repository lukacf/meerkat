[package]
name = "meerkat-store"
description = "Session persistence for Meerkat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # checks the packaged corpus copy against its owner in meerkat-runtime, which the package cannot reach
    "tests/released_0810_corpus_copy.rs",
]

[dependencies]
meerkat-core = { workspace = true }
meerkat-schedule = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
rusqlite = { workspace = true }
meerkat-sqlite = { workspace = true }
dirs = { workspace = true }
fs4 = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }

[dev-dependencies]
meerkat-store-conformance = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
toml = { workspace = true }

[features]
default = ["jsonl", "memory"]
jsonl = []
memory = []
sqlite = []

[package.metadata.cargo-machete]
ignored = ["toml"]  # dev-dependency used in tests

[lints]
workspace = true
