name: Meta release
# DRAFT for the 0.9.9 monorepo (Meta under meta/, one Cargo workspace).
#
# Meta's own release line: tags meta-vX.Y.Z, independent of Core's vX.Y.Z.
# It publishes ONLY Meta's packages: crates meta-extension-state then
# meerkat-meta (scripts/release-meta-crates.sh), PyPI meerkat-meta, npm
# @rkat/meta-sdk, and the gateway archives. It never publishes a Core crate,
# and its GitHub release is never "latest" (only Core's is: the Homebrew update
# and Core's SDK downloads depend on that).
#
# Adapted from lukacf/meerkat-meta's release.yml (the candidate protocol is
# kept unchanged: tags validate only; `make -C meta release-candidate` builds
# immutable tiers from the merged main commit, `make -C meta release-promote`
# publishes the accepted bytes). Monorepo changes:
#   - every Meta script runs from meta/scripts (meta-release-candidate patch:
#     repository lukacf/meerkat, workflow meta-release.yml, tag prefix meta-v,
#     version from meta/crates/meerkat-meta/Cargo.toml, --latest=false);
#   - floor_check: Meta's published-floor check (the packaged Meta crates
#     resolve and build, libraries and binaries, against crates.io Core at
#     the versions they declare) gates every publication of a promotion and
#     the crates of a registry retry. A candidate's core tier runs it only
#     when Core's crates are already published, and binds the record a
#     promotion reuses while it still holds; otherwise the promotion builds.
#     It replaces the old cold `cargo package` verify build (11.6 min of the
#     0.9.5 promote run), which built the same targets;
#   - artifacts build from the workspace at the candidate's commit, so the
#     gateways embed its in-tree Core: the candidate manifest binds the tree
#     of crates/ at that commit, and promotion refuses unless it equals the
#     tree of Core's tag of the version Meta declares (`v<Core>:crates`). A
#     candidate may therefore build before Core's tag exists, and a lockstep
#     release from one commit always qualifies. Registry mode (building in
#     the floor-check scratch workspace) is not wired in this draft;
#   - the gateways build with the named profile `release-meta` (Meta's former
#     [profile.release]: opt-level 1, opt-level 0 for the mega crates), which
#     the root Cargo.toml defines; the old step that appended overrides to
#     Cargo.toml is gone;
#   - crates publish through scripts/release-publish-rust-crates.sh with
#     MEERKAT_RELEASE_CRATE_LIST=scripts/release-meta-crates.sh and
#     MEERKAT_CRATE_PUBLISH_PATCH=false, bound to the checksums
#     verify_crate_packages records.
# Owner decisions still open (plan-v2 section 10): per-product release
# environments for the publish tokens (release-meta), and whether the floor
# check is required on every Meta PR or only here.

on:
  push:
    tags:
      - "meta-v*"
  workflow_dispatch:
    inputs:
      release_mode:
        description: "existing: validate/registry retry; candidate: build only; promote: accepted bytes; assets: add-only recovery"
        required: false
        default: existing
        type: choice
        options: [existing, candidate, promote, assets]
      source_sha:
        description: "Candidate only: exact merged-main release commit (must equal dispatch SHA)"
        required: false
        default: ""
        type: string
      artifact_selection:
        description: "Promotion/recovery only: explicit versioned immutable artifact selection JSON"
        required: false
        default: ""
        type: string
      publish_release_packages:
        description: "Publish Rust/Python/TypeScript artifacts to registries"
        required: false
        default: false
        type: boolean
      registry_dry_run:
        description: "Nonpublishing rehearsal: no GitHub, registry, or docs writes"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Explicit existing meta-v tag for promotion or registry/asset recovery"
        required: false
        default: ""
        type: string
      candidate_tier:
        description: "Candidate only: core (Linux x86_64/aarch64, macOS arm64) or trailing (macOS x86_64, Windows)"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: meta-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve_release:
    name: Resolve protocol and immutable source
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish_packages: ${{ steps.resolve.outputs.publish_packages }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      ci_bypass: ${{ steps.resolve.outputs.ci_bypass }}
      tier: ${{ steps.resolve.outputs.tier }}
      build_matrix: ${{ steps.resolve.outputs.build_matrix }}
    steps:
      - name: Checkout immutable workflow tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Resolve release mode and source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_SELECTION: ${{ inputs.artifact_selection }}
          PUBLISH_RELEASE_PACKAGES: ${{ inputs.publish_release_packages }}
          REGISTRY_DRY_RUN: ${{ inputs.registry_dry_run }}
          RELEASE_TIER: ${{ inputs.candidate_tier }}
        run: python3 meta/scripts/release-candidate.py resolve

  # Waits (bounded) rather than refuses: the release commit's exact-main CI
  # (ci.yml on main) must be green, and so must a Meta CI run (meta-ci.yml)
  # at the commit that ran Meta's lanes. The gate polls both, the way
  # release.yml's gate does, until both are green or 120 minutes elapsed; a
  # red or cancelled run keeps it polling, because a green re-run attempt
  # counts. In the monorepo the exact-main run's plan is product-scoped; a
  # commit whose diff from the last green main left Meta alone still carries
  # Meta's rows from the run that planned them. It needs only the resolver:
  # a candidate's build legs run beside it, and collection needs both.
  require_ci_green:
    name: Require green exact-main CI
    needs: [resolve_release]
    if: >-
      !cancelled() &&
      needs.resolve_release.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.ci_run.outputs.run_id }}
      run_attempt: ${{ steps.ci_run.outputs.run_attempt }}
    steps:
      # A failed exact-main run counts for Meta only when every failure sits
      # in rows Meta does not depend on (Core's and Meta's rows count), judged
      # by the release commit's FIRST PARENT's copy of
      # scripts/ci-product-evidence.mjs, as release.yml judges it for Core:
      # the commit cannot certify its own red run with an edited
      # job-to-product table. The reader also gets the commit's changes
      # against that parent, with their status and a rename as a deletion and
      # an addition, and refuses a commit that changes what decides the
      # evidence or moves a package. A parent without the reader, or a
      # failure to list the changes, leaves only a green run counting.
      - name: Checkout the release commit and its parent
        if: ${{ needs.resolve_release.outputs.ci_bypass != 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Read the CI evidence reader of the release commit's parent
        if: ${{ needs.resolve_release.outputs.ci_bypass != 'true' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
        run: |
          set -euo pipefail
          parent_reader="${RUNNER_TEMP}/ci-evidence-parent"
          mkdir -p "${parent_reader}"
          if ! parent="$(git rev-parse --verify --quiet "${RELEASE_SHA}^1")"; then
            echo "Release commit ${RELEASE_SHA} has no parent: only a green CI run counts."
            exit 0
          fi
          if ! git show "${parent}:scripts/ci-product-evidence.mjs" > "${parent_reader}/ci-product-evidence.mjs"; then
            rm -f "${parent_reader}/ci-product-evidence.mjs"
            echo "${parent} has no product-scoped CI evidence reader: only a green CI run counts."
            exit 0
          fi
          git diff --name-status --no-renames "${parent}" "${RELEASE_SHA}" > "${parent_reader}/changed-paths.txt"
          echo "A failed CI run of ${RELEASE_SHA} is judged by ${parent}'s reader; the commit changes $(wc -l < "${parent_reader}/changed-paths.txt") path(s)."
      - name: Wait for green exact-main CI and Meta CI at this commit
        id: ci_run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
          CI_BYPASS: ${{ needs.resolve_release.outputs.ci_bypass }}
          RELEASE_MODE: ${{ needs.resolve_release.outputs.mode }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = process.env.RELEASE_SHA;
            if (process.env.CI_BYPASS === "true") {
              core.info("Dry-run dispatch with no release_tag: nothing is published. Skipping the CI check.");
              return;
            }
            // A candidate starts at the release merge (make release-prebuild),
            // beside that commit's own exact-main CI, whose cold run can take
            // longer than 120 minutes (main-unit alone may take 150): it waits
            // up to 240. Every other mode starts once CI ran and waits 120.
            const timeoutMinutes = process.env.RELEASE_MODE === "candidate" ? 240 : 120;
            const timeoutMs = timeoutMinutes * 60 * 1000;
            const pollMs = 30 * 1000;
            const started = Date.now();
            let cancelledReported = false;

            async function exactMainRuns() {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci.yml",
                branch: "main",
                event: "push",
                head_sha: ref,
                per_page: 100,
              });
              return data.workflow_runs.filter(
                (run) => run.head_sha === ref && run.head_branch === "main" && run.event === "push"
              );
            }

            // Meta's own suites (console, browser, SDK, flow editor and,
            // on pull requests, its Rust tests) run in meta-ci.yml, whose
            // "Meta gate" succeeds trivially when a push left Meta alone. The
            // release needs a green Meta CI run at this commit that ran
            // Meta's lanes: the push that reached Meta, or a dispatch on main.
            async function metaEvidence() {
              const metaRuns = [];
              for (const event of ["push", "workflow_dispatch"]) {
                const { data: listing } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "meta-ci.yml",
                  branch: "main",
                  event,
                  head_sha: ref,
                  per_page: 100,
                });
                metaRuns.push(...listing.workflow_runs.filter((run) => run.head_sha === ref && run.head_branch === "main"));
              }
              for (const run of metaRuns.filter((candidate) => candidate.status === "completed" && candidate.conclusion === "success")) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  owner,
                  repo,
                  run_id: run.id,
                  attempt_number: run.run_attempt,
                  per_page: 100,
                });
                // meta-checks runs exactly when the run reached Meta (changes'
                // meta output); warm-cache and the gate run either way.
                if (jobs.some((job) => job.name === "meta-checks" && job.conclusion === "success")) {
                  return { run, count: metaRuns.length };
                }
              }
              return { run: null, count: metaRuns.length };
            }

            // A failed exact-main run still counts for Meta when every
            // failure sits in rows Meta does not depend on (a Connect row,
            // say): its exact-tree attestation records each job's product, and
            // the release commit's parent's scripts/ci-product-evidence.mjs
            // (written by the step above with the commit's changed paths)
            // judges it, once per attempt. Anything it cannot attribute, or no
            // reader, keeps waiting for a green run.
            const parentReader = require("path").join(process.env.RUNNER_TEMP || "", "ci-evidence-parent");
            let evidence = null;
            try {
              const reader = require("path").join(parentReader, "ci-product-evidence.mjs");
              evidence = await import(require("url").pathToFileURL(reader).href);
            } catch (error) {
              core.info(`The release commit's parent has no product-scoped CI evidence reader (${error.message}); only a green run counts.`);
            }
            let changedPaths;
            try {
              changedPaths = require("fs")
                .readFileSync(require("path").join(parentReader, "changed-paths.txt"), "utf8")
                .split("\n")
                .filter((line) => line.trim());
            } catch (error) {
              core.info(`The release commit's changed paths are unknown (${error.message}); only a green run counts.`);
            }
            const verdicts = new Map();
            async function metaScopedVerdict(run) {
              const key = `${run.id}/${run.run_attempt}`;
              if (!verdicts.has(key)) {
                let verdict = { accepted: false, reasons: ["no product-scoped evidence reader"] };
                if (evidence) {
                  try {
                    const attestation = await evidence.attestationOfRun(github, {
                      owner, repo, runId: run.id, attempt: run.run_attempt, commit: ref,
                    });
                    verdict = attestation
                      ? evidence.acceptance(attestation, "meta", { changedPaths })
                      : { accepted: false, reasons: ["the attempt has no exact-tree attestation"] };
                  } catch (error) {
                    verdict = { accepted: false, reasons: [`unreadable attestation: ${error.message}`] };
                  }
                }
                verdicts.set(key, verdict);
                core.info(`CI attempt ${run.run_attempt} (${run.html_url}) ${verdict.accepted ? "is" : "is not"} enough for Meta: ${verdict.reasons.join("; ")}`);
              }
              return verdicts.get(key);
            }

            for (;;) {
              const runs = await exactMainRuns();
              if (runs.length > 0) {
                core.info(
                  runs
                    .map((run) => `CI attempt ${run.run_attempt}: ${run.status}/${run.conclusion || "pending"} (${run.html_url})`)
                    .join("\n")
                );
              } else {
                core.info(`No exact-main CI run found yet for release commit ${ref}`);
              }
              let success = runs.find((run) => run.status === "completed" && run.conclusion === "success");
              let scoped = null;
              if (!success) {
                for (const run of runs.filter((candidate) => candidate.status === "completed" && candidate.conclusion === "failure")) {
                  const verdict = await metaScopedVerdict(run);
                  if (verdict.accepted) {
                    success = run;
                    scoped = verdict;
                    break;
                  }
                }
              }
              let meta = null;
              if (success) {
                core.info(
                  scoped
                    ? `Release commit ${ref} has exact-main CI that failed only in rows Meta does not depend on: ${success.html_url}`
                    : `Release commit ${ref} has green exact-main CI: ${success.html_url}`
                );
                meta = await metaEvidence();
                if (meta.run) {
                  core.info(`Release commit ${ref} has green Meta CI with Meta's lanes: ${meta.run.html_url}`);
                  if (scoped) {
                    core.warning(`Exact-main CI at ${ref} failed (${success.html_url}), only in rows Meta does not depend on: ${scoped.reasons.join("; ")}`);
                  }
                  core.setOutput("run_id", String(success.id));
                  core.setOutput("run_attempt", String(success.run_attempt));
                  return;
                }
                core.info(`No green Meta CI run that ran Meta's lanes yet (${meta.count} run(s) found)`);
              } else {
                // ci.yml lets a newer main commit cancel an older commit's
                // first attempt unless the commit names a release; it never
                // cancels a re-run attempt, so re-running recovers.
                const cancelled = runs.find((run) => run.status === "completed" && run.conclusion === "cancelled");
                if (cancelled && !cancelledReported) {
                  cancelledReported = true;
                  core.warning(
                    `Exact-main CI at ${ref} was cancelled: ${cancelled.html_url}. ` +
                      `Re-run it with: gh run rerun ${cancelled.id} --repo ${owner}/${repo}`
                  );
                }
              }

              if (Date.now() - started >= timeoutMs) {
                core.setFailed(
                  success
                    ? `Release commit ${ref} has no green Meta CI run that ran Meta's lanes after ${timeoutMinutes} minutes ` +
                        `(${meta.count} run(s) found). Dispatch meta-ci.yml on main at this commit.`
                    : `Release commit ${ref} has no green exact-main CI after ${timeoutMinutes} minutes (${runs.length} run(s) found). ` +
                        `A tag is not evidence: fix the red, or re-run a cancelled run.`
                );
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

  release_validate:
    name: Validate Meta release state
    needs: [resolve_release, require_ci_green]
    if: >-
      !cancelled() &&
      needs.resolve_release.result == 'success' &&
      needs.require_ci_green.result == 'success' &&
      needs.resolve_release.outputs.mode != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust-ci

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meta/console/package-lock.json

      - name: Install console dependencies
        run: npm --prefix meta/console ci --silent --no-fund --no-audit

      - name: Verify embedded console bundle freshness
        run: npm --prefix meta/console run embedded:freshness --silent

      # Meta's crates and SDKs agree on one version (Meta's parity script
      # reads meerkat-meta's own version in the monorepo).
      - name: Verify Meta version parity
        run: make -C meta verify-version-parity

      - name: Check formatting
        run: ./scripts/repo-cargo fmt --all -- --check

  # The published floor (plan-v2 section 3.4): the packaged Meta crates,
  # unpacked into a scratch workspace whose [patch.crates-io] covers only
  # Meta's own crates, resolve every Core crate from crates.io at the declared
  # version and build. In a lockstep release Core publishes first: this job
  # waits (bounded) until every Core crate is in the sparse index at the
  # declared version, so no separate orchestration orders the two releases.
  # A candidate may build at the release merge, before Core's crates exist:
  # its core tier reads the index once, with no wait, and builds and binds a
  # floor record (release-candidate.py floor-bind) only when every Core crate
  # is already there; the trailing tier runs none. A promotion reuses the
  # accepted candidate's record while everything it binds still holds
  # (release-candidate.py floor-reuse) and builds otherwise. It publishes
  # nothing (GitHub release, SDK packages, crates) until this job succeeded.
  floor_check:
    name: Meta published-floor check
    needs: [resolve_release, require_ci_green]
    if: >-
      !cancelled() &&
      needs.resolve_release.result == 'success' &&
      needs.require_ci_green.result == 'success' &&
      needs.resolve_release.outputs.mode != 'tag' &&
      needs.resolve_release.outputs.mode != 'assets' &&
      (needs.resolve_release.outputs.mode != 'candidate' ||
       needs.resolve_release.outputs.tier == 'core')
    runs-on: ubuntu-24.04
    # The 60-minute wait for Core's crates, then a floor record, a
    # re-resolution and the floor build (28 to 45 minutes measured): a late
    # Core publication ends in the wait's own message, not a runner timeout.
    timeout-minutes: 120
    outputs:
      core_version: ${{ steps.declared.outputs.core_version }}
      record: ${{ steps.bind.outputs.record }}
    env:
      RELEASE_MODE: ${{ needs.resolve_release.outputs.mode }}
      RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}

      - name: Checkout immutable workflow tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools

      - uses: ./.github/actions/setup-rust-ci

      - name: Read the Core version Meta declares
        id: declared
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c '
          import json, re, sys
          meta = next(p for p in json.load(sys.stdin)["packages"] if p["name"] == "meerkat-meta")
          reqs = {d["req"] for d in meta["dependencies"] if d["name"] == "meerkat-core"}
          exact = [r[1:] for r in reqs if re.fullmatch(r"=[0-9]+\.[0-9]+\.[0-9]+", r)]
          if len(exact) != 1 or len(reqs) != 1:
              sys.exit(f"meerkat-meta declares meerkat-core as {sorted(reqs)}; expected one exact =X.Y.Z")
          print(exact[0])
          ')"
          echo "core_version=${core_version}" >> "${GITHUB_OUTPUT}"
          echo "Meta declares Core ${core_version}"

      # A candidate binds a floor record only when Core's crates are already
      # published (a Meta-only release, or a candidate dispatched after Core's
      # publication); before Core's tag it binds none, at once.
      - name: Check once whether every Core crate is on crates.io
        id: published
        if: needs.resolve_release.outputs.mode == 'candidate'
        run: python3 .release-tools/meta/scripts/release-candidate.py floor-index

      # The record comes from the accepted candidate's attested manifest,
      # verified as stage verifies it; it is `null` when the candidate bound
      # none or the manifest cannot be read, and then the floor builds.
      - name: Read the accepted candidate's floor record
        id: record
        if: needs.resolve_release.outputs.mode == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SELECTION: ${{ inputs.artifact_selection }}
        run: python3 .release-tools/meta/scripts/release-candidate.py floor-record --output "${RUNNER_TEMP}/floor-record.json"

      # What a floor build would see now, without building: the declared
      # versions re-resolved against crates.io (the resolved lock's digest),
      # and the Meta crates packaged as publication will package them. A
      # failure here only means no reuse: a crate file the registry would
      # refuse for its size gets no checksum, so the floor builds, and that
      # build fails on the size before it compiles anything.
      - name: Re-resolve the packaged Meta crates against crates.io without building
        if: steps.record.outputs.present == 'true'
        continue-on-error: true
        run: python3 scripts/published_crates_standalone.py floor --product meta --mode release --no-build --out "${RUNNER_TEMP}/meta-floor-resolve"

      - name: Package the Meta crates without a patch
        id: packaged
        if: steps.record.outputs.present == 'true'
        continue-on-error: true
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          ./scripts/repo-cargo package -p meta-extension-state -p meerkat-meta --locked --no-verify
          python3 scripts/published_crates_standalone.py package-size --product meta --package-dir "${CARGO_TARGET_DIR}/package"
          for pair in "extension_sha256:meta-extension-state" "meta_sha256:meerkat-meta"; do
            output="${pair%%:*}"; crate="${pair##*:}"
            echo "${output}=$(sha256sum "${CARGO_TARGET_DIR}/package/${crate}-${RELEASE_VERSION}.crate" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
          done

      - name: Reuse the candidate's floor record only if everything it binds still holds
        id: reuse
        if: steps.record.outputs.present == 'true'
        env:
          EXTENSION_SHA256: ${{ steps.packaged.outputs.extension_sha256 }}
          META_SHA256: ${{ steps.packaged.outputs.meta_sha256 }}
        run: >-
          python3 .release-tools/meta/scripts/release-candidate.py floor-reuse
          --record "${RUNNER_TEMP}/floor-record.json"
          --resolution "${RUNNER_TEMP}/meta-floor-resolve"
          --meta-crate-sha256 "meta-extension-state=${EXTENSION_SHA256}"
          --meta-crate-sha256 "meerkat-meta=${META_SHA256}"

      # Core publishes its crates by dependency level, meerkat-core early;
      # the floor check resolves every Core crate Meta needs, so one that
      # started while Core was mid-publication would fail at resolution. It
      # waits until every crate scripts/release-rust-crates.sh lists is in
      # the sparse index at the declared version. (A candidate never waits,
      # and a reused record needs no build.)
      - name: Wait until every Core crate is on crates.io at the declared version
        if: >-
          needs.resolve_release.outputs.mode != 'candidate' &&
          steps.reuse.outputs.reuse != 'true'
        shell: bash
        env:
          CORE_VERSION: ${{ steps.declared.outputs.core_version }}
        run: |
          set -euo pipefail
          mapfile -t crates < <(scripts/release-rust-crates.sh)
          if [[ ${#crates[@]} -eq 0 ]]; then
            echo "::error::scripts/release-rust-crates.sh lists no crate" >&2
            exit 1
          fi
          # The sparse index path of a crate name (lowercase).
          index_path() {
            local name="${1,,}"
            case "${#name}" in
              1) echo "1/${name}" ;;
              2) echo "2/${name}" ;;
              3) echo "3/${name:0:1}/${name}" ;;
              *) echo "${name:0:2}/${name:2:2}/${name}" ;;
            esac
          }
          deadline=$(( $(date +%s) + 3600 ))
          pending=("${crates[@]}")
          while :; do
            missing=()
            for crate in "${pending[@]}"; do
              if ! curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' \
                  "https://index.crates.io/$(index_path "${crate}")" \
                  | jq -es --arg v "${CORE_VERSION}" 'any(.[]; .vers == $v)' >/dev/null 2>&1; then
                missing+=("${crate}")
              fi
            done
            if [[ ${#missing[@]} -eq 0 ]]; then
              break
            fi
            if (( $(date +%s) >= deadline )); then
              echo "::error::${#missing[@]} of ${#crates[@]} Core crates are not on crates.io at ${CORE_VERSION} after 60 minutes (${missing[*]}); release Core first (lockstep: tag v${CORE_VERSION} before meta-v)" >&2
              exit 1
            fi
            echo "waiting for ${#missing[@]} of ${#crates[@]} Core crates at ${CORE_VERSION} in the crates.io index: ${missing[*]}"
            pending=("${missing[@]}")
            sleep 30
          done
          echo "every Core crate (${#crates[@]}) is on crates.io at ${CORE_VERSION}"

      - name: Build the packaged Meta crates against published Core
        if: >-
          (needs.resolve_release.outputs.mode == 'candidate' &&
           steps.published.outputs.core_published == 'true') ||
          (needs.resolve_release.outputs.mode != 'candidate' &&
           steps.reuse.outputs.reuse != 'true')
        run: python3 scripts/published_crates_standalone.py floor --product meta --mode release --out "${RUNNER_TEMP}/meta-floor"

      # The candidate's record of what that build proved; collection adds the
      # Meta crate checksums verify_crate_packages records and binds it.
      - name: Bind the floor record
        id: bind
        if: >-
          needs.resolve_release.outputs.mode == 'candidate' &&
          steps.published.outputs.core_published == 'true'
        run: python3 .release-tools/meta/scripts/release-candidate.py floor-bind --floor-dir "${RUNNER_TEMP}/meta-floor"

  build_binaries:
    name: Build gateway binaries (${{ matrix.target }})
    needs: [resolve_release]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.outputs.mode == 'candidate'
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.runs-on }}
    container: ${{ contains(matrix.target, 'unknown-linux-gnu') && 'docker.io/library/buildpack-deps:bullseye@sha256:30d62be8c0d1960899261429cd3960bccffbd075f324adae967c79f410bde24f' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_release.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          targets: ${{ matrix.target }}

      # The legs build exactly the candidate's commit, Core's tag or not:
      # collection binds the tree of crates/ they embed, and promotion
      # refuses unless it equals Core's tag of the declared version, so a
      # Meta gateway never ships unreleased Core code.
      - name: Prepare Linux release container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake_version_pin="3.31.12"
          case "$(uname -m)" in
            x86_64)
              cmake_arch="linux-x86_64"
              cmake_sha256="0dc2e9a6860f06bf10bd8fadc03e35d9eeb4df46e33763a7e480e987758f385c"
              ;;
            aarch64)
              cmake_arch="linux-aarch64"
              cmake_sha256="83f8fd91d2038a56556e1400390fcfe42f79602940c494f6c6f1cdae7f9e7f40"
              ;;
            *)
              echo "Linux release container has no pinned CMake for $(uname -m)" >&2
              exit 1
              ;;
          esac
          cmake_tarball="cmake-${cmake_version_pin}-${cmake_arch}.tar.gz"
          curl --fail --location --retry 5 --retry-delay 5 --silent --show-error \
            --output "/tmp/${cmake_tarball}" \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version_pin}/${cmake_tarball}"
          echo "${cmake_sha256}  /tmp/${cmake_tarball}" | sha256sum --check --strict
          mkdir -p /opt/cmake
          tar --extract --gzip --file "/tmp/${cmake_tarball}" --directory /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "${GITHUB_PATH}"

      # The named profile carries Meta's former [profile.release] (opt-level 1;
      # opt-level 0 for meerkat-core, meerkat-runtime, meerkat-mob,
      # meerkat-live and meerkat-machine-schema). Core's own release profile
      # is untouched. Output: target/<target>/release-meta/.
      - name: Build gateway binaries
        shell: bash
        env:
          CARGO_TARGET_DIR: target
          CARGO_BUILD_JOBS: "2"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail
          # The repository wrapper everywhere but the Bullseye release
          # container, whose Git 2.30 predates the wrapper's
          # `rev-parse --path-format=absolute` (Core's release.yml does the
          # same): there the job owns an isolated target directory and runs
          # the rustup-proxied Cargo of rust-toolchain.toml.
          cargo_cmd=(./scripts/repo-cargo)
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo_cmd=(cargo)
          fi
          "${cargo_cmd[@]}" build -p meerkat-meta --bin meta_gateway --bin rpc_gateway --bin meta_repair \
            --features openai-live --locked --profile release-meta --target "${{ matrix.target }}"

      - name: Check Linux binary portability
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ./meta/scripts/check-linux-release-binary-portability.sh \
            "target/${TARGET}/release-meta/meta_gateway" \
            "target/${TARGET}/release-meta/rpc_gateway" \
            "target/${TARGET}/release-meta/meta_repair"

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${TARGET}" in
            aarch64-apple-darwin) expected="arm64" ;;
            x86_64-apple-darwin) expected="x86_64" ;;
            *) echo "::error::no expected Mach-O architecture for ${TARGET}" >&2; exit 1 ;;
          esac
          file_pattern="^Mach-O 64-bit (executable ${expected}|${expected} executable)([^A-Za-z0-9_]|$)"
          for bin in meta_gateway rpc_gateway meta_repair; do
            path="target/${TARGET}/release-meta/${bin}"
            archs="$(/usr/bin/lipo -archs "${path}")"
            description="$(/usr/bin/file -b "${path}")"
            echo "${path}: lipo '${archs}'; file '${description}'"
            [[ "${archs}" == "${expected}" ]] || { echo "::error::${path} contains '${archs}', expected '${expected}'" >&2; exit 1; }
            [[ "${description}" =~ ${file_pattern} ]] || { echo "::error::${path} is '${description}'" >&2; exit 1; }
          done
          build="target/${TARGET}/release-meta/build"
          for library in "audiopus_sys-*/out/lib/libopus.a" "ring-*/out/libring_core_*.a" "libsqlite3-sys-*/out/libsqlite3.a"; do
            matches=(${build}/${library})
            [[ "${#matches[@]}" -gt 0 ]] || { echo "::error::no ${library} under ${build}" >&2; exit 1; }
            for archive in "${matches[@]}"; do
              archs="$(/usr/bin/lipo -archs "${archive}")"
              [[ "${archs}" == "${expected}" ]] || { echo "::error::${archive} contains '${archs}'" >&2; exit 1; }
            done
          done

      - name: Smoke-run macOS gateways
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve_release.outputs.version }}
        run: |
          set -euo pipefail
          run=()
          if [[ "${TARGET}" == "x86_64-apple-darwin" ]]; then
            if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
              sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
            fi
            run=(/usr/bin/arch -x86_64)
          fi
          for bin in meta_gateway rpc_gateway; do
            output="$(${run[@]+"${run[@]}"} "target/${TARGET}/release-meta/${bin}" --version)"
            echo "${bin}: ${output}"
            [[ "${output}" == "${bin} ${VERSION} "* ]] || { echo "::error::${bin} --version printed '${output}'" >&2; exit 1; }
          done

      - name: Ad-hoc codesign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for bin in meta_gateway rpc_gateway meta_repair; do
            /usr/bin/codesign --force --sign - "target/${{ matrix.target }}/release-meta/${bin}"
          done

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve_release.outputs.version }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BINS=("meta_gateway:meta-gateway" "rpc_gateway:meta-rpc-gateway" "meta_repair:meta-repair")
          for entry in "${BINS[@]}"; do
            bin="${entry%%:*}"; prefix="${entry##*:}"
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              src="target/${TARGET}/release-meta/${bin}.exe"
            else
              src="target/${TARGET}/release-meta/${bin}"
            fi
            [[ -f "$src" ]] || { echo "::error::missing expected binary at $src" >&2; exit 1; }
            artifact="${prefix}-${VERSION}-${TARGET}.${ARCHIVE_EXT}"
            if [[ "$ARCHIVE_EXT" == "zip" ]]; then
              7z a -tzip "dist/${artifact}" "$(cygpath -w "$src")" >/dev/null
            else
              tar -czf "dist/${artifact}" -C "$(dirname "$src")" "$(basename "$src")"
            fi
            [[ -s "dist/${artifact}" ]] || { echo "::error::archive dist/${artifact} missing or empty" >&2; exit 1; }
          done

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Retain original provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.jsonl

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta-gateway-binaries-${{ matrix.target }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  # Collection binds the core tier's floor record when its floor check bound
  # one (Core's crates were already on crates.io), completed with the Meta
  # crate checksums verify_crate_packages recorded; otherwise none, and the
  # promotion runs the floor build. The trailing tier runs no floor check.
  collect_candidate:
    name: Bind immutable candidate artifacts
    needs: [resolve_release, require_ci_green, release_validate, floor_check, verify_crate_packages, build_binaries]
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.result == 'success' &&
      needs.require_ci_green.result == 'success' &&
      needs.release_validate.result == 'success' &&
      (needs.floor_check.result == 'success' ||
       (needs.resolve_release.outputs.tier == 'trailing' &&
        needs.floor_check.result == 'skipped')) &&
      (needs.verify_crate_packages.result == 'success' ||
       (needs.verify_crate_packages.result == 'skipped' &&
        needs.floor_check.outputs.record == '')) &&
      needs.build_binaries.result == 'success' &&
      needs.resolve_release.outputs.mode == 'candidate'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ needs.resolve_release.outputs.mode }}
      RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
      RELEASE_TIER: ${{ needs.resolve_release.outputs.tier }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0

      - name: Collect verified original artifacts
        env:
          CI_RUN_ID: ${{ needs.require_ci_green.outputs.run_id }}
          CI_RUN_ATTEMPT: ${{ needs.require_ci_green.outputs.run_attempt }}
          FLOOR_RECORD: ${{ needs.floor_check.outputs.record }}
          EXTENSION_SHA256: ${{ needs.verify_crate_packages.outputs.extension_sha256 }}
          META_SHA256: ${{ needs.verify_crate_packages.outputs.meta_sha256 }}
        run: |
          floor=()
          if [[ -n "$FLOOR_RECORD" ]]; then
            floor=(--floor-record-json "$FLOOR_RECORD"
                   --meta-crate-sha256 "meta-extension-state=$EXTENSION_SHA256"
                   --meta-crate-sha256 "meerkat-meta=$META_SHA256")
          fi
          python3 meta/scripts/release-candidate.py collect --output-dir candidate \
            --ci-run-id "$CI_RUN_ID" --ci-run-attempt "$CI_RUN_ATTEMPT" --tier "$RELEASE_TIER" "${floor[@]}"

      - name: Attest candidate manifest
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: candidate/candidate-manifest*.json

      - name: Retain manifest provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" candidate/provenance.jsonl

      - name: Upload immutable candidate manifest
        id: manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta-candidate-manifest-${{ github.run_attempt }}
          path: candidate/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Emit explicit acceptance selection
        env:
          ARTIFACT_ID: ${{ steps.manifest.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.manifest.outputs.artifact-digest }}
        run: |
          manifest="candidate/candidate-manifest.json"
          if [[ "$RELEASE_TIER" != "core" ]]; then
            manifest="candidate/candidate-manifest-${RELEASE_TIER}.json"
          fi
          python3 meta/scripts/release-candidate.py selection \
            --manifest-file "$manifest" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  verify_release_assets:
    name: Verify selected or published original bytes
    needs: [resolve_release, release_validate]
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.result == 'success' &&
      needs.release_validate.result == 'success' &&
      (needs.resolve_release.outputs.mode == 'promote' ||
       (needs.resolve_release.outputs.mode == 'existing' &&
        needs.resolve_release.outputs.publish_packages == 'true' &&
        needs.resolve_release.outputs.dry_run == 'false'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ needs.resolve_release.outputs.mode }}
      RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
      ARTIFACT_SELECTION: ${{ inputs.artifact_selection }}
      REGISTRY_DRY_RUN: ${{ needs.resolve_release.outputs.dry_run }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0
      - name: Checkout immutable workflow tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
      # stage also fetches Core's tag of the declared version and refuses a
      # candidate whose bound crates/ tree differs from that tag's.
      - name: Verify selected candidate
        if: needs.resolve_release.outputs.mode == 'promote'
        run: python3 .release-tools/meta/scripts/release-candidate.py stage --output-dir release-assets --proof-dir release-proofs
      - name: Verify existing published assets without writes
        if: needs.resolve_release.outputs.mode == 'existing'
        run: python3 .release-tools/meta/scripts/release-candidate.py verify-published

  # A promotion publishes only after the floor check succeeded; the SDK
  # packages and the crates wait for this job, so every Meta publication of a
  # promotion does too. Assets-mode recovery adds to a published release and
  # runs no floor check.
  publish_github_release:
    name: Add original release assets without replacement
    needs: [resolve_release, release_validate, verify_release_assets, floor_check]
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.result == 'success' &&
      needs.release_validate.result == 'success' &&
      needs.resolve_release.outputs.dry_run == 'false' &&
      ((needs.resolve_release.outputs.mode == 'promote' &&
        needs.verify_release_assets.result == 'success' &&
        needs.floor_check.result == 'success') ||
       (needs.resolve_release.outputs.mode == 'assets' &&
        needs.resolve_release.outputs.publish_packages == 'false'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ needs.resolve_release.outputs.mode }}
      RELEASE_SHA: ${{ needs.resolve_release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.tag }}
      ARTIFACT_SELECTION: ${{ inputs.artifact_selection }}
      REGISTRY_DRY_RUN: ${{ needs.resolve_release.outputs.dry_run }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
          fetch-depth: 0
      - name: Checkout immutable workflow tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
      # The release is created as a draft and published with --latest=false
      # (meta-release-candidate patch): Core's release stays latest.
      - name: Reverify original candidate before publication
        if: needs.resolve_release.outputs.mode == 'promote'
        run: python3 .release-tools/meta/scripts/release-candidate.py stage --output-dir release-assets --proof-dir release-proofs
      - name: Publish exact original archives
        if: needs.resolve_release.outputs.mode == 'promote'
        run: python3 .release-tools/meta/scripts/release-candidate.py publish --assets-dir release-assets --proof-dir release-proofs
      - name: Recover explicitly selected missing original assets
        if: needs.resolve_release.outputs.mode == 'assets'
        run: python3 .release-tools/meta/scripts/release-candidate.py recover

  publish_sdk_packages:
    name: Publish Meta SDK packages
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.result == 'success' &&
      needs.release_validate.result == 'success' &&
      needs.resolve_release.outputs.publish_packages == 'true' &&
      ((needs.resolve_release.outputs.mode == 'existing' &&
        (needs.resolve_release.outputs.dry_run == 'true' ||
         needs.verify_release_assets.result == 'success')) ||
       (needs.resolve_release.outputs.mode == 'promote' &&
        needs.verify_release_assets.result == 'success' &&
        (needs.resolve_release.outputs.dry_run == 'true' ||
         needs.publish_github_release.result == 'success')))
    needs: [resolve_release, release_validate, verify_release_assets, publish_github_release]
    runs-on: ubuntu-24.04
    # environment: release-meta   # owner decision (plan-v2 section 4.8)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - name: Install Python tooling
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Publish Python SDK
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: meta/sdk/python
        run: |
          set -euo pipefail
          DRY_RUN="${{ needs.resolve_release.outputs.dry_run }}"
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Python SDK dry-run: skipping upload"
          else
            python -m twine upload --skip-existing dist/*
          fi

      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: meta/sdk/typescript
        run: |
          set -euo pipefail
          DRY_RUN="${{ needs.resolve_release.outputs.dry_run }}"
          npm install --ignore-scripts
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm run build
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --access public --dry-run
          else
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"
            VIEW_STDERR=$(mktemp)
            trap 'rm -f "$VIEW_STDERR"' EXIT
            if PUBLISHED_VERSION=$(npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org/ 2>"$VIEW_STDERR"); then
              if [[ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]]; then
                echo "::error::npm returned unexpected version '$PUBLISHED_VERSION' for '$PACKAGE_SPEC'." >&2
                exit 1
              fi
              echo "  $PACKAGE_SPEC: already published, skipping"
            else
              VIEW_STATUS=$?
              if grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$VIEW_STDERR"; then
                npm publish --access public
              else
                cat "$VIEW_STDERR" >&2
                exit "$VIEW_STATUS"
              fi
            fi
          fi

  # The crate bytes the publisher must upload. No verify build here:
  # floor_check compiled these crates' packaged sources against published
  # Core. Its own archives differ from these in Cargo.lock only (it
  # packages with every in-repo crate patched to its path), so this job
  # packages without a patch (cargo package is byte-reproducible for a
  # commit) and records the checksums publish_registries binds to. A
  # candidate whose floor check bound a record runs it too: collection binds
  # these checksums into the record, and a promotion reuses the record only
  # while the crates still package to them.
  verify_crate_packages:
    name: Record the floor-checked Meta crate checksums
    needs: [resolve_release, release_validate, floor_check]
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.result == 'success' &&
      needs.release_validate.result == 'success' &&
      needs.floor_check.result == 'success' &&
      ((needs.resolve_release.outputs.publish_packages == 'true' &&
        (needs.resolve_release.outputs.mode == 'existing' ||
         needs.resolve_release.outputs.mode == 'promote')) ||
       (needs.resolve_release.outputs.mode == 'candidate' &&
        needs.floor_check.outputs.record != ''))
    runs-on: ubuntu-24.04
    outputs:
      extension_sha256: ${{ steps.crates.outputs.extension_sha256 }}
      meta_sha256: ${{ steps.crates.outputs.meta_sha256 }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - uses: ./.github/actions/setup-rust-ci
      - name: Package the Meta crates
        run: ./scripts/repo-cargo package -p meta-extension-state -p meerkat-meta --locked --no-verify
      - name: Record the crate checksums
        id: crates
        env:
          VERSION: ${{ needs.resolve_release.outputs.version }}
        run: |
          set -euo pipefail
          # These are the bytes the publisher uploads: no checksum, so no
          # record and no publication, for a crate file the registry would
          # refuse for its size.
          python3 scripts/published_crates_standalone.py package-size --product meta --package-dir "${CARGO_TARGET_DIR}/package"
          for pair in "extension_sha256:meta-extension-state" "meta_sha256:meerkat-meta"; do
            output="${pair%%:*}"; crate="${pair##*:}"
            sum="$(sha256sum "${CARGO_TARGET_DIR}/package/${crate}-${VERSION}.crate" | cut -d' ' -f1)"
            echo "${crate}-${VERSION}.crate: ${sum}"
            echo "${output}=${sum}" >> "${GITHUB_OUTPUT}"
          done

  publish_registries:
    name: Publish Meta crates
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_release.result == 'success' &&
      needs.release_validate.result == 'success' &&
      needs.verify_crate_packages.result == 'success' &&
      needs.resolve_release.outputs.publish_packages == 'true' &&
      ((needs.resolve_release.outputs.mode == 'existing' &&
        (needs.resolve_release.outputs.dry_run == 'true' ||
         needs.verify_release_assets.result == 'success')) ||
       (needs.resolve_release.outputs.mode == 'promote' &&
        needs.verify_release_assets.result == 'success' &&
        (needs.resolve_release.outputs.dry_run == 'true' ||
         needs.publish_github_release.result == 'success'))) &&
      (needs.publish_sdk_packages.result == 'success' ||
       needs.publish_sdk_packages.result == 'failure')
    needs: [resolve_release, release_validate, verify_release_assets, publish_github_release, publish_sdk_packages, verify_crate_packages]
    runs-on: ubuntu-24.04
    # environment: release-meta   # owner decision (plan-v2 section 4.8)
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      VERIFIED_EXTENSION_SHA256: ${{ needs.verify_crate_packages.outputs.extension_sha256 }}
      VERIFIED_META_SHA256: ${{ needs.verify_crate_packages.outputs.meta_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_release.outputs.sha }}
      - uses: ./.github/actions/setup-rust-ci
      - name: Install Python tooling
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Bind the crates to the floor-checked bytes
        run: |
          set -euo pipefail
          ./scripts/repo-cargo package -p meta-extension-state -p meerkat-meta --locked --no-verify
          for pair in "meta-extension-state:${VERIFIED_EXTENSION_SHA256}" "meerkat-meta:${VERIFIED_META_SHA256}"; do
            crate="${pair%%:*}"; verified="${pair##*:}"
            [[ "${verified}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no verified checksum for ${crate}" >&2; exit 1; }
            actual="$(sha256sum "${CARGO_TARGET_DIR}/package/${crate}-${RELEASE_VERSION}.crate" | cut -d' ' -f1)"
            [[ "${actual}" == "${verified}" ]] || { echo "::error::${crate} now packages to ${actual}, not ${verified}" >&2; exit 1; }
            echo "${crate}: ${actual} (floor-checked)"
          done
      # Only Meta's list: meta-extension-state (level 0), then meerkat-meta.
      # Real uploads carry no patch config (MEERKAT_CRATE_PUBLISH_PATCH):
      # a patch is recorded in each packaged Cargo.lock, so the upload would
      # differ from the bytes bound above. meerkat-meta packages after
      # meta-extension-state is in the index, and records it with its
      # crates.io checksum, as the bound packaging does; Core resolves from
      # crates.io either way. A dry run keeps the patch.
      - name: Publish the Meta crates by dependency level
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          MEERKAT_RELEASE_CRATE_LIST: scripts/release-meta-crates.sh
          MEERKAT_CRATE_PUBLISH_PATCH: "false"
          MEERKAT_REGISTRY_DRY_RUN: ${{ needs.resolve_release.outputs.dry_run }}
        run: scripts/release-publish-rust-crates.sh
      - name: Verify exact packages are public on every registry
        if: needs.resolve_release.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          python3 meta/scripts/verify-published-registries.py --version "${RELEASE_VERSION}" \
            --crate-sha256 "meta-extension-state=${VERIFIED_EXTENSION_SHA256}" \
            --crate-sha256 "meerkat-meta=${VERIFIED_META_SHA256}"
