[package]
name = "forge-service-host"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Native application composition. The executable is source-only until the
# existing owner lane qualifies this exact graph and protected installation.
[workspace]

[dependencies]
forge-ghe-collections = { path = "../ghe-collections" }
meerkat-connect = { git = "https://github.com/lukacf/meerkat-connect.git", rev = "4ab7bbed23b7cb7f94064085502ae2421dbed040" }
meerkat-core = "=0.9.5"
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
# Exact versions already in the selected Connect native-candidate lock. This
# crate has not resolved or qualified its own dependency graph yet.
libc = "=0.2.189"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "io-util", "net", "process"] }

# Same Core identities as the pinned Connect native workspace. Keep this
# development graph separate from the pure programs and released Forge runtime.
[patch.crates-io]
meerkat = { git = "https://github.com/lukacf/meerkat", rev = "fdfb7b8905a4769934caa945a49e19ede066fe8a" }
