name: Registry pre-flight

# Proves, with this repository's publish secrets (NPM_TOKEN, PYPI_API_TOKEN,
# CARGO_REGISTRY_TOKEN), that npm, PyPI and crates.io accept them for every
# Core and Meta package, and publishes nothing:
# scripts/release-registry-preflight re-sends the already published artifact
# of an already published version (never the version about to be released),
# after checking it against the registry's own digest, so each registry
# authorizes the write and then refuses it as a duplicate. Every package gets
# PASS, FAIL, INCONCLUSIVE or SKIP with the registry's exact answer, in the
# log, the job summary and the uploaded report.
#
# Run it after any change of those secrets (one NPM_TOKEN serves Core and
# Meta) and before every release window:
#   gh workflow run registry-preflight.yml --ref main                       # plan: reads only, no secret
#   gh workflow run registry-preflight.yml --ref main -f mode=probe         # probe Core and Meta
#   gh workflow run registry-preflight.yml --ref main -f mode=probe -f crates=all
#
# Dispatch only, on main only, read-only token. A job holds the secrets only
# in probe mode, and only in its probe step. crates.io takes one publish token
# of the account's rate limit per crate probe (burst 30, one more a minute),
# shared with every release: `family` probes the fixed sample (two crates a
# product); `all` probes every crate, paced, and must finish at least an hour
# before a window's first crates.io publication. The products run one after
# the other for the same reason.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan: read the registries and print the probes, no write and no secret; probe: send them"
        required: false
        type: choice
        default: plan
        options: [plan, probe]
      products:
        description: "Products whose packages to check"
        required: false
        type: choice
        default: core-and-meta
        options: [core-and-meta, core, meta]
      crates:
        description: "family: the fixed crates.io sample; all: every crate, paced (early run only)"
        required: false
        type: choice
        default: family
        options: [family, all]

permissions:
  contents: read

concurrency:
  group: registry-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Registry pre-flight (${{ matrix.product }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        product: ${{ fromJSON(inputs.products == 'core' && '["core"]' || inputs.products == 'meta' && '["meta"]' || '["core","meta"]') }}
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The registry pre-flight runs only on main, not ${GITHUB_REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the pinned twine
        if: inputs.mode == 'probe'
        run: python -m pip install --disable-pip-version-check --no-input 'twine==7.0.0'

      - name: Registry pre-flight
        env:
          PRODUCT: ${{ matrix.product }}
          MODE: ${{ inputs.mode }}
          CRATES: ${{ inputs.crates }}
          NPM_TOKEN: ${{ inputs.mode == 'probe' && secrets.NPM_TOKEN || '' }}
          PYPI_API_TOKEN: ${{ inputs.mode == 'probe' && secrets.PYPI_API_TOKEN || '' }}
          CARGO_REGISTRY_TOKEN: ${{ inputs.mode == 'probe' && secrets.CARGO_REGISTRY_TOKEN || '' }}
        run: |
          python3 -I scripts/release-registry-preflight \
            --product "${PRODUCT}" \
            --mode "${MODE}" \
            --crates "${CRATES}" \
            --report "${RUNNER_TEMP}/registry-preflight-${PRODUCT}.json"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: registry-preflight-${{ matrix.product }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-preflight-${{ matrix.product }}.json
          if-no-files-found: warn
          retention-days: 30
