[package]
name = "meerkat-machine-codegen"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
meerkat-core = { workspace = true }
meerkat-machine-schema = { path = "../meerkat-machine-schema" }
thiserror = { workspace = true }

[dev-dependencies]
# `sqlite-store` mirrors meerkat-runtime's own path-only self-dependency: the
# recovery/commit wire types in meerkat-runtime::store are gated on it, so a
# default-feature build of that crate reports them as dead code. Without this,
# `clippy -p meerkat-machine-codegen --all-targets -- -D warnings` (the
# changed-crate pre-push gate) fails inside an untouched dependency.
meerkat-runtime = { path = "../meerkat-runtime", features = ["sqlite-store"] }
meerkat-mob = { path = "../meerkat-mob" }
meerkat-schedule = { path = "../meerkat-schedule", features = ["machine-schema-exports"] }
meerkat-workgraph = { path = "../meerkat-workgraph", features = ["machine-schema-exports"] }

[lints]
workspace = true
