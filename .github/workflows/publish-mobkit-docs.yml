name: Publish MobKit docs

# docs.rkat.ai mirrors MobKit's documentation on main. MobKit (Meta) lives
# under meta/ in this repository, so the source is main itself: the mirror
# (docs/mobkit/** and docs/docs.json) is rendered from meta/docs at the main
# head. Documentation carries no version tag: a doc fix is published the
# moment it lands on main.
#
# Triggers:
#   - push to main that changes meta/docs/** or the mirror script;
#   - workflow_dispatch: mirror the main head now, for example after a failed
#     publication.
# No nightly catch-up: a push in the same repository cannot be lost the way a
# cross-repository dispatch could, and the nightly lag check
# (scripts/check-mobkit-docs-lag.py) fails while a docs-changing main commit
# is not mirrored.
#
# Landing the regenerated snapshot on main. The "Protect MAIN" ruleset
# requires the CI gate status check, and bot-authored pull requests used to
# stall: their pull_request CI run waited for a maintainer approval that
# nobody gave, and the CI gate's 20-minute push-to-terminal budget then
# failed the late run on time alone (four MobKit releases went unpublished
# in 2026-09). Two paths, chosen at run time:
#   - Fast path, when the repository secret MOBKIT_DOCS_PR_TOKEN exists: push
#     the guarded snapshot commit straight to main with that token. The token
#     must be a fine-grained PAT held by a repository admin with Contents:
#     read and write (and Pull requests: read and write for the PR path) on
#     lukacf/meerkat; the admin role bypasses the ruleset. Only
#     docs/mobkit/** and docs/docs.json can be in that commit (the staging
#     step refuses anything else), so the bypass is scoped by construction.
#   - Pull request path, otherwise: push a publication branch, open the PR,
#     approve the PR's own pull_request CI run at once (the repository allows
#     Actions to create and approve pull requests; approving a run needs
#     actions: write, which github.token holds), and enable auto-merge with a
#     merge commit. The approval happens within seconds of the run's
#     creation, so the CI gate's budget is met.

on:
  push:
    branches:
      - main
    paths:
      - "meta/docs/**"
      - "scripts/sync-mobkit-docs.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-mobkit-docs
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror MobKit main
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout docs.rkat.ai source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the source commit
        id: source
        run: |
          set -euo pipefail
          # The checkout is main's head: the pushed commit, or a later one
          # when pushes raced. The newest main is the one to mirror.
          source_sha=$(git rev-parse HEAD)
          if [[ "$(git rev-parse origin/main)" != "$source_sha" ]]; then
            echo "::error::The checkout is not main's head; refusing to mirror it" >&2
            exit 1
          fi
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "short=${source_sha:0:12}" >> "${GITHUB_OUTPUT}"
          echo "Mirroring MobKit docs from main at ${source_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate MobKit documentation from main
        run: |
          set -euo pipefail
          python3 scripts/sync-mobkit-docs.py meta \
            --source-ref main \
            --require-clean

      - name: Validate complete Mintlify site
        run: make docs-check

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate Mintlify parsing and links
        working-directory: docs
        run: npx --yes mint@4.2.728 broken-links

      - name: Stage the generated snapshot
        id: stage
        env:
          SOURCE_SHORT: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          git add docs/mobkit docs/docs.json
          if git diff --cached --quiet; then
            echo "docs.rkat.ai already mirrors MobKit main at ${SOURCE_SHORT}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          unexpected=$(git diff --cached --name-only | grep -Ev '^docs/(mobkit/|docs\.json$)' || true)
          if [[ -n "$unexpected" ]]; then
            echo "::error::MobKit docs publication staged unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: mirror MobKit main ${SOURCE_SHORT}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Publish directly to main with the admin token
        id: direct
        if: steps.stage.outputs.changed == 'true' && env.MOBKIT_DOCS_PR_TOKEN != ''
        env:
          MOBKIT_DOCS_PR_TOKEN: ${{ secrets.MOBKIT_DOCS_PR_TOKEN }}
        run: |
          set -euo pipefail
          # The commit touches only docs/mobkit/** and docs/docs.json (staged
          # under the path guard above). The admin-held token bypasses the
          # ruleset for exactly this commit; main's CI still runs on the push.
          git push "https://x-access-token:${MOBKIT_DOCS_PR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "published=true" >> "${GITHUB_OUTPUT}"
          echo "Published MobKit docs mirror directly to main" >> "${GITHUB_STEP_SUMMARY}"

      - name: Push a publication branch
        id: branch
        if: steps.stage.outputs.changed == 'true' && env.MOBKIT_DOCS_PR_TOKEN == ''
        env:
          MOBKIT_DOCS_PR_TOKEN: ${{ secrets.MOBKIT_DOCS_PR_TOKEN }}
          SOURCE_SHORT: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          pr_branch="codex/publish-mobkit-docs-${SOURCE_SHORT}-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${pr_branch}"
          echo "pushed_branch=${pr_branch}" >> "${GITHUB_OUTPUT}"

      - name: Publish through a protected pull request
        id: pull_request
        if: steps.branch.outputs.pushed_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.branch.outputs.pushed_branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_SHORT: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          pr_branch="${PR_BRANCH}"
          pr_url=$(gh pr create \
            --base main \
            --head "${pr_branch}" \
            --title "docs: mirror MobKit main ${SOURCE_SHORT}" \
            --body "Mirror MobKit main at ${SOURCE_SHA} after generated-site and link validation. Opened as a pull request because main requires the CI gate; the workflow approves its own CI run at once and enables auto-merge. Set the repository secret MOBKIT_DOCS_PR_TOKEN (admin-held fine-grained PAT) to publish directly instead.")
          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"

          # A bot-authored pull request's CI run is created in action_required.
          # Approve it now, while the CI gate's push-to-terminal budget is
          # still fresh; a late approval fails on time alone.
          run_id=""
          for attempt in $(seq 1 12); do
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${pr_branch}&event=pull_request&per_page=5" \
              --jq '.workflow_runs[] | select(.name == "CI") | .id' | head -n 1 || true)
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::No pull_request CI run appeared for ${pr_branch}" >&2
            exit 1
          fi
          # GitHub reports a run waiting for approval as status "completed"
          # with conclusion "action_required" (the status field itself is
          # never "action_required"). Check both, and confirm the approval
          # took: the first live run of this workflow skipped the POST here
          # and the pull request sat blocked until a human approved it.
          run_state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq '(.status // "") + "/" + (.conclusion // "")')
          if [[ "$run_state" == *action_required* ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve"
            sleep 5
            run_state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '(.status // "") + "/" + (.conclusion // "")')
            if [[ "$run_state" == *action_required* ]]; then
              echo "::error::CI run ${run_id} still awaits approval after the approve call (${run_state})" >&2
              exit 1
            fi
          fi
          echo "pull_request CI run ${run_id}: ${run_state}"
          gh pr merge "${pr_url}" --auto --merge
          echo "Queued protected MobKit docs publication: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report a publication that needs a human
        # A snapshot was staged but did not reach main and no pull request is
        # queued for merge. Leave the job red (nothing was published) and say
        # so in the job summary and one tracking issue with a stable title.
        if: failure() && steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.branch.outputs.pushed_branch }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
          SOURCE_SHORT: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          python3 scripts/report-mobkit-docs-publication-failure.py \
            --repository "${GITHUB_REPOSITORY}" \
            --source "main@${SOURCE_SHORT}" \
            --branch "${PR_BRANCH:-unpushed}" \
            --pull-request-url "${PR_URL}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --summary "${GITHUB_STEP_SUMMARY}"
