[package]
name = "meerkat-openai"
description = "OpenAI vertical for Meerkat: LLM client, compatible client, live/realtime, provider runtime, catalog, capabilities, profile, and ChatGPT OAuth backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
meerkat-core = { workspace = true }
meerkat-models = { workspace = true }
meerkat-llm-core = { workspace = true }
meerkat-contracts = { workspace = true }
# meerkat-auth-core's resolver is wasm-compatible; needed so the
# provider runtime can resolve inline-secret bindings in the browser
# (closes Cluster C in the smoke-fix track).
meerkat-auth-core = { workspace = true }
meerkat-copilot = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
indexmap = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true, optional = true }
# Development integration stays on the workspace-owned immutable source pin.
# A coordinated release replaces this with the published protocol dependency.
oai-rt-rs = { workspace = true, optional = true }
# Pinned to the tokio-tungstenite major used by oai-rt-rs so the typed
# `tungstenite::Error` discriminants can be matched when classifying
# realtime websocket faults (no error-string parsing).
tokio-tungstenite = { version = "0.26", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
meerkat-runtime = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }
meerkat-auth-core = { workspace = true, features = ["oauth"] }
axum = { workspace = true, features = ["ws"] }

[features]
default = ["oauth", "copilot"]
oauth = ["meerkat-auth-core/oauth"]
copilot = ["dep:meerkat-copilot", "meerkat-copilot/oauth"]
realtime = ["dep:oai-rt-rs", "dep:sha2", "dep:tokio-tungstenite"]
experimental-gpt-live = [
    "dep:oai-rt-rs",
    "meerkat-llm-core/experimental-gpt-live",
    "oai-rt-rs/experimental-gpt-live",
]
# Structurally separate, non-shipping Gate0 candidate broker. It accepts no
# qualified experimental admission carrier and advertises no capability.
experimental-gpt-live-gate0-harness = ["experimental-gpt-live"]
test-realtime-fixtures = []

[package.metadata.cargo-machete]
ignored = ["getrandom", "base64", "indexmap", "tempfile"]

[lints]
workspace = true
