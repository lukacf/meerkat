# Workspace-only tests of the published crates.
#
# A published crate's tests must pass standalone: plain `cargo test` in the
# unpacked package, with the features its
# [package.metadata.meerkat.standalone-tests] declares and no repository
# files. A test that cannot run there is workspace-only, declared here with
# its reason. It never skips itself at run time: a test that passes by not
# running is a lie.
#
#   excluded        files the crate's [package] exclude keeps out of its
#                   package; the two lists must agree
#   workspace_only  tests the package compiles out (the crate's
#                   `workspace-tests` feature gates them) because they need a
#                   crate the package cannot depend on, one table per target
#                   and reason: `modules` covers every test under each module
#                   path, `tests` names single tests. A name no workspace test
#                   matches any more fails the census, so the list stays exact
#   guard_allow     packaged files the static guard flags for a reason that
#                   is not a test escape (`kind` is the guard's finding)
#
# scripts/published_crates_standalone.py reads this file: `guard` checks it
# against the manifests and the packaged sources, `census` against the
# workspace and standalone test names.

[crates.meerkat-core]
excluded = [
    { path = "tests/fixtures/v0_8_10_recovery_migration_session.json", reason = "released recovery-migration fixture; only in-repo tests read it" },
    { path = "tests/fixtures/v0_8_10_recovery_migration_session.provenance.json", reason = "provenance of the fixture above" },
    { path = "tests/v0_8_10_recovery_migration.rs", reason = "embeds the two fixture files above" },
    { path = "tests/session_document_strict_read_parity.rs", reason = "needs meerkat-machine-schema, which depends on this crate" },
]

[[crates.meerkat-core.workspace_only]]
target = "src/lib.rs"
reason = "needs meerkat-machine-kernels or meerkat-machine-schema, which depend on this crate"
