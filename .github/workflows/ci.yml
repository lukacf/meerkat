            export MEERKAT_MCP_TEST_SERVER="${fixture}"
            echo "mcp-test-server fixture: ${MEERKAT_MCP_TEST_SERVER}"
          fi
          # shellcheck disable=SC2086
          ./scripts/repo-cargo nextest run ${PACKAGES} ${TARGETS} --profile ci-pr "${partition_args[@]}" \
