          key_prefix: sccache/${{ env.RUSTUP_TOOLCHAIN }}/linux-x64

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Build nextest archive (lib and bin targets)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" && -n "${ARCHIVE}" ]] || { echo "::error::empty archived unit lane"; exit 1; }
          # Built into the target directory, the fixture rides in the archive
          # (archive.include, .config/nextest.toml) and sits next to the
          # extracted test binaries' deps/, where
          # mcp_test_server::fixture_binary() resolves it.
          # shellcheck disable=SC2086
          fixture="$(scripts/mcp-test-server-fixture --if-needed ${PACKAGES})"
          if [[ -n "${fixture}" ]]; then echo "mcp-test-server fixture (archived): ${fixture}"; fi
          # shellcheck disable=SC2086
          ./scripts/repo-cargo nextest archive ${PACKAGES} --lib --bins \
            --archive-file "${RUNNER_TEMP}/nextest-${ARCHIVE}.tar.zst"

      - name: Verify the partitions cover every test exactly once
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          PARTITIONS: ${{ matrix.partitions }}
        run: |
          set -euo pipefail
          [[ "${PARTITIONS}" =~ ^[0-9]+$ ]] && (( PARTITIONS >= 2 )) || { echo "::error::archived lane without a partition count"; exit 1; }
          archive="${RUNNER_TEMP}/nextest-${ARCHIVE}.tar.zst"
          list() {
            cargo-nextest nextest list --archive-file "${archive}" --workspace-remap "${GITHUB_WORKSPACE}" \
              --profile ci-pr --message-format oneline "$@" | LC_ALL=C sort
          }
          list > "${RUNNER_TEMP}/all.txt"
          : > "${RUNNER_TEMP}/union.txt"
          for (( index = 1; index <= PARTITIONS; index++ )); do
            list --partition "hash:${index}/${PARTITIONS}" >> "${RUNNER_TEMP}/union.txt"
          done
          LC_ALL=C sort "${RUNNER_TEMP}/union.txt" -o "${RUNNER_TEMP}/union.txt"
          duplicates="$(uniq -d "${RUNNER_TEMP}/union.txt" | wc -l)"
          if [[ "${duplicates}" != "0" ]] || ! cmp -s "${RUNNER_TEMP}/all.txt" "${RUNNER_TEMP}/union.txt"; then
            echo "::error::the ${PARTITIONS} partitions of ${ARCHIVE} do not cover its $(wc -l < "${RUNNER_TEMP}/all.txt") tests exactly once (duplicates: ${duplicates})"
            diff "${RUNNER_TEMP}/all.txt" "${RUNNER_TEMP}/union.txt" | head -20 || true
            exit 1
          fi
          echo "${ARCHIVE}: ${PARTITIONS} partitions cover all $(wc -l < "${RUNNER_TEMP}/all.txt") tests exactly once"

      - name: Upload nextest archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Keyed by run, not attempt: re-running only a failed partition job
          # (attempt 2+) does not re-run this build job, so the partition must
          # find the archive an earlier attempt uploaded. A full re-run rebuilds
          # and replaces it.
          name: nextest-${{ matrix.archive }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nextest-${{ matrix.archive }}.tar.zst
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload sccache server log
        if: ${{ always() }}
        # Diagnostics can never fail a lane.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sccache-log-main-unit-archive-${{ matrix.archive }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/work/_temp/sccache.log
          if-no-files-found: ignore
          retention-days: 3

