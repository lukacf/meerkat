      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
          shared-key: ci-registry
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Unit tests (workspace shard, lib and bin targets)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TARGETS: ${{ matrix.targets }}
          # Set only on feature-suite rows whose tests need a deeper test-thread
          # stack than the 8 MiB .cargo/config.toml default (see FEATURE_UNIT_SUITES).
          MIN_STACK: ${{ matrix.rust_min_stack }}
          # Set only on the rows of a partitioned lane (PARTITIONED_UNIT_PACKAGES):
          # the row builds the lane and runs one hash partition of its tests.
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          [[ -n "${PACKAGES}" ]] || { echo "::error::empty package list in a main unit lane"; exit 1; }
          case "${TARGETS}" in
            "--lib"|"--bins"|"--lib --bins") ;;
            *) echo "::error::unexpected unit targets '${TARGETS}'"; exit 1 ;;
          esac
          # An empty RUST_MIN_STACK would drop tests to Rust's 2 MiB default, so it
          # is exported only when the row sets one.
          if [[ -n "${MIN_STACK}" ]]; then export RUST_MIN_STACK="${MIN_STACK}"; fi
