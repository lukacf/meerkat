[package]
name = "forge-service-host"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Native application library. The protected executable entry is still pending
# Connect's authenticated mapping/close API; this is not an installed launcher.
[workspace]

[dependencies]
forge-ghe-collections = { path = "../ghe-collections" }
meerkat-connect = { git = "https://github.com/lukacf/meerkat-connect.git", rev = "57717be45b79ce47ffee384e52b43916d760c18a" }
meerkat-core = "=0.9.5"
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

# Same Core identities as the pinned Connect native workspace. Keep this
# development graph separate from the pure programs and released Forge runtime.
[patch.crates-io]
meerkat = { git = "https://github.com/lukacf/meerkat", rev = "fdfb7b8905a4769934caa945a49e19ede066fe8a" }
