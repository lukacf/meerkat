SPECIFICATION Spec
CONSTANTS
  NatValues = {0, 1, 2}
  StringValues = {"alpha", "beta"}
  ToolGrantEndReasonValues = {"Deadline", "Revoked", "RunEnded"}
  ToolGrantIssueRefusalValues = {"InvalidWindow", "AlreadyIssued"}
  ToolGrantRunIdValues <- ToolGrantRunIdValuesDeep
  ToolGrantUseRefusalValues = {"Expired", "Revoked", "RunEnded", "OutsideRun"}
INVARIANTS
  unissued_is_empty
  issued_window_is_nonempty
  active_has_no_end
  ended_grants_record_their_end
  expiry_never_precedes_its_deadline
  revocation_precedes_the_deadline
  run_ended_records_its_end
  run_scope_set_only_by_issue
CONSTRAINTS
  DeepStateConstraint
