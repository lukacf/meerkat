[package]
name = "meerkat-runtime"
description = "v9 runtime control-plane for Meerkat agent lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
meerkat-core = { workspace = true, features = ["__meerkat-generated-authority-bridge"] }
meerkat-live = { workspace = true, optional = true, features = ["__meerkat-generated-authority-bridge"] }
meerkat-llm-core = { workspace = true, optional = true }
meerkat-machine-dsl = { workspace = true }
meerkat-machine-kernels = { workspace = true }
meerkat-machine-schema = { workspace = true }
meerkat-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
meerkat-machine-derive = { workspace = true }
rusqlite = { workspace = true, optional = true }
meerkat-sqlite = { workspace = true, optional = true }
tracing = { workspace = true }
meerkat-store = { workspace = true, optional = true }
futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meerkat-auth-core = { workspace = true, features = ["oauth"] }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }

[features]
default = []
live = [
    "dep:meerkat-live",
    "dep:meerkat-llm-core",
    "meerkat-core/__meerkat-live-authority-bridge",
]
sqlite-store = ["dep:rusqlite", "dep:meerkat-sqlite", "dep:meerkat-store", "meerkat-store/sqlite"]
test-support = []

[dev-dependencies]
# Path-only self-dependency (no version, stripped at publish): this crate's
# own integration tests need the test-support hooks without relying on
# feature unification from sibling crates in the same build graph.
#
# `sqlite-store` is listed for the same reason. The release-boundary corpora
# (`recovery_contract`, `pre_ledger_realm_bridge`) are gated on it, and without
# this a package-scoped `-p meerkat-runtime` lane compiles those files away to
# nothing and reports success over zero tests. Storage evidence must not depend
# on which sibling crates happen to share the build graph.
meerkat-runtime = { path = ".", features = ["test-support", "sqlite-store"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tempfile = { workspace = true }
meerkat-store = { workspace = true, features = ["memory", "sqlite"] }
meerkat-machine-schema = { workspace = true }
meerkat-machine-kernels = { workspace = true, features = ["test-oracle"] }
meerkat-comms = { workspace = true }
# Integration tests drive the offline schema bridge directly against realms
# written by published pre-0.8.10 binaries.
meerkat-sqlite = { workspace = true }
rusqlite = { workspace = true }

[lints]
workspace = true
