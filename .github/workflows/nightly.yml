name: Nightly

# Everything pull-request CI (ci.yml) deliberately does not run. ci.yml is
# Cargo-only, selected by changed paths, and sized to a 20-minute
# push-to-terminal budget; the broad, slow, or low-churn coverage runs here
# once a day on free hosted runners (plus on demand), and the release
# workflow re-runs the BuildBuddy graph on the tag.
#
# Coverage rationale:
#   workspace-unit    - `make test-unit`: every workspace unit test (PR CI
#                       runs only the directly changed packages)
#   workspace-int     - every integration-fast test of `make test-int`, as
#                       rows (its one build no longer fits a runner's
#                       disk): the planner's closure rows and one row for
#                       the bin harnesses, then an aggregate that accounts
#                       for every row; the lib harnesses run in
#                       workspace-unit
#   e2e-fast          - deterministic real-binary end-to-end lane
#   dense-topology    - the exact 300-member/150-peer Mob stress on hosted
#                       Linux (17-22 minutes; does not fit PR CI)
#   machine-verify    - the canonical TLC lane's machine-verify part: the
#                       bounded adaptive witness and the `machine-verify
#                       --all` sweep (ci.yml runs the lane's audit shards on
#                       every machine-authority change)
#   machine-verify-deep - Deep-profile TLC (deep.cfg, witnesses, coverage
#                       audit) over the compositions that fit the 900 s
#                       per-run cap; a capped run fails as TLC INCOMPLETE.
#                       Then the AuthMachine source-credential publication
#                       audit over the whole domains of the inputs its CI
#                       profile samples, which ci.yml's audit runs sampled
#   sdk-host          - Python + TypeScript SDK suites, unconditional
#   gcp-buildbuddy    - the whole BuildBuddy/Bazel graph in `full-fresh`
#                       mode: prebuild, fmt/static, native nextest lanes,
#                       governance (seam-inventory, rmat-audit, machine
#                       authority), SDK suites, wasm-check, minimal-feature,
#                       feature matrix, audit
#   clippy-full       - clippy --all-targets --all-features over the whole
#                       workspace (PR CI lints changed packages only)
#   feature-matrix    - feature-unification bugs the all-features lane hides
#   minimal/modular   - minimal-feature builds + surface modularity contracts
#   e2e-system        - real-binary/local-resource lane
#   sdk-web           - full Web SDK suite
#   wasm-contract     - wasm-pack browser contract test in headless Chrome
#   release-packaging - per-crate `cargo package` dry-run (release hygiene)
#   audit             - daily cargo-deny advisory sweep
#   meta-docs-lag     - docs/meta mirror vs main: fails while a main commit
#                       that changed meta/docs after the mirrored one is not
#                       mirrored (publication has stalled silently)
#   example-standalone - the standalone example workspaces 034 and 035
#                       (their tests, then 035's script fixtures); no
#                       other workflow builds them. It measures: each
#                       target's seconds go to the job summary
#   meta-example-006  - Meta example pack 006's keyless script, which
#                       no other workflow runs

# Hosted-runner slots. The account runs at most 40 hosted jobs at once,
# shared with every pull request and main push, and nightly once held 22 of
# them for most of 02:17-04:40 UTC (run 36807541395) while a merge burst
# queued pull-request jobs for up to 11 minutes. Nightly now holds about ten:
#   1. gcp-buildbuddy runs alone first (its own jobs peak at 9-10 hosted
#      submitters for about 35 minutes, and its 3000 s deadline needs them
#      in parallel);
#   2. then five sequential chains: each job `needs` the previous one and
#      runs under !cancelled(), so a red job never skips the rest:
#        release-packaging (143-304 min) > meta-docs-lag (2) >
#          example-standalone (not measured yet) > meta-example-006
#          (not measured yet)
#        e2e-system (47-360) > sdk-web (4-29) > audit (1) >
#          machine-verify-deep (3-8, and about 40 for its whole-domain
#          audit)
#        feature-matrix (170-267) > workspace-int-plan > workspace-int
#          (the integration-fast rows, at most four at once; not
#          measured yet) > workspace-int-aggregate
#        release-stack-budget (86-148) > minimal-and-modularity (13-72) >
#          e2e-fast (3-34) > sdk-host (3-52)
#        machine-verify (40-50) > workspace-unit (117-173) > clippy-full
#          (30-63) > dense-topology (24-70) > wasm-contract (4-26)
# Minutes are the range over the 2026-11-01 to 11-07 runs, a job that ran
# out of time counted at its limit and a run that lost its runner left
# out; most jobs swing several-fold from night to night. machine-verify's,
# workspace-unit's and the whole-domain audit's are estimates for their
# current settings, and dense-topology's upper end is its limit. The
# longest chain was feature-matrix > workspace-int (then one job of
# 134-240 minutes, its upper end its limit), at up to about eight and a
# half hours, and nightly took 4 h 46 min to 7 h 23 min. The
# integration-fast rows that replaced that job are not measured yet;
# while they run, their chain holds up to four slots, so nightly holds up
# to about thirteen. A new job joins the shortest chain; a new chain is a
# new slot.
#
# A red run on main opens or updates the "Nightly failures" issue through
# nightly-failure-issue.yml, which starts once this workflow's run has
# completed, so no job here waits for the others.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      graph_only:
        # Run only gcp-buildbuddy (the whole Bazel graph): the release
        # final gate dispatches it on the release branch tip before the tag,
        # where the full graph otherwise first runs (#1687), and the same
        # dispatch warms the remote cache for the tag run. While
        # MEERKAT_GCP_BUILDBUDDY_ENABLED is not 'true' such a dispatch starts
        # nothing in GCP and fails (buildbuddy.yml's gate), and the tag
        # validates on its exact-tree CI attestation instead (release.yml).
        description: Run only the full BuildBuddy graph (pre-tag check / cache warm-up).
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  # The reusable BuildBuddy workflow authenticates to GCP with OIDC.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Stable per-VM Cargo home: hosted runners are fresh per job, and cache
  # reuse (rust-cache + sccache) requires registry source paths that do not
  # change between runs.
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.97.0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # Never exit on idle (ci.yml's lanes do the same). sccache's idle clock
  # restarts only on a new compile request, and at the default 600 s the
  # server exits under a compile still running (it waits 10 s for it): a
  # crate whose rustc ran that long with nothing else compiling was cut off
  # and compiled again from the start without the cache ("The server looks
  # like it shut down unexpectedly, compiling locally instead"). The system
  # e2e lane printed that 90 times on 2026-11-07 and compiled for 343 of its
  # 346.6 minutes, and 36 times on 11-04, when it ran out of its 360; it
  # took 184 and 201 minutes in all on 10-28 and 11-03, which printed none.
  SCCACHE_IDLE_TIMEOUT: "0"
  # A failed sccache install never fails a job either: each Setup sccache
  # step continues on error (so does the action's post step, which reads
  # the stats), and the step after it then sets an empty RUSTC_WRAPPER,
  # which Cargo reads as no wrapper.

jobs:
  workspace-unit:
    name: Workspace unit tests
    needs: machine-verify
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    # At four Cargo jobs `make test-unit` took 60-79 minutes to compile and
    # 27-31 to run its tests (2026-11-02 to 11-05). Two jobs compile for an
    # estimated 1.5-1.8 times as long: 117-173 minutes in all.
    timeout-minutes: 180
    env:
      RUSTC_WRAPPER: sccache
      # At four Cargo jobs the 16 GB runner lost this job mid-compile (exit
      # 143 after the log went silent, 2026-11-06 and 11-07), as it lost
      # workspace-int below. Two jobs keep at most two rustc alive.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-workspace-unit
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      # The runner's size and 12 GiB of swap before the build: the script of
      # ci.yml's meerkat-meta unit rows (see main-unit there), with this
      # job's file names. `make test-unit` compiles meerkat-mob's lib test,
      # one rustc process that peaked at 15,970 to 16,298 MiB in four cold
      # builds of ci.yml's mob unit rows on a host without a memory limit
      # (the 0.9.15 and 0.9.16 trees): above this
      # runner's memory, and CARGO_BUILD_JOBS cannot lower one process. Run
      # 43976249019 lost this job at exit 143, 25 minutes into `make
      # test-unit` (job 133831902555). Swap turns an OOM kill into a slower
      # tail; it lowers no peak. Nothing here fails the job.
      - name: Show the runner's size and add swap (workspace unit tests)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          show_resources() {
            nproc
            free -m
            if [[ -d /mnt ]]; then
              df -h / /mnt
            else
              df -h /
            fi
            swapon --show || true
          }
          show_resources
          vmstat -t 30 >"${RUNNER_TEMP}/workspace-unit-vmstat.log" 2>&1 </dev/null &
          swapfile=/workspace-unit-swapfile
          need_gib=40
          if mountpoint -q /mnt; then
            mnt_avail_kib="$(df --output=avail -k /mnt | tail -n 1 | tr -d ' ')"
            if ((mnt_avail_kib >= 20 * 1024 * 1024)); then
              swapfile=/mnt/workspace-unit-swapfile
              need_gib=20
            fi
          fi
          avail_kib="$(df --output=avail -k "$(dirname "${swapfile}")" | tail -n 1 | tr -d ' ')"
          if ((avail_kib < need_gib * 1024 * 1024)); then
            echo "::warning title=Workspace unit swap::under ${need_gib} GiB free for ${swapfile}: no swap added"
            exit 0
          fi
          echo "Adding 12 GiB of swap at ${swapfile}"
          sudo fallocate -l 12GiB "${swapfile}"
          sudo chmod 600 "${swapfile}"
          sudo mkswap "${swapfile}"
          sudo swapon "${swapfile}"
          show_resources

      # meerkat-rpc's WebRTC router tests, which `live-webrtc` gates and this
      # lane compiles out, run on every Rust-changing main push instead:
      # ci.yml's "Main unit tests (rpc[openai-live])" row turns on every
      # meerkat-rpc feature (experimental-gpt-live implies openai-live, which
      # implies live-webrtc and mob).
      - name: Workspace unit tests
        run: make test-unit

      # After a lost runner no later step runs, not even this one; it prints
      # for a job that ended by itself.
      - name: Show memory after the workspace unit tests
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          free -m
          swapon --show || true
          grep -E '^(pswpin|pswpout|oom_kill) ' /proc/vmstat || true
          cat "${RUNNER_TEMP}/workspace-unit-vmstat.log" || true

  # The integration-fast tests of `make test-int`, as rows. Its one build of
  # every test harness of Core's workspace no longer fits a hosted runner's
  # root disk (a scheduled job that began with about 90 GiB free ended with
  # "No space left on device").
  # The planner's closure rows build the same integration harnesses a few at
  # a time, as on a push to main. This job turns a whole-workspace plan into
  # the matrix of the rows job below (scripts/ci-nightly-int-split.mjs
  # matrix): Core's closure rows without the e2e-fast row (the e2e-fast job
  # runs that binary; `make test-int` never ran it), under the profile and
  # with the HeadCanonical filter of `make test-int`, plus one row for the
  # bin harnesses, which `make test-int` ran and no closure row names. The
  # lib harnesses are in no row: `make test-int` ran them a second time, and
  # the workspace-unit job runs them from the same package selection (when
  # the rows were introduced, each of the 51 lib harnesses was the same
  # build in both jobs, by Cargo's unit graph).
  workspace-int-plan:
    name: Workspace integration-fast rows (plan)
    needs: feature-matrix
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # The rows' contracts (scripts/ci-nightly-int-split-selftest.mjs) run
      # here, as the nightly example jobs run theirs: no other workflow has
      # these rows.
      - name: Contracts of the nightly integration-fast rows
        run: node scripts/ci-nightly-int-split-selftest.mjs

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Plan the rows
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          # A push plan without a base is the whole workspace: every closure
          # row of Core, packed as on a push to main.
          node scripts/ci-cargo-lanes.mjs --format json --event push --head HEAD >"${RUNNER_TEMP}/nightly-int-planner.json"
          mkdir -p "${RUNNER_TEMP}/nightly-int-plan"
          node scripts/ci-nightly-int-split.mjs matrix "${RUNNER_TEMP}/nightly-int-planner.json" \
            --rows "${RUNNER_TEMP}/nightly-int-plan/nightly-int-rows.json" >"${RUNNER_TEMP}/nightly-int-matrix.json"
          echo "matrix=$(cat "${RUNNER_TEMP}/nightly-int-matrix.json")" >>"${GITHUB_OUTPUT}"

      # The rows the aggregate must account for. Three days, like the other
      # diagnostic uploads.
      - name: Keep the planned rows for the aggregate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-int-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-int-plan/nightly-int-rows.json
          if-no-files-found: error
          retention-days: 3

  workspace-int:
    name: Workspace integration-fast tests (${{ matrix.name }})
    needs: workspace-int-plan
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ${{ matrix.runner }}
    # A row builds a part of what `make test-int` built and runs a part of
    # its tests, so a row has that job's limit: 240 minutes (on 2026-11-07
    # it compiled for 79 minutes and ran its 23968 tests in 81). How long a
    # row takes here is not measured yet. The runner and the limit are the
    # row's own (scripts/ci-nightly-int-split.mjs): the bin row, whose rkat
    # harness links the whole CLI, is sized by constants of its own.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      # The account's 40 hosted jobs are shared with every pull request and
      # main push, and nightly is built to hold about ten (the head of this
      # file): at most four rows run at once.
      max-parallel: 4
      # When the plan job left no matrix: one stand-in row that fails with
      # the reason, so the chain goes on and the aggregate reports it.
      matrix: ${{ fromJSON(needs.workspace-int-plan.outputs.matrix || '{"include":[{"id":"no-plan","name":"no plan","runner":"ubuntu-24.04","timeout_minutes":5}]}') }}
    env:
      RUSTC_WRAPPER: sccache
      # At four Cargo jobs the 16 GB runner lost this job mid-build (exit 143
      # after the log went silent, 2026-10-14 and 10-16). A cold `make
      # test-int` reached 15.0 GiB of rustc memory within two minutes (the
      # schema catalog's library and test harness beside the kernels and
      # contracts), and single meerkat-core and meerkat-runtime rustc
      # processes reach 6-7 GiB. Two jobs keep at most two rustc alive.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Stop when the plan job left no rows
        if: ${{ matrix.id == 'no-plan' }}
        run: |
          echo "::error::the plan job produced no rows (see the job Workspace integration-fast rows (plan))"
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The build of `make test-int` no longer fits the hosted runner's root
      # disk. No step here uses these preinstalled toolchains; removing them
      # frees the root disk the way CI's closure-tests job does.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-workspace-int
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      # The runner's size and 12 GiB of swap before the build, after the
      # disk is freed above: the step of the workspace-unit job, with this
      # job's file names. Run 43976249019 lost this job's runner 91 minutes
      # into `make test-int` with the disk freed (job 133878731987, "The
      # hosted runner lost communication with the server"). The cause is
      # not established: this step prints memory and disk before the build,
      # and vmstat logs every 30 seconds for the step after the tests.
      # Nothing here fails the job.
      - name: Show the runner's size and add swap (workspace integration-fast tests)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          show_resources() {
            nproc
            free -m
            if [[ -d /mnt ]]; then
              df -h / /mnt
            else
              df -h /
            fi
            swapon --show || true
          }
          show_resources
          vmstat -t 30 >"${RUNNER_TEMP}/workspace-int-vmstat.log" 2>&1 </dev/null &
          # Every two minutes, the root file system's free space, for the
          # step after the tests to print (a logger like vmstat's above).
          (
            while :; do
              echo "space reading [periodic $(date -u +%H:%M:%SZ)]: filesystem of /: $(df -Pk / | awk 'NR == 2 { printf "%d MiB free of %d MiB", $(NF - 2) / 1024, $(NF - 4) / 1024 }')" || true
              sleep 120 || true
            done
          ) >"${RUNNER_TEMP}/workspace-int-disk.log" 2>&1 </dev/null &
          swapfile=/workspace-int-swapfile
          need_gib=40
          if mountpoint -q /mnt; then
            mnt_avail_kib="$(df --output=avail -k /mnt | tail -n 1 | tr -d ' ')"
            if ((mnt_avail_kib >= 20 * 1024 * 1024)); then
              swapfile=/mnt/workspace-int-swapfile
              need_gib=20
            fi
          fi
          avail_kib="$(df --output=avail -k "$(dirname "${swapfile}")" | tail -n 1 | tr -d ' ')"
          if ((avail_kib < need_gib * 1024 * 1024)); then
            echo "::warning title=Workspace integration-fast swap::under ${need_gib} GiB free for ${swapfile}: no swap added"
            exit 0
          fi
          echo "Adding 12 GiB of swap at ${swapfile}"
          sudo fallocate -l 12GiB "${swapfile}"
          sudo chmod 600 "${swapfile}"
          sudo mkswap "${swapfile}"
          sudo swapon "${swapfile}"
          show_resources

      # Space readings before and after the row's tests: when the root disk
      # fills during the build they name the directories that hold the space.
      # They remove nothing, and nothing here fails the job. Each directory
      # total is one `du` of a named directory, ended after 60 seconds.
      - name: Show disk use before the workspace integration-fast tests
        continue-on-error: true
        shell: bash
        env:
          ROW_NAME: ${{ matrix.name }}
        run: |
          space_reading() {
            local boundary="$1" path="" size="" status=0
            for path in / "${GITHUB_WORKSPACE:-.}"; do
              timeout 60 df -Pk -- "${path}" 2>/dev/null |
                awk -v boundary="${boundary}" -v path="${path}" '
                  NR == 2 { printf "space reading [%s]: filesystem of %s: %d MiB free of %d MiB\n", boundary, path, $(NF - 2) / 1024, $(NF - 4) / 1024 }
                  END { if (NR < 2) printf "space reading [%s]: filesystem of %s: unavailable\n", boundary, path }' || true
            done
            for path in \
              "${CARGO_TARGET_DIR:-target}" \
              "${CARGO_TARGET_DIR:-target}/debug/deps" \
              "${CARGO_TARGET_DIR:-target}/debug/build" \
              "${CARGO_HOME:-${HOME}/.cargo}/registry" \
              "${CARGO_HOME:-${HOME}/.cargo}/git" \
              "${SCCACHE_DIR:-${HOME}/.cache/sccache}" \
              "${RUNNER_TEMP:-/tmp}" \
              /tmp; do
              if [[ -L "${path}" || ! -d "${path}" ]]; then
                echo "space reading [${boundary}]: ${path}: no such directory"
                continue
              fi
              status=0
              size="$(timeout 60 du -skP -- "${path}" 2>/dev/null)" || status=$?
              size="${size%%$'\t'*}"
              if [[ "${status}" -eq 124 ]]; then
                echo "space reading [${boundary}]: ${path}: timed out after 60 s"
              elif [[ "${size}" =~ ^[0-9]+$ ]]; then
                echo "space reading [${boundary}]: ${path}: $((size / 1024)) MiB as reported by du (unverified)"
              else
                echo "space reading [${boundary}]: ${path}: unavailable"
              fi
            done
          }
          space_reading "before the row's tests" || true
          # The file the next step uploads: the run's keys and the free and
          # used space of the two file systems, by mount point. Numbers only:
          # no directory total, no listing, nothing else of the environment.
          readings="${RUNNER_TEMP}/space-readings-nightly-workspace-int-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.txt"
          {
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run id: ${GITHUB_RUN_ID}"
            echo "run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "sha: ${GITHUB_SHA}"
            echo "row: ${ROW_NAME}"
            echo "boundary: before the row's tests"
            echo "read at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for label in root workspace; do
              path=/
              if [[ "${label}" == workspace ]]; then
                path="${GITHUB_WORKSPACE:-.}"
              fi
              timeout 60 df -Pk -- "${path}" 2>/dev/null |
                awk -v label="${label}" '
                  NR == 2 { printf "filesystem of the %s, mounted on %s: %d MiB free, %d MiB used, %d MiB total\n", label, $NF, $(NF - 2) / 1024, $(NF - 3) / 1024, $(NF - 4) / 1024 }
                  END { if (NR < 2) printf "filesystem of the %s: unavailable\n", label }' || true
            done
          } 2>/dev/null >"${readings}" ||
            echo "space reading [before the row's tests]: the file for the upload could not be written" || true

      # When this job ends without a readable log, the reading above is lost
      # with it (nightly runs 45533040642 and 45742394747: the step had
      # passed, the log could not be read afterwards). An artifact uploaded
      # before the tests is expected to stay readable; that has not been
      # seen yet for a job that ended this way. One small file, kept three
      # days like the other diagnostic uploads; a failed upload fails
      # nothing. The readings taken during and after the tests are printed
      # by the step after them and are not kept this way.
      - name: Keep the disk reading taken before the workspace integration-fast tests
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: space-readings-nightly-workspace-int-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/space-readings-nightly-workspace-int-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.txt
          if-no-files-found: ignore
          retention-days: 3

      # One row (scripts/ci-nightly-int-row.sh): build and list its selection,
      # check that nextest lists exactly its binaries, run it, and write its
      # report for the aggregate.
      - name: Workspace integration-fast tests
        env:
          PACKAGES: ${{ matrix.packages }}
          TESTS: ${{ matrix.tests }}
          PROFILE: ${{ matrix.profile }}
          FILTER: ${{ matrix.filter }}
          BINARIES: ${{ matrix.binaries }}
          NO_TESTS: ${{ matrix.no_tests }}
          MIN_STACK: ${{ matrix.rust_min_stack }}
          PARTITION: ${{ matrix.partition }}
          ROW_ID: ${{ matrix.id }}
          ROW_NAME: ${{ matrix.name }}
          ROW_KIND: ${{ matrix.kind }}
          ROW_CHECK: ${{ matrix.check }}
          REPORT_DIR: ${{ runner.temp }}/nightly-int-row
        run: bash scripts/ci-nightly-int-row.sh

      # After a lost runner no later step runs, not even this one; it prints
      # for a job that ended by itself.
      - name: Show memory after the workspace integration-fast tests
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          ROW_NAME: ${{ matrix.name }}
        run: |
          free -m
          swapon --show || true
          grep -E '^(pswpin|pswpout|oom_kill) ' /proc/vmstat || true
          cat "${RUNNER_TEMP}/workspace-int-vmstat.log" || true
          df -h /
          cat "${RUNNER_TEMP}/workspace-int-disk.log" || true
          space_reading() {
            local boundary="$1" path="" size="" status=0
            for path in / "${GITHUB_WORKSPACE:-.}"; do
              timeout 60 df -Pk -- "${path}" 2>/dev/null |
                awk -v boundary="${boundary}" -v path="${path}" '
                  NR == 2 { printf "space reading [%s]: filesystem of %s: %d MiB free of %d MiB\n", boundary, path, $(NF - 2) / 1024, $(NF - 4) / 1024 }
                  END { if (NR < 2) printf "space reading [%s]: filesystem of %s: unavailable\n", boundary, path }' || true
            done
            for path in \
              "${CARGO_TARGET_DIR:-target}" \
              "${CARGO_TARGET_DIR:-target}/debug/deps" \
              "${CARGO_TARGET_DIR:-target}/debug/build" \
              "${CARGO_HOME:-${HOME}/.cargo}/registry" \
              "${CARGO_HOME:-${HOME}/.cargo}/git" \
              "${SCCACHE_DIR:-${HOME}/.cache/sccache}" \
              "${RUNNER_TEMP:-/tmp}" \
              /tmp; do
              if [[ -L "${path}" || ! -d "${path}" ]]; then
                echo "space reading [${boundary}]: ${path}: no such directory"
                continue
              fi
              status=0
              size="$(timeout 60 du -skP -- "${path}" 2>/dev/null)" || status=$?
              size="${size%%$'\t'*}"
              if [[ "${status}" -eq 124 ]]; then
                echo "space reading [${boundary}]: ${path}: timed out after 60 s"
              elif [[ "${size}" =~ ^[0-9]+$ ]]; then
                echo "space reading [${boundary}]: ${path}: $((size / 1024)) MiB as reported by du (unverified)"
              else
                echo "space reading [${boundary}]: ${path}: unavailable"
              fi
            done
          }
          space_reading "after the row's tests" || true
          # The file the next step keeps beside the row's report: the same
          # numbers as the file kept before the tests.
          readings="${RUNNER_TEMP}/nightly-int-row/space-readings-after.txt"
          mkdir -p "${RUNNER_TEMP}/nightly-int-row" || true
          {
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run id: ${GITHUB_RUN_ID}"
            echo "run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "sha: ${GITHUB_SHA}"
            echo "row: ${ROW_NAME}"
            echo "boundary: after the row's tests"
            echo "read at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for label in root workspace; do
              path=/
              if [[ "${label}" == workspace ]]; then
                path="${GITHUB_WORKSPACE:-.}"
              fi
              timeout 60 df -Pk -- "${path}" 2>/dev/null |
                awk -v label="${label}" '
                  NR == 2 { printf "filesystem of the %s, mounted on %s: %d MiB free, %d MiB used, %d MiB total\n", label, $NF, $(NF - 2) / 1024, $(NF - 3) / 1024, $(NF - 4) / 1024 }
                  END { if (NR < 2) printf "filesystem of the %s: unavailable\n", label }' || true
            done
          } 2>/dev/null >"${readings}" ||
            echo "space reading [after the row's tests]: the file for the upload could not be written" || true

      # The row's report is what the aggregate accounts for: a row without
      # one is named there as missing. The reading taken after the tests
      # goes with it. Three days, like the other diagnostic uploads.
      - name: Keep the row's report and the disk reading taken after its tests
        if: ${{ always() && matrix.id != 'no-plan' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-int-row-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nightly-int-row/report.json
            ${{ runner.temp }}/nightly-int-row/space-readings-after.txt
          if-no-files-found: warn
          retention-days: 3

  # Every row reports to this job, and it fails unless each planned row left
  # a report of a completed, successful run of exactly the tests nextest
  # selected for it (scripts/ci-nightly-int-split.mjs aggregate). It prints
  # the tests listed, selected, ignored, run, passed, failed and skipped per
  # row and in total, where the lib harnesses run, the binaries two rows
  # name, and the bin row's count. The counts are nextest's for the run;
  # nothing asserts a number of tests.
  workspace-int-aggregate:
    name: Workspace integration-fast rows (aggregate)
    needs: workspace-int
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Every attempt's artifacts of this run: a rerun of failed jobs leaves
      # the first attempt's reports of the rows it does not rerun.
      - name: Fetch the planned rows and the rows' reports
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: nightly-int-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/nightly-int-reports

      - name: Account for every row
        shell: bash
        env:
          ROWS_RESULT: ${{ needs.workspace-int.result }}
        run: |
          node scripts/ci-nightly-int-split.mjs aggregate \
            --rows-dir "${RUNNER_TEMP}/nightly-int-reports" --reports-dir "${RUNNER_TEMP}/nightly-int-reports" \
            --rows-result "${ROWS_RESULT}" --summary "${GITHUB_STEP_SUMMARY}"

  e2e-fast:
    name: Deterministic e2e lane
    needs: minimal-and-modularity
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-e2e-fast
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tool-ci
        with:
          tool: nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Deterministic e2e lane
        run: make e2e-fast

  dense-topology:
    name: GitHub-hosted dense Mob topology
    needs: clippy-full
    if: ${{ !cancelled() && !inputs.graph_only }}
    uses: ./.github/workflows/mob-dense-topology.yml

  machine-verify:
    name: Bounded TLC machine verification
    needs: gcp-buildbuddy
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      # A dedicated runner has no Cargo lock contention, so keep xtask under
      # the standard cached target root instead of the local /tmp isolation.
      XTASK_TARGET_DIR: ${{ github.workspace }}/target
      # The generated adaptive composition is large enough that Java's
      # container-selected ~3.5 GiB heap OOMs during semantic processing.
      JAVA_TOOL_OPTIONS: -Xmx8g
      # The per-run TLC cap of this job's sweep (the checker's default is
      # 900 s). The longest run, SessionDocumentMachine's ci.cfg
      # (156,393,703 states generated over 38,712 distinct ones), finished
      # in 846 s on one kind of hosted runner (2026-11-16) and was killed at
      # 900 s, 78 percent through, on a slower kind (2026-11-14 and
      # 2026-11-16: about 1180 s projected), so the machine had no complete
      # bounded check on those nights. 1800 s is 1.5 times the slower kind's
      # need. A run that reaches the cap still fails as TLC INCOMPLETE,
      # never as a pass. The cap holds for every run of the sweep: with one
      # run at the cap the job takes about 61 of its 90 minutes (setup and
      # the xtask build 10, the other runs 21), so the checker reports it;
      # with a second run at the cap the job's limit can come first.
      TLC_RUN_CAP_SECS: "1800"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-machine-verify
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Setup TLC
        uses: ./.github/actions/setup-tlc-ci
        with:
          setup-java: "false"

      # Only the lane's machine-verify part, which no per-change lane runs:
      # the bounded adaptive witness, then `machine-verify --all`: 40 minutes
      # with setup and the xtask build on 2026-11-16, and about 50 on the
      # slower kind of runner (see TLC_RUN_CAP_SECS above). The lane's
      # twenty-seven audit shards run in ci.yml's tlc-audits job on every
      # change scripts/machine-authority-changed matches. The whole lane in
      # one 4-vCPU job needs an estimated 218-260 minutes, and it hit this
      # job's 90-minute limit every night from 2026-11-04.
      - name: Adaptive witness and machine-verify --all sweep
        run: make machine-verify MACHINE_VERIFY_PART=machine-verify

  machine-verify-deep:
    name: Deep TLC composition verification
    needs: audit
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      # A dedicated runner has no Cargo lock contention, so keep xtask under
      # the standard cached target root instead of the local /tmp isolation.
      XTASK_TARGET_DIR: ${{ github.workspace }}/target
      # The generated adaptive composition is large enough that Java's
      # container-selected ~3.5 GiB heap OOMs during semantic processing.
      JAVA_TOOL_OPTIONS: -Xmx8g
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-machine-verify
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Setup TLC
        uses: ./.github/actions/setup-tlc-ci
        with:
          setup-java: "false"

      - name: Deep composition verification (900 s per-run cap)
        run: make machine-verify-deep-compositions

      # The auth CI profile samples a restore's last_refresh and
      # refresh_attempt, which set only the state fields of those names, and
      # nothing reads those, so the source-credential publication audit that
      # ci.yml's audits-s shard runs explores one value of each. Here it
      # explores their whole domains, the space it explored before the
      # samples, and refuses its five seeded defects: 786 s locally with 4
      # TLC workers, an estimated 40 minutes on this runner.
      - name: Source-credential publication audit over the whole domains
        if: ${{ !cancelled() }}
        env:
          TLC_WORKERS: "4"
        run: specs/machines/auth/source_credential_publication_audit.sh 5 --mutants --whole-domain

  sdk-host:
    name: Python + TypeScript SDK suites
    needs: e2e-fast
    if: ${{ !cancelled() && !inputs.graph_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Compile without sccache when its install failed
        if: ${{ steps.sccache.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::sccache-action did not install sccache (see its Setup sccache step); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"

      - name: Setup mold linker
        uses: ./.github/actions/setup-mold-ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-sdk-host
          # Registry only: compiled objects come from sccache. Per-job target
          # caches would exceed the repository's 10 GB cache limit and evict the
          # pull-request lanes' sccache objects every night.
          cache-targets: "false"
          cache-on-failure: true

      - name: Build RPC binary for SDK smoke tests
        run: ./scripts/repo-cargo build -p meerkat-rpc

      - name: Python + TypeScript SDK tests
        run: make -j2 test-sdk-python test-sdk-typescript

  # Default OFF: the self-hosted GCP graph runs only while the repository
  # variable MEERKAT_GCP_BUILDBUDDY_ENABLED is 'true'. Otherwise a scheduled
  # or ordinary run skips this job (nothing starts, syncs or scales) and the
  # chains below still run, while a graph_only dispatch still calls
  # buildbuddy.yml, whose GCP jobs are gated off and whose gate job fails: a
  # graph-only check of a disabled graph is red, never an empty green.
  gcp-buildbuddy:
    name: GCP BuildBuddy (full-fresh)
    if: ${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' || inputs.graph_only }}
    uses: ./.github/workflows/buildbuddy.yml
    with:
      mode: full-fresh
    # Exactly the secrets buildbuddy.yml declares, never `secrets: inherit`:
    # no registry or publish token reaches the called workflow.
    secrets:
      MEERKAT_GCP_BUILDBUDDY_API_KEY: ${{ secrets.MEERKAT_GCP_BUILDBUDDY_API_KEY }}
      BUILDBUDDY_ENDPOINT: ${{ secrets.BUILDBUDDY_ENDPOINT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RKAT_ANTHROPIC_API_KEY: ${{ secrets.RKAT_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RKAT_OPENAI_API_KEY: ${{ secrets.RKAT_OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RKAT_GEMINI_API_KEY: ${{ secrets.RKAT_GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      MEERKAT_E2E_AUTH_OPENAI_OAUTH_TOKENS_JSON: ${{ secrets.MEERKAT_E2E_AUTH_OPENAI_OAUTH_TOKENS_JSON }}
      MEERKAT_E2E_AUTH_ANTHROPIC_MODEL: ${{ secrets.MEERKAT_E2E_AUTH_ANTHROPIC_MODEL }}
      MEERKAT_E2E_AUTH_GEMINI_MODEL: ${{ secrets.MEERKAT_E2E_AUTH_GEMINI_MODEL }}
      MEERKAT_E2E_AUTH_VERTEX_CANARY: ${{ secrets.MEERKAT_E2E_AUTH_VERTEX_CANARY }}

  clippy-full:
