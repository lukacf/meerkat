name: Nightly

# Everything pull-request CI (ci.yml) deliberately does not run. ci.yml is
# Cargo-only, selected by changed paths, and sized to a 20-minute
# push-to-terminal budget; the broad, slow, or low-churn coverage runs here
# once a day on free hosted runners (plus on demand), and the release
# workflow re-runs the BuildBuddy graph on the tag.
#
# Coverage rationale:
#   workspace-unit    - `make test-unit`: every workspace unit test (PR CI
#                       runs only the directly changed packages)
#   workspace-int     - `make test-int`: every integration-fast test
#   e2e-fast          - deterministic real-binary end-to-end lane
#   dense-topology    - the exact 300-member/150-peer Mob stress on hosted
#                       Linux (17-22 minutes; does not fit PR CI)
#   machine-verify    - bounded TLC verification of the canonical machines
#   sdk-host          - Python + TypeScript SDK suites, unconditional
#   gcp-buildbuddy    - the whole BuildBuddy/Bazel graph in `full-fresh`
#                       mode: prebuild, fmt/static, native nextest lanes,
#                       governance (seam-inventory, rmat-audit, machine
#                       authority), SDK suites, wasm-check, minimal-feature,
#                       feature matrix, audit
#   clippy-full       - clippy --all-targets --all-features over the whole
#                       workspace (PR CI lints changed packages only)
#   feature-matrix    - feature-unification bugs the all-features lane hides
#   minimal/modular   - minimal-feature builds + surface modularity contracts
#   e2e-system        - real-binary/local-resource lane
#   sdk-web           - full Web SDK suite
#   wasm-contract     - wasm-pack browser contract test in headless Chrome
#   release-packaging - per-crate `cargo package` dry-run (release hygiene)
#   audit             - daily cargo-deny advisory sweep
#   mobkit-docs-lag   - docs/mobkit mirror vs MobKit main (docs-touching commits);
#                       fails when more than one release was published after
#                       the mirrored one (publication has stalled silently)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  # The reusable BuildBuddy workflow authenticates to GCP with OIDC.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Stable per-VM Cargo home: hosted runners are fresh per job, and cache
  # reuse (rust-cache + sccache) requires registry source paths that do not
  # change between runs.
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_TOOLCHAIN: 1.94.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  workspace-unit:
    name: Workspace unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-workspace-unit
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Workspace unit tests
        run: make test-unit

  workspace-int:
    name: Workspace integration-fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-workspace-int
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Workspace integration-fast tests
        run: make test-int

  e2e-fast:
    name: Deterministic e2e lane
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-e2e-fast
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Deterministic e2e lane
        run: make e2e-fast

  dense-topology:
    name: GitHub-hosted dense Mob topology
    uses: ./.github/workflows/mob-dense-topology.yml

  machine-verify:
    name: Bounded TLC machine verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      # A dedicated runner has no Cargo lock contention, so keep xtask under
      # the standard cached target root instead of the local /tmp isolation.
      XTASK_TARGET_DIR: ${{ github.workspace }}/target
      # The generated adaptive composition is large enough that Java's
      # container-selected ~3.5 GiB heap OOMs during semantic processing.
      JAVA_TOOL_OPTIONS: -Xmx8g
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-machine-verify
          cache-on-failure: true

      - name: Install pinned TLC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/lib" "$HOME/.local/bin"
          curl --fail --location --retry 5 --retry-delay 2 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output "$HOME/.local/lib/tla2tools.jar"
          printf '#!/bin/sh\nexec java -jar "%s/tla2tools.jar" "$@"\n' \
            "$HOME/.local/lib" > "$HOME/.local/bin/tlc"
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Canonical bounded machine verification
        run: make machine-verify

  sdk-host:
    name: Python + TypeScript SDK suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-sdk-host
          cache-on-failure: true

      - name: Build RPC binary for SDK smoke tests
        run: ./scripts/repo-cargo build -p meerkat-rpc

      - name: Python + TypeScript SDK tests
        run: make -j2 test-sdk-python test-sdk-typescript

  gcp-buildbuddy:
    name: GCP BuildBuddy (full-fresh)
    uses: ./.github/workflows/buildbuddy.yml
    with:
      mode: full-fresh
    secrets: inherit

  clippy-full:
    name: Clippy (all targets, all features)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-clippy-full

      - name: Clippy (workspace, all features, all targets)
        run: make lint

  feature-matrix:
    name: Feature matrix (lint + test)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-matrix

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Feature matrix clippy
        run: make lint-feature-matrix

      - name: Feature matrix tests
        run: make test-feature-matrix

  minimal-and-modularity:
    name: Minimal features + surface modularity
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-minimal

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Minimal feature tests
        run: make test-minimal

      - name: Surface modularity tests
        run: make test-surface-modularity

  release-stack-budget:
    name: Release worker-stack budget (rkat-rpc dispatch path)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-release-stack

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      # Release codegen colours stack slots, so this measures the property
      # the shipped binaries actually have. It lives on the nightly, not the
      # release path: a release build of meerkat-rpc's tests is minutes of
      # runner time that would land on every tag otherwise.
      - name: RPC router tests on a 1 MiB release stack
        run: make stack-budget-release

  e2e-system:
    name: System e2e lane
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-e2e-system

      - name: Install nextest
        uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Real-binary system lane
        run: make e2e-system

  sdk-web:
    name: Web SDK build + tests
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-sdk-web

      - name: Web SDK build and tests
        run: make test-sdk-web

  wasm-contract:
    name: WASM browser contract
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-wasm-contract

      - name: Build browser contract test (wasm32)
        run: ./scripts/repo-cargo test -p meerkat-web-runtime --target wasm32-unknown-unknown --test browser_contract --no-run

      - name: Browser contract test (headless Chrome)
        run: wasm-pack test --headless --chrome meerkat-web-runtime --test browser_contract

  release-packaging:
    name: Release packaging dry-run
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-packaging

      - name: Check Rust release packaging
        run: make check-rust-release-packaging

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Cargo deny
        run: make audit

  mobkit-docs-lag:
    name: MobKit docs mirror lag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compare the mirrored MobKit commit with MobKit main
        env:
          # The workflow token can read another public repository's compare
          # endpoint even with `contents: read` here. If lukacf/meerkat-mobkit
          # stops being public, or the token loses that read, the API call
          # fails and the job must fail as "lag unknown" rather than report
          # zero lag.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mirrored=$(python3 -c 'import json; print(json.load(open("docs/mobkit/_source.json"))["source_commit"])')
          compare="${RUNNER_TEMP}/mobkit-compare.json"
          if ! gh api "repos/lukacf/meerkat-mobkit/compare/${mirrored}...main" > "${compare}"; then
            echo "::error::Could not compare the mirrored MobKit commit with main using the workflow token; the MobKit docs mirror lag is unknown, not zero." >&2
            exit 1
          fi
          python3 scripts/check-mobkit-docs-lag.py \
            --manifest docs/mobkit/_source.json \
            --compare "${compare}" \
            --max-lag 0
