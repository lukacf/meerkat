name: Ultrafast (owner pool)

# Owner-dispatched lanes on the ephemeral GCP fast-runner pool
# (.github/workflows/fast-runners.yml, scripts/fast-runners). Dispatch only:
# pull-request and push CI stay on GitHub-hosted runners in ci.yml, which
# never routes by actor or to a self-hosted runner.
#
# Every pool lane has its own runner and label and resolves `runs-on` from
# the up job's outputs before it is queued: its pool label when its runner is
# online, else its GitHub-hosted runner. With MEERKAT_FAST_RUNNERS_ENABLED
# unset (the default), with backend 'hosted', for a dispatch that is not the
# owner's on main, or for a re-run attempt the pool was not made for, every
# lane runs GitHub-hosted and nothing in GCP starts. The down job runs under
# always() and needs every pool lane. The gate fails unless every job
# succeeded (a skipped lane fails it) and, when the pool came up, unless
# every pool lane ran on its own pool runner.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: auto (pool when it comes up, else GitHub-hosted), fast (pool or fail), hosted (never the pool)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - fast
          - hosted

permissions:
  contents: read

concurrency:
  group: ultrafast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast-up:
    name: Fast runners up
    uses: ./.github/workflows/fast-runners.yml
    permissions:
      contents: read
      id-token: write
    with:
      action: up
      backend: ${{ inputs.backend || 'auto' }}
      runners: '[{"lane":"workspace-lib","class":"x64-xl"}]'

  # Example lane: the pre-push hook's workspace kind(lib) lane, which a
  # 4-vCPU hosted runner needs about 64 minutes for. Pool lanes get no
  # id-token and no secrets. The timeout stays well inside the VMs' 120-minute
  # GCE max-run-duration.
  workspace-lib:
    name: Workspace lib tests
    needs: [fast-up]
    if: ${{ !cancelled() && needs.fast-up.result != 'failure' }}
    runs-on: ${{ (needs.fast-up.outputs.attempt == github.run_attempt && fromJSON(needs.fast-up.outputs.runs_on)['workspace-lib']) || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_LANE_ID: ultrafast
      RUST_MIN_STACK: "33554432"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Install nextest
        uses: taiki-e/install-action@2eb6de229bc778f7df20e106e4b34e9a364c73e6 # nextest

      - name: Workspace lib tests
        shell: bash
        run: |
          set -euo pipefail
          MEERKAT_MCP_TEST_SERVER="$(scripts/mcp-test-server-fixture)"
          export MEERKAT_MCP_TEST_SERVER
          ./scripts/repo-cargo nextest run --workspace -E 'kind(lib)' \
            --profile ci-unit --no-tests=fail --no-fail-fast \
            --status-level none --final-status-level fail

  fast-down:
    name: Fast runners down
    if: ${{ always() }}
    needs: [fast-up, workspace-lib]
    uses: ./.github/workflows/fast-runners.yml
    permissions:
      contents: read
      id-token: write
    with:
      action: down
      backend: ${{ inputs.backend || 'auto' }}
      runners: '[{"lane":"workspace-lib","class":"x64-xl"}]'
      up_backend: ${{ needs.fast-up.outputs.backend }}

  gate:
    name: Ultrafast gate
    if: ${{ always() }}
    needs: [fast-up, workspace-lib, fast-down]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the gate script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/fast-runners
          sparse-checkout-cone-mode: false

      - name: Verify every lane ran, on the pool when it came up
        env:
          FAST_RUNNERS_NEEDS: ${{ toJSON(needs) }}
          FAST_RUNNERS_POOL_LANES: '["workspace-lib"]'
          FAST_RUNNERS_SPEC: '[{"lane":"workspace-lib","class":"x64-xl"}]'
          FAST_RUNNERS_REQUESTED: ${{ inputs.backend || 'auto' }}
          FAST_RUNNERS_UP_BACKEND: ${{ needs.fast-up.outputs.backend }}
          FAST_RUNNERS_RUNS_ON: ${{ needs.fast-up.outputs.runs_on }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/fast-runners verify-lanes
