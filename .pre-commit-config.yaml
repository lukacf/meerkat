# Pre-commit configuration for Meerkat
# Install: pip install pre-commit
# Setup: make install-hooks

default_stages: [pre-commit]
# Once any hook has rejected the exact pushed tree, later expensive hooks
# cannot make that push acceptable. Stop immediately so the operator can fix
# the named defect without spending another broad validation cycle first.
fail_fast: true

repos:
  # On commit: auto-format Rust code
  - repo: local
    hooks:
      - id: cargo-fmt-fix
        name: cargo fmt (auto-fix)
        entry: scripts/repo-cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

  # On commit: regenerate Bazel BUILD files when the commit changes an input
  # of the generator: Cargo metadata, a Rust source under crates/ or tests/
  # (a test's data and srcs follow its source text, and a new module file
  # joins srcs), or the generator and the files it reads. CI rejects stale
  # generated BUILDs; the hook refreshes them and fails so they can be staged.
  # The hook runs on every commit and reads the staged paths itself, since
  # pre-commit leaves deletions out of the files it matches; it refuses a
  # commit while a Rust file under crates/ or tests/ is not in the index,
  # which the generator would read from disk. No network; a run of the
  # generator takes about 5 seconds.
  - repo: local
    hooks:
      - id: buildbuddy-generate-fix
        name: regenerate Bazel BUILD files (auto-fix)
        entry: node scripts/precommit-build-hook.mjs
        language: system
        always_run: true
        pass_filenames: false

  # On commit: keep the bundled dogma docs inside the repo-local skill synced
  # from the canonical architecture docs. The hook rewrites stale skill copies
  # and fails so the refreshed files can be staged.
  - repo: local
    hooks:
      - id: sync-meerkat-dogma-skill-docs
        name: sync Meerkat dogma skill docs
        entry: scripts/sync-meerkat-dogma-skill-docs.sh
        language: script
        files: '^(docs/architecture/meerkat-dogma(-commentary)?\.md|\.claude/skills/meerkat-dogma-inquisition/references/meerkat-dogma(-commentary)?\.md|scripts/sync-meerkat-dogma-skill-docs\.sh)$'
        pass_filenames: false

  # On push: dogma doctrine mirror gate. The pre-commit hook above is a
  # path-scoped auto-fix convenience; this verify-only rerun-and-diff check
  # runs on every push so a stale skill mirror cannot be pushed even when the
  # canonical docs were changed outside a commit that touched the watched
  # paths (e.g. merges, --no-verify commits).
  - repo: local
    hooks:
      - id: sync-meerkat-dogma-skill-docs-check
        name: Meerkat dogma skill docs mirror (verify-only)
        entry: scripts/sync-meerkat-dogma-skill-docs.sh --check
        language: script
        pass_filenames: false
        stages: [pre-push]

  # On commit: recorded gpt-live provider streams must be scrubbed (no
  # credentials, SDP, host details or voice audio) before they are committed.
  - repo: local
    hooks:
      - id: gpt-live-replay-fixture-scrubbed
        name: gpt-live replay fixtures are scrubbed
        entry: scripts/gpt-live-scrub-provider-stream check
        language: script
        files: '^tests/integration/fixtures/gpt_live_replay/.*\.jsonl$'

  # On push: secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        stages: [pre-push]

  # On push: file hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Released fixture bytes are manifest-hashed and must not be rewritten.
        # Vendored third-party sources (incl. crate_universe-rendered BUILD
        # files, which repin regenerates byte-exact with trailing whitespace)
        # must also stay untouched or the pre-push clean-tree gate refuses. So
        # must Meta's pinned original installer release inputs, whose SHA-256
        # values the release inputs record. The same holds for Meta's released
        # and continuity fixtures, the font licenses and vendored sources, and
        # Connect's vendored Activepieces tree and its license texts. Connect's
        # mcp-config.ts is left out by exact path until the connect/ sync
        # rewrites connect/; revisit it then.
        exclude: '^(crates/meerkat-runtime/tests/fixtures/v0_8_10_released_realm/corpus/realm/|crates/meerkat-runtime/tests/fixtures/v0_7_x_pre_ledger_realm/corpus/|crates/meerkat-core/tests/fixtures/v0_8_10_recovery_migration_session\.json$|crates/meerkat-runtime/tests/fixtures/v0_8_10_recovery_migration_session\.json$|crates/meerkat-cli/tests/fixtures/v0_8_10_released_realm/|crates/meerkat-store/tests/fixtures/v0_9_3_realtime_voice_session/session\.json$|meta/installer/release/inputs/product/|tools/third-party/|connect/sdk/activepieces/(vendor|licenses)/|connect/sdk/activepieces/src/mcp-config\.ts$|meta/crates/meerkat-meta/tests/fixtures/(released|continuity)_[^/]+/|meta/(console/src|installer/web)/fonts/[^/]+/OFL\.txt$|meta/installer/launchkit/templates_v2/toolkit-ui/vendor/entities/decode\.js$)'
        stages: [pre-push]
      - id: end-of-file-fixer
        # Released fixture bytes are manifest-hashed and must not be rewritten.
        # Vendored third-party sources and Meta's pinned original installer
        # release inputs must stay byte-exact (see above), as must Meta's
        # checksum-pinned and include_bytes! fixtures and Connect's exported
        # frontend catalog. Four Meta console sources lack a final newline:
        # they are left out by exact path until a normal console change gives
        # them one (then drop them here); Connect's activepieces test sources
        # and profile guide wait for the connect/ sync (revisit them then).
        exclude: '^(crates/meerkat-runtime/tests/fixtures/v0_8_10_released_realm/corpus/realm/|crates/meerkat-runtime/tests/fixtures/v0_7_x_pre_ledger_realm/corpus/|crates/meerkat-core/tests/fixtures/v0_8_10_recovery_migration_session\.json$|crates/meerkat-runtime/tests/fixtures/v0_8_10_recovery_migration_session\.json$|crates/meerkat-cli/tests/fixtures/v0_8_10_released_realm/|crates/meerkat-store/tests/fixtures/v0_9_3_realtime_voice_session/session\.json$|crates/meerkat-runtime/tests/fixtures/v0_9_4_input_terminal_outcome\.rs\.txt$|meta/installer/release/inputs/product/|tools/third-party/|connect/sdk/activepieces/(vendor|licenses)/|connect/sdk/activepieces/tests/(oauth-mcp\.test\.mjs|content-expansion-mcp\.test\.mjs|fixtures/config-assistance\.mjs)$|connect/sdk/python/src/meerkat_toolkit/(data/frontend_catalog\.json|adapters/PROFILE-GUIDE\.md)$|meta/crates/meerkat-meta/tests/fixtures/((released|continuity)_[^/]+/|security_idempotency/security-head-evolution\.json$|v0_8_10_(released_session|zero_rewrite_supervisor_session)\.json$)|meta/installer/tests/fixtures/dom_drafts/(original|repaired)\.html$|meta/(console/src|installer/web)/fonts/[^/]+/OFL\.txt$|meta/installer/launchkit/templates_v2/toolkit-ui/vendor/entities/decode\.js$|meta/console/src/(styles/(base|chat|topbar)\.css|panels/memory/records\.tsx)$)'
        stages: [pre-push]
      - id: check-yaml
        stages: [pre-push]
      - id: check-toml
        stages: [pre-push]
      - id: check-merge-conflict
        stages: [pre-push]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-push]

  # On push: formatting check
  - repo: local
    hooks:
      - id: ci-nextest-archive-contract
        name: CI nextest archive family and fail-closed contracts
        entry: scripts/test-ci-nextest-archive.sh
        language: script
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-fmt
        name: cargo fmt --check
        entry: scripts/repo-cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

  # Manual: machine file codegen + verify for the exact pushed refs (run
  # them with --from-ref/--to-ref). CI runs both before merge on a
  # machine-authority change: the ratchets job's machine-check-drift and
  # protocol-check-drift (the drift this hook checked, about 100 s here), and
  # the tlc-audits shards (the hand-written audits of the canonical TLC
  # lane, which took 1003-1126 s here with the machine-verify --all sweep);
  # the sweep runs nightly (make machine-verify) and on the release gate.
  - repo: local
    hooks:
      - id: machine-codegen-drift
        name: machine + protocol codegen drift (changed files)
        entry: scripts/pre-push-machines.sh --codegen-only
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]
      # The canonical TLC lane (make machine-verify).
      - id: machine-codegen-verify
        name: machine verify, canonical TLC lane (changed files)
        entry: scripts/pre-push-machines.sh --verify-only
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]

  # On push: strict @generated header truthfulness guard
  - repo: local
    hooks:
      - id: audit-generated-headers
        name: audit-generated-headers (every @generated is codegen-emitted)
        entry: scripts/pre-push-audit-generated-headers.sh
        language: script
        pass_filenames: false
        stages: [pre-push]

  # On push: W2-F bridge-classifier gate (no ResponseStatus matches in bridge files)
  - repo: local
    hooks:
      - id: bridge-no-responsestatus
        name: bridge layer must not re-interpret ResponseStatus (W2-F)
        entry: scripts/pre-push-bridge-no-responsestatus.sh
        language: script
        pass_filenames: false
        stages: [pre-push]

  # On push: Bazel BUILD + MODULE.bazel.lock freshness gate
  # Generated BUILD files are auto-fixed on pre-commit, but MODULE.bazel.lock
  # refresh needs `bb mod deps --lockfile_mode=update` (network, requires the
  # pinned `bb` CLI) — too expensive for every commit. This hook fails closed
  # when either gate is stale and prints the exact `make` command to refresh.
  # When `bb` is not installed locally, the lock check is skipped honestly
  # (CI catches it).
  - repo: local
    hooks:
      - id: bazel-locks-freshness
        name: Bazel BUILD + MODULE.bazel.lock freshness
        entry: scripts/pre-push-bazel-locks.sh
        language: script
        pass_filenames: false
        stages: [pre-push]

  # On push: the contracts of the hook harness and the release-infra gates.
  # The two slow harness contracts (36-38 s and 87-91 s) run when a push
  # changes what they exercise; the release contracts CI's Format +
  # governance job runs on every pull request (release test-code guards,
  # release doctor workflow assertions, prebuild lookup, Intel macOS binary
  # check, asset provenance) are manual here.
  - repo: local
    hooks:
      - id: pre-push-ref-dispatch-contract
        name: pre-push dispatcher validates the exact single pushed ref
        entry: scripts/test-pre-push-dispatch.sh
        language: script
        pass_filenames: false
        files: '^(scripts/(pre-push-dispatch|test-pre-push-dispatch|pre-push-bazel-locks|pre-push-prune-lanes)\.sh|scripts/lib/.*|\.pre-commit-config\.yaml)$'
        stages: [pre-push]

      - id: pre-push-lane-retention-contract
        name: pre-push lane retention keeps the newest lanes and only exact lane names
        entry: scripts/test-pre-push-lane-retention.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pre-push-machine-status-contract
        name: pre-push machine gate preserves classifier and codegen failures
        entry: scripts/test-pre-push-machines.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Also runs the release-projection and harness-only contracts, which
      # read the CI planner and ci.yml.
      - id: pre-push-unit-status-contract
        name: pre-push deterministic gate preserves lane failures
        entry: scripts/test-pre-push-unit-status.sh
        language: script
        pass_filenames: false
        files: '^(scripts/(pre-push-[^/]*|test-pre-push-[^/]*|release-projection-only\.mjs|test-release-projection-[^/]*|ci-cargo-lanes\.mjs|ci-hook-coverage\.mjs|ci-non-rust-readers[^/]*|ci-verify-row-binaries\.mjs|rust-test-selector\.mjs|rust-embedded-inputs\.mjs|generated-contract-ratchet-changed|machine-authority-changed)|\.pre-commit-config\.yaml|\.github/workflows/ci\.yml|\.config/nextest\.toml|Makefile)$'
        stages: [pre-push]

      - id: lock-consistency-gate-contract
        name: lock gate rejects merge-manufactured dangling lock references
        entry: scripts/test-lock-consistency-gate.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: bazel-module-lock-gate-contract
        name: module lock gate rejects stale and unrecorded workspace inputs
        entry: scripts/test-bazel-module-lock-gate.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: crate-enumeration-gate-contract
        name: release gate names crates missing from any required enumeration
        entry: scripts/test-crate-enumeration-gate.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: crate-license-files-gate-contract
        name: license gate names release crates that package no license files
        entry: scripts/test-crate-license-files-gate.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: release-test-code-guards-contract
        name: release guards reject test-only features and test-code markers
        entry: scripts/test-release-test-code-guards.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: release-doctor-workflow-contract
        name: release doctor workflow assertions survive rewording and reject removal
        entry: scripts/test-release-doctor-workflow-contract.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: release-find-prebuild-contract
        name: release prebuild lookup selects only usable exact-commit prebuilds
        entry: scripts/test-release-find-prebuild.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: release-standalone-gate-contract
        name: standalone census check passes only on a green main run at the given commit
        entry: scripts/test-release-require-standalone-green.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: macos-x86-release-binary-check-contract
        name: Intel macOS release binary check refuses each defect
        entry: scripts/test-check-macos-x86-release-binary.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: release-sqlite-profile-check-contract
        name: release SQLite lock profile check refuses each defect
        entry: scripts/test-check-release-binary-sqlite-profile.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: release-asset-provenance-contract
        name: release asset provenance accepts an earlier run only through its build gate
        entry: scripts/test-verify-release-asset-provenance.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: sdk-binary-digest-stamp-contract
        name: SDK binary digest stamp refuses incomplete releases and unstamped packages
        entry: scripts/test_release_stamp_sdk_binary_digests.py
        language: script
        pass_filenames: false
        files: ^(scripts/(release-stamp-sdk-binary-digests|release-await-binary-manifest|test_release_stamp_sdk_binary_digests\.py|verify-release-assets\.py)|sdks/python/meerkat/(_rkat_rpc_digests|client)\.py|sdks/typescript/src/(rkat-rpc-digests|client)\.ts)$
        stages: [pre-push]

      - id: gcp-buildbuddy-workflow-gate-contract
        name: self-hosted GCP graph stays default-off and tags validate on exact-tree CI while it is off
        entry: scripts/test-gcp-buildbuddy-workflow-gate.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gcp-buildbuddy-hardening-contract
        name: BuildBuddy keys travel only over TLS and the self-hosted path keeps its own key
        entry: scripts/test-gcp-buildbuddy-hardening.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: release-packaging-isolation-contract
        name: parallel release packaging isolates outputs and preserves failures
        entry: scripts/test-release-packaging-isolation.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Manual: the deterministic workspace lanes (workspace unit,
      # integration-fast, HeadCanonical, e2e-fast) for the exact pushed refs.
      # They took 1011-3084 s a push here. CI runs them: the changed
      # packages' unit tests in the pull request, every member's unit tests
      # and the integration, HeadCanonical and e2e-fast rows for the test
      # scope on the push, and the workspace unit lane nightly.
      - id: cargo-test
        name: workspace deterministic unit + integration + e2e gate
        entry: scripts/pre-push-unit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
