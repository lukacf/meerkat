name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release_packages:
        description: "Publish Rust/Python/TypeScript artifacts to registries"
        required: false
        default: false
        type: boolean
      registry_dry_run:
        description: "Run registry publish steps in dry-run mode"
        required: false
        default: false
        type: boolean
      alpha_crates_only:
        description: "Canary lane: publish Rust crates only, skipping SDK packages, binaries, GitHub release assets, and Homebrew"
        required: false
        default: false
        type: boolean
      publish_web_sdk_only:
        description: "Recovery lane: publish only @rkat/web and skip already-published registry artifacts"
        required: false
        default: false
        type: boolean
      web_sdk_artifact_run_id:
        description: "Recovery lane: existing workflow run id containing the rkat-web-package artifact"
        required: false
        default: ""
        type: string
      assets_run_id:
        description: "Asset recovery: publish the release archives of this earlier release.yml run on main instead of rebuilding them (requires publish_release_assets_only)"
        required: false
        default: ""
        type: string
      publish_release_assets_only:
        description: "Recovery lane: build surface binaries and publish GitHub release assets only"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag for recovery lanes, for example v0.6.1"
        required: false
        default: ""
        type: string
      semver_evidence_run_id:
        description: "Package recovery: exact failed tag-run id whose completed semver measurement needs only amended declarations"
        required: false
        default: ""
        type: string
      semver_evidence_job_id:
        description: "Package recovery: exact failed semver job id from semver_evidence_run_id"
        required: false
        default: ""
        type: string
      prebuild_release_artifacts:
        description: "Pre-tag prebuild, dispatched on main: build, attest and upload every release binary and the Web SDK package of the dispatched commit, publishing nothing; the tag run of exactly that commit publishes them instead of rebuilding"
        required: false
        default: false
        type: boolean
      release_backend:
        description: "Release backend for validation and binary builds"
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - buildbuddy

# Read-only by default. Only the jobs that need more get it: the build jobs
# mint OIDC tokens to attest their archives (id-token, attestations: write),
# the release publishers write the GitHub release (contents: write), the
# verifiers read attestations, and the full-graph caller passes id-token on
# to buildbuddy.yml. No checkout in a job with a write scope persists the
# token.
permissions:
  actions: read
  checks: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  MEERKAT_RELEASE_BUILDBUDDY: ${{ vars.MEERKAT_RELEASE_BUILDBUDDY || 'false' }}

# Required GitHub Actions secrets for full release:
#   CARGO_REGISTRY_TOKEN  - crates.io API token
#   PYPI_API_TOKEN        - PyPI API token (scoped to meerkat-sdk package)
#   NPM_TOKEN             - npm access token (scoped to @rkat packages or publish)
#   HOMEBREW_TAP_TOKEN    - GitHub token allowed to update the Homebrew tap
#   BUILDBUDDY_API_KEY    - optional owner-only BuildBuddy binary recovery path

jobs:
  require_ci_green:
    name: Require green CI
    timeout-minutes: 130
    runs-on: ${{ fromJSON(vars.MEERKAT_CI_RUNNER || '"ubuntu-24.04"') }}
    outputs:
      # The verified attestation's schema_version on a tag run; empty on
      # manual dispatches, which do not read the attestation.
      ci_attestation_schema: ${{ steps.ci_attestation.outputs.schema }}
      # 'true' when that attestation proves the exact-tree CI run ran every
      # lane release_validate_cargo repeats (see the step); the tag then
      # validates on it alone. Empty on manual dispatches.
      ci_covers_release_validation: ${{ steps.ci_coverage.outputs.covers_release_validation }}
      # The tag (v<workspace version>) a pre-tag prebuild builds for.
      prebuild_tag: ${{ steps.prebuild_request.outputs.tag }}
      # The release commit; publish_web_sdk binds the package artifact to it.
      sha: ${{ steps.release_ref.outputs.sha }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release commit
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          release_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "Release commit: ${release_sha}"
          echo "Release tree: ${release_tree}"
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "tree=${release_tree}" >> "${GITHUB_OUTPUT}"

      # A pre-tag prebuild (prebuild_release_artifacts) builds the release
      # artifacts of the dispatched main commit before its tag exists and
      # publishes nothing, so it neither binds a tag nor waits for CI: the
      # tag run that may later publish its artifacts requires exact-main CI
      # itself, and reuses them only for exactly its own commit (see
      # release_prebuild). It runs on main only, because only main's
      # attestations are trusted by the tag run, and takes no publishing or
      # recovery input. It builds with the backend its tag run will select
      # (the owner's BuildBuddy lane while MEERKAT_RELEASE_BUILDBUDDY is true
      # or 1): on the other backend its critical lanes queue behind other
      # runners and miss the tag run's bounded wait, as v0.9.3's GitHub-hosted
      # prebuild did, so the tag run built everything again.
      - name: Verify release prebuild request
        id: prebuild_request
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' }}
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          PUBLISH_RELEASE_PACKAGES: ${{ github.event.inputs.publish_release_packages }}
          REGISTRY_DRY_RUN: ${{ github.event.inputs.registry_dry_run }}
          ALPHA_CRATES_ONLY: ${{ github.event.inputs.alpha_crates_only }}
          PUBLISH_WEB_SDK_ONLY: ${{ github.event.inputs.publish_web_sdk_only }}
          WEB_SDK_ARTIFACT_RUN_ID: ${{ github.event.inputs.web_sdk_artifact_run_id }}
          ASSETS_RUN_ID: ${{ github.event.inputs.assets_run_id }}
          PUBLISH_RELEASE_ASSETS_ONLY: ${{ github.event.inputs.publish_release_assets_only }}
          SEMVER_EVIDENCE_RUN_ID: ${{ github.event.inputs.semver_evidence_run_id }}
          SEMVER_EVIDENCE_JOB_ID: ${{ github.event.inputs.semver_evidence_job_id }}
          RELEASE_BACKEND: ${{ github.event.inputs.release_backend }}
          TAG_RUN_BACKEND: ${{ github.actor == 'lukacf' && (vars.MEERKAT_RELEASE_BUILDBUDDY == 'true' || vars.MEERKAT_RELEASE_BUILDBUDDY == '1') && 'buildbuddy' || 'github-hosted' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "A release prebuild runs on refs/heads/main only, got ${GITHUB_REF}: a tag run trusts only archives attested on main." >&2
            exit 1
          fi
          if [[ "${RELEASE_BACKEND}" != "${TAG_RUN_BACKEND}" ]]; then
            echo "A release prebuild builds with the backend its tag run selects (${TAG_RUN_BACKEND}), got release_backend=${RELEASE_BACKEND}: dispatch it with make release-prebuild or release_backend=${TAG_RUN_BACKEND}." >&2
            exit 1
          fi
          conflicting=()
          [[ -z "${RELEASE_TAG_INPUT}" ]] || conflicting+=(release_tag)
          [[ "${PUBLISH_RELEASE_PACKAGES}" != "true" ]] || conflicting+=(publish_release_packages)
          [[ "${REGISTRY_DRY_RUN}" != "true" ]] || conflicting+=(registry_dry_run)
          [[ "${ALPHA_CRATES_ONLY}" != "true" ]] || conflicting+=(alpha_crates_only)
          [[ "${PUBLISH_WEB_SDK_ONLY}" != "true" ]] || conflicting+=(publish_web_sdk_only)
          [[ -z "${WEB_SDK_ARTIFACT_RUN_ID}" ]] || conflicting+=(web_sdk_artifact_run_id)
          [[ -z "${ASSETS_RUN_ID}" ]] || conflicting+=(assets_run_id)
          [[ "${PUBLISH_RELEASE_ASSETS_ONLY}" != "true" ]] || conflicting+=(publish_release_assets_only)
          [[ -z "${SEMVER_EVIDENCE_RUN_ID}" ]] || conflicting+=(semver_evidence_run_id)
          [[ -z "${SEMVER_EVIDENCE_JOB_ID}" ]] || conflicting+=(semver_evidence_job_id)
          if [[ "${#conflicting[@]}" -gt 0 ]]; then
            echo "A release prebuild publishes nothing and takes no publishing or recovery input; unset: ${conflicting[*]}" >&2
            exit 1
          fi
          version="$(git show "${GITHUB_SHA}:Cargo.toml" | awk '
            /^\[workspace.package\]/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ')"
          if [[ -z "${version}" ]]; then
            echo "Cannot read workspace.package.version at ${GITHUB_SHA}" >&2
            exit 1
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; its tag run builds or reuses its own artifacts (asset recovery: make release-assets)." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Prebuilding the ${tag} release artifacts of ${GITHUB_SHA}; nothing is published."

      # Every publishing run is bound to a TAG from an explicit allowlist:
      # v<version> for every mode, and alpha/v<version> only for the
      # crates-only alpha canary (alpha_crates_only). A tag push must be
      # exactly refs/tags/<allowed>; a dispatch must name a release_tag that
      # is an allowed tag (not a branch) and the checked-out commit, or run
      # on an allowed tag ref. A branch, whatever it is called
      # (release/v0.8.45 included), is refused, so a branch tip can never
      # publish as the version its Cargo.toml carries.
      - name: Verify selected release ref matches version
        id: release_version
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' &&
           (github.event.inputs.release_tag != '' ||
            github.event.inputs.publish_release_packages == 'true' ||
            github.event.inputs.publish_web_sdk_only == 'true' ||
            github.event.inputs.publish_release_assets_only == 'true'))
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || '' }}
          ALPHA_CRATES_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.alpha_crates_only || '' }}
        run: |
          set -euo pipefail
          version="$(awk '
            /^\[workspace.package\]/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          expected="v${version}"
          allowed=("${expected}")
          if [[ "${ALPHA_CRATES_ONLY}" == "true" ]]; then
            allowed+=("alpha/${expected}")
          fi
          if [[ -n "${RELEASE_TAG_INPUT}" ]]; then
            if ! tag_commit="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG_INPUT}^{commit}")"; then
              echo "release_tag ${RELEASE_TAG_INPUT} is not a tag; a publishing run is bound to a tag, not a branch." >&2
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
              echo "The checked-out commit is not the ${RELEASE_TAG_INPUT} tag." >&2
              exit 1
            fi
            release_tag="${RELEASE_TAG_INPUT}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
          else
            echo "${GITHUB_REF} is not a tag. A publishing run must run on an allowed tag (${allowed[*]}) or name release_tag." >&2
            exit 1
          fi
          bound=false
          for tag in "${allowed[@]}"; do
            if [[ "${release_tag}" == "${tag}" ]]; then
              bound=true
            fi
          done
          if [[ "${bound}" != true ]]; then
            echo "Version mismatch: Cargo.toml has ${version} but the release tag is ${release_tag} (allowed: ${allowed[*]})." >&2
            exit 1
          fi
          echo "Version ${version} matches release tag ${release_tag}"

      - name: Require successful exact-main CI
        id: ci_run
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true') }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_SHA: ${{ steps.release_ref.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = process.env.RELEASE_SHA;
            const timeoutMs = 120 * 60 * 1000;
            const pollMs = 30 * 1000;
            const started = Date.now();
            let supersededReported = false;

            async function listExactMainRuns() {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci.yml",
                branch: "main",
                event: "push",
                head_sha: ref,
                per_page: 100,
              });
              return data.workflow_runs.filter(
                (run) =>
                  run.head_sha === ref &&
                  run.head_branch === "main" &&
                  run.event === "push"
              );
            }

            for (;;) {
              const runs = await listExactMainRuns();
              if (runs.length > 0) {
                core.info(
                  runs
                    .map((run) => `CI attempt ${run.run_attempt}: ${run.status}/${run.conclusion || "pending"} (${run.html_url})`)
                    .join("\n")
                );
              } else {
                core.info(`No exact-main CI run found yet for ${ref}`);
              }

              const success = runs.find(
                (run) => run.status === "completed" && run.conclusion === "success"
              );
              if (success) {
                core.info(`Release commit ${ref} has successful exact-main CI: ${success.html_url}`);
                core.setOutput("run_id", String(success.id));
                core.setOutput("run_attempt", String(success.run_attempt));
                return;
              }

              // ci.yml lets a newer main commit supersede (cancel) an older
              // commit's first attempt unless the commit message names a
              // release ("chore: release v..."). A re-run attempt is never
              // superseded, so re-running the cancelled run recovers.
              const superseded = runs.find(
                (run) => run.status === "completed" && run.conclusion === "cancelled"
              );
              if (superseded && !supersededReported) {
                supersededReported = true;
                core.warning(
                  `Exact-main CI on ${ref} was cancelled (superseded by a newer main commit): ${superseded.html_url}. ` +
                    `Re-run it with: gh run rerun ${superseded.id} --repo ${owner}/${repo}`
                );
              }

              if (Date.now() - started >= timeoutMs) {
                core.setFailed(`Timed out waiting for successful exact-main CI on release commit ${ref}`);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

      - name: Download exact-tree CI attestation
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci_run.outputs.run_id }}
          CI_RUN_ATTEMPT: ${{ steps.ci_run.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.release_ref.outputs.sha }}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/meerkat-ci-attestation"
          artifact="meerkat-ci-attestation-${RELEASE_SHA}-${CI_RUN_ATTEMPT}"
          mkdir -p "${destination}"
          gh run download "${CI_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact}" \
            --dir "${destination}"

      - name: Verify exact-tree CI attestation
        id: ci_attestation
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        env:
          CI_RUN_ID: ${{ steps.ci_run.outputs.run_id }}
          CI_RUN_ATTEMPT: ${{ steps.ci_run.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.release_ref.outputs.sha }}
          RELEASE_TREE: ${{ steps.release_ref.outputs.tree }}
        run: |
          set -euo pipefail
          attestation="${RUNNER_TEMP}/meerkat-ci-attestation/attestation.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit_sha "${RELEASE_SHA}" \
            --arg tree_sha "${RELEASE_TREE}" \
            --arg workflow_run_id "${CI_RUN_ID}" \
            --arg workflow_run_attempt "${CI_RUN_ATTEMPT}" \
            '.repository == $repository and
             .commit_sha == $commit_sha and
             .tree_sha == $tree_sha and
             .workflow == "CI" and
             .workflow_run_id == $workflow_run_id and
             .workflow_run_attempt == $workflow_run_attempt and
             .event == "push" and
             .ref == "refs/heads/main" and
             ((.schema_version == 1 and .cargo_result == "success") or
              (.schema_version == 2 and
               .validation_backend == "gcp-buildbuddy" and
               .validation_result == "success") or
              (.schema_version == 3 and
               .validation_backend == "gcp-buildbuddy+github-hosted-dense-mob" and
               .validation_result == "success" and
               .component_results.gcp_buildbuddy == "success" and
               .component_results.github_hosted_dense_mob == "success") or
              (.schema_version == 4 and
               .validation_backend == "github-hosted-cargo" and
               .validation_result == "success" and
               .component_results.changes == "success" and
               .component_results.fmt_governance == "success" and
               .component_results.ratchets == "success"))' \
            "${attestation}"
          schema="$(jq -r '.schema_version' "${attestation}")"
          echo "schema=${schema}" >> "${GITHUB_OUTPUT}"
          echo "Verified exact-tree CI attestation (schema ${schema}) for ${RELEASE_SHA} (${RELEASE_TREE})"

      # A release commit whose diff from its first parent is only the
      # forward patch projection (scripts/release-projection-only.mjs) gets a
      # CI plan that reuses the parent's exact-main test evidence instead of
      # rebuilding the workspace cold; its schema-4 attestation says so
      # (plan mode release-projection, reused_test_evidence). Such an
      # attestation is accepted only when the evidence holds now, judged by
      # the PARENT's copies of the classifier and the evidence script (a
      # commit cannot certify itself with edited scripts; for an honest
      # projection they are byte-identical): the release commit is still a
      # projection of its first parent, and the recorded attempt is a
      # completed, successful push run of ci.yml on main at exactly that
      # parent, whose own attestation names the parent's commit and tree,
      # planned the whole workspace with every lane successful and is not
      # itself a reuse.
      - name: Setup Node for reused CI evidence
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # The classifier runs the parent's docs and changelog stampers.
      - name: Setup Python for reused CI evidence
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Verify reused release-projection CI evidence
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_ref.outputs.sha }}
        run: |
          set -euo pipefail
          attestation="${RUNNER_TEMP}/meerkat-ci-attestation/attestation.json"
          mode="$(jq -r '.plan.mode // ""' "${attestation}")"
          reused="$(jq -r 'has("reused_test_evidence")' "${attestation}")"
          if [[ "${mode}" != "release-projection" && "${reused}" == "false" ]]; then
            echo "Exact-tree CI ran its own test lanes (plan mode: ${mode:-legacy}); no reused evidence to verify."
            exit 0
          fi
          if [[ "${mode}" != "release-projection" || "${reused}" != "true" ]]; then
            echo "The CI attestation is inconsistent: plan mode ${mode:-none}, reused_test_evidence present: ${reused}." >&2
            exit 1
          fi
          parent="$(git rev-parse --verify "${RELEASE_SHA}^1")"
          parent_tree="$(git rev-parse --verify "${parent}^{tree}")"
          jq -e \
            --arg parent "${parent}" \
            --arg parent_tree "${parent_tree}" \
            '.reused_test_evidence.classifier == "release-projection-only" and
             .reused_test_evidence.workflow == "CI" and
             .reused_test_evidence.base_commit_sha == $parent and
             .reused_test_evidence.base_tree_sha == $parent_tree and
             (.reused_test_evidence.workflow_run_id | test("^[1-9][0-9]*$")) and
             (.reused_test_evidence.workflow_run_attempt | test("^[1-9][0-9]*$"))' \
            "${attestation}" >/dev/null || {
            echo "The reused CI evidence does not name ${RELEASE_SHA}'s first parent ${parent} (${parent_tree})." >&2
            exit 1
          }
          tools="${RUNNER_TEMP}/release-evidence-tools/scripts"
          mkdir -p "${tools}"
          for script in ci-release-evidence.mjs release-projection-only.mjs release-version-pins.mjs; do
            git show "${parent}:scripts/${script}" > "${tools}/${script}"
          done
          node "${tools}/ci-release-evidence.mjs" verify --repository "${GITHUB_REPOSITORY}" \
            --base "${parent}" --head "${RELEASE_SHA}" \
            --run-id "$(jq -r .reused_test_evidence.workflow_run_id "${attestation}")" \
            --run-attempt "$(jq -r .reused_test_evidence.workflow_run_attempt "${attestation}")"

      # release_validate_cargo repeats fmt-governance (fmt, version parity,
      # lock and MODULE.bazel.lock consistency, release config, crate license
      # files), the generated-contract ratchets (schema, SDK codegen, wrapper
      # and RPC/REST surface freshness), which run only when the plan
      # selected them, and both SDK suites (sdk-host). The attestation, already
      # verified above, covers it only when it proves all three ran: the
      # plan's generated_contract flag with green fmt-governance and ratchets
      # jobs, and a green sdk-host job, or a release-projection plan whose
      # reused_test_evidence the step above verified (the parent run planned
      # the whole workspace, sdk-host included, with every lane successful).
      - name: Decide whether the attestation covers Cargo release validation
        id: ci_coverage
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          attestation="${RUNNER_TEMP}/meerkat-ci-attestation/attestation.json"
          if jq -e '
              .schema_version == 4 and
              .plan.generated_contract == true and
              .component_results.fmt_governance == "success" and
              .component_results.ratchets == "success" and
              (.component_results.sdk_host == "success" or
               (.plan.mode == "release-projection" and
                .reused_test_evidence.classifier == "release-projection-only" and
                .reused_test_evidence.workflow == "CI" and
                ((.reused_test_evidence.workflow_run_id // "") | test("^[1-9][0-9]*$")) and
                ((.reused_test_evidence.workflow_run_attempt // "") | test("^[1-9][0-9]*$"))))' \
              "${attestation}" >/dev/null; then
            covers=true
          else
            covers=false
          fi
          echo "covers_release_validation=${covers}" >> "${GITHUB_OUTPUT}"
          echo "Attestation covers the Cargo release validation lanes: ${covers}"

  # Manual dispatches pick Cargo or the hosted BuildBuddy lane below. A tag
  # push skips this job only when its verified exact-tree CI attestation
  # proves that the successful main CI run on exactly this tree ran every
  # check it repeats (require_ci_green's ci_covers_release_validation:
  # fmt-governance, the generated-contract ratchets, which run only when the
  # plan selected them, and the SDK suites). Otherwise, a legacy attestation
  # included, the tag runs it while the self-hosted GCP graph is disabled
  # (repository variable MEERKAT_GCP_BUILDBUDDY_ENABLED is not 'true').
  release_validate_cargo:
    name: Validate release state with Cargo
    needs: [require_ci_green]
    if: >-
      (github.event_name != 'workflow_dispatch' &&
       vars.MEERKAT_GCP_BUILDBUDDY_ENABLED != 'true' &&
       needs.require_ci_green.outputs.ci_covers_release_validation != 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.publish_web_sdk_only != 'true' &&
       github.event.inputs.publish_release_assets_only != 'true' &&
       github.event.inputs.prebuild_release_artifacts != 'true' &&
       !(github.actor == 'lukacf' &&
         github.event.inputs.release_backend == 'buildbuddy'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      # A recovery of an older tag checks that tag out, and its local
      # actions would be the tag's own: the setup action comes from the
      # workflow's commit instead, whose third-party actions are pinned.
      # Sparse, so the checkout adds no Cargo or Bazel package to the build.
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-rust-ci/action.yml
            scripts/ci-pin-rust-toolchain-env
          sparse-checkout-cone-mode: false

      - uses: ./.release-tooling/.github/actions/setup-rust-ci

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Build rkat-rpc for SDK smoke tests
        run: ./scripts/repo-cargo build -p meerkat-rpc

      # Release validation re-checks release-specific invariants plus SDK parity gates.
      - name: Verify version parity
        run: make verify-version-parity

      - name: Verify RPC surface alignment
        run: make verify-rpc-surface-alignment

      - name: Verify REST surface alignment
        run: make verify-rest-surface-alignment

      - name: Verify SDK wrapper freshness
        run: make verify-sdk-wrapper-freshness

      - name: Run Python SDK suite
        run: make test-sdk-python

      - name: Run TypeScript SDK suite
        run: make test-sdk-typescript

      - name: Verify schema freshness
        run: make verify-schema-freshness

      - name: Verify Rust release config
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release_assets_only != 'true' }}
        run: make check-rust-release-config

      - name: Verify release crates package their license files
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release_assets_only != 'true' }}
        run: make check-crate-license-files

      # 0.8.22 lost a release evening here: the tag's Cargo.lock referenced a
      # thiserror version the merged lock no longer contained (only --locked
      # refuses it, and cargo publish is --locked), and healing that lock
      # staled MODULE.bazel.lock, which failed every BuildBuddy binary lane.
      - name: Verify Cargo.lock resolves under --locked
        run: make verify-lock-consistency

      - name: Verify MODULE.bazel.lock recorded inputs
        run: make verify-bazel-module-lock-inputs

      - name: Check formatting
        run: make fmt-check

  release_validate_buildbuddy:
    name: Validate release state with BuildBuddy
    needs: [require_ci_green]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_web_sdk_only != 'true' &&
      github.event.inputs.publish_release_assets_only != 'true' &&
      github.event.inputs.prebuild_release_artifacts != 'true' &&
      github.actor == 'lukacf' &&
      github.event.inputs.release_backend == 'buildbuddy'
    runs-on: ${{ fromJSON(vars.MEERKAT_CI_RUNNER || '"ubuntu-24.04"') }}
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      MEERKAT_BUILDBUDDY_CI_JOBS: ${{ vars.MEERKAT_RELEASE_BUILDBUDDY_JOBS || vars.MEERKAT_BUILDBUDDY_CI_JOBS || '64' }}
    steps:
      # This job runs the local actions of the tree it checks out, so it
      # validates the dispatched ref only: an older tag's actions, which
      # name third-party actions by tag, never run here. A tag's validation
      # dispatch takes the github-hosted backend, whose Cargo validation
      # runs its setup from the workflow's own commit.
      - name: Refuse a release tag
        if: ${{ github.event.inputs.release_tag != '' }}
        run: |
          echo "::error::release_backend buildbuddy validates the dispatched ref only; dispatch a release tag's validation with release_backend github-hosted" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/run-buildbuddy-ci-lane
        with:
          lane: release-validate
          profile: native
          mode: release-validate
          # No release job restores a cache: nothing on main saves this
          # one either (the self-hosted graph's backend never does).
          repository-cache: "false"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Verify Rust release config
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release_assets_only != 'true' }}
        run: make check-rust-release-config

      - name: Verify MODULE.bazel.lock recorded inputs
        run: make verify-bazel-module-lock-inputs

  # The tag path reuses the exact-tree Cargo CI attestation for the hosted
  # lanes and, while the self-hosted GCP graph is enabled
  # (MEERKAT_GCP_BUILDBUDDY_ENABLED is 'true'), runs the whole
  # BuildBuddy/Bazel graph (prebuild, static, native nextest, governance, SDK
  # suites, wasm-check, minimal-feature, feature matrix, audit) in
  # `full-fresh` mode as its release gate. While it is disabled this job is
  # skipped and the tag validates on its exact-tree CI attestation when it
  # covers the Cargo validation lanes, with release_validate_cargo otherwise.
  # Pull-request CI never runs that graph.
  release_validate_buildbuddy_full:
    name: Validate release tree with the full BuildBuddy graph
    needs: [require_ci_green]
    if: ${{ github.event_name != 'workflow_dispatch' && vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/buildbuddy.yml
    with:
      mode: full-fresh
      # This job mints OIDC tokens: no lane restores a Bazel repository
      # cache entry another run saved.
      repository_cache: "false"
    # Only the self-hosted control plane's key: GCP access is the job's OIDC
    # token (workload identity), and no registry or publish secret reaches
    # the called workflow.
    secrets:
      MEERKAT_GCP_BUILDBUDDY_API_KEY: ${{ secrets.MEERKAT_GCP_BUILDBUDDY_API_KEY }}

  release_validate_gate:
    name: Release validation gate
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       (github.event.inputs.publish_web_sdk_only != 'true' &&
        github.event.inputs.publish_release_assets_only != 'true' &&
        github.event.inputs.prebuild_release_artifacts != 'true'))
    needs: [require_ci_green, release_validate_cargo, release_validate_buildbuddy, release_validate_buildbuddy_full]
    runs-on: ${{ fromJSON(vars.MEERKAT_CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - name: Check selected release validation backend
        shell: bash
        run: |
          set -euo pipefail
          ci_result="${{ needs.require_ci_green.result }}"
          ci_attestation_schema="${{ needs.require_ci_green.outputs.ci_attestation_schema }}"
          ci_covers="${{ needs.require_ci_green.outputs.ci_covers_release_validation }}"
          bb_selected="${{ github.actor == 'lukacf' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_backend == 'buildbuddy') || (github.event_name != 'workflow_dispatch' && (vars.MEERKAT_RELEASE_BUILDBUDDY == 'true' || vars.MEERKAT_RELEASE_BUILDBUDDY == '1'))) }}"
          gcp_graph_enabled="${{ vars.MEERKAT_GCP_BUILDBUDDY_ENABLED == 'true' }}"
          cargo_result="${{ needs.release_validate_cargo.result }}"
          buildbuddy_result="${{ needs.release_validate_buildbuddy.result }}"
          buildbuddy_full_result="${{ needs.release_validate_buildbuddy_full.result }}"

          echo "Required Cargo CI: ${ci_result}"
          [[ "${ci_result}" == "success" ]]

          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "BuildBuddy release validation (manual dispatches only): ${buildbuddy_result}"
            if [[ "${gcp_graph_enabled}" == "true" ]]; then
              echo "Exact-tree CI attestation reused; Cargo release validation: ${cargo_result}"
              echo "Full BuildBuddy graph (full-fresh) on the release tree: ${buildbuddy_full_result}"
              [[ "${cargo_result}" == "skipped" && "${buildbuddy_result}" == "skipped" && "${buildbuddy_full_result}" == "success" ]]
              exit $?
            fi
            echo "Self-hosted GCP graph disabled (MEERKAT_GCP_BUILDBUDDY_ENABLED is not 'true'); full graph: ${buildbuddy_full_result}"
            if [[ "${ci_covers}" == "true" ]]; then
              # The successful exact-main CI run on this tree is the tag's
              # validation: require_ci_green verified its schema-4
              # attestation and that it ran every lane Cargo validation
              # repeats.
              echo "Exact-tree CI attestation (schema ${ci_attestation_schema}) covers the Cargo validation lanes; Cargo release validation: ${cargo_result}"
              [[ "${cargo_result}" == "skipped" && "${buildbuddy_result}" == "skipped" && "${buildbuddy_full_result}" == "skipped" ]]
              exit $?
            fi
            echo "Exact-tree CI attestation (schema ${ci_attestation_schema:-missing}) does not cover the Cargo validation lanes; Cargo release validation of the tag: ${cargo_result}"
            [[ "${cargo_result}" == "success" && "${buildbuddy_result}" == "skipped" && "${buildbuddy_full_result}" == "skipped" ]]
            exit $?
          fi

          echo "Full BuildBuddy graph is a tag-path gate only: ${buildbuddy_full_result}"
          [[ "${buildbuddy_full_result}" == "skipped" ]]

          if [[ "${bb_selected}" == "true" ]]; then
            echo "BuildBuddy release validation selected: ${buildbuddy_result}"
            echo "Cargo release validation skipped: ${cargo_result}"
            [[ "${buildbuddy_result}" == "success" && "${cargo_result}" == "skipped" ]]
            exit $?
          fi

          echo "Cargo release validation selected: ${cargo_result}"
          echo "BuildBuddy release validation skipped: ${buildbuddy_result}"
          [[ "${cargo_result}" == "success" && "${buildbuddy_result}" == "skipped" ]]

  # Authenticate before any registry job can make an irreversible write. The
  # same token publishes both npm SDKs, so require live write access to both
  # package names before Rust crates or the Python SDK begin publishing.
  registry_credentials_preflight:
    name: Verify registry publication credentials
    needs: [require_ci_green]
    if: >-
      always() &&
      needs.require_ci_green.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_release_packages == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A recovery dispatch must run the fixed generic preflight from the
      # workflow commit. Package build and publish jobs below still check out
      # the immutable release tag selected by release_tag.
      - name: Checkout workflow helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require a GitHub-hosted attesting runner
        # build_binaries_buildbuddy attests the release archives on
        # MEERKAT_CI_RUNNER, and the SDK digest stamp refuses attestations from
        # self-hosted runners: fail here, before any crate publishes, when it
        # names a label that is not a GitHub-hosted Ubuntu label.
        env:
          MEERKAT_CI_RUNNER: ${{ vars.MEERKAT_CI_RUNNER }}
        run: python3 -I scripts/release-stamp-sdk-binary-digests require-hosted-runner

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Skip npm credentials for the Rust-only alpha lane
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.alpha_crates_only == 'true' }}
        run: echo "Rust-only alpha publication does not use npm"

      - name: Verify npm identity and package write access
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.alpha_crates_only != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/release-npm-publish-preflight

  # Public-API breaks are allowed in 0.x patch releases and must be DECLARED.
  # This is its own job rather than a step in release_validate_cargo because
  # that job is not the tag's validation whenever the tag's exact-tree CI
  # attestation covers its lanes or the self-hosted GCP graph is enabled:
  # release_validate_gate then asserts it is `skipped`, so a step added there
  # would not run for those releases. Everything that makes a release public
  # depends on this job below.
  release_semver_gate:
    name: Breaks declared and notes stamped
    needs: [require_ci_green]
    if: >-
      github.event.inputs.publish_web_sdk_only != 'true' &&
      github.event.inputs.publish_release_assets_only != 'true' &&
      github.event.inputs.prebuild_release_artifacts != 'true'
    runs-on: ubuntu-24.04
    # The measurement belongs before the tag. Tag-triggered releases consume
    # exact-tree evidence from Release semver readiness. Manual recovery may
    # still run or verify an explicit historical measurement; the measurement
    # itself is a minutes-scale JSON comparison, so anything near this budget
    # is a regression.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      # A tag is immutable once any artifact is public. If its full semver
      # measurement completed and failed only because declarations were
      # missing, a package-recovery dispatch may reuse that exact measurement.
      # The verifier itself and the amended changelog come from the workflow
      # ref, while every published source checkout remains the release tag.
      - name: Checkout semver recovery policy
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.semver_evidence_job_id != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .semver-recovery-policy
          persist-credentials: false

      - if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.semver_evidence_job_id == '' &&
            github.event.inputs.release_tag == ''
          }}
        uses: ./.github/actions/setup-rust-ci

      - name: Install cargo-semver-checks
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.semver_evidence_job_id == '' &&
            github.event.inputs.release_tag == ''
          }}
        uses: taiki-e/install-action@0c0cd218980b4b04e3636f5d7f1216716931ed74 # cargo-semver-checks
        env:
          HOME: ${{ runner.temp }}/install-action-home-${{ github.job }}

      - name: Verify every reported break is named and the notes are stamped
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.semver_evidence_job_id == '' &&
            github.event.inputs.release_tag == ''
          }}
        env:
          # A post-release tree (notes under `## [Unreleased]` above the
          # stamped workspace version) is measured against that version's own
          # tag and would pass, then publish main's tip as the tagged version.
          # The release's own measurement refuses that classification.
          MEERKAT_SEMVER_REQUIRE_RELEASE_TREE: "1"
        run: make semver-breaks

      - name: Verify exact-tree pre-tag semver evidence
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            (github.event.inputs.release_tag != '' &&
             github.event.inputs.semver_evidence_job_id == '')
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          version="$(python3 - <<'PY'
          import pathlib
          import tomllib

          workspace = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          print(workspace["workspace"]["package"]["version"])
          PY
          )"
          artifact_name="meerkat-semver-attestation-main-${tree_sha}"
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty' <<<"${artifact_json}")"
          if [[ -z "${artifact_id}" ]]; then
            echo "::error::No unexpired exact-tree semver evidence exists for ${tree_sha}."
            echo "Run Release semver readiness before creating the tag."
            exit 1
          fi
          evidence="${RUNNER_TEMP}/semver-evidence"
          mkdir -p "${evidence}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/semver-evidence.zip"
          unzip -q "${RUNNER_TEMP}/semver-evidence.zip" -d "${evidence}"
          workflow_run_id="$(jq -r --argjson artifact_id "${artifact_id}" \
            '[.artifacts[] | select(.id == $artifact_id)] | first | .workflow_run.id' \
            <<<"${artifact_json}")"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${workflow_run_id}")"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg tree_sha "${tree_sha}" \
            --arg version "${version}" \
            --arg workflow_run_id "${workflow_run_id}" \
            '.schema_version == 1 and
             .repository == $repository and
             .tree_sha == $tree_sha and
             .version == $version and
             .workflow == "Release semver readiness" and
             .workflow_run_id == $workflow_run_id and
             .event == "push" and
             .ref == "refs/heads/main" and
             .result == "success"' \
            "${evidence}/attestation.json"
          jq -e \
            '.name == "Release semver readiness" and
             .event == "push" and
             .head_branch == "main" and
             .conclusion == "success"' \
            <<<"${run_json}" >/dev/null
          expected_report_sha="$(jq -r .report_sha256 "${evidence}/attestation.json")"
          actual_report_sha="$(sha256sum "${evidence}/report.txt" | awk '{print $1}')"
          [[ "${actual_report_sha}" == "${expected_report_sha}" ]]
          echo "Verified exact-tree semver evidence for ${tree_sha} (${version})"

      - name: Verify exact completed semver measurement and amended declarations
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.semver_evidence_job_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ github.event.inputs.semver_evidence_run_id }}
          EVIDENCE_JOB_ID: ${{ github.event.inputs.semver_evidence_job_id }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${EVIDENCE_RUN_ID}" || -z "${EVIDENCE_JOB_ID}" || -z "${RELEASE_TAG}" ]]; then
            echo "semver evidence recovery requires release_tag, semver_evidence_run_id, and semver_evidence_job_id" >&2
            exit 1
          fi
          release_sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" > "${RUNNER_TEMP}/semver-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${EVIDENCE_JOB_ID}" > "${RUNNER_TEMP}/semver-job.json"
          gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${EVIDENCE_JOB_ID}/logs" > "${RUNNER_TEMP}/semver-job.log"
          python3 .semver-recovery-policy/scripts/verify_semver_recovery_evidence.py \
            --run-json "${RUNNER_TEMP}/semver-run.json" \
            --job-json "${RUNNER_TEMP}/semver-job.json" \
            --job-log "${RUNNER_TEMP}/semver-job.log" \
            --evidence-run-id "${EVIDENCE_RUN_ID}" \
            --evidence-job-id "${EVIDENCE_JOB_ID}" \
            --release-tag "${RELEASE_TAG}" \
            --release-sha "${release_sha}" \
            --changelog .semver-recovery-policy/CHANGELOG.md

  # A tag run publishes the artifacts of a successful pre-tag prebuild of
  # exactly its commit instead of rebuilding them: a release.yml run
  # dispatched on main at the tag commit with prebuild_release_artifacts,
  # whose Release prebuild gate succeeded (critical binaries and Web SDK
  # package ready; its trailing lanes may still be running) and whose
  # critical artifacts have not expired (scripts/release-find-prebuild; a
  # gate that has not concluded is waited for unless a job it needs already
  # failed). Its run id is the only thing reused: publish_github_release
  # verifies every archive exactly as for an assets_run_id recovery (each one
  # and its source stamp attested by release.yml at that commit on
  # refs/heads/main, the run's binary build gate green, every binary
  # embedding the release version), and publish_web_sdk verifies the package
  # attestation and version. No prebuild: the tag builds as before.
  release_prebuild:
    name: Find exact-commit release prebuild
    needs: [require_ci_green]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    # Bounded by the lookup's own wait for a running prebuild (8400 s from
    # the prebuild's start, so at most 140 minutes here).
    timeout-minutes: 150
    outputs:
      run_id: ${{ steps.lookup.outputs.run_id }}
      # The attempt whose gates the lookup examined; the publishers verify
      # that attempt and refuse a prebuild re-run after the lookup.
      run_attempt: ${{ steps.lookup.outputs.run_attempt }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            scripts/release-find-prebuild
          sparse-checkout-cone-mode: false

      - name: Find a successful prebuild of the tag commit
        id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          # A failed lookup is not a reason to stop the release: it only means
          # this run builds everything, as without a prebuild.
          if ! found="$(scripts/release-find-prebuild "${release_sha}")"; then
            echo "::warning::The prebuild lookup failed; this run builds every release artifact."
            found=""
          fi
          read -r run_id run_attempt <<<"${found}" || true
          if [[ -n "${run_id:-}" && ! "${run_attempt:-}" =~ ^[0-9]+$ ]]; then
            echo "::warning::The prebuild lookup returned no attempt for run ${run_id}; this run builds every release artifact."
            run_id=""
          fi
          run_id="${run_id:-}"
          echo "run_attempt=${run_attempt:-}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${run_id}" ]]; then
            echo "Publishing the prebuilt artifacts of release run ${run_id} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}); no binary or Web SDK build in this run."
          else
            echo "No complete prebuild of ${release_sha}; this run builds every release artifact."
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

  build_binaries:
    name: Build and package surface binaries with GitHub-hosted runners (${{ matrix.surface.bin }}, ${{ matrix.platform.target }})
    needs: [require_ci_green, release_validate_gate, release_prebuild]
    # Fallback lane for the critical platforms (Linux x86_64 and aarch64,
    # macOS arm64). Under the owner BuildBuddy split those three targets come
    # from build_binaries_buildbuddy and this job is skipped. The trailing
    # platforms build in their own jobs whichever lane is selected: Windows
    # (build_binaries_windows_cross) and Intel macOS
    # (build_binaries_macos_x86_cross).
    if: >-
      always() &&
      !(github.actor == 'lukacf' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_backend == 'buildbuddy') || (github.event_name != 'workflow_dispatch' && (vars.MEERKAT_RELEASE_BUILDBUDDY == 'true' || vars.MEERKAT_RELEASE_BUILDBUDDY == '1')))) &&
      needs.require_ci_green.result == 'success' &&
      (needs.release_validate_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true') &&
        needs.release_validate_gate.result == 'skipped')) &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true'))) &&
      needs.release_prebuild.outputs.run_id == '' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.assets_run_id == '')
    runs-on: ${{ matrix.platform.runs-on }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Linux GNU binaries must keep the same glibc floor as the BuildBuddy lane
    # (buildpack-deps:bullseye = glibc 2.31, see tools/bazel/platforms/BUILD.bazel);
    # building directly on the hosted runner (Ubuntu 24.04, glibc 2.39) would
    # silently reintroduce the v0.8.21 Bullseye loader failure whenever this
    # fallback lane is active. Non-Linux matrix entries get no container.
    container: ${{ contains(matrix.platform.target, 'unknown-linux-gnu') && 'docker.io/library/buildpack-deps:bullseye@sha256:30d62be8c0d1960899261429cd3960bccffbd075f324adae967c79f410bde24f' || '' }}
    # One job per (target, surface binary). Each job builds exactly one
    # package, so every binary keeps the feature set its own package
    # resolves: one `cargo build -p` for all four would unify features
    # across them and change what each binary links (measured on 0.8.50:
    # rkat-mcp would gain the facade's live/mcp features, native keyring and
    # OAuth; rkat-rest live, axum ws and keyring; rkat and rkat-rpc the rmcp
    # streamable-HTTP server). The four used to build in sequence in one job,
    # each rebuilding the graph above meerkat-core (whose features differ per
    # package), so a target took the sum of four builds (3+ h on Linux at two
    # jobs); now it takes the slowest single package. The cache key is shared
    # per target so the four jobs warm each other where features match.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
        surface:
          - package: rkat
            bin: rkat
          - package: meerkat-rpc
            bin: rkat-rpc
          - package: meerkat-rest
            bin: rkat-rest
          - package: meerkat-mcp-server
            bin: rkat-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && github.sha || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          persist-credentials: false

      # actions/checkout marks the workspace safe in the host user's Git
      # config. Linux release builds run inside the Bullseye container as a
      # different user, and setup-rust-ci's first step
      # (scripts/ci-pin-rust-toolchain-env) asks Git for the repository root,
      # so this must run before it: placed later, every GitHub-hosted Linux
      # binary job failed in its first minute with "detected dubious
      # ownership" (v0.8.49 run 36727820146, v0.8.50 run 36946048903).
      - name: Trust the workspace in the Linux release container
        if: runner.os == 'Linux'
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # A recovery of an older tag checks that tag out: its local actions
      # would be the tag's own, and its tree can predate the test-code
      # marker guard. The setup action and the guard come from the
      # workflow's commit instead, whose third-party actions are pinned.
      # Sparse, so the checkout adds no Cargo or Bazel package to the build.
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-rust-ci/action.yml
            scripts/ci-pin-rust-toolchain-env
            scripts/check-release-binary-markers
            scripts/check-release-binary-sqlite-profile
          sparse-checkout-cone-mode: false

      - uses: ./.release-tooling/.github/actions/setup-rust-ci

      - name: Add release target
        run: rustup target add ${{ matrix.platform.target }}

      # The workspace is trusted for Git in the step after Checkout (see
      # there). audiopus-sys falls back to building bundled Opus and requires
      # CMake 3.x (bundled
      # Opus declares cmake_minimum_required 3.1, which CMake 4 refuses).
      # Bullseye's apt cmake is not used: on 2026-09-18 bullseye-security's
      # pool had dropped libarchive13 deb11u5 while the CDN still served the
      # old index, on both architectures, so `apt-get install cmake` failed
      # with 404 regardless of retries. A pinned Kitware tarball, verified by
      # sha256, is the only CMake this lane accepts.
      - name: Prepare Linux release container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake_version_pin="3.31.12"
          case "$(uname -m)" in
            x86_64)
              cmake_arch="linux-x86_64"
              cmake_sha256="0dc2e9a6860f06bf10bd8fadc03e35d9eeb4df46e33763a7e480e987758f385c"
              ;;
            aarch64)
              cmake_arch="linux-aarch64"
              cmake_sha256="83f8fd91d2038a56556e1400390fcfe42f79602940c494f6c6f1cdae7f9e7f40"
              ;;
            *)
              echo "Linux release container: unsupported architecture $(uname -m)" >&2
              exit 1
              ;;
          esac
          cmake_tarball="cmake-${cmake_version_pin}-${cmake_arch}.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "/tmp/${cmake_tarball}" \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version_pin}/${cmake_tarball}"
          echo "${cmake_sha256}  /tmp/${cmake_tarball}" | sha256sum --check --strict -
          mkdir -p /opt/cmake
          tar -xzf "/tmp/${cmake_tarball}" -C /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "${GITHUB_PATH}"
          cmake_version="$(/opt/cmake/bin/cmake --version | awk 'NR == 1 { print $3 }')"
          case "${cmake_version}" in
            3.*) ;;
            *)
              echo "Linux release container requires CMake 3.x, found ${cmake_version}" >&2
              exit 1
              ;;
          esac
          echo "Linux release container: cmake ${cmake_version} from Kitware tarball"

      - name: Build surface binaries
        shell: bash
        env:
          CARGO_TARGET_DIR: target
        run: |
          set -euo pipefail
          cargo_cmd=(./scripts/repo-cargo)
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            # The immutable v0.8.30 wrapper asks Git for
            # `rev-parse --path-format=absolute`, which predates the
            # Bullseye container's Git 2.30. The release job already owns an
            # isolated target directory, so use the rustup-proxied Cargo
            # directly only on this legacy container. Fail closed unless
            # rustup selected the exact repository pin first.
            expected_rust="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
            active_rust="$(rustc --version | awk '{ print $2 }')"
            if [[ -z "${expected_rust}" || "${active_rust}" != "${expected_rust}" ]]; then
              echo "Linux release toolchain mismatch: expected ${expected_rust:-missing}, active ${active_rust:-missing}" >&2
              exit 1
            fi
            echo "Linux release toolchain: rustc ${active_rust}"
            # The hosted Linux runners have 16 GB. The release build of
            # meerkat-machine-schema peaks at 8.7 GB at opt-level 3 (6.3 GB at
            # opt-level 1; codegen-units does not help) and meerkat-mob at
            # 9.0 GB; pipelining overlaps the two, and at four jobs the
            # aarch64 build was OOM-killed (SIGKILL) in the schema crate. Two
            # jobs bound the worst case to that pair, and the schema crate
            # builds at opt-level 1 through --config so the bound also holds
            # for tags whose Cargo.toml predates that profile override
            # (asset recovery dispatches build the tag with this workflow).
            export CARGO_BUILD_JOBS=2
            cargo_cmd=(cargo --config 'profile.release.package.meerkat-machine-schema.opt-level=1')
          fi

          # This job's one package (binary names differ via [[bin]], see the
          # matrix). Building it alone keeps its own feature resolution.
          "${cargo_cmd[@]}" build --locked -p "${{ matrix.surface.package }}" --release --target "${{ matrix.platform.target }}"

      - name: Ad-hoc codesign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/codesign --force --sign - "target/${{ matrix.platform.target }}/release/${{ matrix.surface.bin }}"

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          ARCHIVE_EXT: ${{ matrix.platform.archive_ext }}
        run: |
          set -euo pipefail
          BINARIES=("${{ matrix.surface.bin }}")
          mkdir -p dist
          VERSION="${VERSION#v}"
          VERSION="${VERSION//\//-}"

          for bin in "${BINARIES[@]}"; do
            src="target/${TARGET}/release/${bin}"
            artifact_name="${bin}-${VERSION}-${TARGET}.${ARCHIVE_EXT}"

            if [[ ! -f "$src" ]]; then
              echo "Missing expected binary at $src" >&2
              exit 1
            fi
            if ! grep -aF -- "$VERSION" "$src" >/dev/null; then
              echo "Binary ${bin} for ${TARGET} does not embed release version ${VERSION}" >&2
              "$src" --version 2>/dev/null || true
              exit 1
            fi
            if [[ "${TARGET}" == *-unknown-linux-gnu ]]; then
              ./scripts/check-linux-release-binary-portability.sh "$src"
            fi
            # No release binary may carry compiled-in test code. The guard
            # reads the release version from VERSION: tokio's test-util
            # marker passes only in a release before 0.9.2.
            .release-tooling/scripts/check-release-binary-markers "$src"
            # The bundled SQLite carries the lock profile the repository's
            # builds declare (LIBSQLITE3_FLAGS); a lane or toolchain that
            # dropped it fails here. Each runner is native to its target.
            if [[ "${bin}" == rkat ]]; then
              .release-tooling/scripts/check-release-binary-sqlite-profile "$src"
            fi

            tar -czf "dist/${artifact_name}" -C "$(dirname "$src")" "$(basename "$src")"
            echo "packaged=${bin} -> dist/${artifact_name}"
          done

      # An asset recovery runs this workflow from main against the tag, so
      # its attestations name main's commit, not the tag. Each archive
      # therefore carries a stamp of the tree it was built from, written only
      # after checking that the checkout is the tag's commit, and attested
      # with it (see scripts/verify-release-asset-provenance --stamps). A
      # pre-tag prebuild runs before the tag exists: its stamp names the
      # dispatched main commit, which a tag run accepts only as its own.
      - name: Stamp archives with the checked-out release commit
        id: source_commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          PREBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD)"
          if [[ "${PREBUILD}" == "true" ]]; then
            if [[ "${tree}" != "${GITHUB_SHA}" ]]; then
              echo "checked-out tree ${tree} is not the dispatched prebuild commit ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            if ! tag_commit="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
              git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            fi
            if [[ "${tree}" != "${tag_commit}" ]]; then
              echo "checked-out tree ${tree} is not the ${RELEASE_TAG} commit ${tag_commit}" >&2
              exit 1
            fi
          fi
          echo "source_commit=${tree}" >> "${GITHUB_OUTPUT}"
          stamped=0
          for archive in dist/*.tar.gz dist/*.zip; do
            [[ -f "${archive}" ]] || continue
            printf '%s\n' "${tree}" > "${archive}.source-commit"
            stamped=$((stamped + 1))
          done
          if [[ "${stamped}" -eq 0 ]]; then
            echo "no release archives under dist/ to stamp" >&2
            exit 1
          fi
          echo "stamped ${stamped} archive(s) with ${RELEASE_TAG} ${tree}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meerkat-${{ matrix.platform.target }}-${{ matrix.platform.runs-on }}-${{ matrix.surface.bin }}
          path: dist/*
          if-no-files-found: error

  build_binaries_windows_cross:
    name: Cross-compile and package Windows surface binaries on Linux
    needs: [require_ci_green, release_validate_gate, release_prebuild]
    if: >-
      always() &&
      needs.require_ci_green.result == 'success' &&
      (needs.release_validate_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true') &&
        needs.release_validate_gate.result == 'skipped')) &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true'))) &&
      needs.release_prebuild.outputs.run_id == '' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.assets_run_id == '')
    # Windows binaries are cross-compiled from Linux with cargo-xwin (clang-cl,
    # lld-link, the Windows SDK). The native windows-latest build ran 190 to
    # 275 minutes on every release from v0.8.11 to v0.8.39 and lost its runner
    # at 162 minutes on v0.8.40, because Windows has no memory overcommit and
    # the generated machine crates peak above 13 GB. On Linux at four jobs the
    # same build took 72 to 81 minutes on the v0.9.4 to v0.9.6 prebuilds, and
    # the v0.9.7 prebuild was cancelled at the former 90-minute cap during
    # Build and package, so the cap is 150 minutes. The cross-compiled build
    # still needs verification on a real Windows runner:
    # verify_windows_binaries runs the binaries there.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 150
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && github.sha || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          persist-credentials: false

      # The published source is always the release tag, but a recovery
      # dispatch runs this workflow definition from main, and a tag cut
      # before the cross-build lane existed has no copy of the composite
      # action. Local actions resolve against the checked-out tree, so fetch
      # the workflow's own ref beside the tag checkout and run the tooling
      # from there (same shape as the semver recovery policy checkout).
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
      - uses: ./.release-tooling/.github/actions/setup-rust-ci

      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          VERSION="${VERSION//\//-}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and package
        uses: ./.release-tooling/.github/actions/build-windows-cross
        with:
          version: ${{ steps.version.outputs.version }}
          # The SDK cache is linked into attested binaries: a dispatch on main
          # would save it into the scope every tag run restores.
          # No release job restores or saves a cache.
          save-sdk-cache: "false"

      # An asset recovery runs this workflow from main against the tag, so
      # its attestations name main's commit, not the tag. Each archive
      # therefore carries a stamp of the tree it was built from, written only
      # after checking that the checkout is the tag's commit, and attested
      # with it (see scripts/verify-release-asset-provenance --stamps). A
      # pre-tag prebuild runs before the tag exists: its stamp names the
      # dispatched main commit, which a tag run accepts only as its own.
      - name: Stamp archives with the checked-out release commit
        id: source_commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          PREBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD)"
          if [[ "${PREBUILD}" == "true" ]]; then
            if [[ "${tree}" != "${GITHUB_SHA}" ]]; then
              echo "checked-out tree ${tree} is not the dispatched prebuild commit ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            if ! tag_commit="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
              git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            fi
            if [[ "${tree}" != "${tag_commit}" ]]; then
              echo "checked-out tree ${tree} is not the ${RELEASE_TAG} commit ${tag_commit}" >&2
              exit 1
            fi
          fi
          echo "source_commit=${tree}" >> "${GITHUB_OUTPUT}"
          stamped=0
          for archive in dist/*.tar.gz dist/*.zip; do
            [[ -f "${archive}" ]] || continue
            printf '%s\n' "${tree}" > "${archive}.source-commit"
            stamped=$((stamped + 1))
          done
          if [[ "${stamped}" -eq 0 ]]; then
            echo "no release archives under dist/ to stamp" >&2
            exit 1
          fi
          echo "stamped ${stamped} archive(s) with ${RELEASE_TAG} ${tree}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      # Same artifact name the native Windows job produced, so the publisher,
      # the asset recovery mode, and the release manifest see no change.
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meerkat-x86_64-pc-windows-msvc-windows-latest
          path: dist/*
          if-no-files-found: error

  verify_windows_binaries:
    name: Verify Windows binaries on a Windows runner
    needs: [build_binaries_windows_cross]
    if: always() && needs.build_binaries_windows_cross.result == 'success'
    # A pinned runner image: windows-latest moves to a new image on GitHub's
    # schedule. The windows-2025-vs2026 label is offered to public
    # repositories only.
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meerkat-x86_64-pc-windows-msvc-windows-latest
          path: dist

      - name: Run each binary
        shell: pwsh
        env:
          VERSION: ${{ needs.build_binaries_windows_cross.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          if (-not $version) { throw 'release version output missing' }
          New-Item -ItemType Directory -Force -Path extracted | Out-Null
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath extracted -Force
          }
          foreach ($bin in @('rkat', 'rkat-rpc', 'rkat-rest', 'rkat-mcp')) {
            $exe = Join-Path extracted "$bin.exe"
            if (-not (Test-Path $exe)) { throw "missing $exe" }
            $out = & $exe --version 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "$bin --version exited $LASTEXITCODE`n$out" }
            if ($out -notmatch [regex]::Escape($version)) { throw "$bin --version did not report $version`n$out" }
            Write-Host "$bin --version: $($out.Trim())"
          }
          & (Join-Path extracted 'rkat.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "rkat --help exited $LASTEXITCODE" }
          Write-Host "all four Windows binaries run on windows-2025-vs2026"

          # The SQLite lock profile the repository's builds declare
          # (scripts/check-release-binary-sqlite-profile checks the other
          # targets): every process-wide lock off, and the allocator
          # statistics switch rkat calls first finding them already off.
          # Releases before 0.9.4 predate the report.
          $release = [version](($version -replace '^v', '') -replace '-.*$', '')
          if ($release -lt [version]'0.9.4') {
            Write-Host "rkat.exe: release $version predates the SQLite lock profile report; not checked"
          } else {
            $scratch = Join-Path $env:RUNNER_TEMP 'sqlite-lock-profile'
            New-Item -ItemType Directory -Force -Path (Join-Path $scratch 'project') | Out-Null
            $report = & (Join-Path extracted 'rkat.exe') --context-root (Join-Path $scratch 'project') --state-root (Join-Path $scratch 'realms') storage doctor --json | Out-String
            if ($LASTEXITCODE -ne 0) { throw "rkat storage doctor --json exited $LASTEXITCODE`n$report" }
            $lockProfile = ($report | ConvertFrom-Json).sqlite_lock_profile
            if ($null -eq $lockProfile -or
                $lockProfile.memory_statistics -ne $false -or
                $lockProfile.shared_page_cache -ne $false -or
                $lockProfile.page_cache_overflow_statistics -ne $false -or
                $lockProfile.memory_statistics_switch -ne 'already_off') {
              throw "rkat.exe runs SQLite with a process-wide lock (the build did not set LIBSQLITE3_FLAGS): $($lockProfile | ConvertTo-Json -Compress)"
            }
            Write-Host "rkat.exe: SQLite runs without process-wide locks (allocator statistics already off)"
          }

  # Intel macOS is a trailing platform: its archives may reach the release
  # after the critical Linux and macOS arm64 ones (publish_github_release
  # adds them, add-only). It is cross-compiled on an Apple silicon runner
  # (macos-15) whichever lane builds the critical targets, one job per
  # surface package so each binary keeps the feature set its own package
  # resolves, as in the GitHub-hosted lane.
  build_binaries_macos_x86_cross:
    name: Cross-compile and package Intel macOS surface binaries on Apple silicon (${{ matrix.surface.bin }})
    needs: [require_ci_green, release_validate_gate, release_prebuild]
    if: >-
      always() &&
      needs.require_ci_green.result == 'success' &&
      (needs.release_validate_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true') &&
        needs.release_validate_gate.result == 'skipped')) &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true'))) &&
      needs.release_prebuild.outputs.run_id == '' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.assets_run_id == '')
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        surface:
          - package: rkat
            bin: rkat
          - package: meerkat-rpc
            bin: rkat-rpc
          - package: meerkat-rest
            bin: rkat-rest
          - package: meerkat-mcp-server
            bin: rkat-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && github.sha || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          persist-credentials: false

      # A recovery of an older tag checks that tag out: its local actions
      # would be the tag's own, and its tree can predate the test-code
      # marker guard. The setup action and the guard come from the
      # workflow's commit instead, whose third-party actions are pinned.
      # Sparse, so the checkout adds no Cargo or Bazel package to the build.
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-rust-ci/action.yml
            scripts/ci-pin-rust-toolchain-env
            scripts/check-release-binary-markers
            scripts/check-macos-x86-release-binary
            scripts/check-release-binary-sqlite-profile
          sparse-checkout-cone-mode: false

      - uses: ./.release-tooling/.github/actions/setup-rust-ci

      - name: Add the Intel macOS target
        run: rustup target add x86_64-apple-darwin

      - name: Cross-compile the surface binary
        shell: bash
        env:
          CARGO_TARGET_DIR: target
        run: |
          set -euo pipefail
          ./scripts/repo-cargo build --locked -p "${{ matrix.surface.package }}" --release --target x86_64-apple-darwin

      - name: Ad-hoc codesign the binary
        shell: bash
        run: /usr/bin/codesign --force --sign - "target/x86_64-apple-darwin/release/${{ matrix.surface.bin }}"

      - name: Package artifacts
        shell: bash
        env:
          TARGET: x86_64-apple-darwin
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          bin="${{ matrix.surface.bin }}"
          mkdir -p dist
          VERSION="${VERSION#v}"
          VERSION="${VERSION//\//-}"
          src="target/${TARGET}/release/${bin}"
          artifact_name="${bin}-${VERSION}-${TARGET}.tar.gz"
          if [[ ! -f "$src" ]]; then
            echo "Missing expected binary at $src" >&2
            exit 1
          fi
          if ! grep -aF -- "$VERSION" "$src" >/dev/null; then
            echo "Binary ${bin} for ${TARGET} does not embed release version ${VERSION}" >&2
            exit 1
          fi
          # Nothing else in the release runs this binary: x86_64 only, run it
          # under Rosetta for its version, system libraries only, and a
          # minimum macOS version every supported Intel Mac meets.
          .release-tooling/scripts/check-macos-x86-release-binary "$src" "$VERSION"
          # No release binary may carry compiled-in test code.
          .release-tooling/scripts/check-release-binary-markers "$src"
          # The SQLite lock profile the repository's builds declare, under
          # Rosetta (the macOS x86 check above installed it when missing).
          if [[ "${bin}" == rkat ]]; then
            .release-tooling/scripts/check-release-binary-sqlite-profile "$src"
          fi
          tar -czf "dist/${artifact_name}" -C "$(dirname "$src")" "$(basename "$src")"
          echo "packaged=${bin} -> dist/${artifact_name}"

      # An asset recovery runs this workflow from main against the tag, so
      # its attestations name main's commit, not the tag. Each archive
      # therefore carries a stamp of the tree it was built from, written only
      # after checking that the checkout is the tag's commit, and attested
      # with it (see scripts/verify-release-asset-provenance --stamps). A
      # pre-tag prebuild runs before the tag exists: its stamp names the
      # dispatched main commit, which a tag run accepts only as its own.
      - name: Stamp archives with the checked-out release commit
        id: source_commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          PREBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD)"
          if [[ "${PREBUILD}" == "true" ]]; then
            if [[ "${tree}" != "${GITHUB_SHA}" ]]; then
              echo "checked-out tree ${tree} is not the dispatched prebuild commit ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            if ! tag_commit="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
              git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            fi
            if [[ "${tree}" != "${tag_commit}" ]]; then
              echo "checked-out tree ${tree} is not the ${RELEASE_TAG} commit ${tag_commit}" >&2
              exit 1
            fi
          fi
          echo "source_commit=${tree}" >> "${GITHUB_OUTPUT}"
          stamped=0
          for archive in dist/*.tar.gz dist/*.zip; do
            [[ -f "${archive}" ]] || continue
            printf '%s\n' "${tree}" > "${archive}.source-commit"
            stamped=$((stamped + 1))
          done
          if [[ "${stamped}" -eq 0 ]]; then
            echo "no release archives under dist/ to stamp" >&2
            exit 1
          fi
          echo "stamped ${stamped} archive(s) with ${RELEASE_TAG} ${tree}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meerkat-x86_64-apple-darwin-macos-15-${{ matrix.surface.bin }}
          path: dist/*
          if-no-files-found: error

  build_binaries_buildbuddy:
    name: Build and package surface binaries via BuildBuddy
    needs: [require_ci_green, release_validate_gate, release_prebuild]
    if: >-
      always() &&
      needs.require_ci_green.result == 'success' &&
      (needs.release_validate_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true') &&
        needs.release_validate_gate.result == 'skipped')) &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true'))) &&
      needs.release_prebuild.outputs.run_id == '' &&
      (github.actor == 'lukacf' &&
       ((github.event_name == 'workflow_dispatch' &&
         github.event.inputs.release_backend == 'buildbuddy') ||
        (github.event_name != 'workflow_dispatch' &&
         (vars.MEERKAT_RELEASE_BUILDBUDDY == 'true' ||
          vars.MEERKAT_RELEASE_BUILDBUDDY == '1')))) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.assets_run_id == '')
    runs-on: ${{ fromJSON(vars.MEERKAT_CI_RUNNER || '"ubuntu-24.04"') }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bb_command: release-build-linux-x86
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - bb_command: release-build-linux-arm64
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - bb_command: release-build-macos-arm64
            target: aarch64-apple-darwin
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && github.sha || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          persist-credentials: false

      # The setup action, the scripts it runs and the test-code marker
      # guard come from the workflow's commit: an asset recovery checks out
      # an older tag, whose local actions name third-party actions by tag
      # and whose tree may predate the guard. Sparse, so the checkout adds
      # no Cargo or Bazel package to the build.
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-buildbuddy-ci/action.yml
            scripts/check-release-binary-markers
            scripts/check-release-binary-sqlite-profile
            scripts/ci-pin-rust-toolchain-env
            scripts/install-buildbuddy-cli
          sparse-checkout-cone-mode: false

      - uses: ./.release-tooling/.github/actions/setup-buildbuddy-ci
        with:
          profile: native
          # The archives are attested: no GitHub Actions cache entry another
          # run (a dispatch included) saved may reach them. Costs nothing:
          # this job's Bazel wrapper uses /tmp/meerkat-bazel-repository-cache,
          # so the restored directory never reached the build.
          repository-cache: "false"

      - name: Build release binaries via BuildBuddy
        shell: bash
        env:
          BUILDBUDDY_BAZEL_COMMAND: ${{ matrix.bb_command }}
          BUILDBUDDY_OUTPUT_LANE: release-build-${{ matrix.target }}
          BUILDBUDDY_OUTPUT_BASE: ${{ runner.temp }}/bb-release-${{ matrix.target }}
          MEERKAT_BUILDBUDDY_OUTPUT_ROOT: ${{ runner.temp }}/bb-release
          BUILDBUDDY_RELEASE_JOBS: ${{ vars.MEERKAT_RELEASE_BUILDBUDDY_JOBS || '64' }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set +e
          scripts/buildbuddy-bazel-poc --jobs="${BUILDBUDDY_RELEASE_JOBS}"
          status="$?"
          set -e

          if [[ "${status}" -eq 38 ]]; then
            echo "::warning::BuildBuddy build completed but BES upload failed; validating downloaded outputs before continuing"
            BAZEL_BIN="${BUILDBUDDY_OUTPUT_BASE}/execroot/_main/bazel-out"
            declare -A BIN_PATHS=(
              [rkat]="crates/meerkat-cli/rkat"
              [rkat-rpc]="crates/meerkat-rpc/rkat_rpc_bin"
              [rkat-rest]="crates/meerkat-rest/rkat_rest_bin"
              [rkat-mcp]="crates/meerkat-mcp-server/rkat_mcp_bin"
            )
            for bin in rkat rkat-rpc rkat-rest rkat-mcp; do
              rel_path="${BIN_PATHS[$bin]}"
              src="$(find "${BAZEL_BIN}" -path "*/${rel_path}" -type f 2>/dev/null | head -1)"
              if [[ -z "${src}" && "${ARCHIVE_EXT}" == "zip" ]]; then
                src="$(find "${BAZEL_BIN}" -path "*/${rel_path}.exe" -type f 2>/dev/null | head -1)"
              fi
              if [[ -z "${src}" ]]; then
                echo "BuildBuddy exited 38 and ${bin} output is missing for ${TARGET}" >&2
                exit "${status}"
              fi
            done
            exit 0
          fi

          exit "${status}"

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BB_OUTPUT_BASE: ${{ runner.temp }}/bb-release-${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${VERSION#v}"
          VERSION="${VERSION//\//-}"
          BAZEL_BIN="${BB_OUTPUT_BASE}/execroot/_main/bazel-out"
          STAGE_ROOT="$(mktemp -d)"
          trap 'rm -rf "${STAGE_ROOT}"' EXIT

          declare -A BIN_PATHS=(
            [rkat]="crates/meerkat-cli/rkat"
            [rkat-rpc]="crates/meerkat-rpc/rkat_rpc_bin"
            [rkat-rest]="crates/meerkat-rest/rkat_rest_bin"
            [rkat-mcp]="crates/meerkat-mcp-server/rkat_mcp_bin"
          )

          for bin in rkat rkat-rpc rkat-rest rkat-mcp; do
            rel_path="${BIN_PATHS[$bin]}"
            src="$(find "${BAZEL_BIN}" -path "*/${rel_path}" -type f 2>/dev/null | head -1)"
            if [[ -z "$src" && "$ARCHIVE_EXT" == "zip" ]]; then
              src="$(find "${BAZEL_BIN}" -path "*/${rel_path}.exe" -type f 2>/dev/null | head -1)"
            fi
            artifact_name="${bin}-${VERSION}-${TARGET}.${ARCHIVE_EXT}"

            if [[ -z "$src" ]]; then
              echo "Missing binary for ${bin} (expected under ${BAZEL_BIN}/*/${rel_path})" >&2
              find "${BAZEL_BIN}" -type f -name "${bin}*" 2>/dev/null || true
              exit 1
            fi

            stage_dir="${STAGE_ROOT}/${bin}"
            mkdir -p "${stage_dir}"
            payload_name="${bin}"
            if [[ "$ARCHIVE_EXT" == "zip" ]]; then
              payload_name="${bin}.exe"
            fi
            cp "$src" "${stage_dir}/${payload_name}"
            chmod +x "${stage_dir}/${payload_name}" || true
            if ! grep -aF -- "$VERSION" "${stage_dir}/${payload_name}" >/dev/null; then
              echo "Binary ${bin} for ${TARGET} does not embed release version ${VERSION}" >&2
              "${stage_dir}/${payload_name}" --version 2>/dev/null || true
              exit 1
            fi
            if [[ "${TARGET}" == *-unknown-linux-gnu ]]; then
              ./scripts/check-linux-release-binary-portability.sh "${stage_dir}/${payload_name}"
            fi
            # No release binary may carry compiled-in test code. The guard
            # reads the release version from VERSION: tokio's test-util
            # marker passes only in a release before 0.9.2, whose Bazel
            # release builds compiled it (an asset recovery of such a tag).
            .release-tooling/scripts/check-release-binary-markers "${stage_dir}/${payload_name}"
            # The SQLite lock profile the repository's builds declare. One
            # runner packages every target, so only the target it runs is
            # executed; the others build from the same MODULE.bazel
            # annotation, which has no per-platform value.
            if [[ "${bin}" == rkat ]]; then
              .release-tooling/scripts/check-release-binary-sqlite-profile \
                --if-runnable-target "${TARGET}" "${stage_dir}/${payload_name}"
            fi
            archive_path="${PWD}/dist/${artifact_name}"

            if [[ "$ARCHIVE_EXT" == "zip" ]]; then
              if command -v 7z >/dev/null 2>&1; then
                (cd "${stage_dir}" && 7z a -tzip "${archive_path}" "${payload_name}")
              elif command -v zip >/dev/null 2>&1; then
                (cd "${stage_dir}" && zip -q "${archive_path}" "${payload_name}")
              elif command -v python3 >/dev/null 2>&1; then
                (cd "${stage_dir}" && python3 -c 'import sys, zipfile; archive_path, payload_name = sys.argv[1], sys.argv[2]; archive = zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED); archive.write(payload_name); archive.close()' "${archive_path}" "${payload_name}")
              else
                echo "Need 7z, zip, or python3 to create ${archive_path}" >&2
                exit 1
              fi
            else
              tar -czf "${archive_path}" -C "${stage_dir}" "${payload_name}"
            fi
            echo "packaged=${bin} -> dist/${artifact_name}"
          done

      # An asset recovery runs this workflow from main against the tag, so
      # its attestations name main's commit, not the tag. Each archive
      # therefore carries a stamp of the tree it was built from, written only
      # after checking that the checkout is the tag's commit, and attested
      # with it (see scripts/verify-release-asset-provenance --stamps). A
      # pre-tag prebuild runs before the tag exists: its stamp names the
      # dispatched main commit, which a tag run accepts only as its own.
      - name: Stamp archives with the checked-out release commit
        id: source_commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          PREBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD)"
          if [[ "${PREBUILD}" == "true" ]]; then
            if [[ "${tree}" != "${GITHUB_SHA}" ]]; then
              echo "checked-out tree ${tree} is not the dispatched prebuild commit ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            if ! tag_commit="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
              git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            fi
            if [[ "${tree}" != "${tag_commit}" ]]; then
              echo "checked-out tree ${tree} is not the ${RELEASE_TAG} commit ${tag_commit}" >&2
              exit 1
            fi
          fi
          echo "source_commit=${tree}" >> "${GITHUB_OUTPUT}"
          stamped=0
          for archive in dist/*.tar.gz dist/*.zip; do
            [[ -f "${archive}" ]] || continue
            printf '%s\n' "${tree}" > "${archive}.source-commit"
            stamped=$((stamped + 1))
          done
          if [[ "${stamped}" -eq 0 ]]; then
            echo "no release archives under dist/ to stamp" >&2
            exit 1
          fi
          echo "stamped ${stamped} archive(s) with ${RELEASE_TAG} ${tree}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meerkat-${{ matrix.target }}-buildbuddy
          path: dist/*
          if-no-files-found: error

  # Linux (x86_64, aarch64) and macOS arm64 archives publish as soon as the
  # critical gate passes, on either lane: they are what the CLI install, the
  # SDKs' rkat-rpc bootstrap and a paired Meta release need. The trailing
  # Intel macOS and Windows archives follow: publish_github_release adds them
  # once their lanes finish, add-only, writes the complete manifest
  # (checksums.sha256, index.json), and update_homebrew follows it. No
  # publisher replaces an asset that is already on the release.
  publish_critical_release_assets:
    name: Publish Linux and macOS arm64 release assets
    needs: [require_ci_green, release_validate_gate, release_semver_gate, build_binaries_critical_gate, release_prebuild]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.require_ci_green.result == 'success' &&
      needs.release_validate_gate.result == 'success' &&
      needs.release_semver_gate.result == 'success' &&
      needs.build_binaries_critical_gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download this run's release archives
        if: ${{ needs.release_prebuild.outputs.run_id == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: meerkat-*
          path: release-artifacts

      - name: Download the archives of the exact-commit prebuild
        if: ${{ needs.release_prebuild.outputs.run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: meerkat-*
          path: release-artifacts
          run-id: ${{ needs.release_prebuild.outputs.run_id }}
          github-token: ${{ github.token }}

      # Exactly the critical archives, whatever trailing ones were already
      # uploaded when this job started.
      - name: Select the critical archive set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "${RELEASE_TAG}" release-artifacts critical-release-artifacts <<'PY'
          import shutil
          import sys
          from pathlib import Path

          tag, source, output = sys.argv[1:]
          version = tag.removeprefix("v").replace("/", "-")
          binaries = ("rkat", "rkat-rpc", "rkat-rest", "rkat-mcp")
          targets = (
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "aarch64-apple-darwin",
          )
          wanted = sorted(
              f"{binary}-{version}-{target}.tar.gz"
              for binary in binaries
              for target in targets
          )
          found = {}
          for path in sorted(Path(source).rglob("*.tar.gz")):
              if path.name not in wanted:
                  continue
              if path.name in found:
                  raise SystemExit(f"duplicate critical release archive {path.name}")
              found[path.name] = path
          missing = [name for name in wanted if name not in found]
          if missing:
              raise SystemExit(f"critical release archives missing: {missing}")
          Path(output).mkdir()
          for name in wanted:
              shutil.copy2(found[name], Path(output) / name)
          print(f"Selected {len(wanted)} critical release archives")
          PY

      # This run's archives must be attested from exactly the tag commit; a
      # prebuild's are verified like an assets_run_id recovery.
      - name: Verify exact-tag Linux and macOS arm64 build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PREBUILD_RUN_ID: ${{ needs.release_prebuild.outputs.run_id }}
          PREBUILD_RUN_ATTEMPT: ${{ needs.release_prebuild.outputs.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -n "${PREBUILD_RUN_ID}" ]]; then
            # The prebuild's trailing lanes may still be running: its
            # critical gate covers the archives verified here.
            scripts/verify-release-asset-provenance \
              --source-run "${PREBUILD_RUN_ID}" \
              --source-attempt "${PREBUILD_RUN_ATTEMPT}" \
              --source-gate "Release critical binary build gate" \
              --prebuild \
              --stamps release-artifacts \
              critical-release-artifacts "${RELEASE_TAG}"
          else
            scripts/verify-release-asset-provenance critical-release-artifacts "${RELEASE_TAG}"
          fi

      - name: Require the release version in every critical binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version="${version//\//-}"
          checked=0
          for archive in critical-release-artifacts/*.tar.gz; do
            unpacked="$(mktemp -d)"
            tar -xzf "${archive}" -C "${unpacked}"
            binaries=0
            while IFS= read -r -d '' binary; do
              binaries=$((binaries + 1))
              grep -aqF -- "${version}" "${binary}" || {
                echo "$(basename "${archive}"): $(basename "${binary}") does not embed release version ${version}" >&2
                exit 1
              }
              scripts/check-release-binary-markers "${binary}"
            done < <(find "${unpacked}" -type f -print0)
            [[ "${binaries}" -gt 0 ]] || { echo "$(basename "${archive}") is empty" >&2; exit 1; }
            checked=$((checked + 1))
          done
          [[ "${checked}" -eq 12 ]] || { echo "expected 12 critical archives, checked ${checked}" >&2; exit 1; }
          echo "Every binary in ${checked} critical archives embeds ${version} and passes the test-code marker guard"

      # The archives just verified were compiled from the tag's tree. Its
      # built-binary test hooks must reach debug builds only: an older tree's
      # binaries honour them and carry no marker the packaging scan can see.
      - name: Require the release tree to gate its test hooks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/check-release-source-test-hooks "${RELEASE_TAG}"

      # Add-only: an archive already on the release (an earlier attempt) is
      # never replaced. The manifest is not written here: it describes the
      # complete set, which only publish_github_release sees.
      - name: Publish Linux and macOS arm64 release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            critical-release-artifacts/*.tar.gz
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: false
          tag_name: ${{ github.ref_name }}

  # The package build runs no code from the release tree before Require
  # green CI has checked the release ref; it then runs beside the release
  # validation and the semver gate instead of after them. Building
  # publishes nothing: publish_web_sdk requires green CI, the release
  # validation, the semver gate, the registry credentials and this build.
  # A tag whose commit was prebuilt reuses the prebuild's package instead.
  build_web_sdk_package:
    name: Build Web SDK package
    needs: [require_ci_green, release_prebuild]
    if: >-
      !cancelled() &&
      needs.require_ci_green.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.web_sdk_artifact_run_id == '') &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        ((github.event.inputs.publish_release_packages == 'true' &&
          github.event.inputs.alpha_crates_only != 'true') ||
         github.event.inputs.prebuild_release_artifacts == 'true'))) &&
      needs.release_prebuild.outputs.run_id == ''
    runs-on: ${{ fromJSON(vars.MEERKAT_CI_RUNNER || '"ubuntu-24.04"') }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Recovery dispatches run the workflow definition from main, but the
          # package must always be built from the explicitly selected release.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && github.sha || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          persist-credentials: false

      # A recovery of an older tag checks that tag out, and its local
      # actions would be the tag's own: the setup action comes from the
      # workflow's commit instead, whose third-party actions are pinned.
      # Sparse, so the checkout adds no Cargo or Bazel package to the build.
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-rust-ci/action.yml
            scripts/ci-pin-rust-toolchain-env
          sparse-checkout-cone-mode: false

      - uses: ./.release-tooling/.github/actions/setup-rust-ci

      - name: Install Python + Node tooling
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.13.1"
          # Pinned: this job attests the package wasm-pack builds.
          sha256="c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${sha256}  /tmp/${archive}" | sha256sum --check --strict -
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      # wasm-pack would otherwise download wasm-bindgen and wasm-opt at build
      # time, unchecked; the build below passes it `--mode no-install`
      # (MEERKAT_WEB_WASM_PACK_MODE), so it uses these or fails. wasm-bindgen
      # must be Cargo.lock's version; wasm-opt is binaryen version_117, the
      # one wasm-pack 0.13.1 downloads. scripts/release-doctor checks the pin
      # against Cargo.lock.
      - name: Install pinned wasm-bindgen and wasm-opt
        shell: bash
        run: |
          set -euo pipefail
          bindgen_version="0.2.126"
          bindgen_sha256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          binaryen_version="version_117"
          binaryen_sha256="3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212"
          locked="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          if [[ "${locked}" != "${bindgen_version}" ]]; then
            echo "Cargo.lock locks wasm-bindgen ${locked:-<none>}, this step pins ${bindgen_version}; update the pin and its sha256" >&2
            exit 1
          fi
          tools="${RUNNER_TEMP}/wasm-tools"
          mkdir -p "${tools}/bin"
          bindgen_archive="wasm-bindgen-${bindgen_version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${bindgen_version}/${bindgen_archive}" \
            --output "${tools}/${bindgen_archive}"
          echo "${bindgen_sha256}  ${tools}/${bindgen_archive}" | sha256sum --check --strict -
          tar -xzf "${tools}/${bindgen_archive}" -C "${tools}"
          install -m 0755 "${tools}/wasm-bindgen-${bindgen_version}-x86_64-unknown-linux-musl/wasm-bindgen" "${tools}/bin/wasm-bindgen"
          binaryen_archive="binaryen-${binaryen_version}-x86_64-linux.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/WebAssembly/binaryen/releases/download/${binaryen_version}/${binaryen_archive}" \
            --output "${tools}/${binaryen_archive}"
          echo "${binaryen_sha256}  ${tools}/${binaryen_archive}" | sha256sum --check --strict -
          tar -xzf "${tools}/${binaryen_archive}" -C "${tools}" "binaryen-${binaryen_version}/bin/wasm-opt"
          install -m 0755 "${tools}/binaryen-${binaryen_version}/bin/wasm-opt" "${tools}/bin/wasm-opt"
          echo "${tools}/bin" >> "${GITHUB_PATH}"
          "${tools}/bin/wasm-bindgen" --version
          "${tools}/bin/wasm-opt" --version

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # No RUSTFLAGS here: sdks/web/scripts/build-wasm.mjs owns the wasm
      # flags (the getrandom cfg and the 8 MiB stack). An ambient RUSTFLAGS
      # made Cargo ignore them and shipped a 1 MiB stack from 0.8.30 through
      # 0.8.44; the build now folds any ambient flags in, and the package
      # script refuses a packed wasm below 8 MiB and runs one turn from it.
      - name: Build and pack Web SDK
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prebuild_release_artifacts == 'true' && needs.require_ci_green.outputs.prebuild_tag || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          CARGO_INCREMENTAL: "0"
          # wasm-pack uses the pinned wasm-bindgen and wasm-opt above and
          # downloads nothing.
          MEERKAT_WEB_WASM_PACK_MODE: no-install
        run: |
          set -euo pipefail
          # Four Cargo jobs, while the release tree's own
          # scripts/release-web-sdk-rustc-wrapper keeps the other memory-heavy
          # wasm32 crates off the machine catalog's rustc (12.8 GiB alone).
          # Plain jobs 4 and 2 were OOM-killed under local 13-15 GiB limits:
          # pipelining overlapped the catalog with meerkat_runtime and
          # meerkat_mob, 18.8 GiB at jobs 4. Jobs 1 fit, but also ran each
          # crate's code generation on one thread: 33m43s of Cargo in the
          # v0.9.1 tag run, 24m05s locally on four vCPUs, where jobs 4 with
          # the wrapper took 11m14s and peaked at 13.0 GiB under a 14 GiB
          # limit. A tree without the wrapper (a recovery of an older tag),
          # or one whose wrapper names a crate the tree does not have, builds
          # at one job as before. This bounds Cargo concurrency, not
          # wasm-opt's parallelism.
          wrapper="${GITHUB_WORKSPACE}/scripts/release-web-sdk-rustc-wrapper"
          if [[ -x "${wrapper}" ]] && "${wrapper}" --check-heavy-crates; then
            export CARGO_BUILD_JOBS=4
            export RUSTC_WRAPPER="${wrapper}"
            export MEERKAT_WEB_WASM_HEAVY_RUSTC_LOCK="${RUNNER_TEMP}/web-sdk-heavy-rustc.lock"
          else
            echo "::warning title=Web SDK build::no heavy-crate wrapper matching this tree; building at one Cargo job"
            export CARGO_BUILD_JOBS=1
          fi
          echo "Web SDK wasm build: CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS} RUSTC_WRAPPER=${RUSTC_WRAPPER:-none}"
          scripts/release-build-web-sdk-package.sh "${GITHUB_WORKSPACE}/web-sdk-package"

      # Binds the artifact to its source. publish_web_sdk refuses a package
      # whose stamp does not name both its own checkout and Require green
      # CI's commit, or whose tarball differs from the stamped one.
      - name: Stamp Web SDK package source
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(web-sdk-package/rkat-web-*.tgz)
          [[ "${#tarballs[@]}" -eq 1 ]] || { echo "expected one rkat-web tarball, found ${#tarballs[@]}" >&2; exit 1; }
          tarball="${tarballs[0]}"
          packed="$(tar -xzOf "${tarball}" package/package.json | jq -r '.name + "@" + .version')"
          expected="$(jq -r '.name + "@" + .version' sdks/web/package.json)"
          [[ "${packed}" == "${expected}" ]] || { echo "tarball package ${packed} is not ${expected}" >&2; exit 1; }
          jq -n \
            --arg commit "$(git rev-parse HEAD)" \
            --arg package "${packed}" \
            --arg tarball "$(basename "${tarball}")" \
            --arg tarball_sha256 "$(sha256sum "${tarball}" | cut -d' ' -f1)" \
            '{commit: $commit, package: $package, tarball: $tarball, tarball_sha256: $tarball_sha256}' \
            > web-sdk-package/rkat-web-package.json
          cat web-sdk-package/rkat-web-package.json

      # A tag run that reuses a prebuild's package verifies this attestation
      # (release.yml at the tag commit on refs/heads/main) before publishing.
      - name: Attest Web SDK package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: web-sdk-package/rkat-web-*.tgz

      - name: Upload Web SDK package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rkat-web-package
          path: |
            web-sdk-package/rkat-web-*.tgz
            web-sdk-package/rkat-web-package.json
          if-no-files-found: error

  # The marker release_prebuild requires of a prebuild run: the critical
  # binaries (Linux x86_64 and aarch64, macOS arm64) and the Web SDK package
  # succeeded for the dispatched commit. The trailing Intel macOS and Windows
  # lanes do not hold it back: they keep running in this run, and the tag's
  # trailing publisher waits for this run's full binary build gate.
  release_prebuild_gate:
    name: Release prebuild gate
    needs: [require_ci_green, build_binaries_critical_gate, build_web_sdk_package]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.prebuild_release_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every prebuilt release artifact
        shell: bash
        env:
          PREBUILD_TAG: ${{ needs.require_ci_green.outputs.prebuild_tag }}
        run: |
          set -euo pipefail
          request="${{ needs.require_ci_green.result }}"
          binaries="${{ needs.build_binaries_critical_gate.result }}"
          web_sdk="${{ needs.build_web_sdk_package.result }}"
          echo "Prebuild request: ${request}"
          echo "Release critical binary build gate: ${binaries}"
          echo "Web SDK package: ${web_sdk}"
          [[ "${request}" == "success" && "${binaries}" == "success" && "${web_sdk}" == "success" && -n "${PREBUILD_TAG}" ]]
          echo "Prebuilt the critical ${PREBUILD_TAG} release artifacts of ${GITHUB_SHA}; the ${PREBUILD_TAG} tag run of exactly this commit publishes them instead of rebuilding, and the trailing ones once this run's binary build gate passes."

  # The critical platforms (Linux x86_64 and aarch64, macOS arm64): the
  # selected lane built them, or the archives come from an earlier run (a
  # prebuild of the tag commit, or assets_run_id). The critical publisher waits
  # for this gate only, never for the trailing Intel macOS and Windows lanes,
  # which build_binaries_gate adds.
  build_binaries_critical_gate:
    name: Release critical binary build gate
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true')))
    needs: [build_binaries, build_binaries_buildbuddy, release_prebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the selected critical-platform lane
        shell: bash
        env:
          ASSETS_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assets_run_id || '' }}
          PREBUILD_RUN_ID: ${{ needs.release_prebuild.outputs.run_id }}
        run: |
          set -euo pipefail
          github_result="${{ needs.build_binaries.result }}"
          buildbuddy_result="${{ needs.build_binaries_buildbuddy.result }}"
          source_run="${PREBUILD_RUN_ID:-${ASSETS_RUN_ID}}"
          if [[ -n "${source_run}" ]]; then
            [[ "${github_result}" == "skipped" && "${buildbuddy_result}" == "skipped" ]] || {
              echo "the archives come from release run ${source_run}, but a build job ran (${github_result}, ${buildbuddy_result})" >&2
              exit 1
            }
            echo "Critical archives come from release run ${source_run}; no build in this run."
            exit 0
          fi
          bb_selected="${{ github.actor == 'lukacf' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_backend == 'buildbuddy') || (github.event_name != 'workflow_dispatch' && (vars.MEERKAT_RELEASE_BUILDBUDDY == 'true' || vars.MEERKAT_RELEASE_BUILDBUDDY == '1'))) }}"
          if [[ "${bb_selected}" == "true" ]]; then
            echo "BuildBuddy critical-platform build selected: ${buildbuddy_result}; GitHub-hosted fallback: ${github_result}"
            [[ "${buildbuddy_result}" == "success" && "${github_result}" == "skipped" ]]
            exit $?
          fi
          echo "GitHub-hosted critical-platform build selected: ${github_result}; BuildBuddy: ${buildbuddy_result}"
          [[ "${github_result}" == "success" && "${buildbuddy_result}" == "skipped" ]]

  build_binaries_gate:
    name: Release binary build gate
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_release_assets_only == 'true' ||
         github.event.inputs.prebuild_release_artifacts == 'true')))
    needs: [build_binaries, build_binaries_buildbuddy, build_binaries_windows_cross, verify_windows_binaries, build_binaries_macos_x86_cross, release_prebuild]
    runs-on: ${{ fromJSON(vars.MEERKAT_CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - name: Check selected release binary backend
        shell: bash
        env:
          ASSETS_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assets_run_id || '' }}
          PREBUILD_RUN_ID: ${{ needs.release_prebuild.outputs.run_id }}
        run: |
          set -euo pipefail
          # A tag whose commit was prebuilt: nothing is built here; the
          # publisher verifies the prebuild run's archives and that its own
          # build gate passed (see publish_github_release).
          if [[ -n "${PREBUILD_RUN_ID}" ]]; then
            for result in "${{ needs.build_binaries.result }}" "${{ needs.build_binaries_buildbuddy.result }}" \
                          "${{ needs.build_binaries_windows_cross.result }}" "${{ needs.verify_windows_binaries.result }}" \
                          "${{ needs.build_binaries_macos_x86_cross.result }}"; do
              [[ "${result}" == "skipped" ]] || { echo "release_prebuild found run ${PREBUILD_RUN_ID}, but a build job ran (${result})" >&2; exit 1; }
            done
            echo "Publishing the prebuilt archives of release run ${PREBUILD_RUN_ID}; no build in this run."
            exit 0
          fi
          # Asset recovery from an earlier run: nothing is built here; the
          # publisher verifies that run's archives and that its own build
          # gate passed (see publish_github_release).
          if [[ -n "${ASSETS_RUN_ID}" ]]; then
            for result in "${{ needs.build_binaries.result }}" "${{ needs.build_binaries_buildbuddy.result }}" \
                          "${{ needs.build_binaries_windows_cross.result }}" "${{ needs.verify_windows_binaries.result }}" \
                          "${{ needs.build_binaries_macos_x86_cross.result }}"; do
              [[ "${result}" == "skipped" ]] || { echo "assets_run_id set, but a build job ran (${result})" >&2; exit 1; }
            done
            echo "Publishing the archives of release run ${ASSETS_RUN_ID}; no build in this run."
            exit 0
          fi
          bb_selected="${{ github.actor == 'lukacf' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_backend == 'buildbuddy') || (github.event_name != 'workflow_dispatch' && (vars.MEERKAT_RELEASE_BUILDBUDDY == 'true' || vars.MEERKAT_RELEASE_BUILDBUDDY == '1'))) }}"
          github_result="${{ needs.build_binaries.result }}"
          buildbuddy_result="${{ needs.build_binaries_buildbuddy.result }}"
          windows_cross_result="${{ needs.build_binaries_windows_cross.result }}"
          windows_verify_result="${{ needs.verify_windows_binaries.result }}"
          macos_x86_result="${{ needs.build_binaries_macos_x86_cross.result }}"

          # The trailing platforms build in their own jobs whichever lane
          # builds the critical ones: Windows is cross-compiled on Linux and
          # verified on a Windows runner, Intel macOS is cross-compiled on
          # Apple silicon.
          echo "Windows cross-compile (Linux, cargo-xwin): ${windows_cross_result}"
          echo "Windows binary verification (windows-2025-vs2026): ${windows_verify_result}"
          [[ "${windows_cross_result}" == "success" && "${windows_verify_result}" == "success" ]] || exit 1
          echo "Intel macOS cross-compile (Apple silicon): ${macos_x86_result}"
          [[ "${macos_x86_result}" == "success" ]] || exit 1

          if [[ "${bb_selected}" == "true" ]]; then
            # Owner lane split: BuildBuddy builds the critical platforms;
            # the hosted fallback matrix is skipped.
            echo "BuildBuddy release binary build (Linux, macOS arm64) selected: ${buildbuddy_result}"
            echo "GitHub-hosted fallback skipped: ${github_result}"
            [[ "${buildbuddy_result}" == "success" && "${github_result}" == "skipped" ]]
            exit $?
          fi

          echo "GitHub-hosted release binary build (Linux, macOS arm64) selected: ${github_result}"
          echo "BuildBuddy release binary build skipped: ${buildbuddy_result}"
          [[ "${github_result}" == "success" && "${buildbuddy_result}" == "skipped" ]]

  publish_github_release:
    name: Publish GitHub release assets
    if: >-
      always() &&
      needs.require_ci_green.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_release_assets_only == 'true')) &&
      (needs.release_validate_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_release_assets_only == 'true' &&
        needs.release_validate_gate.result == 'skipped')) &&
      (needs.release_semver_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_release_assets_only == 'true' &&
        needs.release_semver_gate.result == 'skipped')) &&
      needs.build_binaries_gate.result == 'success'
    # The trailing publisher: once every lane finished (build_binaries_gate,
    # Intel macOS and Windows included) it adds the archives the critical
    # publisher did not, add-only, and only then writes the complete
    # manifest; update_homebrew follows it. Waiting for the critical
    # publisher keeps the two uploads ordered, and `always()` above keeps
    # this authoritative path available if that publisher failed.
    # require_ci_green: every published archive, an asset recovery's from an
    # earlier run included, belongs to a release commit whose exact-main CI
    # succeeded (a prebuild run never waited for it).
    needs:
      [
        require_ci_green,
        release_validate_gate,
        release_semver_gate,
        build_binaries_gate,
        publish_critical_release_assets,
        release_prebuild,
      ]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      # Recovery runs execute the current workflow against an older release
      # tag, so load helpers from the workflow ref rather than that old tag.
      - name: Checkout workflow helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.assets_run_id == '') && needs.release_prebuild.outputs.run_id == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      # The prebuild was selected once its critical artifacts were ready; its
      # trailing Intel macOS and Windows lanes may still be running. Their
      # archives exist once that run's full binary build gate passed, which
      # --source-run below requires anyway. If they failed, the trailing
      # assets come from an asset recovery (make release-assets).
      - name: Wait for the prebuild's trailing lanes
        if: ${{ needs.release_prebuild.outputs.run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREBUILD_RUN_ID: ${{ needs.release_prebuild.outputs.run_id }}
          PREBUILD_RUN_ATTEMPT: ${{ needs.release_prebuild.outputs.run_attempt }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 9000 ))
          while true; do
            state="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${PREBUILD_RUN_ID}/attempts/${PREBUILD_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Release binary build gate") | (.conclusion // "pending")')"
            case "${state:-pending}" in
              success)
                echo "Release run ${PREBUILD_RUN_ID}: every binary lane, trailing ones included, succeeded"
                break
                ;;
              pending) ;;
              *)
                echo "::error::Release run ${PREBUILD_RUN_ID}: Release binary build gate ${state}; publish the trailing assets with an asset recovery (make release-assets)"
                exit 1
                ;;
            esac
            if (( $(date +%s) >= deadline )); then
              echo "::error::Release run ${PREBUILD_RUN_ID}: no binary build gate result after 150 minutes"
              exit 1
            fi
            sleep 60
          done

      # A tag whose commit was prebuilt: the prebuild run's archives, stamps
      # and attestations; verify-release-asset-provenance --source-run binds
      # them to that run before anything is published.
      - name: Download the archives of the exact-commit prebuild
        if: ${{ needs.release_prebuild.outputs.run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: meerkat-*
          run-id: ${{ needs.release_prebuild.outputs.run_id }}
          github-token: ${{ github.token }}

      # Asset recovery from an earlier run (assets_run_id): its archives,
      # stamps and attestations; verify-release-asset-provenance --source-run
      # binds them to that run before anything is published.
      - name: Download the archives of the earlier release run
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assets_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: meerkat-*
          run-id: ${{ github.event.inputs.assets_run_id }}
          github-token: ${{ github.token }}

      - name: Prepare and verify complete release asset set
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "release_tag is required for release asset recovery" >&2
            exit 1
          fi
          scripts/verify-release-assets.py prepare \
            --source-dir release-artifacts \
            --output-dir prepared-release-artifacts \
            --release-tag "${RELEASE_TAG}"

      # The build jobs refuse to package a binary that does not embed the
      # release version; check it again on the exact bytes being published,
      # which for assets_run_id were built by an earlier run.
      - name: Require the release version in every published binary
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version="${version//\//-}"
          checked=0
          for archive in prepared-release-artifacts/*.tar.gz prepared-release-artifacts/*.zip; do
            [[ -f "${archive}" ]] || continue
            unpacked="$(mktemp -d)"
            case "${archive}" in
              *.tar.gz) tar -xzf "${archive}" -C "${unpacked}" ;;
              *.zip) unzip -q "${archive}" -d "${unpacked}" ;;
            esac
            binaries=0
            while IFS= read -r -d '' binary; do
              binaries=$((binaries + 1))
              grep -aqF -- "${version}" "${binary}" || {
                echo "$(basename "${archive}"): $(basename "${binary}") does not embed release version ${version}" >&2
                exit 1
              }
              # Nor may it carry compiled-in test code. The guard reads the
              # release version from VERSION: tokio's test-util marker passes
              # only in a release before 0.9.2.
              VERSION="${version}" scripts/check-release-binary-markers "${binary}"
            done < <(find "${unpacked}" -type f -print0)
            [[ "${binaries}" -gt 0 ]] || { echo "$(basename "${archive}") is empty" >&2; exit 1; }
            rm -rf "${unpacked}"
            checked=$((checked + 1))
          done
          [[ "${checked}" -gt 0 ]] || { echo "no release archives to check" >&2; exit 1; }
          echo "Every binary in ${checked} archives embeds ${version} and passes the test-code marker guard"

      # Tag push, or a dispatch on the tag ref: every archive is attested
      # from exactly the tag commit. An asset recovery dispatched from main
      # runs main's workflow against the tag, so its attestations name the
      # run's commit: then each archive must be attested by release.yml at
      # that commit on refs/heads/main, and carry an attested stamp proving
      # its build job checked out the tag commit. With assets_run_id, or on a
      # tag whose commit was prebuilt (release_prebuild), the archives come
      # from that earlier run: --source-run binds them to its commit,
      # requires its build gate to have passed, and accepts an unstamped run
      # only if nothing outside .github/ and CHANGELOG.md changed between the
      # tag and that commit.
      - name: Verify exact-tag release build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          RECOVERY_FROM_MAIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release_assets_only == 'true' && github.ref == 'refs/heads/main' }}
          ASSETS_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assets_run_id || '' }}
          PREBUILD_RUN_ID: ${{ needs.release_prebuild.outputs.run_id }}
          PREBUILD_RUN_ATTEMPT: ${{ needs.release_prebuild.outputs.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -n "${ASSETS_RUN_ID}" && "${RECOVERY_FROM_MAIN}" != "true" ]]; then
            echo "assets_run_id requires publish_release_assets_only dispatched on main" >&2
            exit 1
          fi
          if [[ -n "${PREBUILD_RUN_ID}" ]]; then
            # The tag commit's pre-tag prebuild, verified exactly like an
            # assets_run_id recovery: release.yml dispatched on main at a
            # commit in this tag's history with a green binary build gate,
            # every archive and its stamp attested by release.yml at that
            # commit on refs/heads/main, and every stamp naming this tag's
            # commit (release_prebuild only selects a run at exactly it).
            scripts/verify-release-asset-provenance \
              --source-run "${PREBUILD_RUN_ID}" \
              --source-attempt "${PREBUILD_RUN_ATTEMPT}" \
              --prebuild \
              --stamps release-artifacts \
              prepared-release-artifacts "${RELEASE_TAG}"
          elif [[ -n "${ASSETS_RUN_ID}" ]]; then
            scripts/verify-release-asset-provenance \
              --source-run "${ASSETS_RUN_ID}" \
              --stamps release-artifacts \
              prepared-release-artifacts "${RELEASE_TAG}"
          elif [[ "${RECOVERY_FROM_MAIN}" == "true" ]]; then
            scripts/verify-release-asset-provenance \
              --recovery-source "${GITHUB_SHA}" \
              --stamps release-artifacts \
              prepared-release-artifacts "${RELEASE_TAG}"
          else
            scripts/verify-release-asset-provenance prepared-release-artifacts "${RELEASE_TAG}"
          fi

      # Every archive above, reused or rebuilt, was compiled from the tag's
      # tree. Its built-binary test hooks must reach debug builds only: an
      # older tree's binaries honour them and carry no marker the packaging
      # scan can see, so an old tag's archives fail closed here.
      - name: Require the release tree to gate its test hooks
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: scripts/check-release-source-test-hooks "${RELEASE_TAG}"

      - name: Publish release archives
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            prepared-release-artifacts/*.tar.gz
            prepared-release-artifacts/*.zip
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: false
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

      # A recovery run can reuse existing archives whose compressed bytes do
      # not match a fresh rebuild. Build the public manifest from the release
      # assets themselves after all missing archives have been uploaded.
      - name: Download published release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p published-release-downloads
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.tar.gz' \
            --pattern '*.zip' \
            --dir published-release-downloads
          scripts/verify-release-assets.py prepare \
            --source-dir published-release-downloads \
            --output-dir published-release-artifacts \
            --release-tag "${RELEASE_TAG}"

      # The manifest is written once, from the complete set of published,
      # never-replaced archives, and never deleted or replaced: a rerun finds
      # it present, checks that it equals the one regenerated from the same
      # archives, and uploads nothing. A published manifest that differs
      # means the archive set changed, and the run fails. Listing the release
      # assets tells a missing manifest from an API error, which fails too.
      #
      # Window: the critical publisher makes the release public with the
      # Linux and macOS arm64 archives before this job writes
      # checksums.sha256 and index.json. With a prebuild whose trailing lanes
      # already finished that is the few minutes between the two publishers;
      # when the tag builds, it lasts until the Intel macOS and Windows lanes
      # finish (or until an asset recovery if they fail). Every archive is
      # attested meanwhile (`gh attestation verify`).
      - name: Check the published manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          mkdir -p published-manifest
          upload=false
          for name in checksums.sha256 index.json; do
            if ! grep -Fxq -- "${name}" <<<"${assets}"; then
              echo "${name} is not on the release yet"
              upload=true
              continue
            fi
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${name}" --dir published-manifest
            if ! cmp -s "published-manifest/${name}" "published-release-artifacts/${name}"; then
              echo "the published ${name} differs from the one regenerated from the published archives; refusing to replace it" >&2
              exit 1
            fi
            echo "published ${name} is unchanged"
          done
          echo "upload=${upload}" >> "${GITHUB_OUTPUT}"

      # Publish checksums and index.json only after every platform archive is
      # present, keeping the public manifest a complete release authority.
      - name: Publish complete release manifest
        if: ${{ steps.manifest.outputs.upload == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            published-release-artifacts/checksums.sha256
            published-release-artifacts/index.json
          draft: false
          fail_on_unmatched_files: true
          overwrite_files: false
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

  update_homebrew:
    name: Update Homebrew tap formula
    if: >-
      always() &&
      needs.publish_github_release.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_release_assets_only == 'true'))
    needs: [publish_github_release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The only Homebrew update: the formula needs every Unix archive, Intel
      # macOS included, so it follows the trailing publisher and reads the
      # complete release's published checksums.sha256.
      - name: Update Homebrew tap from complete release
        uses: ./.github/actions/update-homebrew
        with:
          release_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          github_token: ${{ github.token }}
          tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The next release's semver gate compares each changed crate against the
  # rustdoc JSON of this release instead of rebuilding this workspace on a
  # hosted runner. Generated on the release tag with the pinned rustc; the
  # manifest records that rustc so a consumer on another compiler falls back
  # to rebuilding rather than reading an incompatible format.
  #
  # Nothing a user waits for depends on it. The rustdoc build (17 minutes on
  # 0.9.1) starts as soon as require_ci_green passes, in parallel with
  # publication, instead of after the GitHub release; no job needs it except
  # attach_semver_baseline, which uploads the result once the release is
  # published and which nothing needs. A failure here leaves the next
  # release's semver measurement to rebuild this baseline from the tag.
  publish_semver_baseline:
    name: Generate semver baseline rustdoc
    needs: [require_ci_green]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.publish_release_assets_only == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

      # A recovery of an older tag checks that tag out, and its local
      # actions would be the tag's own: the setup action comes from the
      # workflow's commit instead, whose third-party actions are pinned.
      # Sparse, so the checkout adds no Cargo or Bazel package to the build.
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-rust-ci/action.yml
            scripts/ci-pin-rust-toolchain-env
          sparse-checkout-cone-mode: false

      - uses: ./.release-tooling/.github/actions/setup-rust-ci

      - name: Generate rustdoc JSON for every publishable library crate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          out="${RUNNER_TEMP}/semver-rustdoc"
          scripts/semver-rustdoc-json.sh --source-root . --out "${out}"
          manifest_version="$(jq -r .version "${out}/manifest.json")"
          if [[ "${manifest_version}" != "${version}" ]]; then
            echo "::error::manifest version ${manifest_version} does not match release ${RELEASE_TAG}"
            exit 1
          fi
          # rustdoc JSON compresses about 50:1; pay for the high level once here
          # so every later measurement downloads a few megabytes.
          mkdir -p "${RUNNER_TEMP}/semver-baseline"
          tar -I 'zstd -19 -T0' -cf "${RUNNER_TEMP}/semver-baseline/semver-rustdoc-${version}.tar.zst" -C "${out}" .
          ls -la "${RUNNER_TEMP}/semver-baseline/semver-rustdoc-${version}.tar.zst"

      - name: Upload baseline rustdoc for the release attachment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semver-rustdoc-baseline
          path: ${{ runner.temp }}/semver-baseline/semver-rustdoc-*.tar.zst
          if-no-files-found: error
          retention-days: 7

  attach_semver_baseline:
    name: Attach semver baseline rustdoc to the GitHub release
    if: >-
      always() &&
      needs.publish_github_release.result == 'success' &&
      needs.publish_semver_baseline.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_release_assets_only == 'true'))
    needs: [publish_github_release, publish_semver_baseline]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download baseline rustdoc
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: semver-rustdoc-baseline
          path: semver-baseline

      - name: Attach baseline rustdoc to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          asset="semver-rustdoc-${RELEASE_TAG#v}.tar.zst"
          # Add-only, like every release upload: a baseline already attached
          # (by the tag run, before an asset recovery of the same tag) stays
          # as published, and a concurrent upload fails instead of replacing.
          attached="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          if grep -Fxq -- "${asset}" <<<"${attached}"; then
            echo "${asset} is already on ${RELEASE_TAG}; leaving it in place"
            exit 0
          fi
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "semver-baseline/${asset}"

  # Registry publishing runs automatically on tag pushes alongside binary
  # builds. For recovery (e.g. npm was down during the tag-triggered run),
  # re-run via workflow_dispatch:
  #
  #   gh workflow run release.yml --ref v<VERSION> \
  #     -f publish_release_packages=true \
  #     -f registry_dry_run=false
  #
  # Use registry_dry_run=true to validate without uploading.
  publish_registries:
    name: Publish crates + Python/TypeScript SDK packages
    if: >-
      always() &&
      needs.require_ci_green.result == 'success' &&
      needs.release_validate_gate.result == 'success' &&
      needs.registry_credentials_preflight.result == 'success' &&
      (needs.release_semver_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_release_assets_only == 'true' &&
        needs.release_semver_gate.result == 'skipped')) &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.publish_release_packages == 'true' &&
       github.event.inputs.publish_web_sdk_only != 'true'))
    needs: [require_ci_green, release_validate_gate, release_semver_gate, registry_credentials_preflight]
    runs-on: ubuntu-24.04
    # The SDK packages can wait up to 150 minutes for the release's binary
    # manifest (Stamp the SDK binary digests) after the crates publish; the
    # SLO step after them must still run.
    timeout-minutes: 240
    # Read-only. The SDK digest stamp lists this run's jobs, downloads the
    # release manifest and verifies the archives' build attestations.
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}

      # A recovery of an older tag checks that tag out, and its local
      # actions would be the tag's own: the setup action comes from the
      # workflow's commit instead, whose third-party actions are pinned.
      # Sparse, so the checkout adds no Cargo or Bazel package to the build.
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-rust-ci/action.yml
            scripts/ci-pin-rust-toolchain-env
          sparse-checkout-cone-mode: false

      - uses: ./.release-tooling/.github/actions/setup-rust-ci

      # No cache: this job holds the crates.io, PyPI and npm tokens, and a
      # restored cache (written by any earlier run on main, a dispatch
      # included) could put a binary ahead of cargo or python on PATH. It
      # packages without compiling (cargo publish --no-verify), so a cold
      # registry costs only the index and source downloads.
      - name: Install Python + Node tooling
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install Python publishing tools
        run: python -m pip install --upgrade build twine

      - name: Publish Rust crates
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_web_sdk_only != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          MEERKAT_REGISTRY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}
        run: |
          # The publication SLO window opens when this job starts publishing,
          # not at the tag push: full-fresh release validation runs first.
          echo "RUST_PUBLISH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          MEERKAT_REGISTRY_DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}" \
            scripts/release-publish-rust-crates.sh

      - name: Verify all Rust crates are public
        id: rust_crates_public
        if: >-
          ${{
            (github.event_name != 'workflow_dispatch' ||
             github.event.inputs.registry_dry_run != 'true') &&
            (github.event_name != 'workflow_dispatch' ||
             github.event.inputs.publish_web_sdk_only != 'true')
          }}
        shell: bash
        run: |
          set -euo pipefail
          # Readback only: every crate public, checksummed and not yanked
          # within the deadline. The SDK packages below depend on this, not on
          # the publication SLO, which is enforced after they publish.
          python3 scripts/verify-rust-release-public.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --deadline-seconds 900 \
            --readback-only \
            --observations-out "${RUNNER_TEMP}/rust-crates-public.json"

      - name: Stamp the SDK binary digests
        # The Python and TypeScript SDKs download rkat-rpc only against
        # digests they carry (#1739), so pin this release's into both before
        # either package builds. They come from the release's own manifest,
        # which publish_github_release writes once from the published archives
        # after every platform lane: a tag run waits for it (with a prebuild
        # it is usually there already) and fails at once if that job fails; a
        # package recovery needs it present. The stamp refuses an incomplete
        # manifest, an archive that does not re-hash or carries no build
        # attestation from this repository's release workflow, and pins the
        # binary inside each verified archive. A tag tree whose SDKs predate
        # pinned digests has nothing to stamp.
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            (github.event.inputs.publish_web_sdk_only != 'true' &&
             github.event.inputs.alpha_crates_only != 'true')
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          WAIT_FOR_MANIFEST: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ ! -f sdks/python/meerkat/_rkat_rpc_digests.py ]]; then
            echo "${RELEASE_TAG}'s SDKs pin no rkat-rpc digests; nothing to stamp"
            exit 0
          fi
          scripts/release-await-binary-manifest "${RELEASE_TAG}"
          release_dir="${RUNNER_TEMP}/sdk-binary-digests-release"
          mkdir -p "${release_dir}"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${release_dir}" \
            --pattern checksums.sha256 --pattern index.json --pattern 'rkat-rpc-*'
          python3 scripts/release-stamp-sdk-binary-digests stamp \
            --release-dir "${release_dir}" \
            --release-tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --table-out "${RUNNER_TEMP}/sdk-binary-digests.json"

      - name: Publish Python SDK
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            (github.event.inputs.publish_web_sdk_only != 'true' &&
             github.event.inputs.alpha_crates_only != 'true')
          }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        working-directory: sdks/python
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          VENV_DIR="$(mktemp -d)"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install dist/*.whl
          "$VENV_DIR/bin/python" -c "from meerkat import CONTRACT_VERSION, MeerkatClient; print(CONTRACT_VERSION); print(MeerkatClient.__name__)"
          # The wheel must pin exactly the stamped digests for its version
          # (#1739): read them from the installed package (-I keeps the source
          # tree off sys.path), let its own lookup accept every entry, and
          # refuse an unstamped or wrong-version table.
          if [[ -f meerkat/_rkat_rpc_digests.py ]]; then
            "$VENV_DIR/bin/python" -I -c '
          import json, sys, meerkat
          from meerkat import _rkat_rpc_digests
          from meerkat.client import MeerkatClient
          table = _rkat_rpc_digests.RKAT_RPC_DIGESTS
          for target, entry in table["archives"].items():
              MeerkatClient._pinned_rkat_rpc_archive(meerkat.CONTRACT_VERSION, target, entry["asset"])
          json.dump({"contract_version": meerkat.CONTRACT_VERSION, "digests": table}, sys.stdout)
          ' > "${RUNNER_TEMP}/python-sdk-binary-digests.json"
            python3 ../../scripts/release-stamp-sdk-binary-digests verify \
              --release-tag "${RELEASE_TAG}" \
              --expected "${RUNNER_TEMP}/sdk-binary-digests.json" \
              --actual "${RUNNER_TEMP}/python-sdk-binary-digests.json"
          fi
          rm -rf "$VENV_DIR"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Python SDK dry-run: skipping upload"
          else
            python -m twine upload --skip-existing dist/*
          fi

      - name: Publish TypeScript SDK
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            (github.event.inputs.publish_web_sdk_only != 'true' &&
             github.event.inputs.alpha_crates_only != 'true')
          }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        working-directory: sdks/typescript
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          PACKAGE_VERSION="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if [[ "$DRY_RUN" != "true" ]] && npm view "$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_VERSION already published, skipping"
            exit 0
          fi
          npm install --ignore-scripts
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm run build
          PACKFILE="$(npm pack | tail -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null 2>&1
          npm install "${GITHUB_WORKSPACE}/sdks/typescript/${PACKFILE}" >/dev/null 2>&1
          node --input-type=module -e "const sdk = await import('@rkat/sdk'); if (!sdk.MeerkatClient || !sdk.CONTRACT_VERSION) throw new Error('missing expected exports');"
          # The packed package must pin exactly the stamped digests for its
          # version (#1739): read them from the installed package, let its
          # own lookup accept every entry, and refuse an unstamped or
          # wrong-version table.
          if [[ -f "${GITHUB_WORKSPACE}/sdks/typescript/src/rkat-rpc-digests.ts" ]]; then
            node --input-type=module -e "
              const { pathToFileURL } = await import('node:url');
              const sdk = await import('@rkat/sdk');
              const pinned = pathToFileURL(process.cwd() + '/node_modules/@rkat/sdk/dist/rkat-rpc-digests.js');
              const { RKAT_RPC_DIGESTS: table } = await import(pinned.href);
              for (const [target, entry] of Object.entries(table.archives)) {
                sdk.MeerkatClient.pinnedArchive(sdk.CONTRACT_VERSION, target, entry.asset);
              }
              process.stdout.write(JSON.stringify({ contract_version: sdk.CONTRACT_VERSION, digests: table }));
            " > "${RUNNER_TEMP}/typescript-sdk-binary-digests.json"
            python3 "${GITHUB_WORKSPACE}/scripts/release-stamp-sdk-binary-digests" verify \
              --release-tag "${RELEASE_TAG}" \
              --expected "${RUNNER_TEMP}/sdk-binary-digests.json" \
              --actual "${RUNNER_TEMP}/typescript-sdk-binary-digests.json"
          fi
          cd "${GITHUB_WORKSPACE}/sdks/typescript"
          rm -rf "$SMOKE_DIR" "$PACKFILE"
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - name: Enforce the 30 minute Rust publication SLO
        if: >-
          ${{
            !cancelled() &&
            steps.rust_crates_public.outcome == 'success'
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}"
          release_sha="$(git rev-parse HEAD)"
          tag_run_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=push&head_sha=${release_sha}&per_page=100")"
          tag_pushed_at="$(jq -r \
            --arg release_tag "${release_tag}" \
            --arg release_sha "${release_sha}" \
            '[.workflow_runs[] |
              select(.event == "push" and
                     .head_sha == $release_sha and
                     .head_branch == $release_tag)] |
             sort_by(.created_at) | first | .created_at // empty' \
            <<<"${tag_run_json}")"
          # Measured from the start of crate publication on the observations
          # the readback step recorded; tag-to-public latency is reported for
          # information. Recovery dispatches still verify every crate but
          # cannot re-enforce the original window.
          python3 scripts/verify-rust-release-public.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --observations-in "${RUNNER_TEMP}/rust-crates-public.json" \
            --window-started-at "${RUST_PUBLISH_STARTED_AT}" \
            ${tag_pushed_at:+--tag-pushed-at "${tag_pushed_at}"} \
            --slo-seconds ${{ github.event_name == 'workflow_dispatch' && '2147483647' || '1800' }}

  publish_web_sdk:
    name: Publish Web SDK package
    if: >-
      always() &&
      needs.require_ci_green.result == 'success' &&
      needs.registry_credentials_preflight.result == 'success' &&
      (needs.release_validate_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_web_sdk_only == 'true' &&
        needs.release_validate_gate.result == 'skipped')) &&
      (needs.release_semver_gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_web_sdk_only == 'true' &&
        needs.release_semver_gate.result == 'skipped')) &&
      (needs.build_web_sdk_package.result == 'success' ||
       needs.release_prebuild.outputs.run_id != '' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.web_sdk_artifact_run_id != '')) &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_release_packages == 'true' &&
        github.event.inputs.alpha_crates_only != 'true'))
    # A tag publishes @rkat/web only after release validation and the semver
    # gate passed, whether the package was built here or reused from a
    # prebuild; only the Web-SDK-only recovery skips both gates.
    needs: [require_ci_green, release_validate_gate, release_semver_gate, build_web_sdk_package, registry_credentials_preflight, release_prebuild]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Bind helper scripts and package metadata to the same release as
          # the artifact, even when a later main dispatches the recovery job.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # A reused package comes from an earlier run of this workflow, whose
      # own release.yml decided what it built and stamped, so that run is
      # pinned to a trusted workflow version: this repository's release.yml
      # run either at the release commit (the tag push, or a dispatch on the
      # tag) or by a dispatch on main at a commit in main's history; never a
      # pull request or any other branch. Its Require green CI job must have
      # passed and, for a tag push, also its release validation and semver
      # gates. These are the run checks of
      # scripts/verify-release-asset-provenance --source-run, without its
      # attestations: release archives carry attested stamps, while the Web
      # SDK stamp is a plain file, which the pinned workflow version vouches
      # for. The stamp check below binds the package to this release's commit.
      - name: Verify Web SDK artifact source run
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.web_sdk_artifact_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.inputs.web_sdk_artifact_run_id }}
          RELEASE_SHA: ${{ needs.require_ci_green.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN}" =~ ^[0-9]+$ ]] || { echo "web_sdk_artifact_run_id must be a run id: ${SOURCE_RUN}" >&2; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Require green CI reported no release commit (${RELEASE_SHA:-empty})" >&2; exit 1; }
          run_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" \
            --jq '[.path, .event, .repository.full_name, .head_branch, .head_sha] | @tsv')"
          IFS=$'\t' read -r run_path run_event run_repo run_branch run_sha <<<"${run_meta}"
          if [[ "${run_path}" != ".github/workflows/release.yml" || "${run_repo}" != "${GITHUB_REPOSITORY}" ]] ||
            [[ "${run_event}" != "push" && "${run_event}" != "workflow_dispatch" ]]; then
            echo "run ${SOURCE_RUN} is not a release.yml push or workflow_dispatch run of ${GITHUB_REPOSITORY} (path=${run_path} event=${run_event} repo=${run_repo})" >&2
            exit 1
          fi
          if [[ "${run_sha}" == "${RELEASE_SHA}" ]]; then
            pinned="at the release commit ${run_sha}"
          elif [[ "${run_event}" == "workflow_dispatch" && "${run_branch}" == "main" ]]; then
            main_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${run_sha}...main" --jq .status)"
            if [[ "${main_status}" != "identical" && "${main_status}" != "ahead" ]]; then
              echo "run ${SOURCE_RUN} dispatched main at ${run_sha}, which is not in main's history (compare status ${main_status})" >&2
              exit 1
            fi
            pinned="dispatched on main at ${run_sha}, in main's history"
          else
            echo "run ${SOURCE_RUN} ran release.yml from ${run_branch} at ${run_sha}: neither the release commit ${RELEASE_SHA} nor a dispatch on main" >&2
            exit 1
          fi
          run_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/jobs?per_page=100" --paginate \
            --jq '.jobs[] | [.name, (.conclusion // "none")] | @tsv')"
          required=("Require green CI")
          if [[ "${run_event}" == "push" ]]; then
            required+=("Release validation gate" "Breaks declared and notes stamped")
          fi
          for job in "${required[@]}"; do
            conclusion="$(awk -F'\t' -v job="${job}" '$1 == job { print $2 }' <<<"${run_jobs}")"
            if [[ "${conclusion}" != "success" ]]; then
              echo "run ${SOURCE_RUN}: ${job} did not succeed (${conclusion:-absent})" >&2
              exit 1
            fi
          done
          echo "source run ${SOURCE_RUN}: release.yml ${run_event} run ${pinned}; passed: $(printf '%s, ' "${required[@]}" | sed 's/, $//')"

      - name: Download Web SDK package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rkat-web-package
          path: web-sdk-package
          run-id: >-
            ${{
              needs.release_prebuild.outputs.run_id != '' &&
              needs.release_prebuild.outputs.run_id ||
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.web_sdk_artifact_run_id != '' &&
              github.event.inputs.web_sdk_artifact_run_id ||
              github.run_id
            }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The package must have been built from this checkout, the commit
      # Require green CI passed: the build job's stamp names its checkout,
      # and the tarball must be the stamped one and carry this checkout's
      # package name and version. An artifact without a stamp (built before
      # stamping) is refused.
      - name: Verify Web SDK package source
        env:
          RELEASE_SHA: ${{ needs.require_ci_green.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          head="$(git rev-parse HEAD)"
          stamp=web-sdk-package/rkat-web-package.json
          [[ -f "${stamp}" ]] || { echo "the Web SDK artifact carries no source stamp (${stamp})" >&2; exit 1; }
          tarballs=(web-sdk-package/rkat-web-*.tgz)
          [[ "${#tarballs[@]}" -eq 1 ]] || { echo "expected one rkat-web tarball, found ${#tarballs[@]}" >&2; exit 1; }
          tarball="${tarballs[0]}"
          stamp_commit="$(jq -er .commit "${stamp}")"
          stamp_package="$(jq -er .package "${stamp}")"
          stamp_tarball="$(jq -er .tarball "${stamp}")"
          stamp_sha256="$(jq -er .tarball_sha256 "${stamp}")"
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Require green CI reported no release commit (${RELEASE_SHA:-empty})" >&2; exit 1; }
          if [[ "${stamp_commit}" != "${RELEASE_SHA}" || "${RELEASE_SHA}" != "${head}" ]]; then
            echo "Web SDK package source mismatch: stamp ${stamp_commit}, Require green CI ${RELEASE_SHA}, checkout ${head}" >&2
            exit 1
          fi
          tarball_sha256="$(sha256sum "${tarball}" | cut -d' ' -f1)"
          if [[ "$(basename "${tarball}")" != "${stamp_tarball}" || "${tarball_sha256}" != "${stamp_sha256}" ]]; then
            echo "tarball $(basename "${tarball}") (sha256 ${tarball_sha256}) is not the stamped ${stamp_tarball} (${stamp_sha256})" >&2
            exit 1
          fi
          expected="$(jq -r '.name + "@" + .version' sdks/web/package.json)"
          packed="$(tar -xzOf "${tarball}" package/package.json | jq -r '.name + "@" + .version')"
          if [[ "${packed}" != "${expected}" || "${stamp_package}" != "${expected}" ]]; then
            echo "package mismatch: tarball ${packed}, stamp ${stamp_package}, sdks/web/package.json ${expected}" >&2
            exit 1
          fi
          echo "Web SDK package ${expected} built from ${head} (sha256 ${tarball_sha256})"

      # A package from the tag commit's pre-tag prebuild must be attested by
      # release.yml at exactly this commit on refs/heads/main (the prebuild
      # ran there) and pack this release's version.
      - name: Verify the prebuilt Web SDK package
        if: ${{ needs.release_prebuild.outputs.run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(web-sdk-package/rkat-web-*.tgz)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "expected exactly one prebuilt @rkat/web package, found ${#packages[@]}" >&2
            exit 1
          fi
          release_sha="$(git rev-parse HEAD)"
          gh attestation verify "${packages[0]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${release_sha}" \
            --source-ref refs/heads/main \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            >/dev/null
          expected="$(node -p "require('./sdks/web/package.json').version")"
          packed="$(tar -xzOf "${packages[0]}" package/package.json | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).version))')"
          if [[ "${packed}" != "${expected}" ]]; then
            echo "prebuilt @rkat/web packs ${packed}, this release is ${expected}" >&2
            exit 1
          fi
          echo "Verified prebuilt @rkat/web ${packed}: attested by release.yml at ${release_sha} on refs/heads/main"

      - name: Publish Web SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MEERKAT_REGISTRY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release-publish-web-sdk-package.sh web-sdk-package/rkat-web-*.tgz
