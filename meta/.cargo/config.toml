# Meerkat 0.7's generated machine-authority code (MeerkatMachineMutator::apply
# and friends) allocates very large stack frames, especially in debug builds.
# Upstream meerkat carries the same workspace-wide workaround (see meerkat's
# .cargo/config.toml) and sizes its rpc binary's tokio workers explicitly.
# Without this, meta debug test runs overflow the default 2 MiB tokio
# worker stacks inside meerkat-runtime's DSL apply path.
[env]
RUST_MIN_STACK = "16777216"
