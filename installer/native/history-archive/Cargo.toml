[package]
name = "forge-history-archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Bounded file retention only. No Core, Meta, Connect, process or caller types.
[workspace]

[dependencies]
serde = "=1.0.229"
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[lints.rust]
unsafe_code = "forbid"
