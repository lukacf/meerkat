name: Build Nextest archive
description: Build one canonical Meerkat test family and optionally publish its portable archive.

inputs:
  family:
    description: Canonical archive family.
    required: true
  publish:
    description: Upload the archive for execution on another runner.
    required: false
    default: "true"
  reuse_exact_ci:
    description: Reuse a digest-verified unit-mob archive from successful CI at the identical commit.
    required: false
    default: "false"

outputs:
  path:
    description: Absolute path to the built archive on this runner.
    value: ${{ steps.archive.outputs.path }}

runs:
  using: composite
  steps:
    - name: Restore exact-commit CI unit archive
      if: ${{ inputs.reuse_exact_ci == 'true' && inputs.family == 'unit-mob' }}
      id: reuse
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 scripts/restore-ci-unit-mob-archive.py \
          --repository "${GITHUB_REPOSITORY}" \
          --commit "${GITHUB_SHA}" \
          --current-run "${GITHUB_RUN_ID}" \
          --output "${RUNNER_TEMP}/nextest-unit-mob.tar.zst" >>"${GITHUB_OUTPUT}"

    - name: Build portable test archive
      id: archive
      shell: bash
      env:
        ARCHIVE_FAMILY: ${{ inputs.family }}
        ARCHIVE_REUSED: ${{ steps.reuse.outputs.reused }}
      run: |
        set -euo pipefail
        archive_path="${RUNNER_TEMP}/nextest-${ARCHIVE_FAMILY}.tar.zst"
        if [[ "${ARCHIVE_REUSED}" != "true" ]]; then
          scripts/ci-nextest-archive.sh build "${ARCHIVE_FAMILY}" "${archive_path}"
        fi
        ls -lh "${archive_path}"
        echo "path=${archive_path}" >>"${GITHUB_OUTPUT}"

    - name: Upload portable test archive
      if: ${{ inputs.publish == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: nextest-${{ inputs.family }}-${{ github.sha }}
        path: ${{ steps.archive.outputs.path }}
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 3
