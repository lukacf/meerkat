SPECIFICATION Spec
CONSTANTS
  BooleanValues = {TRUE, FALSE}
  ForkedParticipantActivationRejectionValues = {"NotReserved", "FingerprintMismatch", "MalformedActivation", "ActivationConflict", "CapabilityTerminal"}
  ForkedParticipantAttachDenialValues = {"AuthenticationInvalid", "NotActive", "MalformedAttachment", "Busy", "AttachmentAlreadyReleased", "Expired", "Revoked", "Exhausted"}
  ForkedParticipantCleanupRejectionValues = {"NotTerminal", "AttachmentOutstanding", "NoCleanupDebt"}
  ForkedParticipantCleanupStateValues = {"NotRequired", "Deferred", "Pending", "Complete"}
  ForkedParticipantExpiryIgnoreValues = {"NotExpired", "NotProvisioned", "AlreadyRecorded", "Terminal"}
  ForkedParticipantReleaseRejectionValues = {"NoActiveAttachment", "AttachmentMismatch"}
  ForkedParticipantReservationRejectionValues = {"MalformedRequest", "FingerprintConflict", "AlreadyProvisioned"}
  ForkedParticipantRevocationDenialValues = {"AuthenticationInvalid", "NotProvisioned", "AlreadyTerminal"}
  NatValues = {1}
  SetOfStringValues = {{}, {"alpha"}}
  StringValues = {"alpha"}
INVARIANTS
  reserved_capability_has_positive_max_uses
  use_count_within_max_uses
  granted_attachments_match_use_count
  active_holder_is_a_granted_attachment
  attachment_only_while_attached
  attached_phase_holds_one_attachment
  terminal_capability_is_detached
  cleanup_complete_requires_detached_terminal
  deferred_cleanup_requires_attachment
  empty_record_has_no_capability_facts
  pre_activation_record_has_no_grants
  usable_capability_has_fork_activation
CONSTRAINTS
  CiStateConstraint
