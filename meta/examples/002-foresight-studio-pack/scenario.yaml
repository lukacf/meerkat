scenario_id: foresight-studio
mission: >
  Decide whether fictional company Borealis Robotics should launch a field-service
  copiloting product for industrial maintenance teams in Q3.
default_prompt: >
  Run a board-readiness pass for the Borealis field-service copilot launch. First
  scan the signal lake, then ask at least two relevant peers for a challenge or
  evidence card, score the launch thesis, and finish with a concise board memo
  recommendation. Call out the strongest evidence, the largest unresolved risk,
  and the next validation sprint.

