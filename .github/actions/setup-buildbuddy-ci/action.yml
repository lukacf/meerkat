name: Setup BuildBuddy CI
description: Install the toolchain needed by optional BuildBuddy CI lanes.

inputs:
  profile:
    description: "Setup profile: submitter, native, doctor, lint, sdk, rust, wasm, audit, or full."
    required: false
    default: native
  repository-cache:
    description: >-
      Bazel external repository cache: 'true' restores it and, outside the
      gcp-buildbuddy backend, saves it when the job ends; 'restore' only
      restores it; 'false' neither restores nor saves it. The release binary
      build passes 'false' (its archives are attested), and a release
      validation dispatch 'restore' (a dispatch on main would save into the
      default branch's scope, which every tag run restores).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust
      if: ${{ inputs.profile == 'submitter' || inputs.profile == 'doctor' || inputs.profile == 'lint' || inputs.profile == 'sdk' || inputs.profile == 'rust' || inputs.profile == 'wasm' || inputs.profile == 'audit' || inputs.profile == 'native' || inputs.profile == 'full' }}
      uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0

    # Scripts from the action's own tree: release.yml's BuildBuddy binary
    # build runs this action from its tooling checkout (.release-tooling)
    # beside an older tag's checkout.
    - name: Pin Rust toolchain binaries
      if: ${{ inputs.profile == 'submitter' || inputs.profile == 'doctor' || inputs.profile == 'lint' || inputs.profile == 'sdk' || inputs.profile == 'rust' || inputs.profile == 'wasm' || inputs.profile == 'audit' || inputs.profile == 'native' || inputs.profile == 'full' }}
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: 1.97.0
      run: bash "${GITHUB_ACTION_PATH}/../../../scripts/ci-pin-rust-toolchain-env"

    - name: Add wasm32 target
      if: ${{ inputs.profile == 'wasm' || inputs.profile == 'full' }}
      shell: bash
      run: rustup target add --toolchain "${RUSTUP_TOOLCHAIN}" wasm32-unknown-unknown

    - name: Setup Python
      if: ${{ inputs.profile == 'sdk' || inputs.profile == 'full' }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.14"

    - name: Setup Node
      if: ${{ inputs.profile == 'doctor' || inputs.profile == 'lint' || inputs.profile == 'sdk' || inputs.profile == 'native' || inputs.profile == 'full' }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "22"

    - name: Setup Java
      if: ${{ inputs.profile == 'full' }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: 21

    - name: Cache cargo registry
      if: ${{ inputs.profile == 'lint' || inputs.profile == 'sdk' || inputs.profile == 'rust' || inputs.profile == 'wasm' || inputs.profile == 'audit' || inputs.profile == 'full' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        prefix-key: buildbuddy

    - name: Install lint tools
      if: ${{ inputs.profile == 'lint' }}
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
      with:
        tool: cargo-machete

    - name: Install wasm tools
      if: ${{ inputs.profile == 'wasm' }}
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
      with:
        tool: wasm-pack

    - name: Install audit tools
      if: ${{ inputs.profile == 'audit' }}
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
      with:
        tool: cargo-deny

    - name: Install full Rust CI tools
      if: ${{ inputs.profile == 'full' }}
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
      with:
        tool: nextest,wasm-pack,cargo-deny,cargo-machete

    - name: Install TLC
      if: ${{ inputs.profile == 'full' }}
      uses: ./.github/actions/setup-tlc-ci
      with:
        setup-java: "false"

    - name: Require BuildBuddy API key
      if: ${{ env.MEERKAT_BAZEL_BACKEND != 'gcp-local' }}
      shell: bash
      run: |
        if [[ -z "${BUILDBUDDY_API_KEY}" ]]; then
          echo "BUILDBUDDY_API_KEY secret is required for the optional BuildBuddy workflow." >&2
          exit 1
        fi

    - name: Install pinned BuildBuddy CLI
      shell: bash
      run: |
        bb_bin="$(bash "${GITHUB_ACTION_PATH}/../../../scripts/install-buildbuddy-cli" --dir "${RUNNER_TEMP}/buildbuddy-cli")"
        echo "$(dirname "${bb_bin}")" >> "${GITHUB_PATH}"

    - name: Restore Bazel external repositories
      if: ${{ inputs.repository-cache == 'restore' || (inputs.repository-cache == 'true' && env.MEERKAT_BAZEL_BACKEND == 'gcp-buildbuddy') }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/buildbuddy-repository-cache
        key: buildbuddy-bazel-repository-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          buildbuddy-bazel-repository-${{ runner.os }}-

    - name: Cache Bazel external repositories
      if: ${{ inputs.repository-cache == 'true' && env.MEERKAT_BAZEL_BACKEND != 'gcp-buildbuddy' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/buildbuddy-repository-cache
        key: buildbuddy-bazel-repository-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          buildbuddy-bazel-repository-${{ runner.os }}-
