[package]
name = "meerkat-auth-core"
description = "Shared auth primitives for Meerkat: TokenStore backends, RefreshCoordinator impls, OAuth2 helpers, generic cloud-IAM authorizers (AWS SigV4, Google ADC, Azure AD)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/azure_ad_authorizer.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/cloud_refresh_clock.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/cloud_refresh_readiness.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/connector_login_owner.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/connector_oauth_commit.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/connector_protocol_google.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/connector_protocol_providers.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/google_auth_authorizer.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/mcp_oauth_account_use.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/mcp_oauth_owner.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/token_lifecycle_clear.rs",
    # needs meerkat-runtime, which depends on this crate (a cyclic dev-dependency the package cannot carry)
    "tests/token_lifecycle_serialization.rs",
    # support modules of tests/mcp_oauth_account_use.rs
    "tests/mcp_oauth_account_use_support",
]

[dependencies]
meerkat-core = { workspace = true }
meerkat-llm-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
indexmap = "2"
base64 = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }

# Optional: OS keychain TokenStore.
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "linux-native"] }
# Optional: cross-process refresh lockfile.
fs4 = { version = "0.13", optional = true }
# Optional: generic OAuth2 helpers (PKCE / callback / device-code / token-exchange).
oauth2 = { version = "5", optional = true }
jsonwebtoken = { version = "9", optional = true, default-features = false, features = ["use_pem"] }
axum = { workspace = true, optional = true }
urlencoding = { version = "2", optional = true }
# Optional: AWS SigV4 for Bedrock-style backends. Provider crates activate this via their own features.
aws-sigv4 = { version = "1", optional = true, features = ["http1"] }
aws-credential-types = { version = "1", optional = true }
aws-config = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio", "credentials-process", "sso"] }
aws-types = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }
aws-smithy-eventstream = { version = "0.61", optional = true }
aws-smithy-types = { version = "1", optional = true }
http = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }

# Optional: the macOS keychain status codes behind keyring's platform errors
# (a user denial and a refused interaction are told apart from backend absence).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[dev-dependencies]
# Enables `workspace-tests` for this crate's own tests; path-only, so the
# published package does not carry it. It adds nothing else: with default
# features on, every test build would turn them back on, and a
# `--no-default-features` test build would not check the feature set it
# names.
meerkat-auth-core = { path = ".", default-features = false, features = ["workspace-tests"] }
meerkat-runtime = { path = "../meerkat-runtime", default-features = false, features = ["sqlite-store"] } # path-only (no version): breaks packaging dev-dep cycle; SQLite exercises the actual durable flow owner
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }
schemars = { workspace = true }
axum = { workspace = true }

[features]
default = ["oauth", "keyring", "file-lock"]
keyring = ["dep:keyring", "dep:security-framework"]
file-lock = ["dep:fs4"]
oauth = ["dep:oauth2", "dep:jsonwebtoken", "dep:urlencoding", "dep:axum"]
aws-sigv4 = [
    "dep:aws-sigv4",
    "dep:aws-credential-types",
    "dep:aws-config",
    "dep:aws-types",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-eventstream",
    "dep:aws-smithy-types",
    "dep:http",
    "dep:sha2",
    "dep:hex",
]
gcp-auth = ["dep:jsonwebtoken", "dep:urlencoding"]
azure-ad = ["dep:urlencoding"]
# Internal, not for consumers: compiles the unit tests that need the
# workspace (a crate this one cannot depend on once published). Only the
# path-only self dev-dependency enables it, and `cargo package` strips that
# dev-dependency, so the published package compiles those tests out
# (ci/standalone-workspace-only.toml names them).
workspace-tests = []

[package.metadata.cargo-machete]
ignored = [
    "aws-config",
    "aws-smithy-eventstream",
    "aws-smithy-runtime-api",
    "aws-smithy-types",
    "aws-types",
    "hex",
    "sha2",
    "getrandom",
    "http",
    "indexmap",
    "schemars",
    "tokio_with_wasm",
    "tracing",
]

[lints]
workspace = true
