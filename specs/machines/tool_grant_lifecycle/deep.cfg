SPECIFICATION Spec
CONSTANTS
  NatValues = {0, 1, 2}
  StringValues = {"alpha", "beta"}
  ToolGrantEndReasonValues = {"Deadline", "Revoked"}
  ToolGrantIssueRefusalValues = {"InvalidWindow", "AlreadyIssued"}
  ToolGrantUseRefusalValues = {"Expired", "Revoked"}
