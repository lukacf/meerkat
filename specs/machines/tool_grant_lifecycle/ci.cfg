SPECIFICATION Spec
CONSTANTS
  NatValues = {1}
  StringValues = {"alpha"}
  ToolGrantEndReasonValues = {"Deadline", "Revoked", "RunEnded", "SubjectEnded"}
  ToolGrantIssueRefusalValues = {"InvalidWindow", "AlreadyIssued"}
  ToolGrantRunIdValues <- ToolGrantRunIdValuesCi
  ToolGrantUseRefusalValues = {"Expired", "Revoked", "RunEnded", "OutsideRun", "SubjectEnded"}
INVARIANTS
  unissued_is_empty
  issued_window_is_nonempty
  active_has_no_end
  ended_grants_record_their_end
  expiry_never_precedes_its_deadline
  revocation_precedes_the_deadline
  run_ended_records_its_end
  run_scope_set_only_by_issue
CONSTRAINTS
  CiStateConstraint
