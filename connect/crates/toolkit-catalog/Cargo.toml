[package]
name = "toolkit-catalog"
version = "0.9.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.release]
# Core's `cargo release` (shared version, tag v{{version}}) must never bump
# this crate: its product releases on a version line of its own
# (ci/products.json).
release = false

[dependencies]
meerkat-machine-dsl.workspace = true
meerkat-machine-schema.workspace = true
meerkat-machine-codegen.workspace = true
indexmap.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
