SPECIFICATION Spec
CONSTANTS
  BooleanValues = {TRUE, FALSE}
  NatValues = {0, 1, 2}
  StringValues = {"alpha", "beta"}
  TemporaryCouncilAdvanceRejectionValues = {"NotOpened", "AlreadyAdvanced"}
  TemporaryCouncilClaimDenialValues = {"MalformedClaim", "NotOpened", "HeldByAnotherCoordinator", "AlreadySettled"}
  TemporaryCouncilCleanupRejectionValues = {"ResultNotSealed", "AlreadySettled"}
  TemporaryCouncilExitClassValues = {"Unsealed", "Executed", "CoordinatorInterrupted"}
  TemporaryCouncilOpenRejectionValues = {"MalformedRequest", "FingerprintConflict"}
  TemporaryCouncilSealRejectionValues = {"NotOpened", "NotMerging", "AlreadySealed"}
INVARIANTS
  empty_record_has_no_council_facts
  opened_record_is_fingerprint_bound
  sealed_phase_has_exit_class
  unsealed_phase_has_no_exit_class
  cleanup_attempts_require_a_sealed_result
  debt_and_settlement_have_attempts
  claim_identity_and_epoch_agree
  only_a_bound_record_is_claimable
CONSTRAINTS
  DeepStateConstraint
