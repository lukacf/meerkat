[package]
name = "meerkat-decision"
description = "Batched semantic decision service (binary, choose-one, grade judgments) for Meerkat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
meerkat-capabilities = { workspace = true }
meerkat-core = { workspace = true }
async-trait = { workspace = true }
indexmap = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true, optional = true, features = ["indexmap2"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
reqwest = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }

[features]
default = ["jev"]
# Jev (TypeSafe) evaluation backend. Native only: the adapter is an HTTP client.
jev = ["dep:reqwest"]
schema = ["dep:schemars"]

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
