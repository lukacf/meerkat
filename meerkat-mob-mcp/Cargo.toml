[package]
name = "meerkat-mob-mcp"
description = "Shared Mob host integration with MCP surface adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "rkat-mob-mcp"
path = "src/main.rs"

[dependencies]
meerkat-core = { workspace = true }
meerkat-contracts = { workspace = true, features = ["schema"] }
meerkat = { workspace = true, default-features = false }
meerkat-live = { workspace = true, optional = true }
meerkat-mob = { workspace = true }
meerkat-runtime = { workspace = true }
meerkat-session = { workspace = true }
meerkat-client = { workspace = true }
async-trait = { workspace = true }
indexmap = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
sha2 = { workspace = true }
jsonschema = { workspace = true }

[features]
default = []
experimental-gpt-live = [
    "meerkat/experimental-gpt-live",
    "meerkat-mob/experimental-gpt-live",
    "dep:meerkat-live",
]
experimental-gpt-live-gate0-harness = [
    "experimental-gpt-live",
    "meerkat/experimental-gpt-live-gate0-harness",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile = { workspace = true }
meerkat-mob = { workspace = true, features = ["test-support"] }
meerkat-runtime = { workspace = true, features = ["test-support"] }
meerkat-schedule = { workspace = true }
meerkat-session = { workspace = true, features = ["session-store"] }
meerkat-store = { workspace = true, features = ["sqlite", "jsonl"] }
# The temporary-council fixture composes the production persistent session
# service over a Jsonl session store. Enabling `meerkat-store/jsonl` alone
# would add a `RealmBackend` variant the facade's own cfg-gated match does not
# cover, so the facade's matching feature is enabled with it.
meerkat = { workspace = true, features = ["session-store", "jsonl-store"] }

[package.metadata.cargo-machete]
ignored = ["chrono", "meerkat-client", "thiserror", "tempfile"]  # proc macros / transitive

[lints]
workspace = true
