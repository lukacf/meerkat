    name: Main unit tests (${{ matrix.name }})
    needs: [changes, main-unit-archive-build]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.rust_changed == 'true' && needs.changes.outputs.main_archive_run_count != '0' }}
