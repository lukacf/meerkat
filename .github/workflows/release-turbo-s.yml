name: Release Turbo S

on:
  workflow_dispatch:

concurrency:
  group: release-turbo-s
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  turbo-s:
    name: Exact-main BuildBuddy Turbo S
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      MEERKAT_CLEAN_E2E_SCENARIO_TARGETS: "1"
    steps:
      - name: Refuse non-main release evidence
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Release Turbo S must run against exact main, not ${GITHUB_REF}."
            exit 1
          fi

      - name: Require credentialed release inputs
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for key in \
            BUILDBUDDY_API_KEY \
            ANTHROPIC_API_KEY \
            OPENAI_API_KEY \
            GEMINI_API_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Required repository secret ${key} is not configured."
              exit 1
            fi
          done

      - name: Checkout exact main
        uses: actions/checkout@v6

      - name: Setup BuildBuddy submitter
        uses: ./.github/actions/setup-buildbuddy-ci
        with:
          profile: submitter

      - name: Run Turbo S on BuildBuddy
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          provider_overrides="ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY},OPENAI_API_KEY=${OPENAI_API_KEY},GEMINI_API_KEY=${GEMINI_API_KEY}"
          echo "::add-mask::${provider_overrides}"
          unset ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY
          # One attempt per scenario (no Bazel retry); the typed verdict
          # separates real failures from provider-degraded void runs.
          set +e
          MEERKAT_BUILDBUDDY_SECRET_ENV_OVERRIDES="${provider_overrides}" \
            scripts/buildbuddy-dev e2e-smoke-turbo-s 2>&1 | tee turbo-s.log
          bazel_exit=${PIPESTATUS[0]}
          set -e
          scripts/live-gate-verdict turbo-s.log "$bazel_exit" | tee turbo-s-verdict.txt
          verdict_exit=${PIPESTATUS[0]}
          {
            echo "## Release Turbo S"
            echo '```'
            cat turbo-s-verdict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verdict_exit"
