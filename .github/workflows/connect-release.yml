name: Connect release
# DRAFT for the 0.9.9 monorepo (Connect under connect/).
#
# Connect's own release line: tags connect-vX.Y.Z. Connect publishes no
# registry package: its products, gateway archives, wheel and npm tarball are
# GitHub release assets only, and its release is never "latest" (only Core's
# is). Adapted from lukacf/meerkat-connect's connect-candidate.yml and
# release/CONNECT-CANDIDATE.md, whose protocol is kept:
#   1. candidate (dispatch, one target per run): build and verify the native
#      product from the dispatched commit, then attest the original closure in
#      a separate job that never runs the product;
#   2. tag push connect-vX.Y.Z: validate only (exact-main CI green, awaited
#      for up to 120 minutes; the tag names the Connect version; Connect's
#      published-floor check, which first awaits Core's and Meta's crates on
#      crates.io for up to 120 minutes), then create the release object as a
#      full release that is not latest. The tag may therefore be pushed with
#      Core's and Meta's tags;
#   3. accept (dispatch): bounded, data-only acceptance of one attested
#      candidate against the Meta reader, which in the monorepo is the in-tree
#      meta/ at the same commit; the owner selects the printed acceptance
#      SHA-256;
#   4. publish (dispatch): `publish-accepted` adds exactly the accepted three
#      assets to that release, never replacing one.
# macOS executables, built the way Meta's gateways are (meta-release.yml's
# build_binaries: Cargo on a GitHub-hosted macos-15 runner, architecture
# check, --version smoke run, ad-hoc signing, one archive per executable,
# build provenance):
#   - tag push: build_macos builds meerkat-connect and toolkit_gateway for
#     aarch64-apple-darwin from the tag's commit beside the gates above (it
#     waits for none and writes nothing outside its run); once the release
#     object exists, publish_macos adds the two archives, their checksum
#     files and the provenance bundle to it, never replacing one;
#   - `macos-build` (dispatch): the same build and checks of the dispatched
#     commit; publishes nothing (the rehearsal);
#   - `macos-assets` (dispatch): builds an existing tag's commit and adds the
#     same files to that tag's existing release (add-only recovery).
#   These archives hold the executables only. They are built without a
#   resource digest, so they are not the complete installation the
#   linux-x86_64 archives are (bundled Python, Node/npm, integration library
#   and setup resources), which the release owner's producer builds.
#   To add a target, add its row to build_macos's matrix, its architecture to
#   the check, and the triple to TARGETS in
#   scripts/connect_release_macos_assets.py.
# The complete macOS arm64 installation (the executables with the bundled
# Python, Node/npm, integration library and setup resources), stage one:
#   - `macos-stage` (dispatch): two hosted macos-15 jobs call the producer
#     (connect/scripts/connect-candidate.py macos <step>) once per step from
#     the dispatched commit. stage_macos_build fetches the pinned public
#     inputs (connect/scripts/fetch-pinned-inputs.py: the committed pin file
#     plus the crate rows derived from Cargo.lock), builds the library, the
#     resources and the two executables with the resource digest;
#     stage_macos_check builds the test executables, runs the installed
#     checks and uploads the stage record as a workflow artifact. Nothing is
#     published: no release, no tag, no token, no provider key. The stage
#     record is read, scanned and reviewed outside the workflow before
#     anything is assembled for a release (release/CONNECT-CANDIDATE.md).
# Prerequisites (connect-candidate-monorepo patch): connect-candidate.py names
# lukacf/meerkat and this workflow; after the workspace wire-up it must build
# meerkat-connect from the root workspace instead of native-candidate/.

"on":
  push:
    tags:
      - "connect-v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "candidate: build one target; accept: accept an attested candidate; publish: add accepted assets; macos-build: build and check the macOS executables, publish nothing; macos-assets: build an existing tag's macOS executables and add them to its release; macos-stage: stage the complete macOS installation as a workflow artifact, publish nothing"
        required: true
        type: choice
        options: [candidate, accept, publish, macos-build, macos-assets, macos-stage]
      release_tag:
        description: macos-assets only - the existing connect-vX.Y.Z tag whose release gets the macOS executables
        required: false
        default: ""
        type: string
      rkat_release_tag:
        description: macos-stage only - Core's published release tag (vX.Y.Z) whose rkat archive the consumer check runs; empty builds rkat from the dispatched commit
        required: false
        default: ""
        type: string
      target:
        description: Native target (candidate and accept modes)
        required: false
        type: choice
        options: [linux-x86_64, macos-arm64]
      source_sha:
        description: Candidate only - exact dispatched commit (40 lowercase hex)
        required: false
        default: ""
        type: string
      inputs_sha256:
        description: Candidate only - SHA-256 of the target's release input JSON at that commit
        required: false
        default: ""
        type: string
      candidate_run_id:
        description: Accept only - run id of the attested candidate
        required: false
        default: ""
        type: string
      publication_request:
        description: Accept only - the ten-field publication request JSON (release/CONNECT-CANDIDATE.md)
        required: false
        default: ""
        type: string
      acceptance_run_id:
        description: Publish only - run id of the accept run
        required: false
        default: ""
        type: string
      acceptance_sha256:
        description: Publish only - the owner-selected SHA-256 of acceptance.json
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: connect-release-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Connect release mode and version
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Connect's version line: its crates carry an explicit version after
          # the workspace wire-up (meerkat-connect's manifest); in the
          # transition it is native-candidate's workspace version.
          version="$(python3 - <<'PY'
          import pathlib, tomllib
          crate = tomllib.loads(pathlib.Path("connect/crates/meerkat-connect/Cargo.toml").read_text())["package"]["version"]
          if isinstance(crate, str):
              print(crate)
          else:
              native = tomllib.loads(pathlib.Path("connect/native-candidate/Cargo.toml").read_text())
              print(native["workspace"]["package"]["version"])
          PY
          )"
          # source_ref is what build_macos checks out: the pushed tag, the
          # dispatched commit of a build-only run, or the existing tag an
          # asset recovery names (whose version is the tag's, not this
          # checkout's).
          if [[ "${EVENT}" == "push" ]]; then
            mode=tag
            tag="${REF#refs/tags/}"
            if [[ "${tag}" != "connect-v${version}" ]]; then
              echo "::error::tag ${tag} does not name the Connect version ${version} (expected connect-v${version})" >&2
              exit 1
            fi
            source_ref="${REF}"
          elif [[ "${MODE}" == "macos-assets" ]]; then
            mode="${MODE}"
            tag="${RELEASE_TAG}"
            if [[ ! "${tag}" =~ ^connect-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::macos-assets needs release_tag, an existing connect-vX.Y.Z tag; got '${tag}'" >&2
              exit 1
            fi
            version="${tag#connect-v}"
            source_ref="refs/tags/${tag}"
          else
            if [[ -n "${RELEASE_TAG}" ]]; then
              echo "::error::release_tag is only valid for macos-assets (mode ${MODE})" >&2
              exit 1
            fi
            mode="${MODE}"
            tag="connect-v${version}"
            source_ref="${GITHUB_SHA}"
          fi
          {
            echo "mode=${mode}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "source_ref=${source_ref}"
          } >> "${GITHUB_OUTPUT}"
          echo "Connect ${version}: mode ${mode}, tag ${tag}, source ${source_ref}"

  # Waits (bounded) rather than refuses: the tagged commit's exact-main CI
  # (ci.yml on main) must be green. The gate polls every 30 seconds for up
  # to 120 minutes, the way release.yml's gate does; a red or cancelled run
  # keeps it polling, because a green re-run attempt counts. So the Connect
  # tag can be pushed with Core's and Meta's, before CI at the commit is done.
  require_ci_green:
    name: Require green exact-main CI
    needs: [resolve]
    if: needs.resolve.outputs.mode == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for green exact-main CI at this commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.sha;
            const timeoutMs = 120 * 60 * 1000;
            const pollMs = 30 * 1000;
            const started = Date.now();
            let cancelledReported = false;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "ci.yml", branch: "main", event: "push", head_sha: ref, per_page: 100,
              });
              const runs = data.workflow_runs.filter(
                (run) => run.head_sha === ref && run.head_branch === "main" && run.event === "push"
              );
              if (runs.length > 0) {
                core.info(
                  runs
                    .map((run) => `CI attempt ${run.run_attempt}: ${run.status}/${run.conclusion || "pending"} (${run.html_url})`)
                    .join("\n")
                );
              } else {
                core.info(`No exact-main CI run found yet for Connect release commit ${ref}`);
              }
              const success = runs.find((run) => run.status === "completed" && run.conclusion === "success");
              if (success) {
                core.info(`Connect release commit ${ref} has green exact-main CI: ${success.html_url}`);
                return;
              }
              // ci.yml lets a newer main commit cancel an older commit's
              // first attempt unless the commit names a release; it never
              // cancels a re-run attempt, so re-running recovers.
              const cancelled = runs.find((run) => run.status === "completed" && run.conclusion === "cancelled");
              if (cancelled && !cancelledReported) {
                cancelledReported = true;
                core.warning(
                  `Exact-main CI at ${ref} was cancelled: ${cancelled.html_url}. ` +
                    `Re-run it with: gh run rerun ${cancelled.id} --repo ${owner}/${repo}`
                );
              }
              if (Date.now() - started >= timeoutMs) {
                core.setFailed(
                  `Connect release commit ${ref} has no green exact-main CI after 120 minutes (${runs.length} run(s)).`
                );
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

  # Connect's published floor: copies of its manifests with path dependencies
  # dropped (Connect publishes no crate) resolve Core and Meta from crates.io
  # at the versions they declare, and build. Required for a Connect release.
  # It first waits (bounded, 120 minutes) until every crate of Core's publish
  # list and of Meta's publish order is in the sparse index at the declared
  # versions, so the tag may be pushed before Core and Meta are published;
  # the job's timeout covers that wait plus the 90-minute build.
  floor_check:
    name: Connect published-floor check
    needs: [resolve, require_ci_green]
    if: needs.resolve.outputs.mode == 'tag' && needs.require_ci_green.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
      - name: Read the Core and Meta versions Connect declares
        id: declared
        shell: bash
        run: |
          set -euo pipefail
          versions="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c '
          import json, os, re, sys
          metadata = json.load(sys.stdin)
          root = metadata["workspace_root"]
          connect = [p for p in metadata["packages"]
                     if os.path.relpath(p["manifest_path"], root).replace(os.sep, "/").startswith("connect/")]
          if not connect:
              sys.exit("no Connect package in the workspace metadata")
          def declared(name):
              reqs = {d["req"] for p in connect for d in p["dependencies"] if d["name"] == name}
              exact = [r[1:] for r in reqs if re.fullmatch(r"=[0-9]+\.[0-9]+\.[0-9]+", r)]
              if len(exact) != 1 or len(reqs) != 1:
                  sys.exit(f"Connect declares {name} as {sorted(reqs)}; expected one exact =X.Y.Z")
              return exact[0]
          print(declared("meerkat-core"), declared("meerkat-meta"))
          ')"
          read -r core_version meta_version <<<"${versions}"
          echo "core_version=${core_version}" >> "${GITHUB_OUTPUT}"
          echo "meta_version=${meta_version}" >> "${GITHUB_OUTPUT}"
          echo "Connect declares Core ${core_version} and Meta ${meta_version}"
      - name: Wait until every Core and Meta crate is on crates.io at the declared versions
        shell: bash
        env:
          CORE_VERSION: ${{ steps.declared.outputs.core_version }}
          META_VERSION: ${{ steps.declared.outputs.meta_version }}
        run: |
          set -euo pipefail
          mapfile -t core_crates < <(scripts/release-rust-crates.sh)
          mapfile -t meta_crates < <(jq -r '.products[] | select(.name == "meta") | .publish_order[]' ci/products.json)
          if [[ ${#core_crates[@]} -eq 0 || ${#meta_crates[@]} -eq 0 ]]; then
            echo "::error::Core's publish list (${#core_crates[@]} crates) or Meta's publish order (${#meta_crates[@]} crates) is empty" >&2
            exit 1
          fi
          wanted=()
          for crate in "${core_crates[@]}"; do wanted+=("${crate}@${CORE_VERSION}"); done
          for crate in "${meta_crates[@]}"; do wanted+=("${crate}@${META_VERSION}"); done
          # The sparse index path of a crate name (lowercase).
          index_path() {
            local name="${1,,}"
            case "${#name}" in
              1) echo "1/${name}" ;;
              2) echo "2/${name}" ;;
              3) echo "3/${name:0:1}/${name}" ;;
              *) echo "${name:0:2}/${name:2:2}/${name}" ;;
            esac
          }
          deadline=$(( $(date +%s) + 7200 ))
          pending=("${wanted[@]}")
          while :; do
            missing=()
            for entry in "${pending[@]}"; do
              crate="${entry%@*}"
              version="${entry##*@}"
              if ! curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' \
                  "https://index.crates.io/$(index_path "${crate}")" \
                  | jq -es --arg v "${version}" 'any(.[]; .vers == $v)' >/dev/null 2>&1; then
                missing+=("${entry}")
              fi
            done
            if [[ ${#missing[@]} -eq 0 ]]; then
              break
            fi
            if (( $(date +%s) >= deadline )); then
              echo "::error::${#missing[@]} of ${#wanted[@]} Core and Meta crates are not on crates.io after 120 minutes (${missing[*]}); publish Core and Meta first" >&2
              exit 1
            fi
            echo "waiting for ${#missing[@]} of ${#wanted[@]} Core and Meta crates in the crates.io index: ${missing[*]}"
            pending=("${missing[@]}")
            sleep 30
          done
          echo "every Core crate (${#core_crates[@]}) at ${CORE_VERSION} and Meta crate (${#meta_crates[@]}) at ${META_VERSION} is on crates.io"
      - name: Build Connect against published Core and Meta
        run: python3 scripts/published_crates_standalone.py floor --product connect --mode release --out "${RUNNER_TEMP}/connect-floor"

  create_release:
    name: Create the Connect release (not latest)
    needs: [resolve, require_ci_green, floor_check]
    if: >-
      needs.resolve.outputs.mode == 'tag' &&
      needs.require_ci_green.result == 'success' &&
      needs.floor_check.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the release object for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG}: release exists; nothing to create"
            exit 0
          fi
          # A full release that is not latest: Core's release stays latest. The
          # assets arrive later: publish-accepted adds a hosted candidate's, and
          # the release owner uploads a direct (retained-host) production's.
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --latest=false --title "Meerkat Connect ${TAG#connect-v}" \
            --notes "Meerkat Connect ${TAG#connect-v}. RELEASE-MANIFEST.json and SHA256SUMS name each asset and how it was produced."

  # The macOS executables, built the way Meta's gateway legs are
  # (meta-release.yml build_binaries): Cargo through the repository wrapper on
  # a GitHub-hosted Apple silicon runner, then Meta's checks and its ad-hoc
  # signing step, one archive per executable, build provenance. The package,
  # features and profile are the ones the release owner's Linux producer
  # builds with. No resource digest is compiled in (see the header), so
  # these executables refuse every step that needs the bundled resources.
  # It needs only the resolver: on a tag it runs beside the gates and writes
  # nothing outside its run; publish_macos adds its archives after them.
  build_macos:
    name: Build macOS executables (${{ matrix.target }})
    needs: [resolve]
    if: >-
      needs.resolve.outputs.mode == 'tag' ||
      needs.resolve.outputs.mode == 'macos-build' ||
      needs.resolve.outputs.mode == 'macos-assets'
    runs-on: ${{ matrix.runs-on }}
    # A bound, not an estimate: no hosted macOS build of these two
    # executables has been measured. Meta's three gateways took 78 minutes on
    # this label at its lighter release-meta profile.
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          persist-credentials: false

      # The archives name the release version and are attested by this run:
      # refuse a checkout that is not the tag's commit (or, for a build-only
      # run, the dispatched commit) or whose crate is another version.
      - name: Check that the checkout is the release source at the release version
        shell: bash
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "${MODE}" == "macos-build" ]]; then
            origin="the dispatched commit"
            expected="${GITHUB_SHA}"
          else
            origin="the ${TAG} commit"
            if ! expected="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
              git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
              expected="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
            fi
          fi
          if [[ "${head}" != "${expected}" ]]; then
            echo "::error::checked-out commit ${head} is not ${origin} ${expected}" >&2
            exit 1
          fi
          crate_version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' connect/crates/meerkat-connect/Cargo.toml)"
          if [[ "${crate_version}" != "${VERSION}" ]]; then
            echo "::error::meerkat-connect at ${head} is version ${crate_version:-unknown}, not the release version ${VERSION}" >&2
            exit 1
          fi
          echo "building Connect ${VERSION} for ${TARGET} from ${origin} ${head}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          targets: ${{ matrix.target }}

      # CARGO_BUILD_JOBS as in Meta's legs: two rustc processes bound the
      # memory the largest crates need together on a hosted runner.
      - name: Build the executables
        shell: bash
        env:
          CARGO_TARGET_DIR: target
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          env -u MEERKAT_CONNECT_RESOURCES_SHA256 ./scripts/repo-cargo build --locked --release \
            --target "${TARGET}" -p meerkat-connect \
            --features meerkat-connect/console,toolkit-mobkit/native-host \
            --bin meerkat-connect --bin toolkit_gateway

      - name: Verify macOS binary architecture
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET}" in
            aarch64-apple-darwin) expected="arm64" ;;
            *) echo "::error::no expected Mach-O architecture for ${TARGET}" >&2; exit 1 ;;
          esac
          file_pattern="^Mach-O 64-bit (executable ${expected}|${expected} executable)([^A-Za-z0-9_]|$)"
          for bin in meerkat-connect toolkit_gateway; do
            path="target/${TARGET}/release/${bin}"
            archs="$(/usr/bin/lipo -archs "${path}")"
            description="$(/usr/bin/file -b "${path}")"
            echo "${path}: lipo '${archs}'; file '${description}'"
            [[ "${archs}" == "${expected}" ]] || { echo "::error::${path} contains '${archs}', expected '${expected}'" >&2; exit 1; }
            [[ "${description}" =~ ${file_pattern} ]] || { echo "::error::${path} is '${description}'" >&2; exit 1; }
          done

      - name: Smoke-run the executables
        shell: bash
        run: |
          set -euo pipefail
          for bin in meerkat-connect toolkit_gateway; do
            output="$("target/${TARGET}/release/${bin}" --version)"
            echo "${bin}: ${output}"
            if [[ "${output}" != "${bin} ${VERSION}" && "${output}" != "${bin} ${VERSION} "* ]]; then
              echo "::error::${bin} --version printed '${output}'" >&2
              exit 1
            fi
          done

      # The signing step the Core and Meta macOS lanes apply: an ad-hoc
      # signature, no signing identity.
      - name: Ad-hoc codesign macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          for bin in meerkat-connect toolkit_gateway; do
            /usr/bin/codesign --force --sign - "target/${TARGET}/release/${bin}"
          done

      # One archive per executable, named as Core's and Meta's are
      # (<name>-<version>-<triple>.tar.gz) with the Linux assets' two name
      # prefixes, and a checksum file beside each, as the Linux archives have.
      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BINS=("meerkat-connect:meerkat-connect" "toolkit_gateway:meerkat-connect-gateway")
          for entry in "${BINS[@]}"; do
            bin="${entry%%:*}"; prefix="${entry##*:}"
            src="target/${TARGET}/release/${bin}"
            [[ -f "$src" ]] || { echo "::error::missing expected binary at $src" >&2; exit 1; }
            artifact="${prefix}-${VERSION}-${TARGET}.tar.gz"
            tar -czf "dist/${artifact}" -C "$(dirname "$src")" "$(basename "$src")"
            [[ -s "dist/${artifact}" ]] || { echo "::error::archive dist/${artifact} missing or empty" >&2; exit 1; }
            (cd dist && /usr/bin/shasum -a 256 "${artifact}" > "${artifact}.sha256")
            echo "packaged ${bin} -> dist/${artifact} ($(cut -d' ' -f1 "dist/${artifact}.sha256"))"
          done

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Retain original provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "dist/connect-${TARGET}-provenance.jsonl"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-macos-binaries-${{ matrix.target }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  # Adds exactly the files build_macos uploaded in this run to the release
  # create_release made, after the gates: add-only, see
  # scripts/connect_release_macos_assets.py. SHA256SUMS and
  # RELEASE-MANIFEST.json stay the release owner's files.
  publish_macos:
    name: Add the macOS executables to the Connect release
    needs: [resolve, create_release, build_macos]
    if: needs.resolve.outputs.mode == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout the workflow's own publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/connect_release_macos_assets.py
          sparse-checkout-cone-mode: false
      - name: Download this run's macOS archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'connect-macos-binaries-*' --dir "${RUNNER_TEMP}/macos-download"
      - name: Add exactly the built archives (never replacing one)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/connect_release_macos_assets.py --tag "${TAG}" --version "${VERSION}" \
            --download "${RUNNER_TEMP}/macos-download" --work "${RUNNER_TEMP}/macos-existing"

  # Asset recovery (dispatch, macos-assets): the same publisher for an
  # existing tag's existing release, after this run's own build of that tag.
  # It creates no release and no tag. Its steps are publish_macos's, byte for
  # byte (scripts/test_connect_release_workflow.py compares them).
  recover_macos:
    name: Add the macOS executables to an existing Connect release
    needs: [resolve, build_macos]
    if: needs.resolve.outputs.mode == 'macos-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout the workflow's own publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/connect_release_macos_assets.py
          sparse-checkout-cone-mode: false
      - name: Download this run's macOS archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'connect-macos-binaries-*' --dir "${RUNNER_TEMP}/macos-download"
      - name: Add exactly the built archives (never replacing one)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/connect_release_macos_assets.py --tag "${TAG}" --version "${VERSION}" \
            --download "${RUNNER_TEMP}/macos-download" --work "${RUNNER_TEMP}/macos-existing"

  # Stage one of the complete macOS arm64 installation (dispatch,
  # macos-stage). The producer runs one step per workflow step, so each has
  # its own log, time and failure. Its records bind absolute paths: the
  # checkout is the runner's default workspace and the work root a short
  # fixed directory (macOS allows 104 bytes for a Unix socket path, and the
  # installed checks keep theirs under the work root), the same two literals
  # in both jobs, and each job's first step refuses any other layout.
  # Network: the fetch step downloads the pinned public inputs and checks
  # each against its pin; Cargo downloads the crates Cargo.lock pins; the
  # library step's component build runs `npm ci` for the integrity-locked
  # packages of connect/sdk/activepieces/package-lock.json; two installed
  # checks read live public pages with a controlled model. No step holds a
  # token or a provider key, and nothing leaves the run but its artifacts
  # and the provenance attestation of the stage record's digest.
  stage_macos_build:
    name: Stage the complete macOS installation (library, resources, executables)
    needs: [resolve]
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.mode == 'macos-stage'
    runs-on: macos-15
    # A bound, not an estimate: no hosted run of these builds has been
    # measured. GitHub ends a hosted job at 360 minutes.
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      CONNECT_CHECKOUT: /Users/runner/work/meerkat/meerkat
      CONNECT_WORK: /private/tmp/cw
      CONNECT_PINS: /private/tmp/cw/pins
      CONNECT_RESOLVED_PINS: /private/tmp/cw/pins/library-pins-macos-arm64.resolved.json
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      work_artifact: ${{ steps.pack.outputs.work_artifact }}
    steps:
      - name: Checkout the dispatched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the runner layout
        shell: bash
        run: |
          set -euo pipefail
          here="$(pwd -P)"
          if [[ "${here}" != "${CONNECT_CHECKOUT}" ]]; then
            echo "::error::the checkout is at ${here}, not ${CONNECT_CHECKOUT}" >&2
            exit 1
          fi
          if [[ "$(uname -s)" != "Darwin" || "$(uname -m)" != "arm64" ]]; then
            echo "::error::not a macOS arm64 runner: $(uname -s) $(uname -m)" >&2
            exit 1
          fi
          if [[ -e "${CONNECT_WORK}" || -L "${CONNECT_WORK}" ]]; then
            echo "::error::the work root ${CONNECT_WORK} already exists" >&2
            exit 1
          fi
          parent="$(dirname "${CONNECT_WORK}")"
          if [[ ! -d "${parent}" || "$(cd "${parent}" && pwd -P)" != "${parent}" ]]; then
            echo "::error::the work root's parent ${parent} is not a real directory" >&2
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [[ "${head}" != "${GITHUB_SHA}" ]]; then
            echo "::error::checked-out commit ${head} is not the dispatched commit ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "::error::the checkout is not clean" >&2
            exit 1
          fi
          echo "checkout ${here} at ${head}; work root ${CONNECT_WORK}"
          df -k "${parent}"

      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          targets: aarch64-apple-darwin

      - name: Install zstd
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || brew install zstd
          zstd --version

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos preflight \
            --work "${CONNECT_WORK}" --source-sha "${GITHUB_SHA}"

      # The only step that downloads the pinned inputs. Cargo.lock is the pin
      # for crates: the tool closure Cargo prints and the lock give the crate
      # rows, and the fetch writes the resolved pin file every later step is
      # given. Its record and the resolved file are kept under the work
      # root's records, so the stage record carries them. The test first
      # checks that this tree's closure resolves against its lock.
      - name: Fetch the pinned public inputs
        shell: bash
        env:
          CONNECT_PINS_TOOL_CLOSURE: "1"
        run: |
          set -euo pipefail
          (cd connect && python3 -B -m unittest scripts.test_fetch_pinned_inputs)
          connect/scripts/repo-cargo tree --locked --manifest-path "${CONNECT_CHECKOUT}/Cargo.toml" \
            -p toolkit-package --features local-recipes,local-artifacts --target aarch64-apple-darwin \
            -e normal,build --prefix none --format "{p}" > "${CONNECT_WORK}/tool-closure.txt"
          python3 -I connect/scripts/fetch-pinned-inputs.py \
            --pins connect/release/library-pins-macos-arm64.json \
            --closure "${CONNECT_WORK}/tool-closure.txt" --lock Cargo.lock \
            --destination "${CONNECT_PINS}"
          mkdir -p "${CONNECT_WORK}/records/pinned-inputs"
          cp "${CONNECT_PINS}/FETCHED.json" "${CONNECT_RESOLVED_PINS}" "${CONNECT_WORK}/records/pinned-inputs/"

      - name: Build the integration library
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos library \
            --work "${CONNECT_WORK}" --pins "${CONNECT_RESOLVED_PINS}" --pinned-inputs "${CONNECT_PINS}"

      - name: Package the resources
        shell: bash
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos resources \
            --work "${CONNECT_WORK}" --pins "${CONNECT_RESOLVED_PINS}" --pinned-inputs "${CONNECT_PINS}"

      # CARGO_BUILD_JOBS as in build_macos: two rustc processes bound the
      # memory the largest crates need together on a hosted runner.
      - name: Build and sign the executables
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos build --work "${CONNECT_WORK}"

      # No later step reads Cargo's output (the producer copies what it
      # builds into the work root), and the pack below needs the disk.
      - name: Free the Cargo output
        shell: bash
        env:
          RUST_LANE_ID: connect-macos-arm64
        run: |
          set -euo pipefail
          connect/scripts/repo-cargo clean
          df -k "${CONNECT_WORK}"

      # The check job restores the whole work root at the same path: one
      # uncompressed tar keeps modes and links, which a workflow artifact's
      # own packing does not.
      - name: Pack the work root for the check job
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          tar -cf "${RUNNER_TEMP}/connect-work.tar" -C "$(dirname "${CONNECT_WORK}")" "$(basename "${CONNECT_WORK}")"
          (cd "${RUNNER_TEMP}" && shasum -a 256 connect-work.tar > connect-work.tar.sha256)
          ls -l "${RUNNER_TEMP}/connect-work.tar"
          echo "work_artifact=connect-macos-arm64-work-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload the work root
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.work_artifact }}
          path: |
            ${{ runner.temp }}/connect-work.tar
            ${{ runner.temp }}/connect-work.tar.sha256
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 3

  # The second half of stage one: the test executables, the installed checks
  # and the stage record. The stage record is the producer's directory,
  # uploaded unchanged; the shutdown review in it stays pending and the CLI
  # product is not assembled here.
  stage_macos_check:
    name: Stage the complete macOS installation (installed checks, stage record)
    needs: [resolve, stage_macos_build]
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.mode == 'macos-stage'
    runs-on: macos-15
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CONNECT_CHECKOUT: /Users/runner/work/meerkat/meerkat
      CONNECT_WORK: /private/tmp/cw
      CONNECT_PINS: /private/tmp/cw/pins
      CONNECT_RESOLVED_PINS: /private/tmp/cw/pins/library-pins-macos-arm64.resolved.json
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the dispatched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the runner layout
        shell: bash
        run: |
          set -euo pipefail
          here="$(pwd -P)"
          if [[ "${here}" != "${CONNECT_CHECKOUT}" ]]; then
            echo "::error::the checkout is at ${here}, not ${CONNECT_CHECKOUT}" >&2
            exit 1
          fi
          if [[ "$(uname -s)" != "Darwin" || "$(uname -m)" != "arm64" ]]; then
            echo "::error::not a macOS arm64 runner: $(uname -s) $(uname -m)" >&2
            exit 1
          fi
          if [[ -e "${CONNECT_WORK}" || -L "${CONNECT_WORK}" ]]; then
            echo "::error::the work root ${CONNECT_WORK} already exists" >&2
            exit 1
          fi
          parent="$(dirname "${CONNECT_WORK}")"
          if [[ ! -d "${parent}" || "$(cd "${parent}" && pwd -P)" != "${parent}" ]]; then
            echo "::error::the work root's parent ${parent} is not a real directory" >&2
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [[ "${head}" != "${GITHUB_SHA}" ]]; then
            echo "::error::checked-out commit ${head} is not the dispatched commit ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "::error::the checkout is not clean" >&2
            exit 1
          fi
          echo "checkout ${here} at ${head}; work root ${CONNECT_WORK}"
          df -k "${parent}"

      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          targets: aarch64-apple-darwin

      - name: Install zstd
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || brew install zstd
          zstd --version

      - name: Download the work root
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.stage_macos_build.outputs.work_artifact }}
          path: ${{ runner.temp }}/connect-work

      - name: Restore the work root at its path
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          if [[ -e "${CONNECT_WORK}" || -L "${CONNECT_WORK}" ]]; then
            echo "::error::the work root ${CONNECT_WORK} already exists" >&2
            exit 1
          fi
          (cd "${RUNNER_TEMP}/connect-work" && shasum -a 256 -c connect-work.tar.sha256)
          tar -xpf "${RUNNER_TEMP}/connect-work/connect-work.tar" -C "$(dirname "${CONNECT_WORK}")"
          rm -f "${RUNNER_TEMP}/connect-work/connect-work.tar"
          if [[ ! -f "${CONNECT_WORK}/records/preflight.step.json" || ! -f "${CONNECT_RESOLVED_PINS}" ]]; then
            echo "::error::${CONNECT_WORK} is not a preflighted work root with its resolved pin file" >&2
            exit 1
          fi

      - name: Stage the products and build the test executables
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos stage \
            --work "${CONNECT_WORK}" --pins "${CONNECT_RESOLVED_PINS}" --pinned-inputs "${CONNECT_PINS}"

      - name: Check the installed gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos check-gateway --work "${CONNECT_WORK}"

      - name: Check the installed CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos check-cli --work "${CONNECT_WORK}"

      # With rkat_release_tag: Core's published rkat archive for this
      # architecture, taken by that release's own checksum file (public
      # release assets, no token). Without it rkat is built from the
      # dispatched commit, and the record says so: such a stage record shows
      # the check on macOS and is not one a release is assembled from.
      - name: Check a fresh rkat consumer
        shell: bash
        env:
          RKAT_RELEASE_TAG: ${{ inputs.rkat_release_tag }}
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          if [[ -z "${RKAT_RELEASE_TAG}" ]]; then
            python3 connect/scripts/connect-candidate.py macos check-consumer --work "${CONNECT_WORK}" \
              --rkat-from-checkout
            exit 0
          fi
          if [[ ! "${RKAT_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rkat_release_tag must be Core's release tag vX.Y.Z; got '${RKAT_RELEASE_TAG}'" >&2
            exit 1
          fi
          archive="rkat-${RKAT_RELEASE_TAG#v}-aarch64-apple-darwin.tar.gz"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RKAT_RELEASE_TAG}"
          directory="${RUNNER_TEMP}/rkat-release"
          mkdir "${directory}"
          curl -fsSL --retry 3 --max-time 600 -o "${directory}/checksums.sha256" "${base}/checksums.sha256"
          curl -fsSL --retry 3 --max-time 600 -o "${directory}/${archive}" "${base}/${archive}"
          expected="$(awk -v name="${archive}" '$2 == name { print $1 }' "${directory}/checksums.sha256")"
          if [[ ! "${expected}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::checksums.sha256 of ${RKAT_RELEASE_TAG} has no single row for ${archive}" >&2
            exit 1
          fi
          actual="$(shasum -a 256 "${directory}/${archive}" | cut -d' ' -f1)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::${archive} is ${actual}, not the published ${expected}" >&2
            exit 1
          fi
          python3 connect/scripts/connect-candidate.py macos check-consumer --work "${CONNECT_WORK}" \
            --rkat-archive "${directory}/${archive}" --rkat-archive-sha256 "${expected}"

      - name: Check the setup conversation start
        shell: bash
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos check-conversation --work "${CONNECT_WORK}"

      - name: Check the official Playwright install
        shell: bash
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos check-official-install --work "${CONNECT_WORK}"

      - name: Write the stage record
        shell: bash
        run: |
          set -euo pipefail
          python3 connect/scripts/connect-candidate.py macos stage-record \
            --work "${CONNECT_WORK}" --output "${CONNECT_WORK}/artifact"

      - name: Attest the stage record
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: /private/tmp/cw/artifact/STAGE.json

      # The bundle is an artifact of its own: the stage record holds exactly
      # the files STAGE.json lists.
      - name: Retain the provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/stage-provenance"
          cp -- "${BUNDLE_PATH}" "${RUNNER_TEMP}/stage-provenance/connect-macos-arm64-stage-provenance.jsonl"

      - name: Upload the stage record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-macos-arm64-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: /private/tmp/cw/artifact
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          retention-days: 90

      - name: Upload the stage provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-macos-arm64-stage-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-provenance/connect-macos-arm64-stage-provenance.jsonl
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  build:
    name: Build and verify ${{ inputs.target }}
    needs: [resolve]
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.mode == 'candidate'
    runs-on: ${{ inputs.target == 'macos-arm64' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: connect
    env:
      CONNECT_TARGET: ${{ inputs.target }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout the dispatched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check native host, source, versions and complete input selection
        env:
          CONNECT_SOURCE_SHA: ${{ inputs.source_sha }}
          CONNECT_INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
        run: python3 scripts/connect-candidate.py preflight
      - name: Prepare Linux build tools
        if: inputs.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev zstd
      - name: Prepare macOS build tools
        if: inputs.target == 'macos-arm64'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          xcode-select --print-path
          brew install pkg-config openssl@3 zstd
          printf 'OPENSSL_DIR=%s\n' "$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Select Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Emit actual build, installed verification and selection
        env:
          CONNECT_SOURCE_SHA: ${{ inputs.source_sha }}
          CONNECT_INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
          XDG_CACHE_HOME: ${{ runner.temp }}/connect-cargo-cache
          RUST_LANE_ID: connect-release-${{ github.run_id }}-${{ github.run_attempt }}
          CARGO_INCREMENTAL: '0'
          CARGO_TERM_COLOR: never
        run: python3 scripts/connect-candidate.py build
      - name: Upload exact candidate closure
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-${{ inputs.target }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: connect/dist/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  attest:
    name: Attest original candidate bytes
    needs: [resolve, build]
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.mode == 'candidate' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: connect
    env:
      CONNECT_TARGET: ${{ inputs.target }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the same workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Fetch this job's immutable artifact by ID and digest
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECT_SOURCE_SHA: ${{ inputs.source_sha }}
          CONNECT_INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
          CONNECT_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CONNECT_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: python3 scripts/connect-candidate.py fetch-built
      - name: Attest candidate closure and manifest
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: connect/dist/*
      - name: Retain the original attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "dist/connect-${CONNECT_TARGET}-provenance.jsonl"
      - name: Upload attested candidate without publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-${{ inputs.target }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: connect/dist/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  # Data-only acceptance. The Meta reader is the in-tree meta/ of the
  # candidate's own commit (one repository), so no second checkout is
  # selected; the request still names every identity explicitly.
  accept:
    name: Accept an attested ${{ inputs.target }} candidate
    needs: [resolve]
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.mode == 'accept'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Download the attested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "${RUN_ID}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::candidate_run_id must be a run id" >&2; exit 1; }
          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "connect-${TARGET}-candidate-${RUN_ID}-*" --dir "${RUNNER_TEMP}/candidate-download"
          mkdir -p "${RUNNER_TEMP}/candidate"
          find "${RUNNER_TEMP}/candidate-download" -type f -exec cp -n -- {} "${RUNNER_TEMP}/candidate/" \;
      - name: Accept the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ inputs.publication_request }}
        working-directory: connect
        run: |
          set -euo pipefail
          printf '%s' "${REQUEST}" > "${RUNNER_TEMP}/request.json"
          python3 scripts/connect-candidate.py accept-publication \
            --request "${RUNNER_TEMP}/request.json" --candidate "${RUNNER_TEMP}/candidate" \
            --meta-source "${GITHUB_WORKSPACE}/meta" --output "${RUNNER_TEMP}/acceptance"
          echo "acceptance.json sha256: $(sha256sum "${RUNNER_TEMP}/acceptance/acceptance.json" | cut -d' ' -f1)"
      - name: Upload the acceptance record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-${{ inputs.target }}-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish:
    name: Publish accepted Connect assets
    needs: [resolve]
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Download the acceptance record
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.acceptance_run_id }}
        run: |
          set -euo pipefail
          [[ "${RUN_ID}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::acceptance_run_id must be a run id" >&2; exit 1; }
          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --pattern "connect-*-acceptance-${RUN_ID}-*" \
            --dir "${RUNNER_TEMP}/acceptance-download"
          accepted="$(find "${RUNNER_TEMP}/acceptance-download" -name acceptance.json -printf '%h\n')"
          [[ "$(printf '%s\n' "${accepted}" | wc -l)" == 1 ]] || { echo "::error::expected exactly one acceptance record" >&2; exit 1; }
          echo "ACCEPTED_DIR=${accepted}" >> "${GITHUB_ENV}"
      - name: Add exactly the accepted assets (never replacing one)
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_SHA256: ${{ inputs.acceptance_sha256 }}
        working-directory: connect
        run: |
          set -euo pipefail
          python3 scripts/connect-candidate.py publish-accepted \
            --accepted "${ACCEPTED_DIR}" --acceptance-sha256 "${ACCEPTANCE_SHA256}" \
            --output "${RUNNER_TEMP}/publication"
